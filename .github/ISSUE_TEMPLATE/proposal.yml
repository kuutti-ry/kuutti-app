name: Proposal
description: A change to how Kuutti works. Read the Product constraints in CLAUDE.md first.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Kuutti will never build: compatibility or chemistry scores, desirability signals, infinite feeds, real-time engagement push, streaks, leaderboards, boosts or anything purchasable, ads, pre-match links to external profiles, under-18 access. A proposal in that direction will be closed with a pointer to that list.
  - type: textarea
    id: summary
    attributes:
      label: In short
      description: One or two sentences for a person, in plain words, saying what this is about and for whom. No file names; the detail goes below.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: Whose problem is it, and how do you know? Evidence beats opinion.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: The smallest change that solves it. Which slice (identity, profile, media, pond, matching, chat, safety, research, rewards, notifications) and which app it touches.
    validations:
      required: true
  - type: textarea
    id: decisions
    attributes:
      label: Decisions it touches
      description: The TD or ADR it follows or would change. A change to identity, uploads, event flow, data retention or infrastructure needs an ADR (CLAUDE.md, Decisions).
  - type: textarea
    id: risks
    attributes:
      label: Safety, privacy and accessibility
      description: What could go wrong for a member, what personal data it touches, and how it works with a screen reader and at the largest font size.
