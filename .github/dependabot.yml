version: 2
updates:
  # Keep the actions used in .github/workflows current. Actions are pinned to
  # commit SHAs; Dependabot bumps the SHA and the version comment together.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]

  # The pnpm workspace. Minor and patch bumps arrive as one pull request a
  # week; majors come alone so they get read.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # The Expo SDK pins these, patch included (`npx expo install --check`
      # in apps/mobile names each one): they move with an SDK upgrade through
      # `npx expo install --fix`, never one by one. With them in the weekly
      # group, the whole group failed typecheck and test-mobile (#113).
      - dependency-name: "react-native"
      - dependency-name: "@react-native/jest-preset"
      - dependency-name: "react-native-reanimated"
      - dependency-name: "react-native-worklets"
      - dependency-name: "react-native-safe-area-context"
      - dependency-name: "react-native-screens"
      - dependency-name: "react-native-svg"
      # NativeWind 4 compiles with Tailwind CSS 3; Tailwind 4 arrives with
      # NativeWind 5, as a deliberate migration (#116).
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      # i18next-icu 2.4.4 accepts intl-messageformat below 12 only (its peer
      # range). Remove this once a release of the plugin accepts 12 (#117).
      - dependency-name: "intl-messageformat"
        update-types: ["version-update:semver-major"]
      # The types follow the runtime. Node 22 is the project's engine
      # (package.json) and the API image's base, so the types of a newer major
      # would let code compile that the runtime does not have (#119).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # jest-expo 57 and React Native 0.86's jest preset are built on Jest 29:
      # their babel-jest, environments and snapshot packages are ^29. Jest 30
      # arrives with the Expo SDK whose jest-expo is built on it (#121).
      - dependency-name: "jest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/jest"
        update-types: ["version-update:semver-major"]

  # The API image's base image (apps/api/Dockerfile). Node 22 is the
  # project's engine (package.json), and newer Node images drop Corepack, so
  # major bumps are a deliberate change, never a Dependabot pull request.
  - package-ecosystem: "docker"
    directory: "/apps/api"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  # Provider version bumps for the infrastructure code, one per root with a
  # lockfile.
  - package-ecosystem: "terraform"
    directories: ["/infra/bootstrap", "/infra/envs/staging", "/infra/envs/prod"]
    schedule:
      interval: "weekly"
    groups:
      providers:
        patterns: ["*"]
