version: 2

# Every entry runs on the first of the month and proposes a release only once
# it is seven days old (cooldown; GitHub's default is three days): most
# malicious releases are found and pulled within days. Security updates skip
# both and open when the alert does. What is added by hand meets pnpm's own
# one-day minimumReleaseAge (pnpm-workspace.yaml).
updates:
  # Keep the actions used in .github/workflows current. Actions are pinned to
  # commit SHAs; Dependabot bumps the SHA and the version comment together.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  # The pnpm workspace. Minor and patch bumps arrive as one pull request a
  # month; majors come alone so they get read.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # The Expo SDK pins these, patch included (`npx expo install --check`
      # in apps/mobile names each one): they move with an SDK upgrade through
      # `npx expo install --fix`, never one by one. With them in the group,
      # the whole group failed typecheck and test-mobile (#113).
      - dependency-name: "react-native"
      - dependency-name: "@react-native/jest-preset"
      - dependency-name: "react-native-reanimated"
      - dependency-name: "react-native-worklets"
      - dependency-name: "react-native-safe-area-context"
      - dependency-name: "react-native-screens"
      - dependency-name: "react-native-svg"
      # The SDK's own packages are numbered after it and move together, in an
      # SDK upgrade: one of them a major ahead is half an upgrade. SDK 58 came
      # as five such pull requests (#244 to #248). Their patches still come.
      - dependency-name: "expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "expo-*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@expo/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jest-expo"
        update-types: ["version-update:semver-major"]
      # NativeWind 4 compiles with Tailwind CSS 3; Tailwind 4 arrives with
      # NativeWind 5, as a deliberate migration (#116).
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      # i18next-icu 2.4.4 accepts intl-messageformat below 12 only (its peer
      # range). Remove this once a release of the plugin accepts 12 (#117).
      - dependency-name: "intl-messageformat"
        update-types: ["version-update:semver-major"]
      # The types follow the runtime. Node 22 is the project's engine
      # (package.json) and the API image's base, so the types of a newer major
      # would let code compile that the runtime does not have (#119).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # jest-expo 57 and React Native 0.86's jest preset are built on Jest 29:
      # their babel-jest, environments and snapshot packages are ^29. Jest 30
      # arrives with the Expo SDK whose jest-expo is built on it (#121).
      - dependency-name: "jest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/jest"
        update-types: ["version-update:semver-major"]

  # The API image's base image (apps/api/Dockerfile). Node 22 is the
  # project's engine (package.json), and newer Node images drop Corepack, so
  # major bumps are a deliberate change, never a Dependabot pull request.
  - package-ecosystem: "docker"
    directory: "/apps/api"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  # The images of the local and CI stack (docker-compose.yml). Postgres keeps
  # the major RDS runs (infra/modules/data/main.tf); a new major goes there
  # first, by hand.
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      compose-images:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]

  # Provider version bumps for the infrastructure code, one per root with a
  # lockfile. The lockfiles are OpenTofu's (registry.opentofu.org); as
  # `terraform` this entry read the Terraform registry and proposed nothing
  # ("No update possible", 10 October 2026) while four AWS provider releases
  # went by.
  - package-ecosystem: "opentofu"
    directories: ["/infra/bootstrap", "/infra/envs/staging", "/infra/envs/prod"]
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    groups:
      providers:
        patterns: ["*"]
