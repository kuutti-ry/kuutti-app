name: Preview

# Four preview lanes per pull request (#9, TD-2, TD-19), one sticky comment.
#   api     the image build.yml pushed for this pull request runs on the
#           staging box as its own Dokploy application with its own
#           kuutti_pr_<n> database, at https://pr-<n>.<PREVIEW_API_DOMAIN>
#   web     the Expo web export of the same commit on EAS Hosting, pointed at
#           that API, at https://<EAS_HOSTING_SUBDOMAIN>--pr-<n>.expo.app
#   native  when native code, auth, push, camera or the fingerprint changed
#           against main: an EAS Update on branch pr-<n> for the dev client
#           (#10), with a QR code; dormant until expo-updates is configured
#   admin   the moderation panel of the same commit, built under /pr-<n>/
#           against the staging API, since a preview API has no bank
#           (ADR-014 §1), and written to pr-<n>/ of the staging panel's
#           bucket, at <ADMIN_URL>/pr-<n>/ (#313, ADR-025 §6); dormant until
#           the panel's host is applied
# Everything a lane needs lives in the GitHub environment "preview" (the
# panel's writer holds the plan role, a repository variable) and the
# repository variable PREVIEWS_ENABLED switches the lanes on (infra/README.md,
# Previews). Forks and Dependabot get no secrets, so they get no preview.
# Each lane's comment rewrites the whole sticky comment, so the comments come
# one after another, api, web, admin, native, each with the rows of the ones
# before it. Removal is preview-cleanup.yml.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
    paths: ["apps/mobile/**", "pnpm-lock.yaml", ".github/workflows/preview.yml"]

permissions:
  contents: read

# bash -eo pipefail: a failed script behind a pipe must fail the step.
defaults:
  run:
    shell: bash

concurrency:
  group: preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/kuutti-ry/kuutti-api
  PREVIEW_LIMIT: "3"

jobs:
  api:
    name: api preview
    if: >-
      github.event_name == 'pull_request'
      && vars.PREVIEWS_ENABLED == 'true'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      pull-requests: write
    environment:
      name: preview
      url: ${{ steps.names.outputs.api_url }}
    outputs:
      deployed: ${{ steps.deploy.outputs.deployed }}
      api_url: ${{ steps.names.outputs.api_url }}
      web_origin: ${{ steps.names.outputs.web_origin }}
      short_sha: ${{ steps.names.outputs.short_sha }}
      database: ${{ steps.names.outputs.database }}
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      # Every preview address is a function of the pull request number, so the
      # API can allow exactly its own web origin before that origin exists.
      - name: Names
        id: names
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PREVIEW_API_DOMAIN: ${{ vars.PREVIEW_API_DOMAIN }}
          EAS_HOSTING_SUBDOMAIN: ${{ vars.EAS_HOSTING_SUBDOMAIN }}
        run: |
          : "${PREVIEW_API_DOMAIN:?set the preview environment variable PREVIEW_API_DOMAIN}"
          : "${EAS_HOSTING_SUBDOMAIN:?set the preview environment variable EAS_HOSTING_SUBDOMAIN}"
          short="${HEAD_SHA::7}"
          {
            echo "short_sha=$short"
            echo "image=$IMAGE:pr-$PR_NUMBER-$short"
            echo "api_url=https://pr-$PR_NUMBER.$PREVIEW_API_DOMAIN"
            echo "web_origin=https://$EAS_HOSTING_SUBDOMAIN--pr-$PR_NUMBER.expo.app"
            echo "database=kuutti_pr_$PR_NUMBER"
          } >> "$GITHUB_OUTPUT"

      - name: Wait for the image build.yml pushes for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_REF: ${{ steps.names.outputs.image }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          for _ in $(seq 1 72); do
            if docker manifest inspect "$IMAGE_REF" >/dev/null 2>&1; then echo "found $IMAGE_REF"; exit 0; fi
            sleep 10
          done
          echo "::error::$IMAGE_REF did not appear within 12 minutes; is the Build workflow green?"
          exit 1

      # At most PREVIEW_LIMIT previews on the box (TD-2). A pull request that
      # already holds one keeps it; a new one beyond the limit gets the comment
      # and nothing else.
      - name: Deploy the preview API, or refuse at the limit
        id: deploy
        env:
          GH_TOKEN: ${{ github.token }}
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
          DOKPLOY_ENVIRONMENT_ID: ${{ vars.DOKPLOY_ENVIRONMENT_ID }}
          PREVIEW_API_DOMAIN: ${{ vars.PREVIEW_API_DOMAIN }}
          IMAGE_REF: ${{ steps.names.outputs.image }}
          WEB_ORIGIN: ${{ steps.names.outputs.web_origin }}
          SHORT_SHA: ${{ steps.names.outputs.short_sha }}
        run: |
          # The pull request may have merged or closed while this run waited
          # for the image (or for a reviewer, when the environment has one);
          # the sweep has been there by then and nothing would remove what
          # this step put back. Assigned
          # first, tested after: inside the test a failure of the question
          # would read as "not open" and leave the lane green.
          open=$(.github/scripts/pr-open.sh)
          if [ "$open" != true ]; then
            echo "::notice::#$PR_NUMBER is no longer open; nothing deployed"
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          previews=$(.github/scripts/dokploy-preview.sh list)
          mine=$(jq --arg pr "$PR_NUMBER" '[.[] | select(.pr == $pr)] | length' <<< "$previews")
          others=$(jq -r --arg pr "$PR_NUMBER" '[.[] | select(.pr != $pr) | "#" + .pr] | join(", ")' <<< "$previews")
          count=$(jq --arg pr "$PR_NUMBER" '[.[] | select(.pr != $pr)] | length' <<< "$previews")
          if [ "$mine" = 0 ] && [ "$count" -ge "$PREVIEW_LIMIT" ]; then
            NOTICE="No preview: the box holds its $PREVIEW_LIMIT previews ($others). Close one of those pull requests, or wait for the sweep to retire previews older than 7 days, then push again." \
              .github/scripts/preview-comment.sh
            echo "::notice::preview limit reached ($others); nothing deployed"
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          .github/scripts/dokploy-preview.sh deploy "$PR_NUMBER" "$IMAGE_REF" "$WEB_ORIGIN"
          echo "deployed=true" >> "$GITHUB_OUTPUT"

      - name: /health reports this pull request's commit with its database migrated
        if: steps.deploy.outputs.deployed == 'true'
        env:
          API_URL: ${{ steps.names.outputs.api_url }}
          COMMIT: ${{ steps.names.outputs.short_sha }}
        run: .github/scripts/wait-healthy.sh

      # Rule 8: the preview answers its own web origin and refuses every other
      # browser origin, the staging web app and another pull request's included.
      - name: Only this pull request's web origin passes CORS
        if: steps.deploy.outputs.deployed == 'true'
        env:
          API_URL: ${{ steps.names.outputs.api_url }}
          WEB_ORIGIN: ${{ steps.names.outputs.web_origin }}
          EAS_HOSTING_SUBDOMAIN: ${{ vars.EAS_HOSTING_SUBDOMAIN }}
        run: |
          allowed() {
            curl -fsS -o /dev/null -D - -X OPTIONS -H "Origin: $1" -H 'Access-Control-Request-Method: GET' "$API_URL/health" \
              | tr -d '\r' | grep -i '^access-control-allow-origin:' | cut -d' ' -f2-
          }
          own=$(allowed "$WEB_ORIGIN")
          [ "$own" = "$WEB_ORIGIN" ] || { echo "::error::own origin $WEB_ORIGIN refused (got '$own')"; exit 1; }
          for origin in "https://$EAS_HOSTING_SUBDOMAIN.expo.app" "https://$EAS_HOSTING_SUBDOMAIN--pr-0.expo.app" "https://example.com"; do
            got=$(allowed "$origin" || true)
            [ -z "$got" ] || { echo "::error::$origin was allowed"; exit 1; }
            echo "refused $origin"
          done
          robots=$(curl -fsS -o /dev/null -D - "$API_URL/health" | tr -d '\r' | grep -i '^x-robots-tag:' || true)
          grep -qi noindex <<< "$robots" || { echo "::error::no X-Robots-Tag: noindex"; exit 1; }
          echo "allowed $own only; $robots"

      - name: Comment
        if: steps.deploy.outputs.deployed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHORT_SHA: ${{ steps.names.outputs.short_sha }}
          API_URL: ${{ steps.names.outputs.api_url }}
          DATABASE: ${{ steps.names.outputs.database }}
        run: .github/scripts/preview-comment.sh

  web:
    name: web preview
    needs: api
    if: needs.api.outputs.deployed == 'true'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      pull-requests: write
    environment:
      name: preview
      url: ${{ needs.api.outputs.web_origin }}
    outputs:
      web_url: ${{ steps.deploy.outputs.url }}
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/pnpm

      # EXPO_PUBLIC_* is inlined at export time: this bundle can only ever talk
      # to this pull request's API. The web target runs against seed data and
      # the mock IdP only (rules/mobile.md); it is not a product surface.
      - name: Export the web target against the preview API
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_URL: ${{ needs.api.outputs.api_url }}
        run: pnpm exec expo export --platform web

      # This lane runs after the api lane (and after a reviewer, when the
      # environment has one), so it asks again: an alias made after the merge
      # is one no sweep would find, the Dokploy application being the sweep's
      # work list.
      - name: Is the pull request still open?
        id: open
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open=$(.github/scripts/pr-open.sh)
          echo "open=$open" >> "$GITHUB_OUTPUT"
          [ "$open" = true ] || echo "::notice::#$PR_NUMBER is no longer open; nothing deployed"

      - name: Deploy to EAS Hosting as pr-${{ github.event.pull_request.number }}
        id: deploy
        if: steps.open.outputs.open == 'true'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPECTED: ${{ needs.api.outputs.web_origin }}
        run: |
          out=$(pnpm exec eas deploy --alias "pr-$PR_NUMBER" --json --non-interactive)
          url=$(jq -r '(.aliases // [])[0].url // .url' <<< "$out")
          url="${url%/}"
          [ "$url" = "$EXPECTED" ] || { echo "::error::EAS Hosting gave $url, the API allows $EXPECTED: check EAS_HOSTING_SUBDOMAIN"; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "$url"

      - name: The page is served and its bundle points at the preview API
        if: steps.open.outputs.open == 'true'
        env:
          URL: ${{ steps.deploy.outputs.url }}
          API_URL: ${{ needs.api.outputs.api_url }}
        run: |
          # A brand-new alias took over 150 s to answer on its first
          # deployment (PR #18); later ones are quick. Its page can also
          # answer before the bundle it names is served there (PR #368: the
          # page after 27 s, its bundle 404 at once, 200 when asked later), so
          # the page and each bundle are asked again until they answer.
          # Six minutes in all is the limit before the lane is called broken.
          deadline=$((SECONDS + 360))
          fetch() {
            until curl -fsS --max-time 30 "$1" -o "$2"; do
              [ "$SECONDS" -lt "$deadline" ] || return 1
              sleep 5
            done
          }
          fetch "$URL/" "$RUNNER_TEMP/page.html" \
            || { echo "::error::$URL did not answer within 6 minutes"; exit 1; }
          scripts=$(grep -o '/_expo/static/js/web/[^"]*\.js' "$RUNNER_TEMP/page.html" | sort -u)
          [ -n "$scripts" ] || { echo "::error::no bundle referenced by $URL"; exit 1; }
          # Not `curl | grep -q`: grep exits on the first match, curl gets EPIPE
          # (exit 23) and pipefail turns a found URL into "not found".
          for s in $scripts; do
            fetch "$URL$s" "$RUNNER_TEMP/bundle.js" \
              || { echo "::error::$URL$s did not answer within 6 minutes"; exit 1; }
            if grep -q "$API_URL" "$RUNNER_TEMP/bundle.js"; then echo "bundle $s targets $API_URL"; exit 0; fi
          done
          echo "::error::no bundle of $URL mentions $API_URL"; exit 1

      - name: Comment
        if: steps.open.outputs.open == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHORT_SHA: ${{ needs.api.outputs.short_sha }}
          API_URL: ${{ needs.api.outputs.api_url }}
          DATABASE: ${{ needs.api.outputs.database }}
          WEB_URL: ${{ steps.deploy.outputs.url }}
        run: .github/scripts/preview-comment.sh

  # The panel of this pull request (#313, ADR-025 §6), after the api lane as
  # the web lane is: the Dokploy application is the sweep's work list, so a
  # panel preview exists only beside one, and goes with it. Built here without
  # the OIDC token, since the pull request's own install and Vite config run
  # here. The job after it writes the build: it installs and builds nothing,
  # and the scripts it runs come from the pull request's ref, as every job of
  # this workflow, bounded by what the plan role may do (ADR-025 §7).
  admin:
    name: admin preview
    needs: api
    if: needs.api.outputs.deployed == 'true'
    runs-on: ubuntu-24.04-arm
    environment: preview
    permissions:
      contents: read
    outputs:
      ready: ${{ steps.ready.outputs.ready }}
      url: ${{ steps.ready.outputs.url }}
      bucket: ${{ steps.ready.outputs.bucket }}
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      # Until the variables are set from staging's tofu output
      # (infra/README.md, Admin panel), the lane stops green.
      - name: Is the panel's host applied?
        id: ready
        env:
          ADMIN_URL: ${{ vars.ADMIN_URL }}
          ADMIN_BUCKET: ${{ vars.ADMIN_BUCKET }}
          ADMIN_API_URL: ${{ vars.ADMIN_API_URL }}
        run: |
          missing=""
          for name in ADMIN_URL ADMIN_BUCKET ADMIN_API_URL; do [ -n "${!name}" ] || missing="$missing $name"; done
          if [ -n "$missing" ]; then
            echo "::notice::not set in the preview environment:$missing; no panel preview (infra/README.md, Admin panel)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "ready=true"
            echo "url=${ADMIN_URL%/}/pr-$PR_NUMBER/"
            echo "bucket=$ADMIN_BUCKET"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.ready.outputs.ready == 'true'
        with:
          persist-credentials: false
      - uses: ./.github/actions/pnpm
        if: steps.ready.outputs.ready == 'true'

      # The staging API, not this pull request's: a preview API cannot sign
      # anyone in, and a staff session is a staging one (ADR-025 §6). So a
      # pull request that changes the API too previews its panel against
      # main's API. The router takes the base as its basename.
      - name: Build the panel under /pr-<n>/ against the staging API
        if: steps.ready.outputs.ready == 'true'
        env:
          VITE_API_URL: ${{ vars.ADMIN_API_URL }}
        run: pnpm --filter @kuutti/admin exec vite build --base "/pr-$PR_NUMBER/"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.ready.outputs.ready == 'true'
        with:
          name: admin-preview
          path: apps/admin/dist
          retention-days: 1
          if-no-files-found: error
          overwrite: true

  # Writes the panel's build to pr-<n>/ (ADR-025 §6, §7). No environment:
  # the plan role trusts the pull request's own subject and may put and
  # delete pr-* of the staging panel's bucket, nothing else; with no
  # CloudFront write, nothing is invalidated: index.html goes up with
  # no-cache and the assets carry their hash. It waits for the web lane only
  # so that its comment follows the web lane's and carries its row; a web
  # lane that failed does not stop it.
  admin-publish:
    name: admin preview publish
    needs: [api, web, admin]
    if: ${{ !cancelled() && needs.admin.result == 'success' && needs.admin.outputs.ready == 'true' }}
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    outputs:
      url: ${{ steps.served.outputs.url }}
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_PLAN_ROLE_ARN }}
      AWS_ROLE_SESSION_NAME: gha-admin-preview-${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: admin-preview
          path: dist

      # Right before writing, as every lane asks (ADR-012 §7): a prefix
      # written after the merge's sweep would wait for the bucket's 14 days.
      - name: Is the pull request still open?
        id: open
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open=$(.github/scripts/pr-open.sh)
          echo "open=$open" >> "$GITHUB_OUTPUT"
          [ "$open" = true ] || echo "::notice::#$PR_NUMBER is no longer open; nothing written"

      - if: steps.open.outputs.open == 'true'
        run: .github/scripts/aws-oidc.sh

      # As main's build is written (admin-deploy.yml): the assets, then the
      # licences and index.html, uncached under their fixed names, then the
      # assets of the push before go. The trailing slash keeps pr-1/ from
      # reaching pr-12/.
      - name: Write the build to pr-<n>/
        if: steps.open.outputs.open == 'true'
        env:
          BUCKET: ${{ needs.admin.outputs.bucket }}
        run: |
          prefix="s3://$BUCKET/pr-$PR_NUMBER/"
          immutable='public, max-age=31536000, immutable'
          aws s3 sync dist "$prefix" --exclude index.html --exclude licenses.txt --cache-control "$immutable"
          aws s3 cp dist/licenses.txt "${prefix}licenses.txt" --cache-control no-cache --content-type 'text/plain; charset=utf-8'
          aws s3 cp dist/index.html "${prefix}index.html" --cache-control no-cache
          aws s3 sync dist "$prefix" --exclude index.html --exclude licenses.txt --cache-control "$immutable" --delete

      # The preview's root and a page by its path both answer this build's
      # index.html (the CloudFront Function, ADR-025 §6), and the files it
      # names are served. A path asked for before this push may answer an
      # edge's copy for a few seconds, so each is given a minute.
      - name: The preview is served
        id: served
        if: steps.open.outputs.open == 'true'
        env:
          URL: ${{ needs.admin.outputs.url }}
        run: |
          for path in "" photos; do
            ok=false
            for _ in $(seq 1 12); do
              if curl -fsS --max-time 10 -o "$RUNNER_TEMP/page.html" "$URL$path" && cmp -s "$RUNNER_TEMP/page.html" dist/index.html; then
                ok=true; break
              fi
              sleep 5
            done
            [ "$ok" = true ] || { echo "::error::$URL$path does not answer this build's index.html"; exit 1; }
            echo "$URL$path answers this build's index.html"
          done
          # The licences the footer links (#416), uncached like index.html.
          ok=false
          for _ in $(seq 1 12); do
            if curl -fsS --max-time 10 -o "$RUNNER_TEMP/licenses.txt" "${URL}licenses.txt" && cmp -s "$RUNNER_TEMP/licenses.txt" dist/licenses.txt; then
              ok=true; break
            fi
            sleep 5
          done
          [ "$ok" = true ] || { echo "::error::${URL}licenses.txt is not this build's licences"; exit 1; }
          echo "${URL}licenses.txt answers this build's licences"
          origin="${URL%/pr-"$PR_NUMBER"/}"
          # Byte for byte: a file the bucket lacks answers 200 with the root's
          # index.html (the fallback, ADR-025 §2), so a status says nothing.
          files=$(grep -o "/pr-$PR_NUMBER/assets/[^\"]*" dist/index.html | sort -u || true)
          [ -n "$files" ] || { echo "::error::dist/index.html names nothing under /pr-$PR_NUMBER/assets/"; exit 1; }
          for file in $files; do
            curl -fsS --max-time 10 -o "$RUNNER_TEMP/asset" "$origin$file"
            cmp -s "$RUNNER_TEMP/asset" "dist${file#/pr-"$PR_NUMBER"}" || { echo "::error::$origin$file is not this build's file"; exit 1; }
            echo "served $file"
          done
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Comment
        if: steps.open.outputs.open == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHORT_SHA: ${{ needs.api.outputs.short_sha }}
          API_URL: ${{ needs.api.outputs.api_url }}
          DATABASE: ${{ needs.api.outputs.database }}
          # A web lane that failed its own check after deploying still has an
          # output: its row says building rather than link it.
          WEB_URL: ${{ needs.web.result == 'success' && needs.web.outputs.web_url || '' }}
          ADMIN_URL: ${{ steps.served.outputs.url }}
        run: .github/scripts/preview-comment.sh

  native:
    name: native preview
    # After the panel's writer as well, so its comment, the last, carries the
    # panel's row; a panel lane that is dormant, skipped or failed does not
    # stop it, a web lane that failed still does.
    needs: [api, web, admin-publish]
    if: ${{ !cancelled() && needs.api.outputs.deployed == 'true' && needs.web.result == 'success' }}
    # x86-64, unlike the other lanes: expo export compiles Hermes bytecode with
    # hermes-compiler's hermesc, which ships for Linux as linux64-bin only; on
    # an arm64 runner the shell cannot execute it (run 35459415764). deploy.yml
    # publishes from ubuntu-latest for the same reason.
    runs-on: ubuntu-latest
    # The same environment as the other lanes: EXPO_TOKEN is not available
    # to a pull-request job anywhere else.
    environment: preview
    permissions:
      contents: read
      pull-requests: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/pnpm

      # The lane publishes only once #10 has configured expo-updates (an EAS
      # project id and updates.url). Updates are not code-signed (ADR-004), so
      # the preview environment's EXPO_TOKEN is all it takes: a preview run is
      # as trusted as a push to main, write access to this repository is
      # granted as that trust, and the environment's reviewer goes back on, or
      # signing replaces it, before the first production build outside the
      # team (ADR-004 §3 and §4, infra/README.md, Previews, Trust).
      - name: Is EAS Update configured?
        id: configured
        run: |
          if ! jq -e '.expo.updates.url and .expo.extra.eas.projectId' apps/mobile/app.json >/dev/null 2>&1; then
            echo "configured=not-configured" >> "$GITHUB_OUTPUT"
            echo "::notice::expo-updates is not configured; the native lane stays dormant until #10"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      # Native code, auth, push or camera: the paths from #9. Everything else
      # native is caught by the fingerprint below. The paths come from the
      # files API: `gh pr diff` refuses a diff over 20,000 lines (#236).
      - name: Paths that need a native preview
        id: paths
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          changed=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" --jq '.[].filename')
          if grep -Eq '^apps/mobile/(app\.json|app\.config\.[^/]+|package\.json|plugins/|src/lib/auth/|src/features/(notifications|media)/)' <<< "$changed"; then
            echo "matched=true" >> "$GITHUB_OUTPUT"
            grep -E '^apps/mobile/' <<< "$changed"
          else
            echo "matched=false" >> "$GITHUB_OUTPUT"
            echo "no native-relevant path changed"
          fi

      - name: Fingerprint of this pull request
        working-directory: apps/mobile
        run: node ../../node_modules/@expo/fingerprint/bin/cli.js fingerprint:generate > "$RUNNER_TEMP/fingerprint-pr.json"

      - name: Fingerprint of main
        id: base
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/fingerprint-main.json
          key: fingerprint-main-${{ github.event.pull_request.base.sha }}
          restore-keys: fingerprint-main-

      - name: Native preview needed?
        id: decide
        env:
          PATHS_MATCHED: ${{ steps.paths.outputs.matched }}
          BASE_HIT: ${{ steps.base.outputs.cache-matched-key }}
        run: |
          pr=$(jq -r .hash "$RUNNER_TEMP/fingerprint-pr.json")
          if [ -z "$BASE_HIT" ]; then
            echo "no fingerprint of main cached yet: treating the fingerprint as changed"
            fingerprint_changed=true
          else
            base=$(jq -r .hash "$RUNNER_TEMP/fingerprint-main.json")
            if [ "$pr" = "$base" ]; then fingerprint_changed=false; else fingerprint_changed=true; fi
            echo "fingerprint main=$base pr=$pr ($BASE_HIT)"
          fi
          if [ "$PATHS_MATCHED" = true ] || [ "$fingerprint_changed" = true ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi

      # Bundled without the token, as the web lane does: Metro, Babel and the
      # pull request's own build configuration run here, and updates are not
      # code-signed (ADR-004), so EXPO_TOKEN is the right to publish anywhere.
      # The arguments are what eas update itself passes to expo export.
      - name: Export the update bundle against the preview API
        if: steps.configured.outputs.configured == 'true' && steps.decide.outputs.needed == 'true'
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_URL: ${{ needs.api.outputs.api_url }}
        run: |
          : "${EXPO_PUBLIC_API_URL:?the preview API URL must be set}"
          pnpm exec expo export --output-dir dist --source-maps --dump-assetmap \
            --platform ios --platform android

      # The last lane waits longest; the same question before it publishes.
      - name: Is the pull request still open?
        id: open
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          open=$(.github/scripts/pr-open.sh)
          echo "open=$open" >> "$GITHUB_OUTPUT"
          [ "$open" = true ] || echo "::notice::#$PR_NUMBER is no longer open; nothing published"

      - name: Publish the EAS Update on branch pr-${{ github.event.pull_request.number }}
        id: update
        if: steps.open.outputs.open == 'true' && steps.configured.outputs.configured == 'true' && steps.decide.outputs.needed == 'true'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          SHORT_SHA: ${{ needs.api.outputs.short_sha }}
        run: |
          # No --environment here: an EAS environment's variables override the
          # runner's, and the bundle above points at the pull request's own API.
          # Same filter as deploy.yml: only the JSON document reaches jq.
          out=$(pnpm exec eas update --branch "pr-$PR_NUMBER" --message "pr-$PR_NUMBER $SHORT_SHA" \
            --skip-bundler --input-dir dist --platform all --json --non-interactive \
            | sed -n '/^[{[]/,$p')
          group=$(jq -er '.[0].group' <<< "$out")
          project=$(jq -r .expo.extra.eas.projectId app.json)
          slug=$(jq -r .expo.slug app.json)
          {
            echo "qr=https://qr.expo.dev/eas-update?appScheme=$slug&projectId=$project&groupId=$group"
            echo "link=https://expo.dev/projects/$project/updates/$group"
          } >> "$GITHUB_OUTPUT"
          jq -r '.[] | "\(.platform) \(.id) runtime \(.runtimeVersion)"' <<< "$out"

      - name: Comment
        if: steps.open.outputs.open == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHORT_SHA: ${{ needs.api.outputs.short_sha }}
          API_URL: ${{ needs.api.outputs.api_url }}
          DATABASE: ${{ needs.api.outputs.database }}
          WEB_URL: ${{ needs.web.outputs.web_url }}
          ADMIN_URL: ${{ needs.admin-publish.outputs.url }}
          NATIVE: ${{ steps.configured.outputs.configured != 'true' && steps.configured.outputs.configured || (steps.decide.outputs.needed == 'true' && 'published' || 'not-needed') }}
          NATIVE_QR: ${{ steps.update.outputs.qr }}
          NATIVE_LINK: ${{ steps.update.outputs.link }}
        run: .github/scripts/preview-comment.sh

  # The fingerprint of main, cached for the native lane's comparison. Runs on
  # every push to main that could change it.
  fingerprint-main:
    name: fingerprint of main
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/pnpm
      - working-directory: apps/mobile
        run: |
          node ../../node_modules/@expo/fingerprint/bin/cli.js fingerprint:generate > "$RUNNER_TEMP/fingerprint-main.json"
          jq -r '"main fingerprint " + .hash' "$RUNNER_TEMP/fingerprint-main.json"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/fingerprint-main.json
          key: fingerprint-main-${{ github.sha }}
