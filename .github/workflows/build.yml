name: Build

# The API image (#8, TD-2): built once per commit on arm64, never under QEMU,
# smoke-tested, and on main or a v* tag pushed to GHCR. A tag whose commit was
# already built on main reuses that exact image, so production runs the bytes
# staging ran. Deploys and the release draft are the reusable workflows this
# one calls. A pull request from this repository also gets its image pushed
# as :pr-<n>-<sha7>, which preview.yml deploys to the staging box (#9); forks
# and Dependabot have no token that can push, so they get none. After the
# staging deploy, main's moderation panel goes to its own host on
# admin.staging.<domain> (#313, ADR-025 §5).

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/kuutti-ry/kuutti-api

jobs:
  image:
    name: image
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      short_sha: ${{ steps.identity.outputs.short_sha }}
      digest: ${{ steps.digest.outputs.digest }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: kuutti
          POSTGRES_PASSWORD: kuutti
          POSTGRES_DB: kuutti
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kuutti"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build identity
        id: identity
        env:
          REF_NAME: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
          # A pull request builds its merge with main but identifies as the
          # commit the reviewer sees; /health of its preview reports that.
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_FROM_THIS_REPO: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' }}
        run: |
          # The counted version is the root package.json's (CLAUDE.md, Git: versioning); an untagged build names it with its commit.
          counted="$(jq -r .version package.json)"
          if [ -n "$PR_NUMBER" ]; then
            short="${PR_HEAD_SHA::7}"
            version="$counted-pr$PR_NUMBER-$short"
            preview_tags="$IMAGE:pr-$PR_NUMBER-$short"$'\n'"$IMAGE:pr-$PR_NUMBER"
          else
            short="${GITHUB_SHA::7}"
            if [ "$IS_TAG" = "true" ]; then version="${REF_NAME#v}"; else version="$counted-$short"; fi
            preview_tags=""
          fi
          {
            echo "short_sha=$short"
            echo "version=$version"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "push_preview=$PR_FROM_THIS_REPO"
            echo "preview_tags<<EOF"
            echo "$preview_tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # A release carries no Finnish text that is still machine-translated (#13,
      # rules/i18n.md). Checked here, before anything is tagged: a refused
      # release must not leave a vX.Y.Z image behind, and the production deploy
      # and the release both wait for this job.
      - uses: ./.github/actions/pnpm
        if: startsWith(github.ref, 'refs/tags/v')
      - name: Every Finnish text has had its native review
        if: startsWith(github.ref, 'refs/tags/v')
        run: pnpm i18n:check --release

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: github.event_name == 'push' || steps.identity.outputs.push_preview == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A release tag on a commit that main already built: retag, do not rebuild.
      - name: Reuse the image main built for this commit
        id: reuse
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if docker buildx imagetools inspect "$IMAGE:$GITHUB_SHA" >/dev/null 2>&1; then
            docker buildx imagetools create -t "$IMAGE:$TAG" "$IMAGE:$GITHUB_SHA"
            echo "reused=true" >> "$GITHUB_OUTPUT"
            echo "retagged $IMAGE:$GITHUB_SHA as $TAG"
          else
            echo "reused=false" >> "$GITHUB_OUTPUT"
            echo "no image for $GITHUB_SHA (a tag off main, e.g. a hotfix): building"
          fi

      - name: Image tags
        id: meta
        if: steps.reuse.outputs.reused != 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=,format=long
            type=ref,event=branch
            type=ref,event=tag

      - name: Build for the smoke test
        if: steps.reuse.outputs.reused != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/arm64
          load: true
          tags: kuutti-api:ci
          provenance: false
          build-args: |
            APP_VERSION=${{ steps.identity.outputs.version }}
            GIT_COMMIT=${{ steps.identity.outputs.short_sha }}
            BUILT_AT=${{ steps.identity.outputs.built_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Every copy of the image carries its own licence and the notices of what
      # it carries, written by the API's build for this platform (#416, ADR-005).
      - name: The image carries its licence and the third-party notices
        if: steps.reuse.outputs.reused != 'true'
        run: |
          docker run --rm --entrypoint sh kuutti-api:ci -c '
            test -s /app/LICENSE && test -s /app/LICENSE-EXCEPTION &&
            grep -q "^@img/sharp-linux-arm64 " /app/dist/THIRD_PARTY_NOTICES &&
            grep -q "^LIBVIPS AND THE LIBRARIES BUILT INTO IT$" /app/dist/THIRD_PARTY_NOTICES' \
            || { echo "::error::the image lacks its licence or its THIRD_PARTY_NOTICES"; exit 1; }
          echo "the image carries /app/LICENSE, /app/LICENSE-EXCEPTION and dist/THIRD_PARTY_NOTICES"

      - name: Image starts, migrates, and answers /health with db ok
        if: steps.reuse.outputs.reused != 'true'
        run: |
          docker run -d --name api --network host \
            -e APP_ENV=test \
            -e DATABASE_URL=postgres://kuutti:kuutti@127.0.0.1:5432/kuutti \
            kuutti-api:ci
          for _ in $(seq 1 30); do
            if out=$(curl -fsS http://127.0.0.1:3000/health); then echo "$out"; echo "$out" | grep -q '"db":"ok"' && echo "$out" | grep -q '"migrations":"current"' && exit 0; fi
            sleep 1
          done
          echo "no healthy answer"; docker logs api; exit 1

      # Same layers as the smoke-test build (the cache hits), pushed under the
      # pull request's tags for preview.yml. No provenance: nothing ships from it.
      - name: Push the pull request's image for its preview
        if: steps.identity.outputs.push_preview == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.identity.outputs.preview_tags }}
          provenance: false
          build-args: |
            APP_VERSION=${{ steps.identity.outputs.version }}
            GIT_COMMIT=${{ steps.identity.outputs.short_sha }}
            BUILT_AT=${{ steps.identity.outputs.built_at }}
          cache-from: type=gha

      - name: Push with provenance and SBOM
        id: push
        if: github.event_name == 'push' && steps.reuse.outputs.reused != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          build-args: |
            APP_VERSION=${{ steps.identity.outputs.version }}
            GIT_COMMIT=${{ steps.identity.outputs.short_sha }}
            BUILT_AT=${{ steps.identity.outputs.built_at }}
          cache-from: type=gha

      - name: Digest of what was pushed
        id: digest
        if: github.event_name == 'push'
        env:
          REF: ${{ github.ref_name }}
          PUSHED: ${{ steps.push.outputs.digest }}
        run: |
          if [ -n "$PUSHED" ]; then digest="$PUSHED"; else
            digest=$(docker buildx imagetools inspect "$IMAGE:$REF" --format '{{json .Manifest}}' | jq -r .digest)
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "$IMAGE@$digest"

  # A signed statement, kept by GitHub and next to the image, that this digest
  # was built by this workflow from this ref (#16 A.7). BuildKit's provenance in
  # the image job is unsigned metadata in the registry; this is what
  # `gh attestation verify` checks before a manual recovery deploy
  # (infra/README.md). A job of its own: the deploys do not wait for Sigstore,
  # and the job that builds and runs a pull request's code holds neither the
  # OIDC token nor the right to attest. It runs for main and for tags, so a
  # release that retags main's digest is attested under its tag as well.
  attest:
    name: attest
    needs: image
    if: github.event_name == 'push' && needs.image.outputs.digest != ''
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ needs.image.outputs.digest }}
          push-to-registry: true

  deploy-staging:
    name: deploy staging
    needs: image
    # STAGING_ENABLED: set by the maintainer once staging is applied and its
    # Dokploy is configured (infra/README.md).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.STAGING_ENABLED == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
      image: ghcr.io/kuutti-ry/kuutti-api:${{ github.sha }}
      commit: ${{ needs.image.outputs.short_sha }}
    # Environment-scoped secrets (DOKPLOY_TOKEN) only reach the called job
    # through inherit; an explicit pass would resolve at the caller, which
    # has no environment.
    secrets: inherit # zizmor: ignore[secrets-inherit]

  # The moderation panel follows the staging API it talks to (#313, ADR-025
  # §5). It is built without credentials, since pnpm install runs the
  # dependencies' own scripts, and written by the next job, which holds the
  # staging role and installs nothing; "staging" is here for its variables.
  # Until those are set from tofu output (infra/README.md, Admin panel), this
  # job stops green and the next one is skipped.
  admin:
    name: admin panel
    needs: deploy-staging
    runs-on: ubuntu-24.04-arm
    environment: staging
    permissions:
      contents: read
    outputs:
      ready: ${{ steps.ready.outputs.ready }}
    steps:
      - name: Is the panel's host applied?
        id: ready
        env:
          ADMIN_URL: ${{ vars.ADMIN_URL }}
          ADMIN_BUCKET: ${{ vars.ADMIN_BUCKET }}
          ADMIN_DISTRIBUTION_ID: ${{ vars.ADMIN_DISTRIBUTION_ID }}
        run: |
          missing=""
          for name in ADMIN_URL ADMIN_BUCKET ADMIN_DISTRIBUTION_ID; do [ -n "${!name}" ] || missing="$missing $name"; done
          if [ -n "$missing" ]; then
            echo "::notice::not set in the staging environment:$missing; the panel is not deployed (infra/README.md, Admin panel)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.ready.outputs.ready == 'true'
        with:
          persist-credentials: false
      - uses: ./.github/actions/pnpm
        if: steps.ready.outputs.ready == 'true'

      # VITE_* is inlined at build time: this build only ever talks to the
      # staging API, the one origin its CSP names (ADR-025 §3).
      - name: Build the panel against the staging API
        if: steps.ready.outputs.ready == 'true'
        env:
          VITE_API_URL: ${{ vars.API_URL }}
        run: |
          : "${VITE_API_URL:?API_URL must be set in the GitHub environment}"
          pnpm --filter @kuutti/admin exec vite build

      # overwrite: a re-run of this job, once the variables are set, uploads
      # under the same name in the same run.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.ready.outputs.ready == 'true'
        with:
          name: admin-dist
          path: apps/admin/dist
          retention-days: 1
          if-no-files-found: error
          overwrite: true

  admin-staging:
    name: admin staging
    needs: admin
    if: needs.admin.outputs.ready == 'true'
    runs-on: ubuntu-24.04-arm
    environment:
      name: staging
      url: ${{ vars.ADMIN_URL }}
    permissions:
      contents: read
      id-token: write
    # The staging role (kuutti-ci-apply), as the infrastructure apply has it:
    # the bucket's root and the invalidation are staging's to write, and the
    # plan role may write pr-* alone (ADR-025 §7).
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_APPLY_ROLE_ARN }}
      AWS_ROLE_SESSION_NAME: gha-admin-${{ github.run_id }}
    # bash -eo pipefail: a failed curl behind a pipe must fail the step.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: admin-dist
          path: dist
      - run: .github/scripts/aws-oidc.sh

      # The hashed assets first, then index.html, which names them, and only
      # then the assets of the build before: a page loaded in between finds
      # every file it asks for. index.html is revalidated on every load, the
      # assets never change under their names (ADR-025 §4); licenses.txt, the
      # bundled packages' licences the footer links (#416), keeps its name
      # from build to build, so it is revalidated too. pr-* holds the
      # previews of open pull requests (§6): --delete must never reach it.
      - name: Write the build to the bucket's root, never under pr-
        env:
          ADMIN_BUCKET: ${{ vars.ADMIN_BUCKET }}
        run: |
          immutable='public, max-age=31536000, immutable'
          aws s3 sync dist "s3://$ADMIN_BUCKET/" --exclude index.html --exclude licenses.txt --exclude 'pr-*' --cache-control "$immutable"
          aws s3 cp dist/licenses.txt "s3://$ADMIN_BUCKET/licenses.txt" --cache-control no-cache --content-type 'text/plain; charset=utf-8'
          aws s3 cp dist/index.html "s3://$ADMIN_BUCKET/index.html" --cache-control no-cache
          aws s3 sync dist "s3://$ADMIN_BUCKET/" --exclude index.html --exclude licenses.txt --exclude 'pr-*' --cache-control "$immutable" --delete

      # /* is one path of the thousand free each month. Waited for, so the
      # checks below read this build and not an edge's copy of the last one.
      - name: Invalidate the distribution
        env:
          ADMIN_DISTRIBUTION_ID: ${{ vars.ADMIN_DISTRIBUTION_ID }}
        run: |
          id=$(aws cloudfront create-invalidation --distribution-id "$ADMIN_DISTRIBUTION_ID" --paths '/*' \
            --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$ADMIN_DISTRIBUTION_ID" --id "$id"
          echo "invalidated /* ($id)"

      # What #313 asks of the host, read from outside: every header of the
      # panel's policy, exactly as ADR-025 §3 has it, on the root and on a
      # page's own path (the fallback, §2); that path answers this build's
      # panel (#302), and licenses.txt this build's licences (#416); and the
      # API answers the panel's origin and no other (§10). The API reads its parameters at boot: a refused origin right
      # after the parameter changed wants the API restarted once.
      - name: The panel is served with its headers, and the API lets it in
        env:
          ADMIN_URL: ${{ vars.ADMIN_URL }}
          API_URL: ${{ vars.API_URL }}
        run: |
          csp="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' $API_URL; connect-src $API_URL; worker-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
          for path in / /photos; do
            headers=$(curl -fsS -o /dev/null -D - "$ADMIN_URL$path" | tr -d '\r')
            while IFS='|' read -r name want; do
              got=$(grep -i "^$name:" <<< "$headers" | cut -d' ' -f2- || true)
              lower() { tr '[:upper:]' '[:lower:]' <<< "$1"; }
              [ "$(lower "$got")" = "$(lower "$want")" ] || { echo "::error::$ADMIN_URL$path answered $name '$got', not '$want'"; exit 1; }
            done <<EOF
          content-security-policy|$csp
          strict-transport-security|max-age=63072000; includeSubDomains; preload
          x-content-type-options|nosniff
          referrer-policy|no-referrer
          x-frame-options|DENY
          permissions-policy|camera=(), microphone=(), geolocation=()
          cross-origin-opener-policy|same-origin
          cross-origin-resource-policy|same-origin
          x-robots-tag|noindex, nofollow
          EOF
            echo "$ADMIN_URL$path carries every header of the panel's policy"
          done
          code=$(curl -sS -o "$RUNNER_TEMP/photos.html" -w '%{http_code}' "$ADMIN_URL/photos")
          if [ "$code" != 200 ] || ! cmp -s "$RUNNER_TEMP/photos.html" dist/index.html; then
            echo "::error::$ADMIN_URL/photos answered $code, not this build's index.html"; exit 1
          fi
          echo "$ADMIN_URL/photos answers 200 with this build's index.html"
          # Byte for byte: a key the bucket lacks answers 200 with index.html (§2).
          code=$(curl -sS -o "$RUNNER_TEMP/licenses.txt" -w '%{http_code}' "$ADMIN_URL/licenses.txt")
          if [ "$code" != 200 ] || ! cmp -s "$RUNNER_TEMP/licenses.txt" dist/licenses.txt; then
            echo "::error::$ADMIN_URL/licenses.txt answered $code, not this build's licences"; exit 1
          fi
          echo "$ADMIN_URL/licenses.txt answers this build's licences"
          allowed() {
            curl -fsS -o /dev/null -D - -X OPTIONS -H "Origin: $1" -H 'Access-Control-Request-Method: GET' "$API_URL/health" \
              | tr -d '\r' | grep -i '^access-control-allow-origin:' | cut -d' ' -f2-
          }
          own=$(allowed "$ADMIN_URL" || true)
          [ "$own" = "$ADMIN_URL" ] || { echo "::error::$API_URL refused $ADMIN_URL (got '$own'); restarted since its parameters changed?"; exit 1; }
          got=$(allowed https://example.com || true)
          [ -z "$got" ] || { echo "::error::$API_URL allowed https://example.com"; exit 1; }
          echo "$API_URL allows $own and refused https://example.com"

  deploy-prod:
    name: deploy prod
    needs: image
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/deploy.yml
    with:
      environment: prod
      image: ghcr.io/kuutti-ry/kuutti-api:${{ github.ref_name }}
      commit: ${{ needs.image.outputs.short_sha }}
    secrets: inherit # zizmor: ignore[secrets-inherit]

  release:
    name: release
    needs: image
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/release.yml
    permissions:
      contents: write
    with:
      tag: ${{ github.ref_name }}
      image: ghcr.io/kuutti-ry/kuutti-api@${{ needs.image.outputs.digest }}
