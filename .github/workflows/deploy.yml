name: Deploy

# Called by build.yml: deploys an already-pushed image to one environment's
# Dokploy, waits until /health runs that commit (#8), then publishes the same
# commit's JavaScript as an EAS Update to the environment's channel (#10:
# staging or production). The GitHub environment supplies DOKPLOY_URL,
# DOKPLOY_APPLICATION_ID and API_URL as variables and DOKPLOY_TOKEN and
# EXPO_TOKEN as secrets; prod's environment also carries the reviewer gate,
# so a prod deploy waits for approval before this runs. EAS_ENABLED
# (repository variable) switches the update on.

on:
  workflow_call:
    inputs:
      environment:
        description: staging or prod
        type: string
        required: true
      image:
        description: Full image reference to deploy
        type: string
        required: true
      commit:
        description: Short commit /health must report
        type: string
        required: true

permissions:
  contents: read

# bash -eo pipefail: a failed eas or curl behind a pipe must fail the step.
defaults:
  run:
    shell: bash


jobs:
  deploy:
    name: deploy ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.API_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Between the first infra apply and the Dokploy setup (infra/README.md,
      # After the first apply) the environment has no DOKPLOY_URL yet: report
      # it and stop green rather than fail every merge in the meantime.
      - name: Is Dokploy configured for this environment?
        id: ready
        env:
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
        run: |
          if [ -z "$DOKPLOY_URL" ]; then
            echo "DOKPLOY_URL is not set for this environment; nothing deployed (infra/README.md, After the first apply)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Point the Dokploy application at the image and deploy
        if: steps.ready.outputs.ready == 'true'
        env:
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
          DOKPLOY_APPLICATION_ID: ${{ vars.DOKPLOY_APPLICATION_ID }}
          IMAGE: ${{ inputs.image }}
        run: .github/scripts/dokploy-deploy.sh

      - name: /health reports the commit with the database reachable
        if: steps.ready.outputs.ready == 'true'
        env:
          API_URL: ${{ vars.API_URL }}
          COMMIT: ${{ inputs.commit }}
        run: .github/scripts/wait-healthy.sh

      # The update follows the API (#10, ADR-004): staging gets channel
      # staging, prod channel production, each bundle pointed at its own API.
      # Not code-signed: Expo sells update signing with its paid plans only,
      # so what may publish is whatever holds this environment's EXPO_TOKEN
      # (ADR-004). A native change is a build, not an update: eas-build.yml
      # watches the fingerprint.
      - uses: ./.github/actions/pnpm
        if: steps.ready.outputs.ready == 'true' && vars.EAS_ENABLED == 'true'

      - name: Publish the EAS Update to the ${{ inputs.environment == 'prod' && 'production' || 'staging' }} channel
        if: steps.ready.outputs.ready == 'true' && vars.EAS_ENABLED == 'true'
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EXPO_PUBLIC_API_URL: ${{ vars.API_URL }}
          CHANNEL: ${{ inputs.environment == 'prod' && 'production' || 'staging' }}
          EAS_ENVIRONMENT: ${{ inputs.environment == 'prod' && 'production' || 'preview' }}
          COMMIT: ${{ inputs.commit }}
        run: |
          # --environment makes the EAS environment's EXPO_PUBLIC_API_URL win over
          # the runner's; both must exist and README keeps them equal.
          : "${EXPO_PUBLIC_API_URL:?API_URL must be set in the GitHub environment}"
          # With --environment, eas-cli prints a plain line on stdout ahead of
          # the JSON (eas-build.yml has the same filter); keep the document.
          pnpm exec eas update --channel "$CHANNEL" --environment "$EAS_ENVIRONMENT" \
            --message "$COMMIT" --platform all --json --non-interactive \
            | sed -n '/^[{[]/,$p' \
            | jq -er '.[] | "\(.platform) \(.id) runtime \(.runtimeVersion) branch \(.branch)"'

      # The update's source maps, so Sentry symbolises the JavaScript it just
      # published (#11). dist is eas update's export directory. Skipped, not
      # failed, while the environment has no token: the update is already out.
      # The organisation is named here because the uploader reads these
      # variables before the app.json plugin block. Sentry's slug was kuutti-fi
      # from its creation (2026-09-20, `kuutti` was taken) and is kuutti-ry,
      # the GitHub organisation's name (#110), since October 2026. An
      # organisation token carries the slug it was made under and sentry-cli
      # prefers it to SENTRY_ORG, so a rename also means a new token
      # (docs/runbooks/sentry-setup.md, section 4). app.json's plugin block
      # names kuutti-ry since the seal-head icons' native change (#409).
      - name: Upload the update's source maps to Sentry
        if: steps.ready.outputs.ready == 'true' && vars.EAS_ENABLED == 'true'
        working-directory: apps/mobile
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: kuutti-ry
          SENTRY_PROJECT: mobile
          SENTRY_URL: https://de.sentry.io/
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then
            echo "SENTRY_AUTH_TOKEN is not set in this environment; source maps not uploaded"
            exit 0
          fi
          pnpm exec sentry-expo-upload-sourcemaps dist
