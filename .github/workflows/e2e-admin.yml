name: E2E admin

# The moderation panel's flows (apps/admin/e2e, ADR-051) in Chromium against the local stack on
# the runner, as `pnpm e2e:admin` runs them on a laptop: docker compose's Postgres, mock bank and
# S3 stand-in, then the run's own database, API and production build of the panel, served with
# the headers of infra/modules/admin/main.tf. It needs no .env: the run configures itself from
# env.example.
#
# When (ADR-051 §8): every push to main, a pull request that changes what the flows exercise
# (each push), and by hand. No environment, no secret, not a required check.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "apps/admin/**"
      - "apps/api/**"
      - "packages/**"
      - "services/mock-idp/**"
      - "infra/modules/admin/main.tf"
      - "docker-compose.yml"
      - "env.example"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".npmrc"
      - ".github/actions/pnpm/**"
      - ".github/workflows/e2e-admin.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-admin:
    name: e2e-admin
    # On the job, as in e2e.yml: a newer push to the same ref ends the run in progress.
    concurrency:
      group: e2e-admin-${{ github.ref }}
      cancel-in-progress: true
    # The compose job's runner: docker compose runs as on a laptop.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/pnpm

      - name: Start the stack
        run: docker compose up -d --wait

      - name: Cache the release of pictures
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/kuutti-demo-photos
          key: demo-photos-${{ hashFiles('packages/db/src/seed/photos-manifest.ts') }}

      - name: Fetch and verify the pictures
        run: pnpm demo:assets

      # Playwright's own build of Chromium, its headless shell alone, for the version the lockfile
      # pins: fetched from Playwright's download host by its own command (the package has no
      # install script), the system libraries it needs from the runner's apt.
      - name: The version of Playwright
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

      - name: Chromium and its libraries
        working-directory: apps/admin
        run: npx playwright install --with-deps --only-shell chromium

      - name: The flows
        run: pnpm e2e:admin

      # Playwright's report and each failed flow's trace and screenshot, beside the API's log and
      # what each step of the setup said. Local data of a database that is gone, nothing secret.
      - name: Keep what the run saw
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-admin
          path: |
            apps/admin/e2e/.out/setup.log
            apps/admin/e2e/.out/api.log
            apps/admin/e2e/.out/results
            apps/admin/e2e/.out/report
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore

      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --no-color | tail -100
