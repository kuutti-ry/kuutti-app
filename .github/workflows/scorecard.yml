name: Scorecard

# OpenSSF Scorecard (#16 A.6): checks most of the repository hardening
# continuously (pinned actions, token permissions, branch protection, dangerous
# workflow patterns, signed releases) and publishes the result that the README
# badge shows. Findings also land in the repository's code scanning alerts.

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: scorecard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Upload the findings as code scanning alerts.
      security-events: write
      # publish_results proves to the Scorecard API, with the job's OIDC token,
      # that the result comes from this repository.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
