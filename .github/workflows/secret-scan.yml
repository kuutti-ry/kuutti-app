name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly full-history scan, Monday 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Least privilege: the job only needs to read the repository contents.
permissions:
  contents: read

jobs:
  trufflehog:
    name: TruffleHog
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history so the scanner can inspect every commit in the range.
          fetch-depth: 0

      # Pushes and pull requests: fail on verified secrets and on ones that could
      # not be verified either way, so a real key with a broken verifier still
      # blocks. The weekly full-history scan is verified-only: placeholders in old
      # commits can never be cleaned up and would keep it red forever.
      - name: Scan the pushed range for leaked secrets
        if: github.event_name != 'schedule'
        uses: trufflesecurity/trufflehog@b2b0a92070f206ab7b5a1105d82a7f2f48d92341 # v3.99.0
        with:
          extra_args: --results=verified,unknown

      - name: Weekly scan of the whole history for verified secrets
        if: github.event_name == 'schedule'
        uses: trufflesecurity/trufflehog@b2b0a92070f206ab7b5a1105d82a7f2f48d92341 # v3.99.0
        with:
          extra_args: --results=verified
