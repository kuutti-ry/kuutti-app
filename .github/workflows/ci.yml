name: CI

# The checks the main ruleset requires (#8): job names are the check names and
# stay stable. Everything runs on arm64, the architecture of the t4g box.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/pnpm
      - run: pnpm typecheck

  lint:
    name: lint
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/pnpm
      - run: pnpm lint
      # Every PEM stays out of git; .gitignore un-ignores exactly one public
      # certificate bundle. TruffleHog filters unverifiable keys, so this is
      # the backstop.
      - name: No private key in tracked files
        run: |
          if git grep -lE 'BEGIN( RSA| EC| OPENSSH| ENCRYPTED)? PRIVATE KEY' -- . ':!*.md'; then
            echo "::error::a private key is tracked; rotate it, then remove it from history"; exit 1
          fi
          echo "no private key tracked"

  test-api-packages:
    name: test-api-packages
    runs-on: ubuntu-24.04-arm
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: kuutti
          POSTGRES_PASSWORD: kuutti
          POSTGRES_DB: kuutti_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kuutti"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://kuutti:kuutti@127.0.0.1:5432/kuutti_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/pnpm
      - name: Vitest for the API, the admin panel and every package
        run: pnpm -r --filter '!@kuutti/mobile' run test

  test-mobile:
    name: test-mobile
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/pnpm
      - name: jest-expo
        run: pnpm --filter @kuutti/mobile test
      # WCAG contrast of every token pair in every theme (#12).
      - name: Token contrast
        run: pnpm --filter @kuutti/mobile check:contrast

  i18n:
    name: i18n
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A pull request's merge commit and its first parent, the base: what
          # the review notice below compares against, without another fetch.
          fetch-depth: 2
      - uses: ./.github/actions/pnpm
      # rules/i18n.md: the file validates, a missing fi fails, a missing sv
      # warns, no dynamic value is inflected, every translation is machine
      # text or carries a current native review (#55). Unreviewed Finnish
      # blocks a release tag, which is build.yml's i18n release gate.
      - name: messages.yaml follows the rules
        run: pnpm i18n:check
      - name: How far the native review has come
        run: node packages/i18n/scripts/review.ts --markdown >> "$GITHUB_STEP_SUMMARY"
      # An approval shows on the pull request, so one nobody asked for is seen (#55).
      - name: Texts newly approved by a native review
        if: github.event_name == 'pull_request'
        run: node packages/i18n/scripts/review.ts --approved-since HEAD^1
      - name: Compiled catalogues and the key type are committed and current
        run: |
          pnpm i18n:build
          git diff --exit-code -- packages/i18n/src/generated
          test -z "$(git status --porcelain -- packages/i18n/src/generated)" || { git status --porcelain -- packages/i18n/src/generated; echo "run pnpm i18n:build and commit src/generated"; exit 1; }

  licenses:
    name: licenses
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/pnpm
      # Every installed dependency is under an allowed licence or is a named
      # exception with its reason (#16 C.2, scripts/license-policy.json).
      - name: Dependency licences follow the policy
        run: pnpm check:licenses --self-test
        env:
          # Reads the licence GitHub reports for each action named in the policy.
          GH_TOKEN: ${{ github.token }}

  audit:
    name: audit
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/pnpm
        with:
          install: "false"
      - name: No known high or critical vulnerability in the lockfile
        run: pnpm audit --audit-level high

  scenarios:
    name: scenarios
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The checker has no dependencies, so there is nothing to install.
      - uses: ./.github/actions/pnpm
        with:
          install: "false"
      - name: Every non-pending scenario has a same-named test (ADR-002)
        run: pnpm check:scenarios --list

  schema-drift:
    name: schema-drift
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/pnpm

      - name: OpenAPI document and generated types are committed and current (ADR-003)
        run: |
          pnpm openapi
          git diff --exit-code -- apps/api/openapi.json packages/schema/src/api.generated.ts

      - name: Migrations match the schema
        run: |
          pnpm --filter @kuutti/db check
          pnpm --filter @kuutti/db generate --name ci-drift-check
          git diff --exit-code -- packages/db/drizzle
          test -z "$(git status --porcelain -- packages/db/drizzle)" || { git status --porcelain -- packages/db/drizzle; echo "schema changed without a committed migration"; exit 1; }

      - name: No forbidden identifiers in the schema
        run: pnpm check:schema-words

  compose:
    name: compose
    # The local stack as a developer runs it: Postgres, the S3 stand-in (versitygw), the mock bank IdP.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/pnpm

      - name: Every published port binds to loopback
        run: |
          docker compose config --format json | python3 -c '
          import json, sys
          bad = [(n, p) for n, s in json.load(sys.stdin)["services"].items() for p in s.get("ports", []) if p.get("host_ip") != "127.0.0.1"]
          print("all published ports on 127.0.0.1" if not bad else f"not loopback: {bad}")
          sys.exit(1 if bad else 0)'

      - name: Start the stack
        run: |
          cp env.example .env
          docker compose up -d --wait
          docker compose ps

      - name: Mock bank IdP issues FTN-shaped claims
        run: node services/mock-idp/verify.ts

      - name: Migrate and seed against compose Postgres
        run: |
          pnpm --filter @kuutti/db migrate
          pnpm --filter @kuutti/db seed --env development

      - name: API and db tests against compose Postgres and the S3 stand-in
        env:
          DATABASE_URL: postgres://kuutti:kuutti@127.0.0.1:5432/kuutti_test
          S3_ENDPOINT: http://127.0.0.1:9000
          S3_BUCKET: kuutti-media
          S3_ACCESS_KEY: kuutti
          S3_SECRET_KEY: kuutti-dev-only
        run: |
          pnpm --filter @kuutti/tunnistus-oidc test
          pnpm --filter @kuutti/db test
          pnpm --filter @kuutti/api test

      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --no-color | tail -100

  issue-link:
    name: issue-link
    # Every pull request names the issue it works on ("Refs #n"), so the issue's
    # timeline links to the pull request and back. A closing keyword is refused:
    # an issue closes when the maintainer has tested it, not when a merge
    # happens (CLAUDE.md, Git). Dependabot has no issue and is exempt.
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    env:
      PR_BODY: ${{ github.event.pull_request.body }}
    steps:
      - name: the body references an issue without closing it
        run: |
          if ! grep -Eq '#[0-9]+' <<< "$PR_BODY"; then
            echo '::error::The pull request body names no issue. Add "Refs #<n>".'
            exit 1
          fi
          if grep -Eiq '\b(close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved)\b[[:space:]]*([a-z0-9._-]+/[a-z0-9._-]+)?#[0-9]+' <<< "$PR_BODY"; then
            echo '::error::A closing keyword would close the issue on merge. Write "Refs #<n>"; the maintainer closes the issue after testing.'
            exit 1
          fi

  workflows:
    name: workflows
    # Static checks of the workflows themselves: zizmor for injection,
    # permissions and pinning, and the #8 invariants script; then the one
    # script that cancels runs, against a gh that answers from a file.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: zizmor and the permission invariants
        run: |
          pip install --quiet zizmor==1.30.1 pyyaml==6.0.2
          zizmor --no-progress --min-severity medium --min-confidence medium .github/workflows
          python .github/scripts/check-workflow-permissions.py
      - name: what the sweep withdraws, and what it leaves
        run: .github/scripts/withdraw-waiting-runs.test.sh
