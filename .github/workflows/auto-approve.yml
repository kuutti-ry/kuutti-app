name: Auto-approve own pull requests

# Runs from main on its schedule. A manual dispatch runs the chosen branch's
# copy of this file, and a push runs that branch's workflows, each with the
# token scopes its own file asks for: so while the repository's "Allow GitHub
# Actions to create and approve pull requests" is on, which this job needs,
# a workflow anyone with write pushes can approve a pull request, and that
# setting, not this file, decides who can approve (#609). The jobs a pull
# request starts hold the same scope, since GitHub lets a token comment on a
# pull request only with it (issues: write alone answers 403, tried on
# 2026-11-06), and they run the pull request's own scripts. It reads nothing
# from a pull request but
# its author, draft state, head repository and whether its diff adds a native
# review record: a `reviewed:` line in packages/i18n/messages.yaml is the mark
# a native speaker leaves through `pnpm i18n:review` (#55), and its record is
# the human approval of the pull request, which this bot must not stand in for.
# Latency: GitHub's schedule, a few minutes. Needs "Allow GitHub Actions to
# create and approve pull requests".
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  approve:
    name: approve the maintainer's open pull requests
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Approve what the maintainer authored from this repository and nobody approved yet
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # The owner is read from the run, not written here: a name written
          # here outlived the organisation's rename (#110) and the job ran
          # green while it approved nothing. Empty, the step fails instead.
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          : "${OWNER:?the run names no repository owner}"
          gh pr list --repo "$REPO" --author superseacat --state open \
            --json number,isDraft,reviewDecision,headRepositoryOwner \
            --jq '.[] | select(.isDraft == false and .reviewDecision != "APPROVED" and .headRepositoryOwner.login == env.OWNER) | .number' |
          while read -r n; do
            # A native review record needs a person's approval on record (#55).
            # The diff is read first and the guard fails closed: no diff, no approval.
            if ! diff=$(gh pr diff --repo "$REPO" "$n" 2>&1); then
              echo "::warning::#$n: could not read the diff, not approving: $diff"
              continue
            fi
            if grep -qE '^\+[[:space:]]*reviewed:' <<< "$diff"; then
              echo "#$n adds a native review record (reviewed:): left for a person to approve"
              continue
            fi
            gh pr review --repo "$REPO" --approve \
              --body "Approved automatically: authored by the maintainer from this repository (#8, auto-approve.yml)." "$n"
          done
