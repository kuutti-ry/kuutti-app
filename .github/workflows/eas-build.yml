name: EAS build

# Native builds on EAS (#10, TD-2). On a v* tag: the production profile for
# both platforms, behind the prod environment (its reviewer approves the
# release anyway). On main: the development and preview profiles, but only
# when the project's fingerprint differs from the last finished development
# build's, so a JS-only change never spends a build; those reach devices as
# EAS Updates from deploy.yml. Never per pull request: the free tier is 15
# builds per platform a month. Install links are on the project's builds page
# (https://expo.dev/accounts/kuutti/projects/kuutti/builds); a repository
# variable EAS_BUILDS_ISSUE, if set, mirrors them onto that issue as well.
# EAS_ENABLED switches this on. By hand only, the staging profile: the staging
# app as an Android app bundle, which EAS submits to Google Play's internal
# testing track once it is built (ADR-057, #193); EAS holds the Play service
# account's key, so no GitHub environment holds a Google credential.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      profile:
        description: Build profile from eas.json
        type: choice
        options: [development, preview, staging, production]
        default: development
      platform:
        type: choice
        options: [all, android, ios]
        default: all

permissions:
  contents: read

# bash -eo pipefail: a failed eas behind a pipe must fail the step, never
# read as "no build yet" and spend two builds.
defaults:
  run:
    shell: bash

concurrency:
  group: eas-build-${{ github.ref }}
  cancel-in-progress: false


jobs:
  # A production binary bundles the texts: none of its Finnish may still be
  # machine-translated (#13). A job of its own, without an environment, so it
  # answers before the prod reviewer is asked. It always runs and only checks on
  # a tag or a production dispatch, so the build's `needs` is never a skipped job.
  i18n-release:
    name: i18n release gate
    runs-on: ubuntu-24.04-arm
    env:
      PRODUCTION: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.profile == 'production' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.PRODUCTION == 'true'
        with:
          persist-credentials: false
      - uses: ./.github/actions/pnpm
        if: env.PRODUCTION == 'true'
      - name: Every Finnish text has had its native review
        if: env.PRODUCTION == 'true'
        run: pnpm i18n:check --release

  build:
    name: eas build
    needs: i18n-release
    if: vars.EAS_ENABLED == 'true'
    runs-on: ubuntu-24.04-arm
    # A production build, from a tag or by hand, goes through the prod
    # environment and its reviewer; everything else through staging.
    environment: ${{ (startsWith(github.ref, 'refs/tags/v') || inputs.profile == 'production') && 'prod' || 'staging' }}
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/pnpm

      - name: Profiles to build
        id: plan
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EVENT: ${{ github.event_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
          INPUT_PROFILE: ${{ inputs.profile }}
          INPUT_PLATFORM: ${{ inputs.platform }}
          PLATFORMS: ${{ vars.EAS_PLATFORMS || 'android' }}
        run: |
          profiles=""
          platform=all
          if [ "$EVENT" = workflow_dispatch ]; then
            profiles="$INPUT_PROFILE"; platform="$INPUT_PLATFORM"
            # Android's alone until the association's Apple account can take
            # the staging app to TestFlight (#193).
            if [ "$profiles" = staging ]; then platform=android; fi
          elif [ "$IS_TAG" = true ]; then
            profiles="production"
          else
            # The fingerprint policy (rules/mobile.md): a native rebuild only
            # when the fingerprint differs from the last development build's,
            # decided per platform. Platforms come from the repository variable
            # EAS_PLATFORMS (default android: iOS needs the Apple account) so a
            # platform that cannot build never turns every push red, and only
            # the development profile builds on push during M1; preview builds
            # are started by hand. Each platform is 15 free builds a month.
            changed=""
            for p in $PLATFORMS; do
              # The newest development build that finished or is still queued
              # or running: a build in flight for this fingerprint must not be
              # started twice (seen 2026-09-20: a docs-only push right after a
              # native merge spent a second pair while the first pair was running).
              last=$(pnpm exec eas build:list --platform "$p" --build-profile development \
                --limit 10 --json --non-interactive | sed -n '/^[{[]/,$p' \
                | jq -r '[.[] | select(.status == "FINISHED" or .status == "IN_PROGRESS" or .status == "IN_QUEUE" or .status == "NEW")][0].id // empty')
              if [ -z "$last" ]; then echo "$p: no development build yet"; changed="$changed $p"; continue; fi
              # With --environment, eas-cli prints "Environment variables ...
              # loaded from the preview environment" on stdout ahead of the
              # JSON; keep only the document (run 35454488799).
              cmp=$(pnpm exec eas fingerprint:compare --build-id "$last" --environment preview --json --non-interactive \
                | sed -n '/^[{[]/,$p')
              # fingerprint1 is the build's, fingerprint2 the project's (seen on
              # 2026-09-20: the log had them the other way round).
              built=$(jq -r '.fingerprint1.hash' <<< "$cmp"); now=$(jq -r '.fingerprint2.hash' <<< "$cmp")
              if [ "$now" = "$built" ]; then echo "$p: fingerprint $now matches build $last"; else echo "$p: fingerprint $now differs from build $last ($built)"; changed="$changed $p"; fi
            done
            changed=$(echo $changed)
            if [ -n "$changed" ]; then
              profiles="development"
              case "$changed" in *" "*) platform=all ;; *) platform="$changed" ;; esac
            fi
          fi
          {
            echo "profiles=$profiles"
            echo "platform=$platform"
          } >> "$GITHUB_OUTPUT"
          echo "building: ${profiles:-nothing} ($platform)"

      - name: Start the builds
        id: build
        if: steps.plan.outputs.profiles != ''
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          PROFILES: ${{ steps.plan.outputs.profiles }}
          PLATFORM: ${{ steps.plan.outputs.platform }}
        run: |
          : > "$RUNNER_TEMP/builds.json"
          case "$PLATFORM" in all) platforms="android ios" ;; *) platforms="$PLATFORM" ;; esac
          for profile in $PROFILES; do
            # A build of the same profile and platform that is still queued or
            # running belongs to older code: cancel it, so the queue and the
            # free tier go to what is current (maintainer's rule, 2026-09-20).
            # A cancel that races a finish is harmless; the new build starts anyway.
            for p in $platforms; do
              pnpm exec eas build:list --platform "$p" --build-profile "$profile" --limit 5 --json --non-interactive \
                | sed -n '/^[{[]/,$p' \
                | jq -r '.[] | select(.status == "NEW" or .status == "IN_QUEUE" or .status == "IN_PROGRESS") | .id' \
                | while read -r id; do
                    [ -n "$id" ] || continue
                    echo "cancelling obsolete $profile $p build $id"
                    pnpm exec eas build:cancel "$id" --non-interactive || echo "could not cancel $id (finished meanwhile)"
                  done
            done
            # EAS submits the staging bundle itself once it is built (eas.json's
            # submit profile staging), so the job does not wait for the build.
            submit=()
            if [ "$profile" = staging ]; then submit=(--auto-submit); fi
            pnpm exec eas build --profile "$profile" --platform "$PLATFORM" "${submit[@]}" \
              --message "${GITHUB_REF_NAME} ${GITHUB_SHA::7}" --no-wait --json --non-interactive \
              | jq -c --arg profile "$profile" '.[] | {profile: $profile, id, platform, status}' >> "$RUNNER_TEMP/builds.json"
          done
          jq -r '"\(.profile) \(.platform) \(.id) \(.status)"' "$RUNNER_TEMP/builds.json"

      # One sticky comment per profile on the pinned issue: the build pages
      # carry the install link (APK) or the ad hoc install for registered iOS
      # devices once the build finishes.
      - name: Mirror the build links onto an issue (only with EAS_BUILDS_ISSUE)
        if: steps.plan.outputs.profiles != '' && vars.EAS_BUILDS_ISSUE != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ vars.EAS_BUILDS_ISSUE }}
          PROFILES: ${{ steps.plan.outputs.profiles }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          project=$(jq -r '.expo.extra.eas.projectId' apps/mobile/app.json)
          for profile in $PROFILES; do
            body="$RUNNER_TEMP/builds-$profile.md"
            {
              echo "#### \`$profile\` builds · $REF_NAME · \`${GITHUB_SHA::7}\` · $(date -u +%Y-%m-%d)"
              echo
              echo "| platform | build |"
              echo "|---|---|"
              jq -r --arg profile "$profile" --arg project "$project" \
                'select(.profile == $profile) | "| \(.platform | ascii_downcase) | https://expo.dev/projects/\($project)/builds/\(.id) |"' "$RUNNER_TEMP/builds.json"
              echo
              echo "<sub>Android: install the APK from the build page. iOS: registered devices only (apps/mobile/README.md). Started by [this run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID).</sub>"
            } > "$body"
            MARKER="eas-builds-$profile" BODY_FILE="$body" .github/scripts/sticky-comment.sh
          done
