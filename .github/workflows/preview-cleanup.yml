name: Preview cleanup

# Removes previews nobody needs any more (#9, TD-2, TD-19, ADR-012): the Dokploy
# application on the staging box, the EAS Hosting alias, the EAS Update branch,
# and the database kuutti_pr_<n>, which only the box can reach. The database is
# dropped through one Run Command document (modules/compute) that the plan role
# may send to the staging box and nothing else.
#
# It runs unattended from main: a sweep removes the previews of every pull
# request that is closed or merged and retires previews older than seven days,
# and a dispatch (from main) removes one pull request's. The sweep starts on
# every push to main, which is what a merge is, and on a schedule for what no
# merge follows (a pull request closed unmerged, the seven days). The push is
# the trigger that counts: GitHub starts scheduled workflows when it has room,
# and in this repository that has meant once in two to six hours, whatever the
# cron line says (ADR-012 §6). A push to main runs main's copy of this file. It
# does NOT run on the pull request's close event: that event runs the pull
# request's own copy of this file, and the removal must run main's copy (its
# actions: write job, ADR-012 §8, and the plan role that trusts main alone);
# a close event that waited for the reviewer of "preview" is also what left
# three previews of merged pull requests on the box until it ran out of
# memory (2026-09-27, ADR-012). pull_request_target is banned in this
# repository for the same class of reason (check-workflow-permissions.py).
# The GitHub environment "preview-cleanup" holds the same Dokploy and EAS
# tokens as "preview" and has no required reviewer: nothing here runs code
# from a pull request. Order: select, drop the database, remove the EAS
# alias and branch, remove the Dokploy application (the sweep's work list).
# A failed database drop leaves the application for the next sweep; a failed
# EAS removal does not, it fails the run by name.
#
# Beside that, and needing none of it: the runs of preview.yml that still
# wait for a reviewer of "preview" while their pull request has merged or
# closed are cancelled (ADR-012 §8; idle while the environment has no
# reviewer, ADR-004 §3). They deployed nothing, so the sweep above never
# finds them, and they would wait for thirty days.

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number whose previews to remove (empty for a sweep)
        required: false
        type: string

permissions:
  contents: read

# bash -eo pipefail: a failed script behind a pipe must fail the step.
defaults:
  run:
    shell: bash

# One cleanup at a time; a sweep that finds a run in progress waits.
concurrency:
  group: preview-cleanup
  cancel-in-progress: false

jobs:
  # Which pull requests lose their previews. Needs the Dokploy token to list
  # them, nothing else; gh, curl and jq are on the runner.
  select:
    name: select pull requests
    # Only from main: the plan role trusts main, and this file must be main's.
    if: vars.PREVIEWS_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    environment: preview-cleanup
    permissions:
      contents: read
      pull-requests: write
    outputs:
      numbers: ${{ steps.select.outputs.numbers }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Pull requests to clean
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
          DOKPLOY_ENVIRONMENT_ID: ${{ vars.DOKPLOY_ENVIRONMENT_ID }}
          PREVIEW_API_DOMAIN: ${{ vars.PREVIEW_API_DOMAIN }}
          INPUT_PR: ${{ github.event.inputs.pr }}
        run: |
          if [ -n "$INPUT_PR" ]; then
            [[ "$INPUT_PR" =~ ^[0-9]{1,7}$ ]] || { echo "::error::not a pull request number: $INPUT_PR"; exit 1; }
            numbers=$(jq -cn --arg pr "$INPUT_PR" '[$pr]')
          else
            numbers='[]'
            now=$(date -u +%s)
            for row in $(.github/scripts/dokploy-preview.sh list | jq -c '.[]'); do
              pr=$(jq -r .pr <<< "$row")
              created=$(jq -r .createdAt <<< "$row")
              age=$(( (now - $(date -u -d "$created" +%s)) / 86400 ))
              # A pull request that does not exist is closed; any other
              # failure of gh (rate limit, outage) must not remove an open
              # preview, so it is skipped with a warning.
              if state=$(gh pr view "$pr" --json state --jq .state 2>"$RUNNER_TEMP/pr-view.err"); then :
              elif grep -q "Could not resolve to a PullRequest" "$RUNNER_TEMP/pr-view.err"; then state=CLOSED
              else echo "::warning::could not read the state of #$pr: $(cat "$RUNNER_TEMP/pr-view.err")"; continue; fi
              if [ "$state" = CLOSED ] || [ "$state" = MERGED ]; then
                echo "#$pr is $state: removing its preview"
                NOTICE="Previews removed: the pull request is $state." \
                  PR_NUMBER="$pr" SHORT_SHA="sweep" .github/scripts/preview-comment.sh || true
              elif [ "$age" -ge 7 ]; then
                echo "#$pr preview is $age days old: retiring it"
                NOTICE="Preview retired after $age days to free the box; push again to recreate it." \
                  PR_NUMBER="$pr" SHORT_SHA="sweep" .github/scripts/preview-comment.sh || true
              else
                continue
              fi
              numbers=$(jq -c --arg pr "$pr" '. + [$pr]' <<< "$numbers")
            done
          fi
          echo "numbers=$numbers" >> "$GITHUB_OUTPUT"
          echo "cleaning: $numbers"

  # The runs nobody will approve any more (ADR-012 §8). A job of its own, with
  # no environment and no secret: it asks GitHub about runs and pull requests
  # with the run's own token and cancels. Cancelling takes actions: write, a
  # scope much wider than that use (it starts and disables workflows too), so
  # this is the only job in the repository that has it, and the job is one
  # checkout and one script (check-workflow-permissions.py holds its whole
  # shape: a step or a value more, and CI fails).
  # Nothing waits for the job and it waits for nothing: a failure here never
  # keeps a preview on the box.
  waiting:
    name: withdraw waiting runs
    if: vars.PREVIEWS_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      actions: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Cancel the preview runs that wait for a pull request that is not open
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/withdraw-waiting-runs.sh

  # The database lives on the private RDS instance; only the box reaches it.
  # No GitHub environment here: the plan role trusts main, and a job with an
  # environment presents a different OIDC subject. It runs before the Dokploy
  # application goes, because that application is the sweep's only work list:
  # a drop that fails leaves the application in place, so the next sweep finds
  # the pull request again and retries everything.
  databases:
    name: drop kuutti_pr_<n>
    needs: select
    if: needs.select.outputs.numbers != '[]' && needs.select.outputs.numbers != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_PLAN_ROLE_ARN }}
      AWS_ROLE_SESSION_NAME: gha-preview-cleanup-${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - run: .github/scripts/aws-oidc.sh

      - name: Send the drop document to the staging box
        env:
          NUMBERS: ${{ needs.select.outputs.numbers }}
        run: |
          instance=$(aws ec2 describe-instances \
            --filters Name=tag:Name,Values=kuutti-staging Name=instance-state-name,Values=running \
            --query 'Reservations[].Instances[].InstanceId' --output text)
          [ -n "$instance" ] || { echo "::error::no running kuutti-staging instance"; exit 1; }
          failed=0
          for pr in $(jq -r '.[]' <<< "$NUMBERS"); do
            id=$(aws ssm send-command --document-name kuutti-staging-preview-database \
              --instance-ids "$instance" --parameters "prNumber=$pr" \
              --comment "preview-cleanup.yml: pull request $pr" --query Command.CommandId --output text)
            for _ in $(seq 1 36); do
              sleep 5
              status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$instance" --query Status --output text 2>/dev/null || echo Pending)
              case "$status" in Pending|InProgress|Delayed) continue ;; esac
              break
            done
            aws ssm get-command-invocation --command-id "$id" --instance-id "$instance" \
              --query '[StandardOutputContent, StandardErrorContent]' --output text
            if [ "$status" != Success ]; then echo "::error::dropping kuutti_pr_$pr: $status"; failed=1; fi
          done
          exit "$failed"

  # Everything else. The database is dropped before this job runs, and the
  # Dokploy application, the sweep's work list, goes only after it: a failed
  # drop is retried by the next sweep. The EAS alias and branch are removed on
  # the way; a failure there never keeps a container on the box, it fails the
  # run and names what is left.
  remove:
    name: remove previews
    needs: [select, databases]
    if: needs.databases.result == 'success'
    runs-on: ubuntu-24.04-arm
    environment: preview-cleanup
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/pnpm

      # The alias is what the pull request linked to; the deployments behind
      # it stay listed in the EAS dashboard. The update branch is pruned so the
      # free tier's branch list does not grow with every pull request (TD-2).
      # A pull request without a web or native lane has neither, and EAS says
      # so in several wordings (ABSENT). Any other failure is remembered and
      # fails the job at its end, after the Dokploy application is gone: a
      # leftover alias at Expo costs nothing, a leftover container on the box
      # costs the box (2026-09-27, ADR-012).
      - name: Remove the EAS Hosting alias and the EAS Update branch
        id: eas
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          NUMBERS: ${{ needs.select.outputs.numbers }}
          ABSENT: "could not find|not found|does not exist|doesn't exist|no such|no ([a-z]+ )*(alias|branch)"
        run: |
          left=""
          remove() { # remove <what> <name> <command...>
            local what="$1" name="$2"; shift 2
            if out=$("$@" 2>&1); then echo "removed $what $name"
            elif grep -qiE "$ABSENT" <<< "$out"; then echo "no $what $name"
            else echo "$out"; echo "::error::$what $name could not be removed; by hand: $*"; left="$left $what:$name"; fi
          }
          for pr in $(jq -r '.[]' <<< "$NUMBERS"); do
            remove "EAS Hosting alias" "pr-$pr" pnpm exec eas deploy:alias:delete "pr-$pr" --non-interactive
            if jq -e '.expo.updates.url' app.json >/dev/null 2>&1; then
              remove "EAS Update branch" "pr-$pr" pnpm exec eas branch:delete "pr-$pr" --non-interactive
            fi
          done
          echo "left=$left" >> "$GITHUB_OUTPUT"

      - name: Remove the Dokploy applications
        env:
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          DOKPLOY_TOKEN: ${{ secrets.DOKPLOY_TOKEN }}
          DOKPLOY_ENVIRONMENT_ID: ${{ vars.DOKPLOY_ENVIRONMENT_ID }}
          PREVIEW_API_DOMAIN: ${{ vars.PREVIEW_API_DOMAIN }}
          NUMBERS: ${{ needs.select.outputs.numbers }}
        run: |
          for pr in $(jq -r '.[]' <<< "$NUMBERS"); do
            .github/scripts/dokploy-preview.sh delete "$pr"
          done

      - name: Anything left at EAS fails the run, by name
        if: steps.eas.outputs.left != ''
        env:
          LEFT: ${{ steps.eas.outputs.left }}
        run: |
          echo "::error::left at EAS:$LEFT"
          exit 1
