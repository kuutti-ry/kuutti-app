name: E2E

# The Maestro flows of apps/mobile/e2e on an Android emulator against the local
# stack, the way a developer runs them on the iOS simulator (ADR-020 §4, #164):
# Postgres, the S3 stand-in and the mock bank from docker compose, the API from
# source, the dev client built here, Metro serving the bundle. The emulator
# reaches them on its own 127.0.0.1 through adb reverse, so nothing in the
# flows or the app names another host. On every pull request for now, to see
# what a run costs; the flows' order does not matter (the README's table).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-android:
    name: e2e-android
    # x86_64: hardware acceleration of the emulator is proven on the standard
    # Linux runners (free for a public repository), and docker compose runs as
    # on a laptop. The rest of CI is arm64.
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      MAESTRO_VERSION: 2.11.0
      MAESTRO_SHA256: 5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/pnpm

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: The emulator may use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start the stack
        run: |
          cp env.example .env
          docker compose up -d --wait

      - name: Migrate and seed
        run: |
          pnpm --filter @kuutti/db migrate
          pnpm --filter @kuutti/db seed --env development

      - name: Cache the release of pictures
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/kuutti-demo-photos
          key: demo-photos-${{ hashFiles('packages/db/src/seed/photos-manifest.ts') }}

      - name: Fetch and verify the pictures
        run: pnpm demo:assets

      - name: Start the API
        run: |
          nohup pnpm dev > api.log 2>&1 &
          for _ in $(seq 1 90); do curl -fsS http://127.0.0.1:3000/health && exit 0; sleep 2; done
          cat api.log
          exit 1

      - name: The cast's stories
        run: pnpm demo:reset

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Build the dev client
        working-directory: apps/mobile
        run: |
          CI=1 npx expo prebuild --platform android --no-install
          cd android
          ./gradlew assembleDebug --console=plain -PreactNativeArchitectures=x86_64

      - name: Start Metro
        run: |
          CI=1 nohup pnpm dev:mobile > metro.log 2>&1 &
          for _ in $(seq 1 90); do curl -fsS http://127.0.0.1:8081/status && exit 0; sleep 2; done
          cat metro.log
          exit 1

      - name: Install Maestro
        run: |
          curl -fsSL -o "$RUNNER_TEMP/maestro.zip" "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          echo "${MAESTRO_SHA256}  $RUNNER_TEMP/maestro.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/maestro/bin" >> "$GITHUB_PATH"

      - name: The flows on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          # Each line runs on its own: the emulator's loopback ports reach the
          # runner's API, mock bank, Metro and S3 stand-in.
          script: |
            adb reverse tcp:3000 tcp:3000
            adb reverse tcp:8080 tcp:8080
            adb reverse tcp:8081 tcp:8081
            adb reverse tcp:9000 tcp:9000
            adb install -r apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
            node scripts/e2e.ts --format junit --output e2e-report.xml

      - name: Keep what the run saw
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-android
          path: |
            e2e-report.xml
            api.log
            metro.log
            ~/.maestro/tests
          retention-days: 7
          if-no-files-found: ignore

      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --no-color | tail -100
