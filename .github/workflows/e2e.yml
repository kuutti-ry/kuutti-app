name: E2E

# The Maestro flows of apps/mobile/e2e on an Android emulator against the local
# stack, the way a developer runs them on the iOS simulator (ADR-020 §4, #164):
# Postgres, the S3 stand-in and the mock bank from docker compose, the API from
# source, the dev client built here (or restored by its fingerprint), Metro
# serving the bundle. The emulator reaches them on its own 127.0.0.1 through
# adb reverse, so nothing in the flows or the app names another host.
#
# In four jobs (ADR-020 §7, #226): each runs a stretch of config.yaml's order on
# its own emulator and stack, so no flow shares a persona or a database with
# another job, after one job that restores the dev client or builds it. Setting
# up costs a job about three minutes, the flows close to forty in one job.
#
# When (ADR-020 §6): every push to main, a pull request that carries the label
# e2e (each push while it stays) and changes what the flows exercise, and by
# hand.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "apps/mobile/**"
      - "apps/api/**"
      - "packages/**"
      - "services/mock-idp/**"
      - "scripts/e2e.ts"
      - "docker-compose.yml"
      - "env.example"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".npmrc"
      - ".github/actions/pnpm/**"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The dev client holds only the native side, which its fingerprint names (the
  # one preview.yml and eas-build.yml compare; the commit in `extra` is left
  # out, and Metro serves the config anyway). A pull request that leaves the
  # native side alone finds main's; one that changes it builds once, and its
  # later pushes find that. The key's tail names how it is built, so a change of
  # the build changes the key. Built here once, not in each of the four jobs.
  dev-client:
    name: e2e-dev-client
    # A pull request only with the label: put on now, or there already when a
    # push comes. Another label put on is no reason to run. The four jobs need
    # this one, so they are skipped with it.
    if: >-
      github.event_name != 'pull_request'
      || (contains(github.event.pull_request.labels.*.name, 'e2e')
          && (github.event.action != 'labeled' || github.event.label.name == 'e2e'))
    # On the job, not the workflow: a run whose job is skipped must not cancel
    # the one in progress.
    concurrency:
      group: e2e-dev-client-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    # About 13 minutes when it builds.
    timeout-minutes: 30
    outputs:
      key: ${{ steps.dev-client.outputs.cache-primary-key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/pnpm

      - name: Fingerprint of the dev client
        id: fingerprint
        working-directory: apps/mobile
        run: |
          hash=$(node ../../node_modules/@expo/fingerprint/bin/cli.js fingerprint:generate --platform android | jq -r .hash)
          echo "android fingerprint $hash"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"

      # Only whether it is there: the four jobs restore it themselves.
      - name: Look for the dev client
        id: dev-client
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dev-client/app-debug.apk
          key: e2e-dev-client-${{ steps.fingerprint.outputs.hash }}-debug-x86_64
          lookup-only: true

      # No Gradle cache: the dev client is cached whole, and a Gradle cache
      # would be restored on every run for the few that build.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        if: steps.dev-client.outputs.cache-hit != 'true'
        with:
          distribution: temurin
          java-version: "17"

      - name: Build the dev client
        if: steps.dev-client.outputs.cache-hit != 'true'
        working-directory: apps/mobile
        run: |
          CI=1 npx expo prebuild --platform android --no-install
          (cd android && ./gradlew assembleDebug --console=plain -PreactNativeArchitectures=x86_64)
          mkdir -p ../../dev-client
          cp android/app/build/outputs/apk/debug/app-debug.apk ../../dev-client/

      - name: Save the dev client
        if: steps.dev-client.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dev-client/app-debug.apk
          key: ${{ steps.dev-client.outputs.cache-primary-key }}

  e2e-android:
    name: e2e-android (${{ matrix.shard }}/4)
    needs: dev-client
    strategy:
      # Every stretch reports, whichever fails.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    concurrency:
      group: e2e-android-${{ github.ref }}-${{ matrix.shard }}
      cancel-in-progress: true
    # x86_64: hardware acceleration of the emulator is proven on the standard
    # Linux runners (free for a public repository), and docker compose runs as
    # on a laptop. The rest of CI is arm64.
    runs-on: ubuntu-latest
    # About 15 minutes when it passes; a hung emulator or flow ends here.
    timeout-minutes: 40
    env:
      MAESTRO_VERSION: 2.11.0
      MAESTRO_SHA256: 5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/pnpm

      # Java for Maestro.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"

      - name: The emulator may use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # By hand, with the SDK the runner carries: the repository allows only
      # GitHub's own actions and those of verified creators, and the emulator
      # actions are neither. Started here, so it boots while the rest is built;
      # the image is the local emulator's, Chrome included, on a phone of the
      # same screen (the runner's tools know no Pixel 8). No metrics, and no
      # prompt about them, which the emulator says a later release will ask.
      # `yes` ends on a broken pipe once the licences are taken, hence `|| true`.
      - name: Start the emulator
        run: |
          image="system-images;android-36;google_apis;x86_64"
          tools="$ANDROID_HOME/cmdline-tools/latest/bin"
          # avdmanager and the emulator look for devices in different homes
          # on the runner; one folder for both.
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          (yes || true) | "$tools/sdkmanager" --licenses > /dev/null
          "$tools/sdkmanager" emulator platform-tools "$image" > /dev/null
          echo no | "$tools/avdmanager" create avd --name e2e --package "$image" --device pixel_7 \
            || { "$tools/avdmanager" list device --compact; exit 1; }
          nohup "$ANDROID_HOME/emulator/emulator" -avd e2e -no-window -no-audio -no-boot-anim \
            -no-snapshot -no-metrics -gpu swiftshader_indirect -camera-back none -camera-front none \
            > emulator.log 2>&1 &

      - name: Start the stack
        run: |
          cp env.example .env
          docker compose up -d --wait

      - name: Migrate and seed
        run: |
          pnpm --filter @kuutti/db migrate
          pnpm --filter @kuutti/db seed --env development

      - name: Cache the release of pictures
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/kuutti-demo-photos
          key: demo-photos-${{ hashFiles('packages/db/src/seed/photos-manifest.ts') }}

      - name: Fetch and verify the pictures
        run: pnpm demo:assets

      - name: Start the API
        run: |
          nohup pnpm dev > api.log 2>&1 &
          for _ in $(seq 1 90); do curl -fsS http://127.0.0.1:3000/health && exit 0; sleep 2; done
          cat api.log
          exit 1

      - name: The cast's stories
        run: pnpm demo:reset

      # The home screen shows an area's numbers from ten people up.
      - name: The synthetic population
        run: pnpm demo:population

      - name: Restore the dev client
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dev-client/app-debug.apk
          key: ${{ needs.dev-client.outputs.key }}
          fail-on-cache-miss: true

      # The first bundle takes Metro about 35 s: asked for here, the one the
      # dev client will ask for (the manifest names it), it is built while the
      # emulator boots rather than in the first flow.
      - name: Start Metro
        run: |
          CI=1 nohup pnpm dev:mobile > metro.log 2>&1 &
          for _ in $(seq 1 90); do curl -fsS http://127.0.0.1:8081/status && break; sleep 2; done
          curl -fsS -o /dev/null http://127.0.0.1:8081/status || { cat metro.log; exit 1; }
          bundle=$(curl -fsS -H "expo-platform: android" -H "accept: application/expo+json,application/json" \
            http://127.0.0.1:8081/ | jq -r .launchAsset.url)
          nohup curl -fsS -o /dev/null "$bundle" > /dev/null 2>&1 &

      - name: Install Maestro
        run: |
          curl -fsSL -o "$RUNNER_TEMP/maestro.zip" "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          echo "${MAESTRO_SHA256}  $RUNNER_TEMP/maestro.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/maestro/bin" >> "$GITHUB_PATH"

      # The emulator's loopback ports reach the runner's API, mock bank, Metro
      # and S3 stand-in; on Android 14 and later Gboard answers a synthesized tap
      # on a field with its stylus tutorial, so handwriting is off (README).
      #
      # Booted is not yet ready to install: the package manager can answer a
      # little later, and an install meanwhile fails with "Failure calling
      # service package: Broken pipe" (#355). So the step waits for it to
      # answer, and tries the install three times.
      - name: Wait for the emulator
        timeout-minutes: 14
        run: |
          timeout 300 adb wait-for-device || { cat emulator.log; exit 1; }
          for _ in $(seq 1 150); do
            [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ] && break
            sleep 2
          done
          [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ] || { tail -50 emulator.log; exit 1; }
          for _ in $(seq 1 60); do
            adb shell pm path android 2> /dev/null | grep -q '^package:' && break
            sleep 2
          done
          adb shell pm path android | grep -q '^package:' || { tail -50 emulator.log; exit 1; }
          for scale in window_animation_scale transition_animation_scale animator_duration_scale; do
            adb shell settings put global "$scale" 0
          done
          adb shell settings put secure stylus_handwriting_enabled 0
          for port in 3000 8080 8081 9000; do adb reverse "tcp:$port" "tcp:$port"; done
          for attempt in 1 2 3; do
            adb install -r dev-client/app-debug.apk && break
            [ "$attempt" = 3 ] && { tail -50 emulator.log; exit 1; }
            sleep 10
          done

      - name: The flows on the emulator
        env:
          SHARD: ${{ matrix.shard }}
        run: node scripts/e2e.ts --shard "$SHARD/4" --format junit --output e2e-report.xml

      - name: Keep what the run saw
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-android-${{ matrix.shard }}
          path: |
            e2e-report.xml
            api.log
            metro.log
            emulator.log
            ~/.maestro/tests
          retention-days: 7
          if-no-files-found: ignore

      - name: Stack logs on failure
        if: failure()
        run: docker compose logs --no-color | tail -100
