# Open the local bundle and wait for one of the app's first screens (ADR-020 §3).
# The dev client opens the bundle by its launcher link, never through the launcher
# screen. Signed in, the app shows the home screen's area card or an onboarding
# step under its welcome title; signed out, the sign-in screen, with its button or,
# after a refusal, the button to try again, or on a phone that has not recorded
# the current wordings the screens before the bank (#418), which bank-login.yaml
# taps through. With the app's lock on, a cold start shows the lock over all of
# it (ADR-045): one of our screens too, and left standing, since the lock's
# flow expects it; sign-out.yaml leaves it through the bank. "Kuutti" alone
# would match the dev client's loading screen, and the lock's plain cover,
# which says nothing else, is hidden from Maestro as from a screen reader.
# Metro is on 8081 unless METRO_PORT says otherwise (a second Metro, from a
# worktree, beside the one of the checkout). On Android the emulator's
# 127.0.0.1 is the host's through adb reverse.
appId: fi.kuutti.app
---
# Opened once more if the app never shows, and the browser of the last sign-in
# then lies in front; a second openLink starts a new process. Added for a native
# crash on Android at the first render after a launch or a reload (CI, 11/10 and
# 18/10/2026: SIGSEGV in Fabric's MountingCoordinator), which was
# react-native-screens' listener race, patched since (#360).
- retry:
    maxRetries: 1
    commands:
      - openLink: exp+kuutti://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A${METRO_PORT || "8081"}
      - extendedWaitUntil:
          visible: "Sign in with your bank|Kirjaudu pankkitunnuksilla|Logga in med din bank|Try again|Yritä uudelleen|Försök igen|Your area|Alueesi|Ditt område|Welcome to Kuutti|Tervetuloa Kuuttiin|Välkommen till Kuutti|Before you sign in|Ennen kuin kirjaudut|Innan du loggar in|Kuutti is locked|Kuutti on lukittu|Kuutti är låst|This is the developer menu.*|Connected to:|Runtime version.*|.* isn't responding"
          timeout: 120000
      # What lies over the app, answered in whatever order it comes until one of
      # our screens shows: a check made once can pass before the next overlay
      # arrives (CI: "isn't responding" answered, then the developer menu's sheet).
      - repeat:
          times: 4
          while:
            notVisible: "Sign in with your bank|Kirjaudu pankkitunnuksilla|Logga in med din bank|Try again|Yritä uudelleen|Försök igen|Your area|Alueesi|Ditt område|Welcome to Kuutti|Tervetuloa Kuuttiin|Välkommen till Kuutti|Before you sign in|Ennen kuin kirjaudut|Innan du loggar in|Kuutti is locked|Kuutti on lukittu|Kuutti är låst"
          commands:
            # A busy Android emulator says an app is not responding, a system app
            # of its own or ours while its bundle loads: waited for, never closed.
            - runFlow:
                when:
                  visible: ".* isn't responding"
                commands:
                  - tapOn: "Wait"
            # A fresh install (every CI run) greets the first load with the dev
            # client's own sheet about its menu, over the app.
            - runFlow:
                when:
                  visible: "This is the developer menu.*"
                commands:
                  - tapOn:
                      text: "Continue"
                      below: "This is the developer menu.*"
            # On Android a fresh install opens the dev client's menu itself over
            # the first load, naming the runtime version: the back key closes it.
            - runFlow:
                when:
                  visible: "Runtime version.*"
                  platform: Android
                commands:
                  - back
            # The dev client's own menu, should a tap have brushed its floating
            # Tools button, lies over the app as a sheet: swiped down, it goes.
            - runFlow:
                when:
                  visible: "Connected to:"
                commands:
                  - swipe:
                      start: "50%, 15%"
                      end: "50%, 95%"
            - extendedWaitUntil:
                visible: "Sign in with your bank|Kirjaudu pankkitunnuksilla|Logga in med din bank|Try again|Yritä uudelleen|Försök igen|Your area|Alueesi|Ditt område|Welcome to Kuutti|Tervetuloa Kuuttiin|Välkommen till Kuutti|Before you sign in|Ennen kuin kirjaudut|Innan du loggar in|Kuutti is locked|Kuutti on lukittu|Kuutti är låst|This is the developer menu.*|Connected to:|Runtime version.*|.* isn't responding"
                timeout: 60000
      - extendedWaitUntil:
          visible: "Sign in with your bank|Kirjaudu pankkitunnuksilla|Logga in med din bank|Try again|Yritä uudelleen|Försök igen|Your area|Alueesi|Ditt område|Welcome to Kuutti|Tervetuloa Kuuttiin|Välkommen till Kuutti|Before you sign in|Ennen kuin kirjaudut|Innan du loggar in|Kuutti is locked|Kuutti on lukittu|Kuutti är låst"
          timeout: 60000
