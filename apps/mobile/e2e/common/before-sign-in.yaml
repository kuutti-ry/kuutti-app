# The screen before the bank (#418, ADR-010 §15), when it stands where the
# sign-in button would: the norms with the terms and the privacy summary, both
# accepted. Research is not asked (#545). The phone remembers them after its
# first sign-in, so most logins never see it; the first flow on a fresh phone
# (each CI job's) always does, and so does every try after a refusal until a
# sign-in records them, since the app drops the answers of a refused attempt.
# Asked as `notVisible`, in half a second, and tapped behind a flag the condition
# clears (README). Ends at the sign-in button, with `output.beforeSignIn` saying
# whether the screen came. Runs from bank-login.yaml.
appId: fi.kuutti.app
---
- evalScript: ${output.beforeSignIn = true}
- runFlow:
    when:
      notVisible: "How we do things here|Näin täällä toimitaan|Så här gör vi här|I'm in, and I accept both|Olen mukana ja hyväksyn molemmat|Jag är med och godkänner båda"
    commands:
      - evalScript: ${output.beforeSignIn = false}
- runFlow:
    when:
      true: ${output.beforeSignIn}
    commands:
      # The norms' heading is the screen's one (#581).
      - assertNotVisible: "Before you sign in|Ennen kuin kirjaudut|Innan du loggar in"
      # Below the norms and both texts, under the fold on a phone.
      - scrollUntilVisible:
          element: "I'm in, and I accept both|Olen mukana ja hyväksyn molemmat|Jag är med och godkänner båda"
          direction: DOWN
          centerElement: true
          timeout: 60000
      - tapOn: "I'm in, and I accept both|Olen mukana ja hyväksyn molemmat|Jag är med och godkänner båda"
      - extendedWaitUntil:
          visible: "Sign in with your bank|Kirjaudu pankkitunnuksilla|Logga in med din bank"
          timeout: 15000
