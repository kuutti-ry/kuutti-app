# From the sign-in screen, past the screens before the bank when they come
# (#418), through the mock bank as PERSONA and back into the app
# (#164, ADR-020 §2). It stops when the app has the link: signed in, or showing a
# refusal, which is what the refusal flows assert on. The persona is named as the
# mock bank's page names them (packages/db/src/seed/personas.ts, given + family).
# No env header: a default there would override the PERSONA a caller passes.
# The page opens in the system browser: Safari on iOS, Chrome on Android.
appId: fi.kuutti.app
---
# The sign-in button, or after a refusal that may pass the same button saying
# "Try again" (#466), or on a phone that has not recorded the current wordings
# the screens before the bank (#418, ADR-010 §15) where the button would be.
- extendedWaitUntil:
    visible: "Sign in with your bank|Kirjaudu pankkitunnuksilla|Logga in med din bank|Try again|Yritä uudelleen|Försök igen|Before you sign in|Ennen kuin kirjaudut|Innan du loggar in|I'm in, and I accept both|Olen mukana ja hyväksyn molemmat|Jag är med och godkänner båda"
    timeout: 15000
# The screens before the bank when they come (before-sign-in.yaml), at the
# top of each try. Then the button: a tap that lands while the screen still
# settles is lost, so it is tapped again while the button is still there;
# never once the browser is open. A fresh browser greets the first page with
# its own screens, a moment after the page: wait for either, the page by its
# heading. On a phone that has not recorded the wordings, the button after a
# refusal leads back to the screens before the bank (#418): they are tapped
# through and the bank opened within the same try.
- retry:
    maxRetries: 2
    commands:
      - runFlow: before-sign-in.yaml
      - runFlow:
          when:
            visible: "Sign in with your bank|Kirjaudu pankkitunnuksilla|Logga in med din bank|Try again|Yritä uudelleen|Försök igen"
          commands:
            - tapOn: "Sign in with your bank|Kirjaudu pankkitunnuksilla|Logga in med din bank|Try again|Yritä uudelleen|Försök igen"
      - extendedWaitUntil:
          visible: "Mock bank|Continue|Jatka|Fortsätt|Use without an account|Accept & continue|Don't allow|No thanks|Before you sign in|Ennen kuin kirjaudut|Innan du loggar in|I'm in, and I accept both|Olen mukana ja hyväksyn molemmat|Jag är med och godkänner båda"
          timeout: 20000
      - runFlow: before-sign-in.yaml
      - runFlow:
          when:
            true: ${output.beforeSignIn}
          commands:
            - tapOn: "Sign in with your bank|Kirjaudu pankkitunnuksilla|Logga in med din bank"
            - extendedWaitUntil:
                visible: "Mock bank|Continue|Jatka|Fortsätt|Use without an account|Accept & continue|Don't allow|No thanks"
                timeout: 20000
# Past the browser's first-use screens, the most private answer each time:
# Safari's sheets (Continue), Chrome's welcome (without an account) and its
# questions (notifications, sync); and a busy emulator's "not responding",
# waited for (never closed: it may be ours). A bounded loop, so our own Continue button can never trap it.
# They come on a browser's first page only, and asking `visible` of what is not
# there costs 7 s (README). Chrome's welcome comes before the page and its
# questions after a tap in the loop, so on Android their absence is asked as
# `notVisible`, in half a second; Safari's sheets come a moment after the page,
# which only the loop's own 7 s catches, so on iOS the loop always runs.
- evalScript: ${output.browserFirstUse = true}
- runFlow:
    when:
      platform: Android
      notVisible: "Continue|Jatka|Fortsätt|Use without an account|Accept & continue|Don't allow|No thanks|Wait"
    commands:
      - evalScript: ${output.browserFirstUse = false}
- runFlow:
    when:
      true: ${output.browserFirstUse}
    commands:
      - repeat:
          times: 6
          while:
            visible: "Continue|Jatka|Fortsätt|Use without an account|Accept & continue|Don't allow|No thanks|Wait"
          commands:
            - tapOn: "Continue|Jatka|Fortsätt|Use without an account|Accept & continue|Don't allow|No thanks|Wait"
# One button per persona, whose accessible name is the person's name followed by
# the note under it, and above the cards a short one with the name alone, all of
# them in view without scrolling: a selector by the name finds that one first,
# and the flow taps it where it is (#226). Scrolled to a card, a flow could stop
# with the card's edge at the screen's edge, a sliver Maestro counts as wholly
# visible, and the tap there missed.
# iOS asks before handing the link back to the app; Chrome hands it on. A tap
# on a page that still moves is lost: tapped again while the button is there.
- waitForAnimationToEnd
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            visible: ".*${PERSONA}.*"
          commands:
            - tapOn: ".*${PERSONA}.*"
      - extendedWaitUntil:
          visible: "Open|Avaa|Öppna|Sign-in did not complete|Kirjautuminen ei onnistunut|Inloggningen slutfördes inte|Your area|Alueesi|Ditt område|Welcome to Kuutti|Tervetuloa Kuuttiin|Välkommen till Kuutti"
          timeout: 20000
# Only iOS asks: on Android the question would cost its 7 s on every sign-in.
- runFlow:
    when:
      platform: iOS
      visible: "Open|Avaa|Öppna"
    commands:
      - tapOn: "Open|Avaa|Öppna"
