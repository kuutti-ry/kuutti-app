# Scroll down a long screen (the profile, ten screens of chips) until ELEMENT
# shows, then centre it. The swipes run in the left margin, where no field
# lies: a swipe that starts on a search box focuses it, and the keyboard then
# takes every swipe after it. A bounded loop, so a missing element fails.
appId: fi.kuutti.app
---
- repeat:
    times: 40
    while:
      notVisible: "${ELEMENT}"
    commands:
      - swipe:
          start: "3%, 75%"
          end: "3%, 25%"
          duration: 300
- scrollUntilVisible:
    element: "${ELEMENT}"
    direction: DOWN
    centerElement: true
    timeout: 60000
