# Closes a row of Settings that holds its setting in place (#511) if it is
# open, so the next flow finds Settings as a person first does. ROW and INSIDE
# as in open-settings-row.yaml; the row is scrolled to from below it. A flow
# that comes to the row from above scrolls down to it first: Maestro takes a
# scroll's direction as written, never from a variable.
appId: fi.kuutti.app
---
- scrollUntilVisible:
    element: ${ROW}
    direction: UP
    centerElement: true
    timeout: 60000
- runFlow:
    when:
      visible: ${INSIDE}
    commands:
      - tapOn: ${ROW}
- extendedWaitUntil:
    notVisible: ${INSIDE}
    timeout: 15000
