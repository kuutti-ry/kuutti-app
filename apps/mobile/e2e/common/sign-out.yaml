# Sign out if the app is signed in, so a flow begins where a new person does.
# Runs after open-app.yaml.
appId: fi.kuutti.app
---
# The app's lock over it (#418, ADR-045), left on by a flow that stopped
# half-way: left through the bank, which signs this phone out and turns the
# lock off, so no flow is ever kept out by another's lock. It is seldom
# there, so its absence is asked as `notVisible`, in half a second, and it is
# left behind a flag the condition clears (README). Signed out that way, the
# check after it finds no signed-in screen and goes nowhere near Settings.
- evalScript: ${output.locked = true}
- runFlow:
    when:
      notVisible: "Kuutti is locked|Kuutti on lukittu|Kuutti är låst"
    commands:
      - evalScript: ${output.locked = false}
- runFlow:
    when:
      true: ${output.locked}
    commands:
      # The passcode's field takes the focus as the lock shows: a tap on the
      # title, which is no button, closes the keyboard over the way out (README).
      - tapOn: "Kuutti is locked|Kuutti on lukittu|Kuutti är låst"
      - scrollUntilVisible:
          element: "Sign in with the bank instead|Kirjaudu mieluummin pankkitunnuksilla|Logga in med banken i stället"
          direction: DOWN
          centerElement: true
          timeout: 60000
      - tapOn: "Sign in with the bank instead|Kirjaudu mieluummin pankkitunnuksilla|Logga in med banken i stället"
      - extendedWaitUntil:
          visible: "Sign in with your bank|Kirjaudu pankkitunnuksilla|Logga in med din bank|Before you sign in|Ennen kuin kirjaudut|Innan du loggar in"
          timeout: 15000
- runFlow:
    when:
      visible: "Your profile|Profiilisi|Din profil|Welcome to Kuutti|Tervetuloa Kuuttiin|Välkommen till Kuutti"
    commands:
      # Logging out opens under its row (#511), by a link that names it rather
      # than a scroll to it: a swipe through Settings could pass over its row
      # once the list grew (#107's Invitations row did), and the flows that
      # test the row itself scroll to it. The list brings the opened row into
      # sight; the scroll is for a list still settling, to the line under Log
      # out everywhere, which puts both buttons in sight (the row is the list's
      # foot, where nothing can be centred), and the list's own scroll ends
      # before the tap. The row is there only with a session (#581): a session
      # the reset erased leaves no line to find, so the scroll is optional; it
      # keeps the minute a scroll has elsewhere for a slow emulator, and that
      # case, the first flow after a reset at most, spends it. The tap below
      # asks for the button itself.
      - openLink: kuutti://settings?open=device
      - extendedWaitUntil:
          visible: "Settings|Asetukset|Inställningar"
          timeout: 15000
      - scrollUntilVisible:
          element: "For a lost or lent phone\\.|Kadonnutta tai lainattua puhelinta varten\\.|För en borttappad eller utlånad telefon\\."
          direction: DOWN
          timeout: 60000
          optional: true
      - waitForAnimationToEnd
      # A session the reset erased is already gone: Settings has no row and no button.
      - runFlow:
          when:
            visible: "Log out|Kirjaudu ulos|Logga ut"
          commands:
            - tapOn: "Log out|Kirjaudu ulos|Logga ut"
      # Opened over an onboarding step, Settings stays on screen after the
      # logout, its account rows gone: the root route is the sign-in screen, or
      # on a phone that has not recorded the current wordings the screens
      # before the bank (#418), which bank-login.yaml taps through.
      - openLink: kuutti://
      - extendedWaitUntil:
          visible: "Sign in with your bank|Kirjaudu pankkitunnuksilla|Logga in med din bank|Before you sign in|Ennen kuin kirjaudut|Innan du loggar in"
          timeout: 15000
