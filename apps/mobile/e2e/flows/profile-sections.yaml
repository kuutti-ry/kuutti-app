# The profile as a list of sections, each its own screen with no Save button
# (#227): an answer given in a section is saved by going back, shows on the
# card, hidden it stays an answer and leaves the card (#515), and taking it back
# the same way takes it off. Sanna has no exercise answer; the flow leaves her
# without one, and shows it again before that, so a second run starts the same.
appId: fi.kuutti.app
name: A section saves on going back, the card shows what it saved, and a hidden answer leaves it
---
- runFlow: ../common/sign-in.yaml
- openLink: kuutti://profile
- extendedWaitUntil:
    visible: "(The basics|Perustiedot|Grunderna)(, .*)?"
    timeout: 15000
# A row is one button named by its title, and how far it is filled its value,
# which Android joins to the name after a comma (#239). What it holds is its
# hint, which Maestro does not read as text, and is not drawn either (#581).
- assertVisible: "(Relationship and kids|Parisuhde ja lapset|Relation och barn)(, .*)?"
- assertNotVisible: "Relationship structure and kids|Suhteen muoto ja lapset|Relationsform och barn"
- waitForAnimationToEnd

# The questions: called that in every language, a row with no line under it, and
# on its screen Sanna's two answers, each with its button, and what is left to add (#581).
- assertNotVisible: "Up to three questions, answered in your own words|Enintään kolme kysymystä, omin sanoin vastattuna|Upp till tre frågor, besvarade med egna ord"
- tapOn: "(Questions|Kysymykset|Frågor)(, .*)?"
- extendedWaitUntil:
    visible: "Remove the question: .*|Poista kysymys: .*|Ta bort frågan: .*"
    timeout: 15000
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "Add a question|Lisää kysymys|Lägg till en fråga"
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn: "Back to your profile|Takaisin profiiliisi|Tillbaka till din profil"
- extendedWaitUntil:
    visible: "(The basics|Perustiedot|Grunderna)(, .*)?"
    timeout: 15000
- waitForAnimationToEnd

- tapOn: "(Lifestyle|Elämäntavat|Livsstil)(, .*)?"
- extendedWaitUntil:
    visible: "Smoking|Tupakointi|Rökning"
    timeout: 15000
- waitForAnimationToEnd
- assertNotVisible: "Save|Tallenna|Spara"
- scrollUntilVisible:
    element: "Weekly|Viikoittain|Varje vecka"
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn: "Weekly|Viikoittain|Varje vecka"
- assertVisible:
    text: "Weekly|Viikoittain|Varje vecka"
    selected: true

# Back to the list: the answer is saved on the way. The arrow is pinned above
# the scroll, so it is in view however far the section was scrolled.
- tapOn: "Back to your profile|Takaisin profiiliisi|Tillbaka till din profil"
- extendedWaitUntil:
    visible: "(The basics|Perustiedot|Grunderna)(, .*)?"
    timeout: 15000
# Exercise is on the whole card under Lifestyle (#644), a chip heard with its question.
- openLink: kuutti://profile/card
- extendedWaitUntil:
    visible: "Your card|Korttisi|Ditt kort"
    timeout: 15000
- scrollUntilVisible:
    element: "Show the whole card|Näytä koko kortti|Visa hela kortet"
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn: "Show the whole card|Näytä koko kortti|Visa hela kortet"
- scrollUntilVisible:
    element: "Lifestyle|Elämäntavat|Livsstil"
    direction: DOWN
    centerElement: true
    timeout: 60000
- scrollUntilVisible:
    element: "(Exercise|Liikunta|Motion): (Weekly|Viikoittain|Varje vecka)"
    direction: DOWN
    centerElement: true
    timeout: 60000

# Hidden: the section keeps the answer and says what hiding did, saved by going
# back like any answer, and the card has no Exercise any more.
- openLink: kuutti://profile
- extendedWaitUntil:
    visible: "(The basics|Perustiedot|Grunderna)(, .*)?"
    timeout: 15000
- waitForAnimationToEnd
- tapOn: "(Lifestyle|Elämäntavat|Livsstil)(, .*)?"
- extendedWaitUntil:
    visible: "Smoking|Tupakointi|Rökning"
    timeout: 15000
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "Weekly|Viikoittain|Varje vecka"
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn: "Hide from your card: Exercise|Piilota kortiltasi: Liikunta|Dölj från ditt kort: Motion"
- assertVisible: "Hidden from your card\\.|Piilotettu kortiltasi\\.|Dolt från ditt kort\\."
- assertVisible:
    text: "Weekly|Viikoittain|Varje vecka"
    selected: true
- tapOn: "Back to your profile|Takaisin profiiliisi|Tillbaka till din profil"
- extendedWaitUntil:
    visible: "(The basics|Perustiedot|Grunderna)(, .*)?"
    timeout: 15000
- openLink: kuutti://profile/card
- extendedWaitUntil:
    visible: "Your card|Korttisi|Ditt kort"
    timeout: 15000
- scrollUntilVisible:
    element: "Show the whole card|Näytä koko kortti|Visa hela kortet"
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn: "Show the whole card|Näytä koko kortti|Visa hela kortet"
# Her hobbies end the whole card: Lifestyle is gone with its one answer.
- scrollUntilVisible:
    element: "(.*: )?(Swimming|Uinti|Simning)"
    direction: DOWN
    centerElement: true
    timeout: 60000
- assertNotVisible: "Lifestyle|Elämäntavat|Livsstil"
- assertNotVisible: "(.*: )?(Weekly|Viikoittain|Varje vecka)"

# Shown again from the same place, and back on the card.
- openLink: kuutti://profile
- extendedWaitUntil:
    visible: "(The basics|Perustiedot|Grunderna)(, .*)?"
    timeout: 15000
- waitForAnimationToEnd
- tapOn: "(Lifestyle|Elämäntavat|Livsstil)(, .*)?"
- extendedWaitUntil:
    visible: "Smoking|Tupakointi|Rökning"
    timeout: 15000
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "Weekly|Viikoittain|Varje vecka"
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn: "Show on your card: Exercise|Näytä kortillasi: Liikunta|Visa på ditt kort: Motion"
- tapOn: "Back to your profile|Takaisin profiiliisi|Tillbaka till din profil"
- extendedWaitUntil:
    visible: "(The basics|Perustiedot|Grunderna)(, .*)?"
    timeout: 15000
- openLink: kuutti://profile/card
- extendedWaitUntil:
    visible: "Your card|Korttisi|Ditt kort"
    timeout: 15000
- scrollUntilVisible:
    element: "Show the whole card|Näytä koko kortti|Visa hela kortet"
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn: "Show the whole card|Näytä koko kortti|Visa hela kortet"
- scrollUntilVisible:
    element: "(Exercise|Liikunta|Motion): (Weekly|Viikoittain|Varje vecka)"
    direction: DOWN
    centerElement: true
    timeout: 60000

# Taken back the same way, from the list: tapped again, which clears it, and
# going back.
- openLink: kuutti://profile
- extendedWaitUntil:
    visible: "(The basics|Perustiedot|Grunderna)(, .*)?"
    timeout: 15000
- waitForAnimationToEnd
- tapOn: "(Lifestyle|Elämäntavat|Livsstil)(, .*)?"
- extendedWaitUntil:
    visible: "Smoking|Tupakointi|Rökning"
    timeout: 15000
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "Weekly|Viikoittain|Varje vecka"
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn: "Weekly|Viikoittain|Varje vecka"
- assertVisible:
    text: "Weekly|Viikoittain|Varje vecka"
    selected: false
- tapOn: "Back to your profile|Takaisin profiiliisi|Tillbaka till din profil"
- extendedWaitUntil:
    visible: "(The basics|Perustiedot|Grunderna)(, .*)?"
    timeout: 15000
# Opened again, the section reads what was stored: nothing chosen.
- waitForAnimationToEnd
- tapOn: "(Lifestyle|Elämäntavat|Livsstil)(, .*)?"
- extendedWaitUntil:
    visible: "Smoking|Tupakointi|Rökning"
    timeout: 15000
- scrollUntilVisible:
    element: "Weekly|Viikoittain|Varje vecka"
    direction: DOWN
    centerElement: true
    timeout: 60000
- assertVisible:
    text: "Weekly|Viikoittain|Varje vecka"
    selected: false
