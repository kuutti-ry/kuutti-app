# The photos screen (#48, #138): the count against the limit, the first photo
# the main one, each photo's state in words, the removal as a labelled button;
# a photo opens full size and back, and removing one asks first. The order is
# changed by holding a tile and dragging it (#179), which Maestro has no
# gesture for (a swipe moves at once, a long press does not drag), and the
# same moves are the tile's accessibility actions, out of its reach too; the
# jest suite covers both. Sanna has five approved photos; the removal is
# declined.
appId: fi.kuutti.app
name: A photo opens full size and back, and removing one asks first
---
- runFlow: ../common/sign-in.yaml
- openLink: kuutti://photos
- extendedWaitUntil:
    visible: "5 photos, at most 6|5 kuvaa, enintään 6|5 foton, högst 6"
    timeout: 15000
- waitForAnimationToEnd
- assertVisible: "Main photo|Pääkuva|Huvudfoto"
- assertVisible: "Visible to others|Näkyy muille|Syns för andra"

- tapOn: "Open photo 1|Avaa kuva 1|Öppna foto 1"
- extendedWaitUntil:
    visible: "Back to your photos|Takaisin kuviisi|Tillbaka till dina foton"
    timeout: 15000
- assertVisible: "Photo 1 / 5, full size|Kuva 1 / 5, täysikokoinen|Foto 1 / 5, full storlek"
- tapOn: "Back to your photos|Takaisin kuviisi|Tillbaka till dina foton"

- extendedWaitUntil:
    visible: "5 photos, at most 6|5 kuvaa, enintään 6|5 foton, högst 6"
    timeout: 15000
- tapOn:
    text: "Remove|Poista|Ta bort"
    index: 0
- extendedWaitUntil:
    visible: "Remove this photo\\?|Poistetaanko tämä kuva\\?|Ta bort det här fotot\\?"
    timeout: 15000
- tapOn: "Keep it|Säilytä|Behåll"
- assertNotVisible: "Remove this photo\\?|Poistetaanko tämä kuva\\?|Ta bort det här fotot\\?"
- assertVisible: "5 photos, at most 6|5 kuvaa, enintään 6|5 foton, högst 6"
