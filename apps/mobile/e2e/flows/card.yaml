# The card is what others see (#47, ADR-019 §2), in two depths (#644): the
# name with the age above the photos (every account is bank-verified, so the
# card does not say so, #239), the gender and the town on one line, the key
# facts as chips in the person's own words with no label line, the first
# prompt, and "Show the whole card", which opens the bio, the other prompt and
# the rest of the answers under the profile's section titles in place. Soft
# fields (education, drinking) never show, and a finished profile has no list
# of what is missing. Her home is a name, never digits, and how far is a
# round's to say, so her own card has no band (ADR-061 §3, §5). A chip is one
# element to a screen reader, heard with its question ("Looking for: ..."), so
# on iOS its label carries the question and the patterns allow it. Sanna's
# history after `pnpm demo:reset` (packages/db/src/seed/histories.ts); read only.
appId: fi.kuutti.app
name: The card leads with the name, the photo and the key facts, and opens the rest in place but nothing soft
---
- runFlow: ../common/sign-in.yaml
- openLink: kuutti://profile/card
- extendedWaitUntil:
    visible: "Your card|Korttisi|Ditt kort"
    timeout: 15000
- assertVisible: "This is what others see\\.|Tämän muut näkevät\\.|Det här ser andra\\."
- assertVisible: "Sanna, \\d+"
- assertVisible: "Photo 1 of 5|Kuva 1 / 5|Foto 1 av 5"
- assertNotVisible: ".*verified.*|.*varmistettu.*|.*verifierad.*"
- assertVisible: "Woman|Nainen|Kvinna"
- assertVisible: "Espoo|Esbo"
- assertNotVisible: ".*\\d{5}.*"
- assertNotVisible: "Nearby|Lähellä|I närheten|Close|Melko lähellä|Ganska nära|Around|Samoilla seuduilla|I trakten|Far|Kauempana|Längre bort"
# The key facts, each an answer in her own words after its icon, and no label line.
- scrollUntilVisible:
    element: "(.*: )?(Something long-term|Jotain pitkäaikaista|Något långvarigt)"
    direction: DOWN
    centerElement: true
    timeout: 60000
- assertNotVisible: "Looking for|Etsin|Söker"
- assertVisible: "(.*: )?(Never|En koskaan|Aldrig)"
# Each language a chip of its own.
- assertVisible: "(.*: )?(Finnish|Suomi|Finska)"
- assertVisible: "(.*: )?(Swedish|Ruotsi|Svenska)"
# The unit is joined by a no-break space.
- assertVisible: "(.*: )?171.cm"
- scrollUntilVisible:
    element: "Aamu-uinti, sitten.*"
    direction: DOWN
    centerElement: true
    timeout: 60000
# The rest waits for the whole card, opened in place.
- assertNotVisible: "(.*: )?Arkkitehti"
- scrollUntilVisible:
    element: "Show the whole card|Näytä koko kortti|Visa hela kortet"
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn: "Show the whole card|Näytä koko kortti|Visa hela kortet"
- scrollUntilVisible:
    element: "Arkkitehti, joka piirtää.*"
    direction: DOWN
    centerElement: true
    timeout: 60000
- scrollUntilVisible:
    element: "Teach me|Opeta minulle|Lär mig"
    direction: DOWN
    centerElement: true
    timeout: 60000
- scrollUntilVisible:
    element: "Work and education|Työ ja koulutus|Arbete och utbildning"
    direction: DOWN
    centerElement: true
    timeout: 60000
- scrollUntilVisible:
    element: "(.*: )?Arkkitehti"
    direction: DOWN
    centerElement: true
    timeout: 60000
- scrollUntilVisible:
    element: "(.*: )?(Swimming|Uinti|Simning)"
    direction: DOWN
    centerElement: true
    timeout: 60000
# Nothing soft, and nothing missing.
- assertNotVisible: "(.*: )?(Master's or YAMK|Maisteri tai YAMK|Magister eller högre YH)"
- assertNotVisible: "(.*: )?(Socially|Seurassa|I sällskap)"
- assertNotVisible: "Before your card can be shown|Ennen kuin korttisi voidaan näyttää|Innan ditt kort kan visas"
