# Notification choices (#176, ADR-032; #102, ADR-055 §9): a row under Notifications
# and contacts in Settings that opens in place (#511), with first what this phone's answer
# leaves to do, which on the emulator and the simulator, never asked (no flow
# answers the phone's question), is Allow notifications; then one line on what a
# notification says (#581), and a switch per kind, each on until switched off
# and kept on the server. Asking, allowing and refusing, and what a change of
# the phone's answer says aloud, are the jest tests' (PhoneLine). Sanna switches
# Messages off, leaves, finds it kept when she comes back by way of home,
# where the row is still open, read again, and switches it on again, so the
# flow leaves her as it found her, the row closed. The
# other kinds work alike (the jest tests and the API's).
appId: fi.kuutti.app
name: The messages switch in Settings, Notifications, goes off, is kept on the server, and goes on again
---
- runFlow: ../common/sign-in.yaml
- openLink: kuutti://settings
- extendedWaitUntil:
    visible: "Settings|Asetukset|Inställningar"
    timeout: 15000
# The row sits under Notifications and contacts, below the fold on a phone; it is read by its title.
- runFlow:
    file: ../common/open-settings-row.yaml
    env:
      ROW: "(Notifications|Ilmoitukset|Aviseringar)(, .*)?"
      INSIDE: "A notification says that there is a new message or a new match, never what it says or from whom\\.|Ilmoitus kertoo, että sinulle on uusi viesti tai uusi mätsi, ei koskaan mitä siinä lukee tai keneltä se on\\.|En avisering säger att det finns ett nytt meddelande eller en ny matchning, aldrig vad det står eller från vem\\."
# The phone's button comes once the phone has been read; its answer has no line
# of its own, and a change of it is said aloud, which Maestro cannot hear (#581).
- extendedWaitUntil:
    visible: "Allow notifications|Salli ilmoitukset|Tillåt aviseringar"
    timeout: 15000
- assertNotVisible: "This phone has not been asked yet whether Kuutti may notify it\\.|Tältä puhelimelta ei ole vielä kysytty, saako Kuutti lähettää sille ilmoituksia\\.|Den här telefonen har inte frågats än om Kuutti får skicka aviseringar till den\\."
# A switch's text, to Maestro, is its value ("0" off, "1" on) on iOS, and its
# words with its state on Android. Every switch sits at the right edge, so the
# Messages switch, the first, is found between the panel's line and the next
# kind's name, not by rightOf, which compares x alone and would take any switch.
- extendedWaitUntil:
    visible:
      text: "1|(Messages|Viestit|Meddelanden), on"
      below: "A notification says that there is a new message or a new match, never what it says or from whom\\.|Ilmoitus kertoo, että sinulle on uusi viesti tai uusi mätsi, ei koskaan mitä siinä lukee tai keneltä se on\\.|En avisering säger att det finns ett nytt meddelande eller en ny matchning, aldrig vad det står eller från vem\\."
      above: "Matches|Mätsit|Matchningar"
    timeout: 15000
- tapOn: "Messages|Viestit|Meddelanden"
- extendedWaitUntil:
    visible:
      text: "0|(Messages|Viestit|Meddelanden), off"
      below: "A notification says that there is a new message or a new match, never what it says or from whom\\.|Ilmoitus kertoo, että sinulle on uusi viesti tai uusi mätsi, ei koskaan mitä siinä lukee tai keneltä se on\\.|En avisering säger att det finns ett nytt meddelande eller en ny matchning, aldrig vad det står eller från vem\\."
      above: "Matches|Mätsit|Matchningar"
    timeout: 15000
- assertNotVisible: "The change was not saved\\. Try again\\.|Muutosta ei tallennettu\\. Yritä uudelleen\\.|Ändringen sparades inte\\. Försök igen\\."

# Kept on the server: home first, so Settings is read again rather than shown
# as it was; the row comes back open, as it was left.
- openLink: kuutti://
- extendedWaitUntil:
    visible: "People on Kuutti|Ihmiset Kuutissa|Människor på Kuutti"
    timeout: 15000
- openLink: kuutti://settings
- runFlow:
    file: ../common/open-settings-row.yaml
    env:
      ROW: "(Notifications|Ilmoitukset|Aviseringar)(, .*)?"
      INSIDE: "A notification says that there is a new message or a new match, never what it says or from whom\\.|Ilmoitus kertoo, että sinulle on uusi viesti tai uusi mätsi, ei koskaan mitä siinä lukee tai keneltä se on\\.|En avisering säger att det finns ett nytt meddelande eller en ny matchning, aldrig vad det står eller från vem\\."
- extendedWaitUntil:
    visible:
      text: "0|(Messages|Viestit|Meddelanden), off"
      below: "A notification says that there is a new message or a new match, never what it says or from whom\\.|Ilmoitus kertoo, että sinulle on uusi viesti tai uusi mätsi, ei koskaan mitä siinä lukee tai keneltä se on\\.|En avisering säger att det finns ett nytt meddelande eller en ny matchning, aldrig vad det står eller från vem\\."
      above: "Matches|Mätsit|Matchningar"
    timeout: 15000
- tapOn: "Messages|Viestit|Meddelanden"
- extendedWaitUntil:
    visible:
      text: "1|(Messages|Viestit|Meddelanden), on"
      below: "A notification says that there is a new message or a new match, never what it says or from whom\\.|Ilmoitus kertoo, että sinulle on uusi viesti tai uusi mätsi, ei koskaan mitä siinä lukee tai keneltä se on\\.|En avisering säger att det finns ett nytt meddelande eller en ny matchning, aldrig vad det står eller från vem\\."
      above: "Matches|Mätsit|Matchningar"
    timeout: 15000
- assertNotVisible: "The change was not saved\\. Try again\\.|Muutosta ei tallennettu\\. Yritä uudelleen\\.|Ändringen sparades inte\\. Försök igen\\."
- runFlow:
    file: ../common/close-settings-row.yaml
    env:
      ROW: "(Notifications|Ilmoitukset|Aviseringar)(, .*)?"
      INSIDE: "A notification says that there is a new message or a new match, never what it says or from whom\\.|Ilmoitus kertoo, että sinulle on uusi viesti tai uusi mätsi, ei koskaan mitä siinä lukee tai keneltä se on\\.|En avisering säger att det finns ett nytt meddelande eller en ny matchning, aldrig vad det står eller från vem\\."
