# What the person chose in Settings stays across closing the app (#12, #55):
# the session (no bank login again), the theme and the language. Which row
# was open stays only while the app runs (#511): the cold start opens
# Settings with every row closed. Sanna; the flow ends on the phone's theme
# and language with every row closed, as it began. The theme and the
# language each open under their row, one row at a time, and the row's
# summary says what is chosen.
appId: fi.kuutti.app
name: The session, the theme and the language survive closing and reopening the app
---
- runFlow: ../common/sign-in.yaml
- openLink: kuutti://settings
- extendedWaitUntil:
    visible: "Settings|Asetukset|Inställningar"
    timeout: 15000
# Settings can come back where the sign-in left it, scrolled down to Logging
# out, and the rows are in the first section: back to the top first.
- scrollUntilVisible:
    element: "Appearance and language|Ulkoasu ja kieli|Utseende och språk"
    direction: UP
    timeout: 60000
- runFlow:
    file: ../common/open-settings-row.yaml
    env:
      ROW: "(Theme|Teema|Tema)(, .*)?"
      INSIDE: "High contrast|Suuri kontrasti|Hög kontrast"
# Tapped only while not chosen: chosen, by a run that stopped half-way, the
# words are the theme row's own value too.
- runFlow:
    when:
      notVisible: "✓ Dark|✓ Tumma|✓ Mörkt"
    commands:
      - tapOn: "Dark|Tumma|Mörkt"
- assertVisible: "✓ Dark|✓ Tumma|✓ Mörkt"
# Opening the language closes the theme: one row at a time. The list open
# is told by Suomi, a language this flow never chooses: the row's own value
# names the language chosen, Svenska after the restart. (A tick would not do:
# after the restart the theme's list, open above it, has one too.)
- runFlow:
    file: ../common/open-settings-row.yaml
    env:
      ROW: "(Language|Kieli|Språk)(, .*)?"
      INSIDE: ".*Suomi.*"
- assertNotVisible: "High contrast|Suuri kontrasti|Hög kontrast"
- tapOn: ".*Svenska.*"
- assertVisible: "Utseende och språk"

- stopApp
- runFlow: ../common/open-app.yaml
- assertVisible: "Ditt område"
- openLink: kuutti://settings
- extendedWaitUntil:
    visible: "Inställningar"
    timeout: 15000

# Kept across the restart: the language, and the theme ticked under its row;
# every row closed at the cold start. Then back as it began.
- scrollUntilVisible:
    element: "Utseende och språk"
    direction: UP
    timeout: 60000
- assertNotVisible: ".*✓.*Svenska.*"
- runFlow:
    file: ../common/open-settings-row.yaml
    env:
      ROW: "Tema(, .*)?"
      INSIDE: "Hög kontrast"
- assertVisible: "✓ Mörkt"
- tapOn: "Samma som telefonen"
- assertVisible: "✓ Samma som telefonen"
- runFlow:
    file: ../common/open-settings-row.yaml
    env:
      ROW: "Språk(, .*)?"
      INSIDE: ".*Suomi.*"
- assertVisible: ".*✓.*Svenska.*"
- tapOn: "Samma som telefonen"
- assertVisible: "✓ Same as the phone|✓ Sama kuin puhelimessa|✓ Samma som telefonen"
- runFlow:
    file: ../common/close-settings-row.yaml
    env:
      ROW: "(Language|Kieli|Språk)(, .*)?"
      INSIDE: ".*Suomi.*"
