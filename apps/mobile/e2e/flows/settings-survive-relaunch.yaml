# What the person chose in Settings stays across closing the app (#12, #55):
# the session (no bank login again), the theme and the language, and which
# of Settings' rows were left open (#511). Sanna; the flow ends on the system
# theme and the phone's language with both rows closed, as it began. The
# theme and the language each open under their row, and the row's summary
# says what is chosen.
appId: fi.kuutti.app
name: The session, the theme and the language survive closing and reopening the app
---
- runFlow: ../common/sign-in.yaml
- openLink: kuutti://settings
- extendedWaitUntil:
    visible: "Settings|Asetukset|Inställningar"
    timeout: 15000
# Settings can come back where the sign-in left it, scrolled down to This
# device, and the row is in the first section: back to the top first.
- scrollUntilVisible:
    element: "Appearance and language|Ulkoasu ja kieli|Utseende och språk"
    direction: UP
    timeout: 30000
# Each row says what is chosen, which Maestro reads after its title; the
# chosen option itself is ticked under the row.
- runFlow:
    file: ../common/open-settings-row.yaml
    env:
      ROW: "(Theme|Teema|Tema)(, .*)?"
      INSIDE: "High contrast|Suuri kontrasti|Hög kontrast"
- tapOn: "Dark|Tumma|Mörkt"
- assertVisible: "✓ Dark|✓ Tumma|✓ Mörkt"
- runFlow:
    file: ../common/open-settings-row.yaml
    env:
      ROW: "(Language|Kieli|Språk)(, .*)?"
      INSIDE: ".*Svenska.*"
- tapOn: ".*Svenska.*"
- assertVisible: "Utseende och språk"

- stopApp
- runFlow: ../common/open-app.yaml
- assertVisible: "Ditt område"
- openLink: kuutti://settings
- extendedWaitUntil:
    visible: "Inställningar"
    timeout: 15000

# Kept across the restart, both rows still open with their choices ticked;
# then back as it began.
- scrollUntilVisible:
    element: "Utseende och språk"
    direction: UP
    timeout: 30000
- assertVisible: "Hög kontrast"
- assertVisible: "✓ Mörkt"
- tapOn: "System"
- assertVisible: "✓ System"
- scrollUntilVisible:
    element: ".*✓.*Svenska.*"
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn: "Telefonens språk"
- assertVisible: "✓ Phone's language|✓ Puhelimen kieli|✓ Telefonens språk"
- runFlow:
    file: ../common/close-settings-row.yaml
    env:
      ROW: "(Language|Kieli|Språk)(, .*)?"
      INSIDE: ".*Svenska.*"
- runFlow:
    file: ../common/close-settings-row.yaml
    env:
      ROW: "(Theme|Teema|Tema)(, .*)?"
      INSIDE: "High contrast|Suuri kontrasti|Hög kontrast"
