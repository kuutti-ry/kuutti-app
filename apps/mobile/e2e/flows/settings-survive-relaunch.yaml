# What the person chose in Settings stays across closing the app (#12, #55):
# the session (no bank login again), the theme and the language. Sanna; the
# flow ends on the system theme and the phone's language, as it began. The
# theme and the language each have a screen behind their row (#287), and the
# row's summary says what is chosen.
appId: fi.kuutti.app
name: The session, the theme and the language survive closing and reopening the app
---
- runFlow: ../common/sign-in.yaml
- openLink: kuutti://settings
- extendedWaitUntil:
    visible: "Theme|Teema|Tema"
    timeout: 15000
- tapOn: "Theme|Teema|Tema"
- extendedWaitUntil:
    visible: "Dark|Tumma|Mörkt"
    timeout: 15000
- tapOn: "Dark|Tumma|Mörkt"
- assertVisible: "✓ Dark|✓ Tumma|✓ Mörkt"
- tapOn: "Back|Takaisin|Tillbaka"
- tapOn: "Language|Kieli|Språk"
- extendedWaitUntil:
    visible: ".*Svenska.*"
    timeout: 15000
- tapOn: ".*Svenska.*"
- assertVisible: "Språk"
- tapOn: "Tillbaka"
- assertVisible: "Inställningar"

- stopApp
- runFlow: ../common/open-app.yaml
- assertVisible: "Ditt område"
- openLink: kuutti://settings
- extendedWaitUntil:
    visible: "Inställningar"
    timeout: 15000
- assertVisible: "Mörkt"
- assertVisible: "Svenska"

# Back as it began.
- tapOn: "Tema"
- tapOn: "System"
- assertVisible: "✓ System"
- tapOn: "Tillbaka"
- tapOn: "Språk"
- tapOn: "Telefonens språk"
- assertVisible: "✓ Phone's language|✓ Puhelimen kieli|✓ Telefonens språk"
