# Onboarding from the bank login to the home screen, one question per screen
# in the field sheet's order, every answer a button (#146, ADR-010 §9 to §13):
# the name; the gender, and the label only after non-binary; whom one seeks,
# which waits for the article 9 consent on the same screen; the intent; the
# ages as two steppers around the person's own age; the area, one button per
# pond (#174); three photos; a bio; home. The norms with both texts, and
# research, come before the bank (#418, ADR-010 §15): on a fresh phone
# bank-login.yaml accepts them there; on a phone that recorded them at an
# earlier sign-in, the welcome step asks Onni for the texts, counting no step
# (welcome-step.yaml). Then a friend's invitation code, offered once, with no
# step number either, and skipped (#107). The app is closed after whom one
# seeks and opens again at the intent with the answer kept (#219), the
# invitation code not offered again. Onni (26) is registered and never
# onboarded after `pnpm demo:reset`; the photos are his from the release of
# pictures, which the local check queues, so home says the profile still
# lacks something.
appId: fi.kuutti.app
name: A registered person is taken through onboarding one question per screen, and resumes at the intent after the app is closed
---
- addMedia:
    - ../media/faces/onni/1.jpg
    - ../media/faces/onni/2.jpg
    - ../media/faces/onni/3.jpg
- runFlow:
    file: ../common/sign-in.yaml
    env:
      PERSONA: Onni Korhonen

# The welcome step when it comes, then the invitation code.
- runFlow: ../common/welcome-step.yaml

# A friend's invitation code, offered once before the name, counting no step
# (#418), and skipped (#107; using one is the API's test).
- extendedWaitUntil:
    visible: "Did a friend invite you\\?|Kutsuiko ystävä sinut\\?|Bjöd en vän in dig\\?"
    timeout: 15000
- assertNotVisible: "Step \\d+ of \\d+|Vaihe \\d+ / \\d+|Steg \\d+ av \\d+"
- tapOn: "Skip|Ohita|Hoppa över"

# 1: the name, typed, never the bank's.
- extendedWaitUntil:
    visible: "What should we call you\\?|Miksi sinua kutsutaan\\?|Vad ska vi kalla dig\\?"
    timeout: 15000
- assertVisible: "Step 1 of 8|Vaihe 1 / 8|Steg 1 av 8"
- tapOn: "Name on your card|Nimi kortillasi|Namn på ditt kort"
- inputText: "Onni"
# A tap on the question, which is no button, closes the keyboard (README, the keyboard).
- tapOn: "What should we call you\\?|Miksi sinua kutsutaan\\?|Vad ska vi kalla dig\\?"
- tapOn: "Continue|Jatka|Fortsätt"

# 2: the gender; non-binary opens the label, still step 2, and it can be skipped.
- extendedWaitUntil:
    visible: "How do you describe yourself\\?|Miten kuvailet itseäsi\\?|Hur beskriver du dig själv\\?"
    timeout: 15000
- assertVisible: "Step 2 of 8|Vaihe 2 / 8|Steg 2 av 8"
- tapOn: "Non-binary|Muunsukupuolinen|Icke-binär"
- tapOn: "Continue|Jatka|Fortsätt"
- extendedWaitUntil:
    visible: "A word for it, if you like|Sana sille, jos haluat|Ett ord för det, om du vill"
    timeout: 15000
- assertVisible: "Step 2 of 8|Vaihe 2 / 8|Steg 2 av 8"
- tapOn: "Skip|Ohita|Hoppa över"

# 3: whom one seeks; nothing moves on before the article 9 consent on this screen.
- extendedWaitUntil:
    visible: "Whom are you looking for\\?|Ketä etsit\\?|Vem söker du\\?"
    timeout: 15000
- assertVisible: "Step 3 of 8|Vaihe 3 / 8|Steg 3 av 8"
- tapOn: "Anyone|Kenet tahansa|Vem som helst"
- scrollUntilVisible:
    element: "I consent to Kuutti storing whom I seek|Annan Kuutille luvan tallentaa, kenen seuraa etsin|Jag samtycker till att Kuutti lagrar vem jag söker"
    direction: DOWN
    centerElement: true
    timeout: 60000
- assertVisible:
    text: "Continue|Jatka|Fortsätt"
    enabled: false
# A switch's text, to Maestro, is its value ("0" off, "1" on); its words are the
# text's beside it. So the switch is the "0" right of them. The consent is
# saved before Continue opens.
- tapOn:
    text: "0|(I consent to Kuutti storing whom I seek|Annan Kuutille luvan tallentaa, kenen seuraa etsin|Jag samtycker till att Kuutti lagrar vem jag söker), off"
    rightOf: "I consent to Kuutti storing whom I seek|Annan Kuutille luvan tallentaa, kenen seuraa etsin|Jag samtycker till att Kuutti lagrar vem jag söker"
- extendedWaitUntil:
    visible:
      text: "Continue|Jatka|Fortsätt"
      enabled: true
    timeout: 15000
# The button lies half under the screen's bottom edge, where a tap misses it.
- scrollUntilVisible:
    element: "Continue|Jatka|Fortsätt"
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn: "Continue|Jatka|Fortsätt"

# 4: the intent. Closed here and opened again: the screen's memory is gone,
# whom one seeks was saved on leaving its screen.
- extendedWaitUntil:
    visible: "What are you here for\\?|Mitä etsit täältä\\?|Vad är du här för\\?"
    timeout: 15000
- stopApp
- runFlow: ../common/open-app.yaml
- extendedWaitUntil:
    visible: "What are you here for\\?|Mitä etsit täältä\\?|Vad är du här för\\?"
    timeout: 15000
- assertVisible: "Step 4 of 8|Vaihe 4 / 8|Steg 4 av 8"
- assertNotVisible: "Whom are you looking for\\?|Ketä etsit\\?|Vem söker du\\?"
- tapOn: "Something long-term|Jotain pitkäaikaista|Något långvarigt"
- tapOn: "Continue|Jatka|Fortsätt"

# 5: the ages start five years either side of 26 and move by buttons.
- extendedWaitUntil:
    visible: "What ages\\?|Minkä ikäisiä\\?|Vilka åldrar\\?"
    timeout: 15000
- assertVisible: "Step 5 of 8|Vaihe 5 / 8|Steg 5 av 8"
- assertVisible: "21"
- assertVisible: "31"
- tapOn: "Oldest, one year older|Vanhin, vuotta vanhempi|Äldsta, ett år äldre"
- tapOn: "Oldest, one year older|Vanhin, vuotta vanhempi|Äldsta, ett år äldre"
- assertVisible: "33"
- tapOn: "Continue|Jatka|Fortsätt"

# 6: two ponds without a parent, so the area is the person's choice (#174).
- extendedWaitUntil:
    visible: "Where do you live\\?|Missä asut\\?|Var bor du\\?"
    timeout: 15000
- assertVisible: "Step 6 of 8|Vaihe 6 / 8|Steg 6 av 8"
- assertVisible: "Finland|Suomi"
- tapOn: "Capital Area|Pääkaupunkiseutu|Huvudstadsregionen"

# 7: three photos, the reason first, through the system picker one at a time.
- extendedWaitUntil:
    visible: "Two photos of you|Kaksi kuvaa sinusta|Två bilder på dig"
    timeout: 15000
- assertVisible: "Step 7 of 8|Vaihe 7 / 8|Steg 7 av 8"
- tapOn: "Add photos|Lisää kuvia|Lägg till bilder"
- extendedWaitUntil:
    visible: "Your photos|Kuvasi|Dina foton"
    timeout: 15000
- runFlow:
    file: ../common/pick-photo.yaml
    env:
      INDEX: 0
      COUNT: "1 photo, at most 6|1 kuva, enintään 6|1 foto, högst 6"
- runFlow:
    file: ../common/pick-photo.yaml
    env:
      INDEX: 1
      COUNT: "2 photos, at most 6|2 kuvaa, enintään 6|2 foton, högst 6"
- runFlow:
    file: ../common/pick-photo.yaml
    env:
      INDEX: 2
      COUNT: "3 photos, at most 6|3 kuvaa, enintään 6|3 foton, högst 6"
- scrollUntilVisible:
    element: "Done|Valmis|Klar"
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn: "Done|Valmis|Klar"

# 8: a bio of at least 50 characters instead of two prompts.
- extendedWaitUntil:
    visible: "A few words|Muutama sana|Några ord"
    timeout: 15000
- assertVisible: "Step 8 of 8|Vaihe 8 / 8|Steg 8 av 8"
# The field, below its label of the same name; an empty field has no text to match.
- tapOn:
    below: "About you|Sinusta|Om dig"
- inputText: "Frisbeegolfia Keskuspuistossa ja kahvia termarista. Etsin juttuseuraa."
- tapOn: "A few words|Muutama sana|Några ord"
- scrollUntilVisible:
    element: "Save and continue|Tallenna ja jatka|Spara och fortsätt"
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn: "Save and continue|Tallenna ja jatka|Spara och fortsätt"

# Home straight after the bio: research was asked before the bank. The chosen
# area's counter; the photos wait in the local queue, so matching waits for them.
- extendedWaitUntil:
    visible: "Your area|Alueesi|Ditt område"
    timeout: 15000
- assertVisible: "Capital Area|Pääkaupunkiseutu|Huvudstadsregionen"
- assertVisible: "Matching opens for finished profiles\\. Yours still lacks something\\.|Seuranhaku avautuu valmiille profiileille\\. Sinun profiilistasi puuttuu vielä jotakin\\.|Matchningen öppnar för färdiga profiler\\. I din saknas ännu något\\."
