# Who the bank login lets in, and who not (TD-7, the age rule of #33; the cast
# of personas.ts): a banned identity, an account deleted inside its waiting
# time and those under 18 are refused at the callback, each in its own words;
# the youngest who gets in and the oldest reach onboarding: the welcome step, a
# friend's invitation code or, in a later run, a later step known by its
# heading, none numbered after the bank, or home, which of them depends on the
# phone and on how far they have come (#418, #581, #681). Age is
# counted from the end of the birth month, so Venla, who turns 18 this month,
# is refused on every day but its last.
appId: fi.kumpa
name: The bank login refuses the banned, the recently deleted and those under 18, and lets in 18 and 99
---
- runFlow: ../common/open-app.yaml
- runFlow: ../common/sign-out.yaml

- runFlow:
    file: ../common/bank-login.yaml
    env:
      PERSONA: Reijo Salonen
- extendedWaitUntil:
    visible: "Sign-in did not complete|Kirjautuminen ei onnistunut|Inloggningen slutfördes inte"
    timeout: 30000
- assertVisible: "This person may not use Kumpa.|Tämä henkilö ei voi käyttää Kumpa-sovellusta.|Den här personen får inte använda Kumpa."

- runFlow:
    file: ../common/bank-login.yaml
    env:
      PERSONA: Marjatta Lund
- extendedWaitUntil:
    visible: "You deleted your account recently.*|Poistit tilisi äskettäin.*|Du raderade ditt konto nyligen.*"
    timeout: 30000

- runFlow:
    file: ../common/bank-login.yaml
    env:
      PERSONA: Lauri Hämäläinen
- extendedWaitUntil:
    visible: "Kumpa is for adults.*|Kumpa on aikuisille.*|Kumpa är för vuxna.*"
    timeout: 30000

- runFlow:
    # Tomorrow is the 1st on the last day of a month, the one day Venla gets in.
    when:
      true: ${new Date(Date.now() + 86400000).getDate() !== 1}
    commands:
      # The button clears the previous refusal, so the one shown after the bank is Venla's.
      - runFlow:
          file: ../common/bank-login.yaml
          env:
            PERSONA: Venla Nieminen
      - extendedWaitUntil:
          visible: "Kumpa is for adults.*|Kumpa on aikuisille.*|Kumpa är för vuxna.*"
          timeout: 30000

- runFlow:
    file: ../common/bank-login.yaml
    env:
      PERSONA: Eetu Laine
- extendedWaitUntil:
    visible: "Accept terms of use|Hyväksy käyttöehdot|Godkänn användarvillkoren|Did a friend invite you\\?|Kutsuiko ystävä sinut\\?|Bjöd en vän in dig\\?|What should we call you\\?|Miksi sinua kutsutaan\\?|Vad ska vi kalla dig\\?|How do you describe yourself\\?|Miten kuvailet itseäsi\\?|Hur beskriver du dig själv\\?|Whom are you looking for\\?|Ketä etsit\\?|Vem söker du\\?|Where do you live\\?|Missä asut\\?|Var bor du\\?|What should your card show\\?|Mitä korttisi näyttää\\?|Vad ska ditt kort visa\\?|On your card: .*|Kortillasi: .*|På ditt kort: .*|What ages\\?|Minkä ikäisiä\\?|Vilka åldrar\\?|What are you here for\\?|Mitä etsit täältä\\?|Vad är du här för\\?|Two photos of you|Kaksi kuvaa sinusta|Två bilder på dig|Finish your profile|Viimeistele profiilisi|Gör klart din profil|Your profile|Profiilisi|Din profil"
    timeout: 30000

- runFlow: ../common/sign-out.yaml
- runFlow:
    file: ../common/bank-login.yaml
    env:
      PERSONA: Siiri Koskinen
- extendedWaitUntil:
    visible: "Accept terms of use|Hyväksy käyttöehdot|Godkänn användarvillkoren|Did a friend invite you\\?|Kutsuiko ystävä sinut\\?|Bjöd en vän in dig\\?|What should we call you\\?|Miksi sinua kutsutaan\\?|Vad ska vi kalla dig\\?|How do you describe yourself\\?|Miten kuvailet itseäsi\\?|Hur beskriver du dig själv\\?|Whom are you looking for\\?|Ketä etsit\\?|Vem söker du\\?|Where do you live\\?|Missä asut\\?|Var bor du\\?|What should your card show\\?|Mitä korttisi näyttää\\?|Vad ska ditt kort visa\\?|On your card: .*|Kortillasi: .*|På ditt kort: .*|What ages\\?|Minkä ikäisiä\\?|Vilka åldrar\\?|What are you here for\\?|Mitä etsit täältä\\?|Vad är du här för\\?|Two photos of you|Kaksi kuvaa sinusta|Två bilder på dig|Finish your profile|Viimeistele profiilisi|Gör klart din profil|Your profile|Profiilisi|Din profil"
    timeout: 30000
