# A report from a conversation (#351, ADR-030 §12): Laura opens her
# conversation with Emmi, finds in the header's More that it can be ended,
# closes it, then opens the photo Emmi sent her full size and reports it with
# Report this photo (#476, §13): a reason and a short note, typed in the dialog
# with the keyboard up. She is taken back to the list, which thanks her and no
# longer has the conversation (the report blocked Emmi). Emmi signs in and
# finds it among the archived, ended and naming nobody; inside it, the heading
# says it ended, the composer is gone, the way to the support page stands in its
# place, More offers only the report, and Emmi's report goes through too. The
# stories give the pair their conversation and Emmi's photo
# (packages/db/src/seed/conversations.ts), which no other flow reads. A block
# is final, so the flow runs once after each `pnpm demo:reset`. That Emmi's
# card is out of Laura's reach is the API's tests until the round (#96) shows
# a card; that the moderators find the pointed photo first is the panel's flow
# (apps/admin/e2e/report.spec.ts).
appId: fi.kuutti.app
name: A report from a conversation takes it from the reporter's list, and the other finds it ended and can still report it
---
- runFlow:
    file: ../common/sign-in.yaml
    env:
      PERSONA: Laura Saarinen
- openLink: kuutti://chats
- extendedWaitUntil:
    visible: "Emmi, \\d+, .*"
    timeout: 15000
- waitForAnimationToEnd
- tapOn: "Emmi, \\d+, .*"
# More is in the header once the conversation is read.
- extendedWaitUntil:
    visible: "More|Lisää|Mer"
    timeout: 15000
- waitForAnimationToEnd
- tapOn: "More|Lisää|Mer"
- extendedWaitUntil:
    visible: "Report, block or end|Ilmoita, estä tai lopeta|Anmäl, blockera eller avsluta"
    timeout: 15000
- assertVisible: "End conversation|Lopeta keskustelu|Avsluta samtalet"
- assertVisible: "Report and block|Ilmoita ja estä|Anmäl och blockera"
- tapOn: "Cancel|Peruuta|Avbryt"
- extendedWaitUntil:
    notVisible: "Report, block or end|Ilmoita, estä tai lopeta|Anmäl, blockera eller avsluta"
    timeout: 15000
- waitForAnimationToEnd
# Emmi's photo is the conversation's last line, its caption the bubble's words.
- tapOn: "Emmi, \\d{1,2}[.:]\\d{2}[^,]*, Arvaa, .*"
- extendedWaitUntil:
    visible: "(Photo, full size|Kuva, täysikokoinen|Foto, full storlek)\\. Arvaa, .*"
    timeout: 15000
# Report this photo comes once the photo is shown.
- extendedWaitUntil:
    visible: "Report this photo|Ilmoita tästä kuvasta|Anmäl det här fotot"
    timeout: 15000
- tapOn: "Report this photo|Ilmoita tästä kuvasta|Anmäl det här fotot"
# The report says first that it points the moderators to this photo, then
# that they get a copy of the whole conversation, the reporter's own messages
# and photos included.
- extendedWaitUntil:
    visible: "The report points the moderators to this photo\\.|Ilmoitus ohjaa moderaattorit tähän kuvaan\\.|Anmälan pekar ut det här fotot för moderatorerna\\."
    timeout: 15000
- assertVisible: "The moderators get a copy of this whole conversation, your own messages and photos included, and keep it for twelve months\\.|Moderaattorit saavat kopion tästä koko keskustelusta, myös omista viesteistäsi ja kuvistasi, ja säilyttävät sen kaksitoista kuukautta\\.|Moderatorerna får en kopia av hela det här samtalet, även dina egna meddelanden och bilder, och sparar den i tolv månader\\."
- tapOn: "Harassing, threatening or hateful|Häiritsevä, uhkaava tai vihamielinen|Trakasserande, hotfull eller hatisk"
# The note's field is the last in the dialog, below its label, which is also
# its name, and above Send report, which the reason has enabled: tapped
# between the two. Letters only, as the stories' lines are.
- scrollUntilVisible:
    element: "Anything the moderators should know \\(optional, up to 500 characters\\)|Mitä moderaattoreiden pitäisi tietää \\(vapaaehtoinen, enintään 500 merkkiä\\)|Något moderatorerna bör veta \\(valfritt, högst 500 tecken\\)"
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn:
    below: "Anything the moderators should know \\(optional, up to 500 characters\\)|Mitä moderaattoreiden pitäisi tietää \\(vapaaehtoinen, enintään 500 merkkiä\\)|Något moderatorerna bör veta \\(valfritt, högst 500 tecken\\)"
    above: "Send report|Lähetä ilmoitus|Skicka anmälan"
- inputText: "Kysyy aina kotiosoitettani"
# The dialog keeps the focused field in sight just above the keyboard, its
# label above it: on iOS its scroll view insets itself and Send report stays
# under the keyboard; on Android, drawn edge to edge, the whole dialog shrinks
# into the space above the keyboard (the dialog primitive, #351), Send report
# included. A tap on the label, which is no button, closes the keyboard
# (README, the keyboard): the field carries the same words as its name, hence
# the label above what was typed, matched by its last word, which the
# keyboard never corrects.
- tapOn:
    text: "Anything the moderators should know \\(optional, up to 500 characters\\)|Mitä moderaattoreiden pitäisi tietää \\(vapaaehtoinen, enintään 500 merkkiä\\)|Något moderatorerna bör veta \\(valfritt, högst 500 tecken\\)"
    above: "(.* )?kotiosoitettani"
- tapOn: "Send report|Lähetä ilmoitus|Skicka anmälan"
# Back on the list, from the photo too: thanked, and the conversation is gone from it.
- extendedWaitUntil:
    visible: "Thank you\\. A moderator will look at it\\.|Kiitos\\. Moderaattori katsoo ilmoituksen\\.|Tack\\. En moderator tittar på anmälan\\."
    timeout: 15000
- assertVisible: "No conversations yet\\.|Ei vielä keskusteluja\\.|Inga samtal än\\."
- assertNotVisible: "Emmi, \\d+, .*"

# Emmi: the conversation is among the archived, ended, under no name; its
# last line is her own photo.
- runFlow:
    file: ../common/sign-in.yaml
    env:
      PERSONA: Emmi Kallio
- openLink: kuutti://chats
- extendedWaitUntil:
    visible: "(Conversation ended|Keskustelu päättynyt|Samtalet har avslutats), .*"
    timeout: 15000
- waitForAnimationToEnd
- assertVisible:
    text: "(Conversation ended|Keskustelu päättynyt|Samtalet har avslutats), .*"
    below: "Archived|Arkistoidut|Arkiverade"
- assertNotVisible: "Laura, \\d+, .*"
- tapOn: "(Conversation ended|Keskustelu päättynyt|Samtalet har avslutats), .*"
# The way to the support page in place of the composer, which is gone: the list
# has no such link, so this is the conversation. The heading says it ended, the
# same however it ended; the line that said so is said aloud only when it ends
# while on the screen, and never drawn (#581).
- extendedWaitUntil:
    visible: "Support when it's hard|Tukea, kun on vaikeaa|Stöd när det är svårt"
    timeout: 15000
- assertVisible: "Conversation ended|Keskustelu päättynyt|Samtalet har avslutats"
- assertNotVisible: "This conversation has ended\\.|Tämä keskustelu on päättynyt\\.|Det här samtalet har avslutats\\."
- assertNotVisible: "(Message|Viesti|Meddelande)( .*)?"
- waitForAnimationToEnd
- tapOn: "More|Lisää|Mer"
- extendedWaitUntil:
    visible: "Report and block|Ilmoita ja estä|Anmäl och blockera"
    timeout: 15000
- assertNotVisible: "End conversation|Lopeta keskustelu|Avsluta samtalet"
- tapOn: "Report and block|Ilmoita ja estä|Anmäl och blockera"
- extendedWaitUntil:
    visible: "A fake profile, or someone else's photos|Valeprofiili tai jonkun muun kuvat|Falsk profil eller någon annans bilder"
    timeout: 15000
- tapOn: "A fake profile, or someone else's photos|Valeprofiili tai jonkun muun kuvat|Falsk profil eller någon annans bilder"
- tapOn: "Send report|Lähetä ilmoitus|Skicka anmälan"
- extendedWaitUntil:
    visible: "Thank you\\. A moderator will look at it\\.|Kiitos\\. Moderaattori katsoo ilmoituksen\\.|Tack\\. En moderator tittar på anmälan\\."
    timeout: 15000
- assertVisible: "No conversations yet\\.|Ei vielä keskusteluja\\.|Inga samtal än\\."
