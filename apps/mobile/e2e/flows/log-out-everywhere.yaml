# Log out everywhere (#35): every session of the account ends at once, this
# device's with them, and opening the app again does not bring it back.
# Sanna; her profile is untouched, only her sessions end.
appId: fi.kuutti.app
name: Log out everywhere ends this device's session, and reopening the app does not bring it back
---
- runFlow: ../common/sign-in.yaml
- openLink: kuutti://settings
- extendedWaitUntil:
    visible: "Settings|Asetukset|Inställningar"
    timeout: 15000
# This device's session has a screen of its own, behind its row under "Account"
# (#287), below the fold on a phone: scrolled to, then tapped.
- scrollUntilVisible:
    element: "This device|Tämä laite|Den här enheten"
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn: "This device|Tämä laite|Den här enheten"
- extendedWaitUntil:
    visible: "Log out everywhere|Kirjaudu ulos kaikkialta|Logga ut överallt"
    timeout: 15000
- tapOn: "Log out everywhere|Kirjaudu ulos kaikkialta|Logga ut överallt"
- openLink: kuutti://
- extendedWaitUntil:
    visible: "Sign in with your bank|Kirjaudu pankkitunnuksilla|Logga in med din bank"
    timeout: 15000
- stopApp
- runFlow: ../common/open-app.yaml
- assertVisible: "Sign in with your bank|Kirjaudu pankkitunnuksilla|Logga in med din bank"
- assertNotVisible: "Your area|Alueesi|Ditt område"
