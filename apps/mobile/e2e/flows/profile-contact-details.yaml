# The text rule (#47, TD-6): contact details come after a match, so a bio with
# a phone number is refused with the reason, and nothing is stored. The basics
# save on leaving (#227), and the leaving is not held (#238): the refusal brings
# the screen back with the draft and asks, with the reason, before leaving
# without saving. Sanna's bio is untouched afterwards.
appId: fi.kuutti.app
name: A phone number in the bio is refused on leaving with the reason, and the stored bio stays
---
- runFlow: ../common/sign-in.yaml
- openLink: kuutti://profile/section/basics
- extendedWaitUntil:
    visible: "(The basics|Perustiedot|Grunderna)(, .*)?"
    timeout: 15000
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "Arkkitehti, joka piirtää.*"
    direction: DOWN
    centerElement: true
    timeout: 60000
# Typed into the bio where the tap puts the cursor: a number anywhere in it is refused.
- tapOn: "Arkkitehti, joka piirtää.*"
- inputText: " Soita minulle 040 123 4567, niin sovitaan retki Nuuksioon. "
# The keyboard closes with a tap on the field's label, which is no button (the
# screen lets such a tap close it): hideKeyboard taps what lies below the
# field on iOS, and on Android it left the keyboard up in CI. The field itself
# carries the same words as its name, hence above its text.
- tapOn:
    text: "About you|Sinusta|Om dig"
    above: "Arkkitehti, joka piirtää.*"
# The arrow is pinned above the scroll, in view wherever the section stands.
- tapOn: "Back to your profile|Takaisin profiiliisi|Tillbaka till din profil"
- extendedWaitUntil:
    visible: "Leave without saving\\?|Poistutaanko tallentamatta\\?|Lämna utan att spara\\?"
    timeout: 15000
- assertVisible: "Your text has an e-mail address, a link, a phone number or a social media handle\\. Those come after a match\\.|Tekstissäsi on sähköpostiosoite, linkki, puhelinnumero tai somekäyttäjänimi\\. Ne tulevat mätsin jälkeen\\.|Din text har en e-postadress, en länk, ett telefonnummer eller ett användarnamn på sociala medier\\. De kommer efter en match\\."

# Away with the edit unsaved, on the word.
- tapOn: "Leave without saving|Poistu tallentamatta|Lämna utan att spara"
- extendedWaitUntil:
    notVisible: "(The basics|Perustiedot|Grunderna)(, .*)?"
    timeout: 15000
- openLink: kuutti://profile/card
- extendedWaitUntil:
    visible: "Your card|Korttisi|Ditt kort"
    timeout: 15000
- scrollUntilVisible:
    element: "Arkkitehti, joka piirtää.*"
    direction: DOWN
    centerElement: true
    timeout: 60000
- assertNotVisible: ".*040 123 4567.*"
