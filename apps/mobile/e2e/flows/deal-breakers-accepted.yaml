# Deal-breakers (#149, TD-16, features/matching/preferences.feature): at most
# deal_breakers_max (6) of them, one per field the person answered themselves,
# so at six the limit refuses nobody; that refusal is the screen's test and the
# API's, with a lower number. One with no accepted answer cannot be saved, and
# leaving with the set unsaved asks first. Sanna answered all six fields and
# has none set; the flow saves nothing, so it leaves her as it found her.
appId: fi.kuutti.app
name: Each deal-breaker waits for an accepted answer, and leaving unsaved asks first
---
- runFlow: ../common/sign-in.yaml
- openLink: kuutti://profile/deal-breakers
- extendedWaitUntil:
    visible: "Deal-breakers|Ehdottomat rajat|Absoluta gränser"
    timeout: 15000
- assertVisible: "Up to 6\\. Only on what you answered yourself.*|Enintään 6\\. Vain siitä, mihin vastasit itse.*|Högst 6\\. Bara om det du själv svarat på.*"
- assertNotVisible: "To filter on this, share yours first\\.|Suodattaaksesi tällä kerro ensin omasi\\.|För att filtrera på det här, dela ditt eget först\\."

# One on: it waits for an answer that is fine with her before it can be saved.
- tapOn: "(Deal-breaker: Kids|Ehdoton raja: Lapset|Absolut gräns: Barn)(, .*)?"
- assertVisible: "Fine with me|Sopii minulle|Okej för mig"
- assertVisible: "Pick at least one answer that is fine with you\\.|Valitse ainakin yksi vastaus, joka sopii sinulle\\.|Välj minst ett svar som är okej för dig\\."
- assertVisible:
    text: "Save the deal-breakers|Tallenna rajat|Spara gränserna"
    enabled: false
- tapOn: "No kids|Ei lapsia|Inga barn"
- assertVisible:
    text: "No kids|Ei lapsia|Inga barn"
    selected: true
- assertNotVisible: "Pick at least one answer that is fine with you\\.|Valitse ainakin yksi vastaus, joka sopii sinulle\\.|Välj minst ett svar som är okej för dig\\."
- assertVisible:
    text: "Save the deal-breakers|Tallenna rajat|Spara gränserna"
    enabled: true

# Two on: the second is fine too.
- tapOn: "(Deal-breaker: Smoking|Ehdoton raja: Tupakointi|Absolut gräns: Rökning)(, .*)?"
- tapOn: "Never|En koskaan|Aldrig"

# A third goes on as well: the limit is one on every field (#508).
- scrollUntilVisible:
    element: "(Deal-breaker: Languages|Ehdoton raja: Kielet|Absolut gräns: Språk)(, .*)?"
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn: "(Deal-breaker: Languages|Ehdoton raja: Kielet|Absolut gräns: Språk)(, .*)?"
- assertNotVisible: "That is 6 already\\.|Niitä on jo 6\\.|Det är redan 6\\."
- assertVisible:
    text: "1|(Deal-breaker: Languages|Ehdoton raja: Kielet|Absolut gräns: Språk), on"
    rightOf: "Languages|Kielet|Språk"

# Left unsaved: opened again, nothing is on.
# Leaving with them unsaved asks first (14/10/2026): the arrow, kept on the
# word; then a link from outside the app, which waits for the word the same way
# (app/+native-intent.ts) and is followed on it. Nothing of them is stored.
- tapOn: "Back|Takaisin|Tillbaka"
- extendedWaitUntil:
    visible: "Leave without saving\\?|Poistutaanko tallentamatta\\?|Lämna utan att spara\\?"
    timeout: 15000
- tapOn: "Keep editing|Jatka muokkaamista|Fortsätt redigera"
- assertVisible: "Fine with me|Sopii minulle|Okej för mig"
- openLink: kuutti://
- extendedWaitUntil:
    visible: "Leave without saving\\?|Poistutaanko tallentamatta\\?|Lämna utan att spara\\?"
    timeout: 15000
- tapOn: "Leave without saving|Poistu tallentamatta|Lämna utan att spara"
- extendedWaitUntil:
    visible: "Your profile|Profiilisi|Din profil"
    timeout: 15000
- openLink: kuutti://profile/deal-breakers
- extendedWaitUntil:
    visible: "Deal-breakers|Ehdottomat rajat|Absoluta gränser"
    timeout: 15000
- assertNotVisible: "Fine with me|Sopii minulle|Okej för mig"
