# The language choice in Settings changes the app's language at once, and
# the phone's language takes it back (#164, the first feature flow; the
# texts are those of packages/i18n/messages.yaml in all three languages).
# The language's choices open under its row (#511).
appId: fi.kuutti.app
name: The language choice in Settings changes the app's language at once
---
- runFlow: ../common/sign-in.yaml
- openLink: kuutti://settings
- extendedWaitUntil:
    visible: "Settings|Asetukset|Inställningar"
    timeout: 15000
# Settings can come back scrolled down, and the row is in the first section:
# back to the top first.
- scrollUntilVisible:
    element: "Appearance and language|Ulkoasu ja kieli|Utseende och språk"
    direction: UP
    timeout: 60000
# The row says the language chosen, which Maestro reads after its title; it
# opens in place, and the choices are the rows' words that change. The list
# open is told by its ticked choice, which no row's value has.
- runFlow:
    file: ../common/open-settings-row.yaml
    env:
      ROW: "(Language|Kieli|Språk)(, .*)?"
      INSIDE: ".*✓.*"
- tapOn: ".*Suomi.*"
- assertVisible: "Ulkoasu ja kieli"
- assertVisible: ".*✓.*Suomi.*"
- tapOn: ".*Svenska.*"
- assertVisible: "Utseende och språk"
- tapOn: ".*English.*"
- assertVisible: "Appearance and language"
# Back to the phone's language and the row closed, so the next flow finds the app as a person would.
- tapOn: "Same as the phone"
- assertVisible: "Appearance and language|Ulkoasu ja kieli|Utseende och språk"
- runFlow:
    file: ../common/close-settings-row.yaml
    env:
      ROW: "(Language|Kieli|Språk)(, .*)?"
      INSIDE: ".*✓.*"
- assertVisible: "Settings|Asetukset|Inställningar"
