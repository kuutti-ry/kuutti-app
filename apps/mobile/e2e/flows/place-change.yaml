# The home after onboarding (#514, ADR-061 §1, §3): what the card shows of it,
# saved on the tap, and a new postal code, whenever the person likes, which
# starts the card from the town again. In words only: what was typed leaves the
# field with its save, and no screen shows digits back, which the screen's one
# line says. The filled one of the town and the area says what the card shows,
# and a save is said to a screen reader and not drawn (#581). Sanna lives in Tapiola,
# Espoo, with the town on her card; the flow puts her back as it found her. A
# run that stops half-way leaves her elsewhere: `pnpm demo:reset` first.
appId: fi.kuutti.app
name: The home changes by a new postal code, the card says the name chosen, and digits are never shown back
---
- runFlow: ../common/sign-in.yaml
- openLink: kuutti://profile
- extendedWaitUntil:
    visible: "(The basics|Perustiedot|Grunderna)(, .*)?"
    timeout: 15000
- tapOn: "Home|Koti|Hem"
- extendedWaitUntil:
    visible: "What should your card show\\?|Mitä korttisi näyttää\\?|Vad ska ditt kort visa\\?"
    timeout: 15000
# The second sentence of onboarding's two, the one that is still news here.
- assertVisible: "Others see a town or your area by name, never the digits\\.|Muut näkevät kaupungin tai alueesi nimen, eivät koskaan numeroita\\.|Andra ser en stad eller ditt område med namn, aldrig siffrorna\\."
- assertVisible: "✓ Espoo|✓ Esbo"
- assertNotVisible: "On your card: .*|Kortillasi: .*|På ditt kort: .*"
- assertNotVisible: ".*\\d{5}.*"

# Her area instead of the town, saved on the tap, and on her card at once. The
# filled one moves, and that is all the eye has of the save.
- tapOn: "Tapiola|Hagalund"
- extendedWaitUntil:
    visible: "✓ Tapiola|✓ Hagalund"
    timeout: 15000
- assertVisible: "Espoo|Esbo"
- assertNotVisible: "Saved\\.|Tallennettu\\.|Sparat\\."
- openLink: kuutti://profile/card
- extendedWaitUntil:
    visible: "Your card|Korttisi|Ditt kort"
    timeout: 15000
- scrollUntilVisible:
    element: "Tapiola|Hagalund"
    direction: DOWN
    centerElement: true
    timeout: 60000

# A new postal code starts from the town again, and leaves the field empty.
# Back, as a person goes: a link here would lay a second home screen over the
# first, and the field Maestro finds would be the one underneath.
- tapOn: "Back to your profile|Takaisin profiiliisi|Tillbaka till din profil"
- extendedWaitUntil:
    visible: "What should your card show\\?|Mitä korttisi näyttää\\?|Vad ska ditt kort visa\\?"
    timeout: 15000
- tapOn:
    below: "Postal code|Postinumero|Postnummer"
- inputText: "33100"
- tapOn: "Others see a town or your area by name, never the digits\\.|Muut näkevät kaupungin tai alueesi nimen, eivät koskaan numeroita\\.|Andra ser en stad eller ditt område med namn, aldrig siffrorna\\."
- tapOn: ".*(Tampere Keskus|Tammerfors centrum).*"
- extendedWaitUntil:
    visible: "✓ Tampere|✓ Tammerfors"
    timeout: 15000
- assertNotVisible: ".*\\d{5}.*"
- assertNotVisible: "Saved\\.|Tallennettu\\.|Sparat\\."
- openLink: kuutti://profile/card
- extendedWaitUntil:
    visible: "Your card|Korttisi|Ditt kort"
    timeout: 15000
- scrollUntilVisible:
    element: "Tampere|Tammerfors"
    direction: DOWN
    centerElement: true
    timeout: 60000

# Back as she began: Tapiola, with the town on her card.
- tapOn: "Back to your profile|Takaisin profiiliisi|Tillbaka till din profil"
- extendedWaitUntil:
    visible: "What should your card show\\?|Mitä korttisi näyttää\\?|Vad ska ditt kort visa\\?"
    timeout: 15000
- tapOn:
    below: "Postal code|Postinumero|Postnummer"
- inputText: "02100"
- tapOn: "Others see a town or your area by name, never the digits\\.|Muut näkevät kaupungin tai alueesi nimen, eivät koskaan numeroita\\.|Andra ser en stad eller ditt område med namn, aldrig siffrorna\\."
- tapOn: ".*(Tapiola|Hagalund).*"
- extendedWaitUntil:
    visible: "✓ Espoo|✓ Esbo"
    timeout: 15000
