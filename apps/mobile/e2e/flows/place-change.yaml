# The home after onboarding (#514, ADR-061 §1, §3): what the card shows of it,
# saved on the tap, and a new postal code, whenever the person likes, which
# starts the card from the town again. In words only: what was typed leaves the
# field with its save, and no screen shows digits back. Sanna lives in Tapiola,
# Espoo, with the town on her card; the flow puts her back as it found her. A
# run that stops half-way leaves her elsewhere: `pnpm demo:reset` first.
appId: fi.kuutti.app
name: The home changes by a new postal code, the card says the name chosen, and digits are never shown back
---
- runFlow: ../common/sign-in.yaml
- openLink: kuutti://profile
- extendedWaitUntil:
    visible: "Your profile|Profiilisi|Din profil"
    timeout: 15000
- tapOn: "Home|Koti|Hem"
- extendedWaitUntil:
    visible: "What should your card show\\?|Mitä korttisi näyttää\\?|Vad ska ditt kort visa\\?"
    timeout: 15000
- assertVisible: "On your card: Espoo|Kortillasi: Espoo|På ditt kort: Esbo"
- assertVisible:
    text: "Espoo|Esbo"
    selected: true
- assertNotVisible: ".*\\d{5}.*"

# Her area instead of the town, saved on the tap, and on her card at once.
- tapOn: "Tapiola|Hagalund"
- extendedWaitUntil:
    visible: "On your card: Tapiola|Kortillasi: Tapiola|På ditt kort: Hagalund"
    timeout: 15000
- assertVisible: "Saved\\.|Tallennettu\\.|Sparat\\."
- openLink: kuutti://profile/card
- extendedWaitUntil:
    visible: "Your card|Korttisi|Ditt kort"
    timeout: 15000
- scrollUntilVisible:
    element: "Tapiola|Hagalund"
    direction: DOWN
    centerElement: true
    timeout: 60000

# A new postal code starts from the town again, and leaves the field empty.
# Back, as a person goes: a link here would lay a second home screen over the
# first, and the field Maestro finds would be the one underneath.
- tapOn: "Back to your profile|Takaisin profiiliisi|Tillbaka till din profil"
- extendedWaitUntil:
    visible: "What should your card show\\?|Mitä korttisi näyttää\\?|Vad ska ditt kort visa\\?"
    timeout: 15000
- tapOn:
    below: "Postal code|Postinumero|Postnummer"
- inputText: "33100"
- tapOn: "Your postal code tells Kuutti.*|Postinumerosi kertoo Kuutille.*|Ditt postnummer berättar för Kuutti.*"
- tapOn: ".*(Tampere Keskus|Tammerfors centrum).*"
- extendedWaitUntil:
    visible: "On your card: Tampere|Kortillasi: Tampere|På ditt kort: Tammerfors"
    timeout: 15000
- assertNotVisible: ".*\\d{5}.*"
- openLink: kuutti://profile/card
- extendedWaitUntil:
    visible: "Your card|Korttisi|Ditt kort"
    timeout: 15000
- scrollUntilVisible:
    element: "Tampere|Tammerfors"
    direction: DOWN
    centerElement: true
    timeout: 60000

# Back as she began: Tapiola, with the town on her card.
- tapOn: "Back to your profile|Takaisin profiiliisi|Tillbaka till din profil"
- extendedWaitUntil:
    visible: "What should your card show\\?|Mitä korttisi näyttää\\?|Vad ska ditt kort visa\\?"
    timeout: 15000
- tapOn:
    below: "Postal code|Postinumero|Postnummer"
- inputText: "02100"
- tapOn: "Your postal code tells Kuutti.*|Postinumerosi kertoo Kuutille.*|Ditt postnummer berättar för Kuutti.*"
- tapOn: ".*(Tapiola|Hagalund).*"
- extendedWaitUntil:
    visible: "On your card: Espoo|Kortillasi: Espoo|På ditt kort: Esbo"
    timeout: 15000
