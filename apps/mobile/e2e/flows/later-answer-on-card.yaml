# An answer saved on its later screen shows on the whole card under its
# section, and taking it back takes it off (#148, #213, #644). The article 9
# fields take the consent given with whom one seeks (#204): Sanna's parties
# show under Beliefs, a chip each, and the star signs include the corgi. The
# glyph before each name is decorative and invisible to Maestro, as to a
# screen reader; the name beside it is what is asserted, and on iOS a chip's
# label carries its question first, which the patterns allow. The flow clears
# what it saved.
appId: fi.kuutti.app
name: A party and a star sign saved on their screens show on the card, and clearing them takes them off
---
- runFlow: ../common/sign-in.yaml

# Two parties: chosen and saved.
- openLink: kuutti://profile/later/politics
- extendedWaitUntil:
    visible: "Parties you could vote for|Puolueet, joita voisit äänestää|Partier du kunde rösta på"
    timeout: 15000
- waitForAnimationToEnd
- tapOn: "Centre Party|Keskusta|Centern"
- tapOn: "Pirate Party|Piraattipuolue|Piratpartiet"
- assertVisible:
    text: "Pirate Party|Piraattipuolue|Piratpartiet"
    selected: true
- scrollUntilVisible:
    element: "Save and continue|Tallenna ja jatka|Spara och fortsätt"
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn: "Save and continue|Tallenna ja jatka|Spara och fortsätt"
- extendedWaitUntil:
    visible: "Religion|Uskonto"
    timeout: 15000

# The corgi, between Virgo and Libra.
- openLink: kuutti://profile/later/zodiac
- extendedWaitUntil:
    visible: "Star sign|Horoskooppimerkki|Stjärntecken"
    timeout: 15000
- waitForAnimationToEnd
- tapOn: "Corgi"
- scrollUntilVisible:
    element: "Save and continue|Tallenna ja jatka|Spara och fortsätt"
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn: "Save and continue|Tallenna ja jatka|Spara och fortsätt"
# The star sign is the last field; the e-mail's screen follows.
- extendedWaitUntil:
    visible: "A way to stay in touch|Tapa pitää yhteyttä|Ett sätt att hålla kontakten"
    timeout: 15000

# On the whole card, under Beliefs.
- openLink: kuutti://profile/card
- extendedWaitUntil:
    visible: "Your card|Korttisi|Ditt kort"
    timeout: 15000
- scrollUntilVisible:
    element: "Show the whole card|Näytä koko kortti|Visa hela kortet"
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn: "Show the whole card|Näytä koko kortti|Visa hela kortet"
- scrollUntilVisible:
    element: "Beliefs|Vakaumus|Övertygelse"
    direction: DOWN
    centerElement: true
    timeout: 60000
- scrollUntilVisible:
    element: "(.*: )?(Centre Party|Keskusta|Centern)"
    direction: DOWN
    centerElement: true
    timeout: 60000
- assertVisible: "(.*: )?(Pirate Party|Piraattipuolue|Piratpartiet)"
- scrollUntilVisible:
    element: "(.*: )?Corgi"
    direction: DOWN
    centerElement: true
    timeout: 60000

# Cleared again: off the card. The screen shows the stored answer once it has
# read it; a tap before that is overwritten, so the flow waits for it.
- openLink: kuutti://profile/later/politics
- extendedWaitUntil:
    visible:
      text: "Centre Party|Keskusta|Centern"
      selected: true
    timeout: 15000
- waitForAnimationToEnd
- tapOn: "Centre Party|Keskusta|Centern"
- tapOn: "Pirate Party|Piraattipuolue|Piratpartiet"
- scrollUntilVisible:
    element: "Save and continue|Tallenna ja jatka|Spara och fortsätt"
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn: "Save and continue|Tallenna ja jatka|Spara och fortsätt"
- extendedWaitUntil:
    visible: "Religion|Uskonto"
    timeout: 15000
- openLink: kuutti://profile/later/zodiac
- extendedWaitUntil:
    visible:
      text: "Corgi"
      selected: true
    timeout: 15000
- waitForAnimationToEnd
- tapOn: "Corgi"
- scrollUntilVisible:
    element: "Save and continue|Tallenna ja jatka|Spara och fortsätt"
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn: "Save and continue|Tallenna ja jatka|Spara och fortsätt"
- extendedWaitUntil:
    visible: "A way to stay in touch|Tapa pitää yhteyttä|Ett sätt att hålla kontakten"
    timeout: 15000
- openLink: kuutti://profile/card
- extendedWaitUntil:
    visible: "Your card|Korttisi|Ditt kort"
    timeout: 15000
- scrollUntilVisible:
    element: "Show the whole card|Näytä koko kortti|Visa hela kortet"
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn: "Show the whole card|Näytä koko kortti|Visa hela kortet"
# Her hobbies end the whole card once Beliefs has nothing left.
- scrollUntilVisible:
    element: "(.*: )?(Swimming|Uinti|Simning)"
    direction: DOWN
    centerElement: true
    timeout: 60000
- assertNotVisible: "Beliefs|Vakaumus|Övertygelse"
- assertNotVisible: "(.*: )?Corgi"
