# The research opt-in stays reachable after onboarding as a switch under the
# app's settings (ADR-010 §9, TD-5; a screen of its own behind its row since #287): on, it records the consent and stays on
# when Settings is opened again; off, it withdraws it. Sanna never took part;
# the flow ends with the switch off.
appId: fi.kuutti.app
name: The research switch in Settings records the opt-in and withdraws it again
---
- runFlow: ../common/sign-in.yaml
- openLink: kuutti://settings
# The consent has a screen of its own, behind its row (#287). The row says
# whether it is on, which Maestro reads after its title; on the screen the
# switch is toggled by its words.
- scrollUntilVisible:
    element: "(Research|Tutkimus|Forskning)(, .*)?"
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn: "(Research|Tutkimus|Forskning)(, .*)?"
- extendedWaitUntil:
    visible: "Anonymised events about how you use Kuutti, under a separate research identifier\\..*|Anonymisoituja tapahtumia Kuutin käytöstäsi.*|Anonymiserade händelser om hur du använder Kuutti.*"
    timeout: 15000
# A switch's text, to Maestro, is its value ("0" off, "1" on), right of its words.
- tapOn: "Take part in research|Osallistu tutkimukseen|Delta i forskningen"
- extendedWaitUntil:
    visible:
      text: "1|(Take part in research|Osallistu tutkimukseen|Delta i forskningen), on"
      rightOf: "Take part in research|Osallistu tutkimukseen|Delta i forskningen"
    timeout: 15000

- openLink: kuutti://
# A link is answered as soon as it is sent, before the screen has changed: with
# Settings opened straight over the consent's screen, whose header is the row's
# title, the scroll found the header and tapped it (CI on main, 14/10/2026).
# So home first, the consent's screen gone, and Settings over that.
- extendedWaitUntil:
    visible: "Your area|Alueesi|Ditt område"
    timeout: 15000
- openLink: kuutti://settings
- scrollUntilVisible:
    element: "(Research|Tutkimus|Forskning)(, .*)?"
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn: "(Research|Tutkimus|Forskning)(, .*)?"
- extendedWaitUntil:
    visible: "Anonymised events about how you use Kuutti, under a separate research identifier\\..*|Anonymisoituja tapahtumia Kuutin käytöstäsi.*|Anonymiserade händelser om hur du använder Kuutti.*"
    timeout: 15000
- assertVisible:
    text: "1|(Take part in research|Osallistu tutkimukseen|Delta i forskningen), on"
    rightOf: "Take part in research|Osallistu tutkimukseen|Delta i forskningen"
- tapOn: "Take part in research|Osallistu tutkimukseen|Delta i forskningen"
- extendedWaitUntil:
    visible:
      text: "0|(Take part in research|Osallistu tutkimukseen|Delta i forskningen), off"
      rightOf: "Take part in research|Osallistu tutkimukseen|Delta i forskningen"
    timeout: 15000
- assertNotVisible: "The research choice could not be saved\\. Try again\\.|Tutkimusvalintaa ei voitu tallentaa\\. Yritä uudelleen\\.|Forskningsvalet kunde inte sparas\\. Försök igen\\."
