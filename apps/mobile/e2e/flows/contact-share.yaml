# Contacts shared in a conversation (#103, ADR-031): Elina keeps her
# Instagram username in Settings, Ways to reach you, where nobody sees it; she
# opens her conversation with Jussi, shares it with the header's Share contact
# and sees its button turn to Stop sharing. Jussi signs in and finds it under the
# conversation's header. Elina signs in again, stops sharing it and removes it
# in Settings, closing its row, so the flow runs again without a reset. The stories give the
# pair their conversation (packages/db/src/seed/conversations.ts), which no
# other flow reads. A run that stops half-way leaves the username kept, or
# shared: `pnpm demo:reset` forgets it.
appId: fi.kuutti.app
name: A contact kept in Settings is shared from a conversation's header and shows under the other person's header, then sharing stops and it is removed
---
- runFlow:
    file: ../common/sign-in.yaml
    env:
      PERSONA: Elina Järvinen
- openLink: kuutti://settings
- extendedWaitUntil:
    visible: "Settings|Asetukset|Inställningar"
    timeout: 15000
# The row sits under Notifications and contacts, below the fold on a phone, and opens in place (#511).
- runFlow:
    file: ../common/open-settings-row.yaml
    env:
      ROW: "Ways to reach you|Mistä sinut tavoittaa|Hur man når dig"
      INSIDE: "Loading your contact details…|Ladataan yhteystietojasi…|Laddar dina kontaktuppgifter…|Nobody sees them until you share one in a conversation\\..*|Kukaan ei näe niitä, ennen kuin jaat jonkin niistä keskustelussa\\..*|Ingen ser dem förrän du delar en av dem i ett samtal\\..*"
# The cards come once what is kept has been read, the phone number's first;
# Instagram's is the fourth of five, below the fold. A field is its label.
- extendedWaitUntil:
    visible: "Your phone number|Puhelinnumerosi|Ditt telefonnummer"
    timeout: 15000
- scrollUntilVisible:
    element: "Your Instagram username|Instagram-käyttäjänimesi|Ditt användarnamn på Instagram"
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn: "Your Instagram username|Instagram-käyttäjänimesi|Ditt användarnamn på Instagram"
- inputText: "elina.lukupiiri"
# There is no Save (#511): leaving the field keeps it. The page keeps the
# focused field in sight just above the keyboard, with the kind's title
# above it. A tap on the title, which is no button and the brand's name in
# every language, closes the keyboard and leaves the field (README, the keyboard).
- tapOn: "Instagram"
- extendedWaitUntil:
    visible: "Saved\\.|Tallennettu\\.|Sparat\\."
    timeout: 15000
- assertVisible: "Remove your Instagram username|Poista Instagram-käyttäjänimesi|Ta bort ditt användarnamn på Instagram"

# The conversation by its row (the name with the age, the last line, when),
# in either group: the nightly sweep archives one quiet for a week, and a
# share brings it back.
- openLink: kuutti://chats
- extendedWaitUntil:
    visible: "Jussi, \\d+, .*"
    timeout: 15000
- waitForAnimationToEnd
- tapOn: "Jussi, \\d+, .*"
# Share contact is in the header once the conversation is read, since she keeps one now.
- extendedWaitUntil:
    visible: "Share contact|Jaa yhteystieto|Dela kontaktuppgift"
    timeout: 15000
- waitForAnimationToEnd
- tapOn: "Share contact|Jaa yhteystieto|Dela kontaktuppgift"
# In Finnish the dialog's title says the header button's words: the dialog is
# known by its Share, whose label names the kind (the button shows "Share").
- extendedWaitUntil:
    visible: "Share your Instagram|Jaa: Instagram|Dela: Instagram"
    timeout: 15000
- assertVisible: "Instagram: elina\\.lukupiiri"
- assertVisible: "Jussi sees what you share at once\\. You can stop sharing at any time, but what Jussi already wrote down stays with them\\.|Jussi näkee jakamasi heti\\. Voit lopettaa jakamisen milloin tahansa, mutta minkä Jussi on jo kirjoittanut muistiin, jää hänelle\\.|Jussi ser det du delar direkt\\. Du kan sluta dela när som helst, men det som Jussi redan har skrivit ner finns kvar\\."
- tapOn: "Share your Instagram|Jaa: Instagram|Dela: Instagram"
# The button turns: its word is the state, and the outcome is said aloud, not drawn (#581).
- extendedWaitUntil:
    visible: "Stop sharing your Instagram|Lopeta jakaminen: Instagram|Sluta dela: Instagram"
    timeout: 15000
- assertNotVisible: "Share your Instagram|Jaa: Instagram|Dela: Instagram"
- assertNotVisible: "Shared\\. Jussi sees it now\\.|Jaettu\\. Jussi näkee sen nyt\\.|Delat\\. Jussi ser det nu\\."
- tapOn: "Close|Sulje|Stäng"
- extendedWaitUntil:
    notVisible: "Stop sharing your Instagram|Lopeta jakaminen: Instagram|Sluta dela: Instagram"
    timeout: 15000

# Jussi: the line under the header shows "Instagram: elina.lukupiiri" and is
# heard as who shares what; Maestro reads the heard words on both platforms
# (on iOS only those). He keeps no contact, so he has no Share contact.
- runFlow:
    file: ../common/sign-in.yaml
    env:
      PERSONA: Jussi Lehtonen
- openLink: kuutti://chats
- extendedWaitUntil:
    visible: "Elina, \\d+, .*"
    timeout: 15000
- waitForAnimationToEnd
- tapOn: "Elina, \\d+, .*"
- extendedWaitUntil:
    visible: "Elina shares Instagram: elina\\.lukupiiri|Elina jakaa yhteystiedon\\. Instagram: elina\\.lukupiiri|Elina delar en kontaktuppgift\\. Instagram: elina\\.lukupiiri"
    timeout: 15000
- assertNotVisible: "Share contact|Jaa yhteystieto|Dela kontaktuppgift"
# Open and Copy stand by the line, named by the kind and the person (#473);
# neither is pressed, so the flow stays in the app.
- assertVisible: "Open Instagram: Elina|Avaa Instagram: Elina|Öppna Instagram: Elina"
- assertVisible: "Copy Instagram: Elina|Kopioi Instagram: Elina|Kopiera Instagram: Elina"

# Elina again: still shared, as its button says. Sharing stops, then the contact
# goes in Settings, which leaves Elina as the stories have it.
- runFlow:
    file: ../common/sign-in.yaml
    env:
      PERSONA: Elina Järvinen
- openLink: kuutti://chats
- extendedWaitUntil:
    visible: "Jussi, \\d+, .*"
    timeout: 15000
- waitForAnimationToEnd
- tapOn: "Jussi, \\d+, .*"
- extendedWaitUntil:
    visible: "Share contact|Jaa yhteystieto|Dela kontaktuppgift"
    timeout: 15000
- waitForAnimationToEnd
- tapOn: "Share contact|Jaa yhteystieto|Dela kontaktuppgift"
- extendedWaitUntil:
    visible: "Stop sharing your Instagram|Lopeta jakaminen: Instagram|Sluta dela: Instagram"
    timeout: 15000
- tapOn: "Stop sharing your Instagram|Lopeta jakaminen: Instagram|Sluta dela: Instagram"
# The button turns back, and the outcome is said aloud, not drawn (#581).
- extendedWaitUntil:
    visible: "Share your Instagram|Jaa: Instagram|Dela: Instagram"
    timeout: 15000
- assertNotVisible: "Stop sharing your Instagram|Lopeta jakaminen: Instagram|Sluta dela: Instagram"
- assertNotVisible: "No longer shared here\\.|Ei enää jaettu tässä\\.|Delas inte längre här\\."
# Closed before Settings: the dialog lies over the app, not inside the conversation.
- tapOn: "Close|Sulje|Stäng"
- extendedWaitUntil:
    notVisible: "Share your Instagram|Jaa: Instagram|Dela: Instagram"
    timeout: 15000
- openLink: kuutti://settings
- extendedWaitUntil:
    visible: "Settings|Asetukset|Inställningar"
    timeout: 15000
# Signed in anew, she finds every row closed (#511): the row is opened again.
- runFlow:
    file: ../common/open-settings-row.yaml
    env:
      ROW: "Ways to reach you|Mistä sinut tavoittaa|Hur man når dig"
      INSIDE: "Loading your contact details…|Ladataan yhteystietojasi…|Laddar dina kontaktuppgifter…|Nobody sees them until you share one in a conversation\\..*|Kukaan ei näe niitä, ennen kuin jaat jonkin niistä keskustelussa\\..*|Ingen ser dem förrän du delar en av dem i ett samtal\\..*"
- extendedWaitUntil:
    visible: "Your phone number|Puhelinnumerosi|Ditt telefonnummer"
    timeout: 15000
- scrollUntilVisible:
    element: "Remove your Instagram username|Poista Instagram-käyttäjänimesi|Ta bort ditt användarnamn på Instagram"
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn: "Remove your Instagram username|Poista Instagram-käyttäjänimesi|Ta bort ditt användarnamn på Instagram"
# Said aloud and not drawn (#581): Remove goes and the field is empty.
- extendedWaitUntil:
    notVisible: "Remove your Instagram username|Poista Instagram-käyttäjänimesi|Ta bort ditt användarnamn på Instagram"
    timeout: 15000
- assertNotVisible: "elina\\.lukupiiri"
- assertNotVisible: "Removed\\. Wherever you shared it, it is gone now\\.|Poistettu\\. Se on poistunut myös sieltä, missä jaoit sen\\.|Borttaget\\. Det är borta även där du delade det\\."
- runFlow:
    file: ../common/close-settings-row.yaml
    env:
      ROW: "Ways to reach you|Mistä sinut tavoittaa|Hur man når dig"
      INSIDE: "Loading your contact details…|Ladataan yhteystietojasi…|Laddar dina kontaktuppgifter…|Nobody sees them until you share one in a conversation\\..*|Kukaan ei näe niitä, ennen kuin jaat jonkin niistä keskustelussa\\..*|Ingen ser dem förrän du delar en av dem i ett samtal\\..*"
