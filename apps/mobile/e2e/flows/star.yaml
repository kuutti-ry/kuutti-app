# The star (#575, ADR-064): Iida puts one on Henna's card, the first in her queue,
# which says that only she sees it, and the card stays. Home then has a way to
# the Starred list, which it had not before; the list opens Henna's card as it
# stands, and its row takes the star off. The list says nobody is there, and home
# goes back to how it was. Nothing is decided, so round.yaml, Iida's too, finds
# her queue as the stories left it. Deciding from the list, the cap and whoever
# the list leaves out are the API's and jest's tests.
appId: fi.kuutti.app
name: A star on a card brings the person to a Starred list only they see, and taking it off leaves everything as it was
---
- runFlow:
    file: ../common/sign-in.yaml
    env:
      PERSONA: Iida Mattila
# Home: no star yet, so no way to a list of them.
- scrollUntilVisible:
    element: "See people|Katso ihmisiä|Se människor"
    direction: DOWN
    centerElement: true
    timeout: 60000
- assertNotVisible: "Starred|Tähdellä merkityt|Stjärnmärkta"
- tapOn: "See people|Katso ihmisiä|Se människor"
- extendedWaitUntil:
    visible: "Liked you|Tykkäsi sinusta|Gillade dig"
    timeout: 15000
- assertVisible: "Henna, \\d+"
- waitForAnimationToEnd
# The first star says who sees it, and the card stays. On iOS a labelled button
# exposes its label alone (README), and the label names the person.
- tapOn: "(Star|Tähti|Stjärna): Henna"
- extendedWaitUntil:
    visible: "Only you can see your stars\\. Nobody is told\\.|Vain sinä näet tähtesi\\. Kenellekään ei kerrota\\.|Bara du ser dina stjärnor\\. Ingen får veta\\."
    timeout: 15000
- assertVisible: "Henna, \\d+"
# Home now has the way to the list, by its word and no count.
- tapOn: "Back to home|Takaisin alkuun|Tillbaka till start"
- scrollUntilVisible:
    element: "Starred|Tähdellä merkityt|Stjärnmärkta"
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn: "Starred|Tähdellä merkityt|Stjärnmärkta"
- extendedWaitUntil:
    visible: "Only you can see this list\\. A like or a pass takes the star off\\.|Vain sinä näet tämän listan\\. Tykkäys tai ohitus poistaa tähden\\.|Bara du ser den här listan\\. Ett gillande eller en överhoppning tar bort stjärnan\\."
    timeout: 15000
# A row opens the card as it stands: she has not answered Henna's like.
- tapOn: "Henna, \\d+"
- extendedWaitUntil:
    visible: "Liked you|Tykkäsi sinusta|Gillade dig"
    timeout: 15000
- waitForAnimationToEnd
- tapOn: "Back to Starred|Takaisin tähdellä merkittyihin|Tillbaka till stjärnmärkta"
# The row's own star takes it off, and the row goes.
- extendedWaitUntil:
    visible: "(Take the star off|Poista tähti|Ta bort stjärnan): Henna"
    timeout: 15000
- tapOn: "(Take the star off|Poista tähti|Ta bort stjärnan): Henna"
- extendedWaitUntil:
    visible: "Nobody here right now\\. A star on a card brings that person here\\.|Täällä ei ole nyt ketään\\. Kortin tähti tuo ihmisen tänne\\.|Ingen här just nu\\. En stjärna på ett kort tar personen hit\\."
    timeout: 15000
- tapOn: "Back to home|Takaisin alkuun|Tillbaka till start"
# Home as it was: something going is waited for (README).
- extendedWaitUntil:
    visible: "See people|Katso ihmisiä|Se människor"
    timeout: 15000
- extendedWaitUntil:
    notVisible: "Starred|Tähdellä merkityt|Stjärnmärkta"
    timeout: 15000
