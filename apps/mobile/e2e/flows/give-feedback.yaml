# Give feedback (#171, ADR-023): from Settings, under Account, a kind chosen
# in words, a few lines, Send, and the thanks; the moderators' side is the
# API's tests. Sanna: the row she leaves is hers alone, one run is far from
# her day's cap of five, and `pnpm demo:reset` takes the rows with her account.
appId: fi.kuutti.app
name: Feedback sent from Settings is thanked, the kind chosen in words
---
- runFlow: ../common/sign-in.yaml
- openLink: kuutti://settings
- extendedWaitUntil:
    visible: "Settings|Asetukset|Inställningar"
    timeout: 15000
# The row sits under Community (#511), below the fold on a phone, and opens in place.
- runFlow:
    file: ../common/open-settings-row.yaml
    env:
      ROW: "Give feedback|Anna palautetta|Ge respons"
      INSIDE: "What is it about\\?|Mistä on kyse\\?|Vad gäller det\\?"
# The kind is a radio button whose label ticks it in words, never a colour alone.
- tapOn: "An idea|Idea|En idé"
- assertVisible: "✓ An idea|✓ Idea|✓ En idé"
# The field's name stands over it too: the second of the two is the field.
- tapOn:
    text: "Your feedback|Palautteesi|Din respons"
    index: 1
- inputText: "A flow left this line to see that feedback lands"
# A tap on the question, which is no button, closes the keyboard (README, the keyboard).
- tapOn: "What is it about\\?|Mistä on kyse\\?|Vad gäller det\\?"
- tapOn: "Send|Lähetä|Skicka"
- extendedWaitUntil:
    visible: "Thank you|Kiitos|Tack"
    timeout: 15000
- assertVisible: "The moderators will read it\\. Nobody is mailed\\.|Moderaattorit lukevat sen\\. Kenellekään ei lähetetä sähköpostia\\.|Moderatorerna läser den\\. Ingen får e-post\\."
- runFlow:
    file: ../common/close-settings-row.yaml
    env:
      ROW: "Give feedback|Anna palautetta|Ge respons"
      INSIDE: "Thank you|Kiitos|Tack"
- assertVisible: "Settings|Asetukset|Inställningar"
