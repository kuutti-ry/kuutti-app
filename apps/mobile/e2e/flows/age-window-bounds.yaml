# The age window's bounds (AGE_MIN 18, AGE_MAX 99; #146): at 99 the window
# starts at 94 to 99, the oldest cannot go past 99 and the youngest cannot
# pass the oldest. A woman is not offered the identity label, and her home is
# an area too small to keep, so the card has nothing to choose from (ADR-061
# §2, §3). Siiri (99) is a newcomer; the flow stops at the photos, so one run
# per `pnpm demo:reset`.
appId: fi.kuutti.app
name: At 99 the age window starts at 94 to 99 and neither end can leave the bounds
---
- runFlow:
    file: ../common/sign-in.yaml
    env:
      PERSONA: Siiri Koskinen
# The welcome step when it comes (#418), then the invitation code.
- runFlow: ../common/welcome-step.yaml
# A friend's invitation code, offered once to a newcomer before the name, skipped (#107).
- extendedWaitUntil:
    visible: "Did a friend invite you\\?|Kutsuiko ystävä sinut\\?|Bjöd en vän in dig\\?"
    timeout: 15000
- tapOn: "Skip|Ohita|Hoppa över"
- extendedWaitUntil:
    visible: "What should we call you\\?|Miksi sinua kutsutaan\\?|Vad ska vi kalla dig\\?"
    timeout: 15000
- tapOn: "Name on your card|Nimi kortillasi|Namn på ditt kort"
- inputText: "Siiri"
# A tap on the question, which is no button, closes the keyboard (README, the keyboard).
- tapOn: "What should we call you\\?|Miksi sinua kutsutaan\\?|Vad ska vi kalla dig\\?"
- tapOn: "Continue|Jatka|Fortsätt"

# A woman goes straight on to whom she seeks: no label step.
- extendedWaitUntil:
    visible: "How do you describe yourself\\?|Miten kuvailet itseäsi\\?|Hur beskriver du dig själv\\?"
    timeout: 15000
- tapOn: "Woman|Nainen|Kvinna"
- tapOn: "Continue|Jatka|Fortsätt"
- extendedWaitUntil:
    visible: "Whom are you looking for\\?|Ketä etsit\\?|Vem söker du\\?"
    timeout: 15000
- assertNotVisible: "A word for it, if you like|Sana sille, jos haluat|Ett ord för det, om du vill"
- tapOn: "Men|Miehiä|Män"
- scrollUntilVisible:
    element: "I consent to Kuutti storing whom I seek|Annan Kuutille luvan tallentaa, kenen seuraa etsin|Jag samtycker till att Kuutti lagrar vem jag söker"
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn:
    text: "0|(I consent to Kuutti storing whom I seek|Annan Kuutille luvan tallentaa, kenen seuraa etsin|Jag samtycker till att Kuutti lagrar vem jag söker), off"
    rightOf: "I consent to Kuutti storing whom I seek|Annan Kuutille luvan tallentaa, kenen seuraa etsin|Jag samtycker till att Kuutti lagrar vem jag söker"
- extendedWaitUntil:
    visible:
      text: "Continue|Jatka|Fortsätt"
      enabled: true
    timeout: 15000
- scrollUntilVisible:
    element: "Continue|Jatka|Fortsätt"
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn: "Continue|Jatka|Fortsätt"
- extendedWaitUntil:
    visible: "What are you here for\\?|Mitä etsit täältä\\?|Vad är du här för\\?"
    timeout: 15000
- tapOn: "Something casual|Jotain rentoa|Något avslappnat"
- tapOn: "Continue|Jatka|Fortsätt"

# 94 to 99; the oldest is at the top already.
- extendedWaitUntil:
    visible: "What ages\\?|Minkä ikäisiä\\?|Vilka åldrar\\?"
    timeout: 15000
- assertVisible: "94"
- assertVisible: "99"
- assertVisible:
    text: "Oldest, one year older|Vanhin, vuotta vanhempi|Äldsta, ett år äldre"
    enabled: false
# The youngest climbs to the oldest and no further.
- repeat:
    times: 5
    commands:
      - tapOn: "Youngest, one year older|Nuorin, vuotta vanhempi|Yngsta, ett år äldre"
- assertVisible:
    text: "Youngest, one year older|Nuorin, vuotta vanhempi|Yngsta, ett år äldre"
    enabled: false
- assertNotVisible: "94"
- tapOn: "Youngest, one year younger|Nuorin, vuotta nuorempi|Yngsta, ett år yngre"
- assertVisible: "98"
- tapOn: "Continue|Jatka|Fortsätt"

# Koli has 271 people, under what is kept, so the card can only say the town,
# and the screen says what it will.
- extendedWaitUntil:
    visible: "Where do you live\\?|Missä asut\\?|Var bor du\\?"
    timeout: 15000
- tapOn:
    below: "Postal code|Postinumero|Postnummer"
- inputText: "83960"
- tapOn: "Where do you live\\?|Missä asut\\?|Var bor du\\?"
- tapOn: ".*Koli.*"
- extendedWaitUntil:
    visible: "Your card shows the nearest town\\.|Korttisi näyttää lähimmän kaupungin\\.|Ditt kort visar närmaste stad\\."
    timeout: 15000
- assertVisible: "On your card: Joensuu|Kortillasi: Joensuu|På ditt kort: Joensuu"
- tapOn: "Continue|Jatka|Fortsätt"
- extendedWaitUntil:
    visible: "Two photos of you|Kaksi kuvaa sinusta|Två bilder på dig"
    timeout: 15000
- assertVisible: "Step 7 of 8|Vaihe 7 / 8|Steg 7 av 8"
