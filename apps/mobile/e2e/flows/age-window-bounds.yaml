# The age window's bounds (AGE_MIN 18, AGE_MAX 99; #146): at 99 the window
# starts at 94 to 99, the oldest cannot go past 99 and the youngest cannot
# pass the oldest. A woman is not offered the identity label, and there are
# two areas to choose from (#174). Siiri (99) is a newcomer; the flow stops at
# the photos, so one run per `pnpm demo:reset`.
appId: fi.kuutti.app
name: At 99 the age window starts at 94 to 99 and neither end can leave the bounds
---
- runFlow:
    file: ../common/sign-in.yaml
    env:
      PERSONA: Siiri Koskinen
- scrollUntilVisible:
    element: "I'm in, and I accept both|Olen mukana ja hyväksyn molemmat|Jag är med och godkänner båda"
    direction: DOWN
- tapOn: "I'm in, and I accept both|Olen mukana ja hyväksyn molemmat|Jag är med och godkänner båda"
- extendedWaitUntil:
    visible: "What should we call you\\?|Miksi sinua kutsutaan\\?|Vad ska vi kalla dig\\?"
    timeout: 15000
- tapOn: "Name on your card|Nimi kortillasi|Namn på ditt kort"
- inputText: "Siiri"
- hideKeyboard
- tapOn: "Continue|Jatka|Fortsätt"

# A woman goes straight on to whom she seeks: no label step.
- extendedWaitUntil:
    visible: "How do you describe yourself\\?|Miten kuvailet itseäsi\\?|Hur beskriver du dig själv\\?"
    timeout: 15000
- tapOn: "Woman|Nainen|Kvinna"
- tapOn: "Continue|Jatka|Fortsätt"
- extendedWaitUntil:
    visible: "Whom are you looking for\\?|Ketä etsit\\?|Vem söker du\\?"
    timeout: 15000
- assertNotVisible: "A word for it, if you like|Sana sille, jos haluat|Ett ord för det, om du vill"
- tapOn: "Men|Miehiä|Män"
- scrollUntilVisible:
    element: "I consent to Kuutti storing whom I seek|Annan Kuutille luvan tallentaa, kenen seuraa etsin|Jag samtycker till att Kuutti lagrar vem jag söker"
    direction: DOWN
- tapOn:
    text: "0"
    rightOf: "I consent to Kuutti storing whom I seek|Annan Kuutille luvan tallentaa, kenen seuraa etsin|Jag samtycker till att Kuutti lagrar vem jag söker"
- extendedWaitUntil:
    visible:
      text: "Continue|Jatka|Fortsätt"
      enabled: true
    timeout: 15000
- scrollUntilVisible:
    element: "Continue|Jatka|Fortsätt"
    direction: DOWN
    centerElement: true
- tapOn: "Continue|Jatka|Fortsätt"
- extendedWaitUntil:
    visible: "What are you here for\\?|Mitä etsit täältä\\?|Vad är du här för\\?"
    timeout: 15000
- tapOn: "Something casual|Jotain rentoa|Något avslappnat"
- tapOn: "Continue|Jatka|Fortsätt"

# 94 to 99; the oldest is at the top already.
- extendedWaitUntil:
    visible: "What ages\\?|Minkä ikäisiä\\?|Vilka åldrar\\?"
    timeout: 15000
- assertVisible: "94"
- assertVisible: "99"
- assertVisible:
    text: "Oldest, one year older|Vanhin, vuotta vanhempi|Äldsta, ett år äldre"
    enabled: false
# The youngest climbs to the oldest and no further.
- repeat:
    times: 5
    commands:
      - tapOn: "Youngest, one year older|Nuorin, vuotta vanhempi|Yngsta, ett år äldre"
- assertVisible:
    text: "Youngest, one year older|Nuorin, vuotta vanhempi|Yngsta, ett år äldre"
    enabled: false
- assertNotVisible: "94"
- tapOn: "Youngest, one year younger|Nuorin, vuotta nuorempi|Yngsta, ett år yngre"
- assertVisible: "98"
- tapOn: "Continue|Jatka|Fortsätt"

# Two areas without a parent: the choice is hers.
- extendedWaitUntil:
    visible: "Where do you live\\?|Missä asut\\?|Var bor du\\?"
    timeout: 15000
- assertVisible: "Kuutti matches people inside one area\\. Choose yours\\.|Kuutti yhdistää ihmisiä yhden alueen sisällä\\. Valitse omasi\\.|Kuutti matchar människor inom ett område\\. Välj ditt\\."
- assertVisible: "Capital Area|Pääkaupunkiseutu|Huvudstadsregionen"
- tapOn: "Finland|Suomi"
- extendedWaitUntil:
    visible: "Three photos of you|Kolme kuvaa sinusta|Tre bilder på dig"
    timeout: 15000
- assertVisible: "Step 8 of 10|Vaihe 8 / 10|Steg 8 av 10"
