# A deal-breaker only on what the person answered themselves (#149, the
# disclose-to-filter rule): a filter on what one will not say about oneself
# is the one-sidedness the design document targets. Of the five fields Noa
# answered only the languages, so the other four ask her to share hers first,
# and Answer it opens that field's screen. Nothing is saved.
appId: fi.kuutti.app
name: A deal-breaker is offered only on what the person answered, and Answer it opens the field
---
- runFlow:
    file: ../common/sign-in.yaml
    env:
      PERSONA: Noa Salmi
- openLink: kuutti://profile/deal-breakers
- extendedWaitUntil:
    visible: "Deal-breakers|Ehdottomat rajat|Absoluta gränser"
    timeout: 15000
- assertVisible: "Deal-breaker: Languages|Ehdoton raja: Kielet|Absolut gräns: Språk"
- assertNotVisible: "Deal-breaker: Smoking|Ehdoton raja: Tupakointi|Absolut gräns: Rökning"
- assertNotVisible: "Deal-breaker: Kids|Ehdoton raja: Lapset|Absolut gräns: Barn"
- assertVisible: "To filter on this, share yours first\\.|Suodattaaksesi tällä kerro ensin omasi\\.|För att filtrera på det här, dela ditt eget först\\."
# The second Answer it is the kids', which has a screen of its own among the later fields.
- tapOn:
    text: "Answer it|Vastaa|Svara"
    index: 1
- extendedWaitUntil:
    visible: "While you wait|Odotellessasi|Medan du väntar"
    timeout: 15000
- assertVisible: "Kids|Lapset|Barn"
- assertVisible: "No kids|Ei lapsia|Inga barn"
