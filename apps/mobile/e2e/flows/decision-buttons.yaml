# The Decision buttons setting (#82): a row in Appearance and language that
# opens in place (#511) and chooses the hand the round's Like and Pass are
# placed for, one-handed mode and the marks they carry (#520), each kept on
# the phone. Where the buttons then sit and what they carry on the round is
# the round screen's jest tests: Sanna's matching has not opened, and a mark
# is silent. This flow holds the setting on a device: chosen, and kept when
# the row is opened again. Sanna; the flow leaves the setting as it found it,
# right hand, two hands and Kuutti's style, and the row closed.
appId: fi.kuutti.app
name: The decision buttons setting places Like and Pass for either hand, and one-handed
---
- runFlow: ../common/sign-in.yaml
- openLink: kuutti://settings
- extendedWaitUntil:
    visible: "Settings|Asetukset|Inställningar"
    timeout: 15000
# Settings can come back where the sign-in left it, scrolled down to This
# device, and the row is in the first section: back to the top first.
- scrollUntilVisible:
    element: "Appearance and language|Ulkoasu ja kieli|Utseende och språk"
    direction: UP
    timeout: 30000
# The row says the hand, which Maestro reads after its title.
- runFlow:
    file: ../common/open-settings-row.yaml
    env:
      ROW: "(Decision buttons|Valintapainikkeet|Valknappar)(, .*)?"
      INSIDE: "One-handed|Yhdellä kädellä|Med en hand"
- assertVisible: ".*✓.*(Right hand|Oikea käsi|Höger hand).*"
- assertVisible:
    text: "0|(One-handed|Yhdellä kädellä|Med en hand), off"
    rightOf: "One-handed|Yhdellä kädellä|Med en hand"
- tapOn: "Left hand|Vasen käsi|Vänster hand"
- extendedWaitUntil:
    visible: ".*✓.*(Left hand|Vasen käsi|Vänster hand).*"
    timeout: 15000
- tapOn: "One-handed|Yhdellä kädellä|Med en hand"
- extendedWaitUntil:
    visible:
      text: "1|(One-handed|Yhdellä kädellä|Med en hand), on"
      rightOf: "One-handed|Yhdellä kädellä|Med en hand"
    timeout: 15000
# The style may lie below the fold. The shapes' button shows ✕ and ○ and is
# named in words, which is what Maestro reads, the screen reader's name.
- scrollUntilVisible:
    element: ".*✓.*Kuutti.*"
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn: "Cross and circle|Risti ja ympyrä|Kryss och cirkel"
- extendedWaitUntil:
    visible: ".*✓.*(Cross and circle|Risti ja ympyrä|Kryss och cirkel).*"
    timeout: 15000
- runFlow:
    file: ../common/close-settings-row.yaml
    env:
      ROW: "(Decision buttons|Valintapainikkeet|Valknappar)(, .*)?"
      INSIDE: "One-handed|Yhdellä kädellä|Med en hand"

# Kept when the row is opened again; then back as it began.
- runFlow:
    file: ../common/open-settings-row.yaml
    env:
      ROW: "(Decision buttons|Valintapainikkeet|Valknappar)(, .*)?"
      INSIDE: "One-handed|Yhdellä kädellä|Med en hand"
- assertVisible: ".*✓.*(Left hand|Vasen käsi|Vänster hand).*"
- assertVisible:
    text: "1|(One-handed|Yhdellä kädellä|Med en hand), on"
    rightOf: "One-handed|Yhdellä kädellä|Med en hand"
- tapOn: "Right hand|Oikea käsi|Höger hand"
- tapOn: "One-handed|Yhdellä kädellä|Med en hand"
- extendedWaitUntil:
    visible:
      text: "0|(One-handed|Yhdellä kädellä|Med en hand), off"
      rightOf: "One-handed|Yhdellä kädellä|Med en hand"
    timeout: 15000
- assertVisible: ".*✓.*(Right hand|Oikea käsi|Höger hand).*"
- scrollUntilVisible:
    element: ".*✓.*(Cross and circle|Risti ja ympyrä|Kryss och cirkel).*"
    direction: DOWN
    centerElement: true
    timeout: 30000
- tapOn: "Kuutti"
- extendedWaitUntil:
    visible: ".*✓.*Kuutti.*"
    timeout: 15000
- runFlow:
    file: ../common/close-settings-row.yaml
    env:
      ROW: "(Decision buttons|Valintapainikkeet|Valknappar)(, .*)?"
      INSIDE: "One-handed|Yhdellä kädellä|Med en hand"
