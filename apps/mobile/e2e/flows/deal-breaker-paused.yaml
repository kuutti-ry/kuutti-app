# A deal-breaker waits while the person's own answer on its field is missing
# (#149, the disclose-to-filter rule, features/matching/preferences.feature):
# taking one's smoking answer back pauses the smoking deal-breaker, said in
# words, with nothing deleted and what stands drawn read-only (#551); answering
# again lifts the pause. Sanna smokes never and has no deal-breaker; the flow
# ends as it began.
appId: fi.kuutti.app
name: Taking one's own answer back pauses the deal-breaker on it, and answering again lifts the pause
---
- runFlow: ../common/sign-in.yaml
- openLink: kuutti://profile/deal-breakers/smoking
- extendedWaitUntil:
    visible:
      text: "Everyone|Kaikki|Alla"
      selected: true
    timeout: 15000
- waitForAnimationToEnd
- tapOn: "Never|Ei koskaan|Aldrig"
- assertVisible:
    text: "Never|Ei koskaan|Aldrig"
    selected: true
- tapOn: "Back|Takaisin|Tillbaka"
- extendedWaitUntil:
    notVisible: "Fine with me|Sopii minulle|Okej för mig"
    timeout: 15000

# Her own answer taken back: the first person's words, on her own question.
- openLink: kuutti://profile/later/smoking
- extendedWaitUntil:
    visible:
      text: "Never|En koskaan|Aldrig"
      selected: true
    timeout: 15000
- waitForAnimationToEnd
- tapOn: "Never|En koskaan|Aldrig"
- scrollUntilVisible:
    element: "Save and continue|Tallenna ja jatka|Spara och fortsätt"
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn: "Save and continue|Tallenna ja jatka|Spara och fortsätt"
- extendedWaitUntil:
    notVisible: "Smoking|Tupakointi|Rökning"
    timeout: 15000

# Paused, in words, on its row and on its screen; nothing deleted.
- openLink: kuutti://profile/deal-breakers
- extendedWaitUntil:
    visible: "((Smoking|Tupakointi|Rökning), )?(Paused until you answer it yourself\\.|Tauolla, kunnes vastaat siihen itse\\.|Pausad tills du själv svarar på det\\.)"
    timeout: 15000
- waitForAnimationToEnd
- tapOn: "(Smoking|Tupakointi|Rökning)(, .*)?"
- extendedWaitUntil:
    visible: "Paused until you answer it yourself\\.|Tauolla, kunnes vastaat siihen itse\\.|Pausad tills du själv svarar på det\\."
    timeout: 15000
- waitForAnimationToEnd
- assertVisible:
    text: "Never|Ei koskaan|Aldrig"
    selected: true
    enabled: false
# Only what stands: the other answers come back with her own.
- assertNotVisible: "Regularly|Säännöllisesti|Regelbundet"

# Answered again: the pause lifts, back where Answer it was pressed (#542), not
# on through the later questions.
- tapOn: "Answer it|Vastaa|Svara"
- extendedWaitUntil:
    visible: "When you have a moment|Kun sinulla on hetki|När du har en stund"
    timeout: 15000
- waitForAnimationToEnd
- tapOn: "Never|En koskaan|Aldrig"
- scrollUntilVisible:
    element: "Save and continue|Tallenna ja jatka|Spara och fortsätt"
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn: "Save and continue|Tallenna ja jatka|Spara och fortsätt"
- extendedWaitUntil:
    visible: "It works both ways.*|Tämä toimii molempiin suuntiin.*|Det här gäller åt båda håll.*"
    timeout: 15000
- waitForAnimationToEnd
- assertNotVisible: "Paused until you answer it yourself\\.|Tauolla, kunnes vastaat siihen itse\\.|Pausad tills du själv svarar på det\\."
- assertVisible:
    text: "Never|Ei koskaan|Aldrig"
    selected: true
    enabled: true
- assertVisible: "Regularly|Säännöllisesti|Regelbundet"

# Back as it began: no deal-breaker.
- tapOn: "Everyone|Kaikki|Alla"
- tapOn: "Back|Takaisin|Tillbaka"
- extendedWaitUntil:
    visible: "((Smoking|Tupakointi|Rökning), )?(Everyone|Kaikki|Alla)"
    timeout: 15000
