# Invitations (#107, ADR-044): a row under Community in Settings that says,
# under itself, what an invitation earns, makes one and shows its code this once
# (Kuutti keeps only its hash), hands the invitation's message to the
# system's share sheet, and withdraws the open invitation after asking.
# Sanna's profile is complete, so she may invite; the invitation she makes
# is withdrawn before the end, so the flow leaves her as it found her. A run
# that stops half-way
# leaves an invitation open, and after five such runs (`invitations_open`)
# Create an invitation is refused: `pnpm demo:reset` first. The sheet is the
# system's, in the phone's language, so the flow asserts only that the app's
# own failure line never shows, and closes what opened (data-export.yaml).
# Using a code and the night's count are the API's tests.
appId: fi.kuutti.app
name: An invitation made in Settings shows its code once, is shared, and is withdrawn after asking
---
- runFlow: ../common/sign-in.yaml
- openLink: kuutti://settings
- extendedWaitUntil:
    visible: "Settings|Asetukset|Inställningar"
    timeout: 15000
# The row sits under Community (#511), below the fold on a phone, and opens in
# place. With none waiting its own value says Create an invitation too (#581),
# so neither the row's being open nor the button is told by those words: the
# first by what the panel says first, the second by that line over it.
- runFlow:
    file: ../common/open-settings-row.yaml
    env:
      ROW: "(Invitations|Kutsut|Inbjudningar)(, .*)?"
      INSIDE: "When a friend you invite finishes their profile.*|Kun kutsumasi ystävä saa profiilinsa valmiiksi.*|När en vän du bjuder in gör klart sin profil.*|Loading your invitations…|Ladataan kutsujasi…|Laddar dina inbjudningar…"
# What an invitation earns, from matching_config invitation_reward: a fish each.
- extendedWaitUntil:
    visible: "When a friend you invite finishes their profile, you get a fish and your friend gets a fish\\.|Kun kutsumasi ystävä saa profiilinsa valmiiksi, saat kalan ja ystäväsi saa kalan\\.|När en vän du bjuder in gör klart sin profil får du en fisk och din vän får en fisk\\."
    timeout: 15000
- tapOn:
    text: "Create an invitation|Tee kutsu|Skapa en inbjudan"
    below: "When a friend you invite finishes their profile, you get a fish and your friend gets a fish\\.|Kun kutsumasi ystävä saa profiilinsa valmiiksi, saat kalan ja ystäväsi saa kalan\\.|När en vän du bjuder in gör klart sin profil får du en fisk och din vän får en fisk\\."
# Ready: said aloud and not drawn (#581). The code's card is what the eye has: the
# code in its two groups; where Maestro reads the label, as a screen reader
# hears it, one character at a time.
- extendedWaitUntil:
    visible: "[0-9A-HJKMNP-TV-Z]{5}-[0-9A-HJKMNP-TV-Z]{5}|(Invitation code|Kutsukoodi|Inbjudningskod): ([0-9A-HJKMNP-TV-Z] ){4}[0-9A-HJKMNP-TV-Z], ([0-9A-HJKMNP-TV-Z] ){4}[0-9A-HJKMNP-TV-Z]"
    timeout: 15000
- assertVisible: "Kuutti shows this code only now\\. Share it with one friend\\.|Kuutti näyttää tämän koodin vain nyt\\. Jaa se yhdelle ystävälle\\.|Kuutti visar den här koden bara nu\\. Dela den med en vän\\."
- assertNotVisible: "Your invitation is ready\\. Its code is below\\.|Kutsusi on valmis\\. Sen koodi on alla\\.|Din inbjudan är klar\\. Koden finns nedan\\."

# The share sheet covers the app, and is closed again.
- scrollUntilVisible:
    element: "Share the code|Jaa koodi|Dela koden"
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn: "Share the code|Jaa koodi|Dela koden"
- extendedWaitUntil:
    notVisible: "Share the code|Jaa koodi|Dela koden"
    timeout: 20000
# iOS's sheet is swiped down by its top; Android's chooser is closed by the back key.
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: "50%, 45%"
          end: "50%, 98%"
- runFlow:
    when:
      platform: Android
    commands:
      - back
# The swipe also scrolls the page under the sheet, since Settings is one long
# list (#511), so on iOS the button may have gone down the page.
- scrollUntilVisible:
    element: "Share the code|Jaa koodi|Dela koden"
    direction: DOWN
    centerElement: true
    timeout: 60000
- assertNotVisible: "The share did not open\\..*|Jakaminen ei avautunut\\..*|Delningen öppnades inte\\..*"

# The newest open invitation, first under its heading, is the one just made:
# its button reads Withdraw, or to a screen reader, which invitation it withdraws.
- scrollUntilVisible:
    element: "Withdraw|Peru|Dra tillbaka|(Withdraw the invitation made|Peru kutsu, joka on tehty|Dra tillbaka inbjudan skapad) .*"
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn: "Withdraw|Peru|Dra tillbaka|(Withdraw the invitation made|Peru kutsu, joka on tehty|Dra tillbaka inbjudan skapad) .*"
- extendedWaitUntil:
    visible: "Withdraw this invitation\\?|Perutaanko tämä kutsu\\?|Dra tillbaka den här inbjudan\\?"
    timeout: 15000
- assertVisible: "Its code stops working at once\\.|Sen koodi lakkaa toimimasta heti\\.|Koden slutar fungera direkt\\."
- tapOn: "Withdraw the invitation|Peru kutsu|Dra tillbaka inbjudan"
# Withdrawn: said aloud and not drawn (#581). To the eye the code goes with its
# invitation once the API has answered: the dialog's going is waited for first,
# so that the page is what is read, and then the code's.
- extendedWaitUntil:
    notVisible: "Withdraw this invitation\\?|Perutaanko tämä kutsu\\?|Dra tillbaka den här inbjudan\\?"
    timeout: 15000
- extendedWaitUntil:
    notVisible: "[0-9A-HJKMNP-TV-Z]{5}-[0-9A-HJKMNP-TV-Z]{5}|(Invitation code|Kutsukoodi|Inbjudningskod): .*"
    timeout: 15000
- assertNotVisible: "The invitation was withdrawn\\. Its code no longer works\\.|Kutsu peruttiin\\. Sen koodi ei enää toimi\\.|Inbjudan drogs tillbaka\\. Koden fungerar inte längre\\."
- assertNotVisible: "The invitation could not be withdrawn\\..*|Kutsua ei voitu perua\\..*|Inbjudan kunde inte dras tillbaka\\..*"
