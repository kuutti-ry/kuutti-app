# Download my data (#52, ADR-007, #237): the zip with everything Kuutti holds
# about the person is handed over, and nothing goes wrong on the way. On iOS
# that is the share sheet, on Android the system's folder picker; both are
# the system's, in the phone's language, so the flow asserts only that the
# app's own failure line never shows, and closes what opened. The file's
# contents are held by erasure.test.ts. Sanna; read only: the day's three
# copies are not spent by one run, and the cap is counted per account.
appId: fi.kuutti.app
name: Download my data hands the person's file over
---
- runFlow: ../common/sign-in.yaml
- openLink: kuutti://settings
# The export is on the account screen, behind its row (#287).
# The row is the last of the list, below the fold on a phone: scrolled to, then tapped.
- scrollUntilVisible:
    element: "Your account|Tilisi|Ditt konto"
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn: "Your account|Tilisi|Ditt konto"
- extendedWaitUntil:
    visible: "Download my data|Lataa tietoni|Ladda ner mina uppgifter"
    timeout: 15000
- assertVisible: "A file with everything Kuutti holds about you, and nothing about anyone else\\.|Tiedosto, jossa on kaikki, mitä Kuutti tietää sinusta, eikä mitään kenestäkään muusta\\.|En fil med allt Kuutti har om dig, och inget om någon annan\\."
- tapOn: "Download my data|Lataa tietoni|Ladda ner mina uppgifter"
# The sheet, or the picker, covers the app.
- extendedWaitUntil:
    notVisible: "Download my data|Lataa tietoni|Ladda ner mina uppgifter"
    timeout: 20000
# iOS's sheet is swiped down by its top; Android's folder picker is closed
# by the back key, which the app takes as a cancelled download.
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: "50%, 45%"
          end: "50%, 98%"
- runFlow:
    when:
      platform: Android
    commands:
      - back
# The account screen comes back, the button still on it.
- extendedWaitUntil:
    visible: "Download my data|Lataa tietoni|Ladda ner mina uppgifter"
    timeout: 15000
- assertNotVisible: "The download did not work\\. Try again\\.|Lataus ei onnistunut\\. Yritä uudelleen\\.|Nedladdningen misslyckades\\. Försök igen\\."
- assertNotVisible: "That is enough copies for today\\..*|Tältä päivältä kopioita on jo tarpeeksi\\..*|Det räcker med kopior för i dag\\..*"
