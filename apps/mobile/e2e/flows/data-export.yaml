# Download my data (#52, ADR-007, #237): the zip with everything Kuutti holds
# about the person is handed over, and nothing goes wrong on the way. On iOS
# that is the share sheet, on Android the system's folder picker; both are
# the system's, in the phone's language, so the flow asserts only that the
# app's own failure line never shows, and closes what opened. The file's
# contents are held by erasure.test.ts. Sanna; read only: on Android the
# folder is asked for before the API (#465), so a run spends none of the
# day's three copies; iOS's sheet needs the file, so a run there spends one,
# and the cap is counted per account.
appId: fi.kuutti.app
name: Download my data hands the person's file over
---
- runFlow: ../common/sign-in.yaml
- openLink: kuutti://settings
# The export opens under its own row, A copy of your data, under Privacy and
# security (#511), below the fold on a phone.
- runFlow:
    file: ../common/open-settings-row.yaml
    env:
      ROW: "(A copy of your data|Kopio tiedoistasi|En kopia av dina uppgifter)(, .*)?"
      INSIDE: "Download my data|Lataa tietoni|Ladda ner mina uppgifter"
- tapOn: "Download my data|Lataa tietoni|Ladda ner mina uppgifter"
# The sheet, or the picker, covers the app.
- extendedWaitUntil:
    notVisible: "Download my data|Lataa tietoni|Ladda ner mina uppgifter"
    timeout: 20000
# iOS's sheet is swiped down by its top, which on iOS 27 lies under the
# screen's middle: a swipe that starts above it closes the sheet and goes on to
# scroll the list behind. Android's folder picker is closed by the back key,
# which the app takes as a cancelled download, before anything is fetched.
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: "50%, 63%"
          end: "50%, 98%"
- runFlow:
    when:
      platform: Android
    commands:
      - back
# Settings comes back, the row still open with its button, and nothing says
# a file was saved.
- extendedWaitUntil:
    visible: "Download my data|Lataa tietoni|Ladda ner mina uppgifter"
    timeout: 15000
- assertNotVisible: "That did not go through\\. Try again\\.|Se ei onnistunut\\. Yritä uudelleen\\.|Det gick inte\\. Försök igen\\."
- assertNotVisible: "That is enough for today\\..*|Tältä päivältä riittää\\..*|Det räcker för i dag\\..*"
- assertNotVisible: "Done\\.|Valmis\\.|Klart\\."
