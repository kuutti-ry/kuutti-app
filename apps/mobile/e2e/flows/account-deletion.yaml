# Deleting the account (#51, TD-7, ADR-007): Settings asks first, keeping the
# account closes the question with nothing deleted, and "Delete everything"
# erases the account at once and signs the person out. The same person's next
# bank login is refused for the cooldown, with the date. Aino is a newcomer:
# her first login registers her, so the flow needs nobody else's state, and
# `pnpm demo:reset` forgets her identity, the cooldown with it.
appId: fi.kuutti.app
name: Deleting the account asks first, signs the person out, and the next login is refused until the cooldown ends
---
- runFlow:
    file: ../common/sign-in.yaml
    env:
      PERSONA: Aino Virtanen
# Settings is reachable before onboarding is done.
- openLink: kuutti://settings
- scrollUntilVisible:
    element: "Delete my account|Poista tilini|Ta bort mitt konto"
    direction: DOWN
    centerElement: true
- assertVisible: "Your account|Tilisi|Ditt konto"

# Asked first; keeping the account deletes nothing.
- tapOn: "Delete my account|Poista tilini|Ta bort mitt konto"
- assertVisible: "Delete your account\\?|Poistetaanko tilisi\\?|Ta bort ditt konto\\?"
- assertVisible: ".*30.*"
- tapOn: "Keep my account|Säilytä tilini|Behåll mitt konto"
- assertNotVisible: "Delete your account\\?|Poistetaanko tilisi\\?|Ta bort ditt konto\\?"
- assertVisible: "Your account|Tilisi|Ditt konto"

# Deleted: signed out at once.
- tapOn: "Delete my account|Poista tilini|Ta bort mitt konto"
- tapOn: "Delete everything|Poista kaikki|Ta bort allt"
- openLink: kuutti://
- extendedWaitUntil:
    visible: "Sign in with your bank|Kirjaudu pankkitunnuksilla|Logga in med din bank"
    timeout: 30000

# The same person again: refused until the cooldown ends.
- runFlow:
    file: ../common/bank-login.yaml
    env:
      PERSONA: Aino Virtanen
- extendedWaitUntil:
    visible: "You deleted your account recently.*|Poistit tilisi äskettäin.*|Du raderade ditt konto nyligen.*"
    timeout: 30000
