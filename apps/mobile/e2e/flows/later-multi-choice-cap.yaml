# Several fields and lines of work, as many as apply (#178, ADR-019 §1; no
# cap since #239): a fourth tap is taken like the first, and Ask me later
# keeps what was stored. A list of fourteen or more has a search box (#148, #239), which
# filters the chips as one types; the twelve fields fit a screen and have none. Sanna's field and work are both arts and culture;
# nothing is saved.
appId: fi.kuutti.app
name: Field and work take as many choices as apply, Ask me later keeps what was stored, and long lists can be searched
---
- runFlow: ../common/sign-in.yaml
- openLink: kuutti://profile/later/field
- extendedWaitUntil:
    visible: "Field|Ala|Bransch"
    timeout: 15000
- waitForAnimationToEnd
- assertNotVisible: "Search|Hae|Sök"
- assertVisible: "Hide me from people in my field|Piilota minut oman alani ihmisiltä|Dölj mig för folk inom mitt område"
- assertVisible:
    text: "Arts and culture|Taide ja kulttuuri|Konst och kultur"
    selected: true
- tapOn: "Tech|Teknologia|Teknik"
- tapOn: "Science|Tiede|Vetenskap"
- assertVisible:
    text: "Tech|Teknologia|Teknik"
    selected: true
- assertVisible:
    text: "Science|Tiede|Vetenskap"
    selected: true
- tapOn: "Health care|Terveysala|Vård"
- assertVisible:
    text: "Health care|Terveysala|Vård"
    selected: true
# Ask me later writes nothing: opened again, only the stored answer.
- scrollUntilVisible:
    element: "Ask me later|Kysy myöhemmin|Fråga mig senare"
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn: "Ask me later|Kysy myöhemmin|Fråga mig senare"
- openLink: kuutti://profile/later/field
- extendedWaitUntil:
    visible: "Field|Ala|Bransch"
    timeout: 15000
- waitForAnimationToEnd
- assertVisible:
    text: "Tech|Teknologia|Teknik"
    selected: false

- openLink: kuutti://profile/later/occupation
- extendedWaitUntil:
    visible: "Work|Työ|Arbete"
    timeout: 15000
- waitForAnimationToEnd
- assertVisible:
    text: "Arts and culture|Taide ja kulttuuri|Konst och kultur"
    selected: true
- tapOn: "Student|Opiskelija|Studerande"
- tapOn: "Retired|Eläkkeellä|Pensionerad"
- tapOn: "Entrepreneur|Yrittäjä|Företagare"
- assertVisible:
    text: "Entrepreneur|Yrittäjä|Företagare"
    selected: true
- scrollUntilVisible:
    element: "Ask me later|Kysy myöhemmin|Fråga mig senare"
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn: "Ask me later|Kysy myöhemmin|Fråga mig senare"

# The languages are named in the app's language (#238); Tagalog is the one
# name the three catalogues share, so one search finds it in any of them.
- openLink: kuutti://profile/later/languages
- extendedWaitUntil:
    visible: "Languages|Kielet|Språk"
    timeout: 15000
- waitForAnimationToEnd
- tapOn: "Search|Hae|Sök"
- inputText: "taga"
- assertVisible: "Tagalog"
# The chips follow each keystroke; the last one takes a moment.
- extendedWaitUntil:
    notVisible: "Swedish|Ruotsi|Svenska"
    timeout: 10000
# Closed with a tap on the field's label, which is no button.
- tapOn: "Languages|Kielet|Språk"
