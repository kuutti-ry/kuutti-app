# The distance as a deal-breaker (#514, ADR-061 §7, features/matching/filters.feature):
# four buttons, no switch, a band and the nearer ones with it, or Everyone,
# which is having none and is heard with the row's name, height's row having
# one too. It reads the home everybody has, so it asks nobody to share theirs
# first and says nothing of those who did not answer. Far is on a card and not
# here: accepting it is no filter. Sanna has no deal-breaker; the flow ends as it began.
appId: fi.kuutti.app
name: Distance takes a band of its four buttons, kept when saved, and Everyone takes it off
---
- runFlow: ../common/sign-in.yaml
- openLink: kuutti://profile/deal-breakers
- extendedWaitUntil:
    visible: "Deal-breakers|Ehdottomat rajat|Absoluta gränser"
    timeout: 15000
- scrollUntilVisible:
    element: "Around|Samoilla seuduilla|I trakten"
    direction: DOWN
    centerElement: true
    timeout: 60000
- assertVisible: "Distance|Etäisyys|Avstånd"
- assertVisible:
    text: "(Everyone|Kaikki|Alla), (Distance|Etäisyys|Avstånd)"
    selected: true
- assertVisible:
    text: "Nearby|Lähellä|I närheten"
    selected: false
- assertNotVisible: "(Deal-breaker: Distance|Ehdoton raja: Etäisyys|Absolut gräns: Avstånd)(, .*)?"
- assertNotVisible: "Far|Kauempana|Längre bort"
- assertNotVisible: "Also people who did not answer|Myös ne, jotka eivät vastanneet|Även de som inte svarade"

# One button at a time: the second replaces the first, and nothing asks after
# those who did not answer, since nobody lacks a home.
- tapOn: "Close|Melko lähellä|Ganska nära"
- assertVisible:
    text: "Close|Melko lähellä|Ganska nära"
    selected: true
- tapOn: "Around|Samoilla seuduilla|I trakten"
- assertVisible:
    text: "Around|Samoilla seuduilla|I trakten"
    selected: true
- assertVisible:
    text: "Close|Melko lähellä|Ganska nära"
    selected: false
- assertVisible:
    text: "(Everyone|Kaikki|Alla), (Distance|Etäisyys|Avstånd)"
    selected: false
- assertNotVisible: "Also people who did not answer|Myös ne, jotka eivät vastanneet|Även de som inte svarade"

# Saved, it is there when the screen opens again.
- scrollUntilVisible:
    element: "Save the deal-breakers|Tallenna rajat|Spara gränserna"
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn: "Save the deal-breakers|Tallenna rajat|Spara gränserna"
- extendedWaitUntil:
    visible: "Saved\\.|Tallennettu\\.|Sparat\\."
    timeout: 15000
- openLink: kuutti://profile
- extendedWaitUntil:
    visible: "Your profile|Profiilisi|Din profil"
    timeout: 15000
- openLink: kuutti://profile/deal-breakers
- extendedWaitUntil:
    visible: "Deal-breakers|Ehdottomat rajat|Absoluta gränser"
    timeout: 15000
- scrollUntilVisible:
    element: "Around|Samoilla seuduilla|I trakten"
    direction: DOWN
    centerElement: true
    timeout: 60000
- assertVisible:
    text: "Around|Samoilla seuduilla|I trakten"
    selected: true

# Everyone takes it off, and saved, she is back as she began.
- tapOn: "(Everyone|Kaikki|Alla), (Distance|Etäisyys|Avstånd)"
- assertVisible:
    text: "(Everyone|Kaikki|Alla), (Distance|Etäisyys|Avstånd)"
    selected: true
- scrollUntilVisible:
    element: "Save the deal-breakers|Tallenna rajat|Spara gränserna"
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn: "Save the deal-breakers|Tallenna rajat|Spara gränserna"
- extendedWaitUntil:
    visible: "Saved\\.|Tallennettu\\.|Sparat\\."
    timeout: 15000
