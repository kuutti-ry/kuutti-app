# The later fields (#148, ADR-019): "Fill in the rest" on the profile list
# (#239) opens the first field not yet answered and walks the unanswered ones in the
# sheet's order, one question per screen, each optional; "Ask me later" moves
# on and writes nothing, so the count of answered fields stays. After the
# last field comes the way to stay in touch (the e-mail) and the deal-breakers. Sanna
# has answered ten of the sixteen fields, but her smoking screen is open
# while other nicotine is unanswered (#239), so nine screens are done; read
# only.
appId: fi.kuutti.app
name: Fill in the rest walks the unanswered fields in order, and Ask me later writes nothing
---
- runFlow: ../common/sign-in.yaml
- openLink: kuutti://profile
- extendedWaitUntil:
    visible: "(The basics|Perustiedot|Grunderna)(, .*)?"
    timeout: 15000
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "Fill in the rest while you wait|Täydennä loput odotellessasi|Fyll i resten medan du väntar"
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn: "Fill in the rest while you wait|Täydennä loput odotellessasi|Fyll i resten medan du väntar"
- extendedWaitUntil:
    visible: "While you wait|Odotellessasi|Medan du väntar"
    timeout: 15000
- assertVisible: "9 of 16 answered|9 / 16 vastattu|9 av 16 besvarade"
- assertVisible: "One question at a time, each optional\\..*|Yksi kysymys kerrallaan, jokainen vapaaehtoinen\\..*|En fråga i taget, var och en frivillig\\..*"
# Her smoking is answered; other nicotine, asked with it, is not.
- assertVisible: "Other nicotine|Muu nikotiini|Annat nikotin"
- scrollUntilVisible:
    element: "Ask me later|Kysy myöhemmin|Fråga mig senare"
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn: "Ask me later|Kysy myöhemmin|Fråga mig senare"
- extendedWaitUntil:
    visible: "Drugs, your attitude|Suhtautuminen huumeisiin|Inställning till droger"
    timeout: 15000
- tapOn: "Ask me later|Kysy myöhemmin|Fråga mig senare"
- extendedWaitUntil:
    visible: "Exercise|Liikunta|Motion"
    timeout: 15000
- tapOn: "Ask me later|Kysy myöhemmin|Fråga mig senare"
- extendedWaitUntil:
    visible: "Pets|Lemmikit|Husdjur"
    timeout: 15000
- tapOn: "Ask me later|Kysy myöhemmin|Fråga mig senare"
- extendedWaitUntil:
    visible: "Parties you could vote for|Puolueet, joita voisit äänestää|Partier du kunde rösta på"
    timeout: 15000
- scrollUntilVisible:
    element: "Ask me later|Kysy myöhemmin|Fråga mig senare"
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn: "Ask me later|Kysy myöhemmin|Fråga mig senare"
- extendedWaitUntil:
    visible: "Religion|Uskonto"
    timeout: 15000
- tapOn: "Ask me later|Kysy myöhemmin|Fråga mig senare"
- extendedWaitUntil:
    visible: "Star sign|Horoskooppimerkki|Stjärntecken"
    timeout: 15000
- assertVisible: "Corgi"
- tapOn: "Ask me later|Kysy myöhemmin|Fråga mig senare"

# After the last: the way to stay in touch, then home. Nothing was written.
- extendedWaitUntil:
    visible: "That is everything\\. Thank you\\.|Siinä kaikki\\. Kiitos\\.|Det var allt\\. Tack\\."
    timeout: 15000
- assertVisible: "A way to stay in touch|Tapa pitää yhteyttä|Ett sätt att hålla kontakten"
- assertVisible: "Your deal-breakers|Ehdottomat rajasi|Dina absoluta gränser"
- openLink: kuutti://profile/later/drugsAttitude
- extendedWaitUntil:
    visible: "9 of 16 answered|9 / 16 vastattu|9 av 16 besvarade"
    timeout: 15000
