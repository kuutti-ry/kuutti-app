# The later fields (#148, ADR-019): "Fill in the rest" on the profile list
# (#239) opens the first field not yet answered and walks the unanswered ones in the
# sheet's order, one question per screen, each optional; "Ask me later" moves
# on and writes nothing, so the count of answered fields stays. After the
# last field comes the way to stay in touch (the e-mail), which no longer leads
# to the deal-breakers: they are What you seek's (#581). Sanna
# has answered ten of the sixteen fields, but her smoking screen is open
# while other nicotine is unanswered (#239), so nine screens are done; read
# only.
appId: fi.kuutti.app
name: Fill in the rest walks the unanswered fields in order, and Ask me later writes nothing
---
- runFlow: ../common/sign-in.yaml
- openLink: kuutti://profile
- extendedWaitUntil:
    visible: "(The basics|Perustiedot|Grunderna)(, .*)?"
    timeout: 15000
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "Fill in the rest when you have a moment|Täydennä loput, kun sinulla on hetki|Fyll i resten när du har en stund"
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn: "Fill in the rest when you have a moment|Täydennä loput, kun sinulla on hetki|Fyll i resten när du har en stund"
- extendedWaitUntil:
    visible: "When you have a moment|Kun sinulla on hetki|När du har en stund"
    timeout: 15000
- assertVisible: "9 of 16 answered|9 / 16 vastattu|9 av 16 besvarade"
# The first question says the one thing the screen cannot: the card (#581).
- assertVisible: "Every answer is on your card only when you give it\\.|Jokainen vastaus näkyy kortillasi vain, jos annat sen\\.|Varje svar syns på ditt kort bara om du ger det\\."
# Her smoking is answered; other nicotine, asked with it, is not, under smoking's whole-width rows.
- scrollUntilVisible:
    element: "Other nicotine|Muu nikotiini|Annat nikotin"
    direction: DOWN
    centerElement: true
    timeout: 60000
- scrollUntilVisible:
    element: "Ask me later|Kysy myöhemmin|Fråga mig senare"
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn: "Ask me later|Kysy myöhemmin|Fråga mig senare"
- extendedWaitUntil:
    visible: "Drugs, your attitude|Suhtautuminen huumeisiin|Inställning till droger"
    timeout: 15000
- tapOn: "Ask me later|Kysy myöhemmin|Fråga mig senare"
- extendedWaitUntil:
    visible: "Exercise|Liikunta|Motion"
    timeout: 15000
- tapOn: "Ask me later|Kysy myöhemmin|Fråga mig senare"
- extendedWaitUntil:
    visible: "Pets|Lemmikit|Husdjur"
    timeout: 15000
- tapOn: "Ask me later|Kysy myöhemmin|Fråga mig senare"
- extendedWaitUntil:
    visible: "Parties you could vote for|Puolueet, joita voisit äänestää|Partier du kunde rösta på"
    timeout: 15000
- scrollUntilVisible:
    element: "Ask me later|Kysy myöhemmin|Fråga mig senare"
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn: "Ask me later|Kysy myöhemmin|Fråga mig senare"
- extendedWaitUntil:
    visible: "Religion|Uskonto"
    timeout: 15000
- tapOn: "Ask me later|Kysy myöhemmin|Fråga mig senare"
- extendedWaitUntil:
    visible: "Star sign|Horoskooppimerkki|Stjärntecken"
    timeout: 15000
- assertVisible: "Corgi"
- tapOn: "Ask me later|Kysy myöhemmin|Fråga mig senare"

# After the last: the way to stay in touch, then home. Nothing was written.
- extendedWaitUntil:
    visible: "A way to stay in touch|Tapa pitää yhteyttä|Ett sätt att hålla kontakten"
    timeout: 15000
- assertNotVisible: "Your deal-breakers|Ehdottomat rajasi|Dina absoluta gränser"
- openLink: kuutti://profile/later/drugsAttitude
- extendedWaitUntil:
    visible: "9 of 16 answered|9 / 16 vastattu|9 av 16 besvarade"
    timeout: 15000
