notifications.intro:
  en: "What you choose here decides what Kuutti tells your phones. A notification says only that there is something, never what or from whom. Each kind is on until you switch it off."
  description: "The Notifications screen (#176, ADR-032; #102, ADR-055), its opening line: the choices are stored on the server and every phone of the person's follows them; a push carries no text and no name; a kind never touched is on. Plain and true."
  fi: "Valintasi ratkaisevat, mistä Kuutti kertoo puhelimillesi. Ilmoitus kertoo vain, että jotain on, ei koskaan mitä tai keneltä. Jokainen laji on päällä, kunnes kytket sen pois."
  sv: "Det du väljer här avgör vad Kuutti berättar för dina telefoner. En avisering säger bara att det finns något, aldrig vad eller från vem. Varje slag är på tills du stänger av det."
  machine: { fi: true, sv: true }

