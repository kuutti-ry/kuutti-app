# Source of truth for every user-facing string in app, API and admin (#13, TD-17).
#
#   some.semantic.key:
#     en: English text, ICU MessageFormat ({name}, {count, plural, one {#} other {#}})
#     description: what it is and where it shows, for translators and reviewers
#     fi: Finnish (required: CI fails without it, except under admin.*)
#     sv: Swedish (CI warns without it)
#     slangi: Stadin slangi (fi-x-stadi, #521), optional: a key without it is the
#       Finnish text. Allowed only where a joke is harmless (isSlangKey); the
#       translator never fills it.
#     machine: { fi: true, sv: true }
#       text a machine or an agent wrote, or anyone other than a native reviewer;
#       a release refuses it in a released language (RELEASED_LOCALES)
#     reviewed: { fi: "3f9a2c1e5b7d9f01" }
#       written by `pnpm i18n:review` when a native reviewer approves: a hash of en
#       and fi, so an edit to either shows as unreviewed. Never written by hand.
#     max_length: 20
#       optional: characters the text may take where the room is fixed
#
# Every fi, sv and slangi text carries machine or reviewed, except legal.*, which
# carries neither (written by people, versioned by consent_version).
# docs/i18n/translation-review-guide.md is the review.
#
# Never inflect a dynamic value: proper nouns and user values stand in nominative
# positions only ("in {pond}" is banned; ponds carry their case forms in the
# database). legal.* keys take a consent_version and never a machine flag.
# After editing: `pnpm i18n:build`, and commit src/generated with it.



# --- When something does not load: why, in words, and the way out that fits ---

load.failed.offline:
  en: "Kuutti could not be reached. Check your connection and try again."
  description: "Under a screen's own 'did not load' line: no answer came back from the API (no network, or the network dropped)."
  fi: "Kuuttiin ei saatu yhteyttä. Tarkista verkkoyhteys ja yritä uudelleen."
  sv: "Kuutti kunde inte nås. Kontrollera anslutningen och försök igen."
  machine: { fi: true, sv: true }

load.failed.server:
  en: "Kuutti's server had a problem. Try again in a moment."
  description: "Under a screen's own 'did not load' line: the API answered with a server error (5xx)."
  fi: "Kuutin palvelimella oli ongelma. Yritä hetken päästä uudelleen."
  sv: "Kuuttis server hade ett problem. Försök igen om en stund."
  machine: { fi: true, sv: true }

load.failed.outdated:
  en: "This version of the app is older than Kuutti's server and cannot read its answer. Update the app to continue."
  description: "Under a screen's own 'did not load' line: the API sent something this build does not know yet (a newer contract); trying again cannot help, updating can."
  fi: "Tämä sovelluksen versio on vanhempi kuin Kuutin palvelin eikä osaa lukea sen vastausta. Päivitä sovellus jatkaaksesi."
  sv: "Den här versionen av appen är äldre än Kuuttis server och kan inte läsa dess svar. Uppdatera appen för att fortsätta."
  machine: { fi: true, sv: true }

load.failed.other:
  en: "Something unexpected went wrong. Try again."
  description: "Under a screen's own 'did not load' line: any other failure."
  fi: "Jokin meni odottamatta pieleen. Yritä uudelleen."
  sv: "Något oväntat gick fel. Försök igen."
  machine: { fi: true, sv: true }

load.retry:
  en: Try again
  description: "Button under a failed load, for every failure but an outdated app."
  fi: Yritä uudelleen
  sv: Försök igen
  machine: { fi: true, sv: true }

load.update:
  en: Update the app
  description: "Button under a failed load when the app is older than the API: fetches the newest update for this build and restarts the app into it."
  fi: Päivitä sovellus
  sv: Uppdatera appen
  machine: { fi: true, sv: true }

load.updating:
  en: Updating…
  description: "The update button while the newest update is fetched; the app restarts when it is there."
  fi: Päivitetään…
  sv: Uppdaterar…
  machine: { fi: true, sv: true }

load.noUpdate:
  en: "No update is available for this app yet. Install the newest version of Kuutti."
  description: "After 'Update the app' found nothing for this build: only installing the app again helps (in production, from the store)."
  fi: "Tälle sovellukselle ei ole vielä päivitystä. Asenna Kuutin uusin versio."
  sv: "Det finns ingen uppdatering för den här appen ännu. Installera den senaste versionen av Kuutti."
  machine: { fi: true, sv: true }

load.install:
  en: Open the install page
  description: "Button outside production after no update was found: opens the page where the team installs the newest build."
  fi: Avaa asennussivu
  sv: Öppna installationssidan
  machine: { fi: true, sv: true }

