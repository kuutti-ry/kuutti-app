account.title:
  en: Your account
  description: "Title of the row under Account in Settings and of the screen it opens, with the data export, \"I found someone\" (#83), the break and the deletion (#287)."
  fi: Tilisi
  sv: Ditt konto
  machine: { fi: true, sv: true }

account.export.button:
  en: Download my data
  description: Account card, the button that fetches everything Kuutti holds about the person and hands it to the share sheet (a file download on the web).
  fi: Lataa tietoni
  sv: Ladda ner mina uppgifter
  machine: { fi: true, sv: true }

account.export.explain:
  en: A file with everything Kuutti holds about you, and nothing about anyone else.
  description: Account card, text under the export button.
  fi: Tiedosto, jossa on kaikki, mitä Kuutti tietää sinusta, eikä mitään kenestäkään muusta.
  sv: En fil med allt Kuutti har om dig, och inget om någon annan.
  machine: { fi: true, sv: true }

account.export.working:
  en: Preparing your data…
  description: Account card, while the export is fetched.
  fi: Valmistellaan tietojasi…
  sv: Förbereder dina uppgifter…
  machine: { fi: true, sv: true }

account.export.title:
  en: Your Kuutti data
  description: The title of the share sheet the export is handed to.
  fi: Kuutti-tietosi
  sv: Dina Kuutti-uppgifter
  machine: { fi: true, sv: true }

account.export.failed:
  en: The download did not work. Try again.
  description: Account card, the export request failed.
  fi: Lataus ei onnistunut. Yritä uudelleen.
  sv: Nedladdningen misslyckades. Försök igen.
  machine: { fi: true, sv: true }

account.export.saved:
  en: Done. The file is where you chose.
  description: "Account card, once the export's file is handed over (#465): saved in the folder the person picked on Android, sent where they chose from the share sheet on iOS, downloaded on the web preview. Not shown when they back out of the picker or the sheet. Read out by the screen reader after the system's sheet closes."
  fi: Valmis. Tiedosto on nyt siellä, minne sen valitsit.
  sv: Klart. Filen finns nu där du valde.
  machine: { fi: true, sv: true }

account.export.limited:
  en: That is enough copies for today. You can download your data again after midnight.
  description: Account card, the export refused because the day's copies (matching_config exports_per_day, #237) are used up; the day rolls at midnight in Finland. Never a number, the cap is a tunable.
  fi: Tältä päivältä kopioita on jo tarpeeksi. Voit ladata tietosi uudelleen keskiyön jälkeen.
  sv: Det räcker med kopior för i dag. Du kan ladda ner dina uppgifter igen efter midnatt.
  machine: { fi: true, sv: true }

account.export.fileName:
  en: kuutti-data
  description: "The stem of the export's file name (#237): the zip is <stem>-<date>.zip and the JSON inside it <stem>-<date>.json. ASCII letters, digits and hyphens only, in every language: the name goes into an HTTP header and the phone's Files app. Nothing about the person in it."
  fi: kuutti-tiedot
  sv: kuutti-uppgifter
  machine: { fi: true, sv: true }

account.export.photoCheck.about:
  en: "Kuutti checks every photo before anyone else sees it. Below are the photos of yours the check did not show to others in the last twelve months, and until when your new photos are checked a little more carefully, if they are. Nothing else follows from them, and both end by themselves."
  description: "Inside the downloaded data file (#253), the text that opens the photo check part. Plain and calm: a person reads what the check holds about them; never accusing words (strike, flag, violation, offence, suspicious)."
  fi: "Kuutti tarkistaa jokaisen kuvan ennen kuin kukaan muu näkee sen. Alla ovat kuvasi, joita tarkistus ei näyttänyt muille viimeisten kahdentoista kuukauden aikana, ja mihin asti uudet kuvasi tarkistetaan hieman tarkemmin, jos tarkistetaan. Niistä ei seuraa mitään muuta, ja molemmat päättyvät itsestään."
  sv: "Kuutti granskar varje foto innan någon annan ser det. Nedan finns de av dina foton som granskningen inte visade för andra under de senaste tolv månaderna, och till när dina nya foton granskas lite noggrannare, om de gör det. Inget annat följer av dem, och båda upphör av sig själva."
  machine: { fi: true, sv: true }

