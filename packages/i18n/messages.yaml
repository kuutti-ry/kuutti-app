  machine: { fi: true, sv: true }

account.export.photoCheck.reason.disturbing:
  en: May show something distressing
  description: Inside the downloaded data file (#253), why the check did not show a photo to others; the disturbing group.
  fi: Saattaa näyttää jotain järkyttävää
  sv: Kan visa något upprörande
  machine: { fi: true, sv: true }

account.export.photoCheck.reason.hate:
  en: May show a symbol Kuutti does not allow
  description: Inside the downloaded data file (#253), why the check did not show a photo to others; the hate symbols group, said without naming it.
  fi: Saattaa näyttää symbolin, jota Kuutti ei salli
  sv: Kan visa en symbol som Kuutti inte tillåter
  machine: { fi: true, sv: true }

account.delete.button:
  en: Delete my account
  description: Account card, the button that opens the deletion confirmation.
  fi: Poista tilini
  sv: Ta bort mitt konto
  machine: { fi: true, sv: true }

account.delete.title:
  en: Delete your account?
  description: Deletion confirmation, heading.
  fi: Poistetaanko tilisi?
  sv: Ta bort ditt konto?
  machine: { fi: true, sv: true }

account.delete.body:
  en: "Your profile, photos, matches and contacts go now and cannot be brought back. Messages you sent stay with the people who received them, under 'Deleted user'. What safety and the law require is kept for a time, as the privacy policy says. A new account is possible after {days, plural, one {# day} other {# days}}."
  description: "Deletion confirmation, text (#51, ADR-007; reworded #511): says only what an erasure does, the messages kept for their receivers under 'Deleted user' (chat's counterpart name) and what safety and law keep; {days} is the cooldown before the same person may register again."
  fi: "Profiilisi, kuvasi, matchisi ja yhteystietosi poistuvat nyt, eikä niitä voi palauttaa. Lähettämäsi viestit jäävät vastaanottajille nimellä 'Poistettu käyttäjä'. Se, mitä turvallisuus ja laki vaativat, säilytetään jonkin aikaa, kuten tietosuojaseloste kertoo. Uuden tilin voi luoda {days, plural, one {# päivän} other {# päivän}} kuluttua."
  sv: "Din profil, dina foton, matcher och kontaktuppgifter försvinner nu och kan inte tas tillbaka. Meddelanden du skickat stannar hos dem som fick dem, under 'Raderad användare'. Det som säkerheten och lagen kräver sparas en tid, som dataskyddsbeskrivningen säger. Ett nytt konto är möjligt efter {days, plural, one {# dag} other {# dagar}}."
  machine: { fi: true, sv: true }

account.delete.confirm:
  en: Delete everything
  description: Deletion confirmation, the confirming button.
  fi: Poista kaikki
  sv: Ta bort allt
  machine: { fi: true, sv: true }

account.delete.cancel:
  en: Keep my account
  description: Deletion confirmation, the cancelling button.
  fi: Säilytä tilini
  sv: Behåll mitt konto
  machine: { fi: true, sv: true }

account.delete.close:
  en: Close
  description: Deletion confirmation, screen-reader label of the close control.
  fi: Sulje
  sv: Stäng
  machine: { fi: true, sv: true }

account.delete.working:
  en: Deleting your account…
  description: Account card, while the deletion request runs.
  fi: Poistetaan tiliäsi…
  sv: Tar bort ditt konto…
  machine: { fi: true, sv: true }

account.delete.failed:
  en: The deletion did not go through. Try again.
  description: Account card, the deletion request failed.
  fi: Poisto ei onnistunut. Yritä uudelleen.
  sv: Borttagningen gick inte igenom. Försök igen.
  machine: { fi: true, sv: true }

account.break.button:
  en: "Take a break"
  description: "Settings, account group: opens the screen that pauses the account (#170)."
  fi: "Pidä tauko"
  sv: "Ta en paus"
  machine: { fi: true, sv: true }

account.break.title:
  en: "Take a break from Kuutti"
  description: "Heading of the break screen (#170)."
  fi: "Pidä tauko Kuutista"
  sv: "Ta en paus från Kuutti"
  machine: { fi: true, sv: true }

account.break.intro:
  en: "A break hides you without deleting anything. Three things happen:"
  description: "Break screen, the line above the three consequences (#170)."
  fi: "Tauko piilottaa sinut poistamatta mitään. Kolme asiaa tapahtuu:"
  sv: "En paus döljer dig utan att något raderas. Tre saker händer:"
  machine: { fi: true, sv: true }

account.break.hidden:
  en: "Your profile leaves everybody's view. Nobody new sees you while you are away."
  description: "Break screen, the first consequence."
  fi: "Profiilisi poistuu kaikkien näkyvistä. Kukaan uusi ei näe sinua tauon aikana."
  sv: "Din profil försvinner ur allas vy. Ingen ny ser dig medan du är borta."
  machine: { fi: true, sv: true }

account.break.signedOut:
  en: "You are signed out on every device, this one included."
  description: "Break screen, the second consequence."
  fi: "Sinut kirjataan ulos kaikilta laitteilta, myös tältä."
  sv: "Du loggas ut på alla enheter, även den här."
  machine: { fi: true, sv: true }

account.break.comesBack:
  en: "Your next bank login brings you back. Nothing is deleted and nothing is asked again, though meanwhile a like waiting for you can run out, and a quiet conversation moves to Archived."
  description: "Break screen, the third consequence. A break stops no clock (ADR-022 §4, the maintainer's of 13/10/2026): a like waiting for the person expires after matching_config like_expiry_days (#97), and a match nobody writes in is archived after silent_match_archive_days (#100, ADR-031 §8), as at any other time. So the line says they can, never how long, since the times are rows. Archived is the conversation list's group (chat.list.archived), where writing brings a quiet one back."
  fi: "Seuraava pankkitunnistautuminen tuo sinut takaisin. Mitään ei poisteta eikä mitään kysytä uudelleen, mutta sillä välin sinua odottava tykkäys voi vanhentua ja hiljainen keskustelu siirtyy Arkistoituihin."
  sv: "Nästa bankinloggning tar dig tillbaka. Inget raderas och inget frågas igen, men under tiden kan ett gillande som väntar på dig gå ut, och ett tyst samtal flyttas till Arkiverade."
  machine: { fi: true, sv: true }

account.break.understand:
  en: "I understand what a break means"
  description: "Break screen, the switch under the three lines; the button is enabled only once it is on (the S-mobiili pattern, #170)."
  fi: "Ymmärrän, mitä tauko tarkoittaa"
  sv: "Jag förstår vad en paus innebär"
  machine: { fi: true, sv: true }

account.break.confirm:
  en: "Start the break"
  description: "Break screen, the button that pauses the account; disabled until the person has said they understand."
  fi: "Aloita tauko"
  sv: "Börja pausen"
  machine: { fi: true, sv: true }

account.break.working:
  en: "Starting your break…"
  description: "Break screen, while the API pauses the account."
  fi: "Aloitetaan taukoasi…"
  sv: "Startar din paus…"
  machine: { fi: true, sv: true }

account.break.failed:
  en: "The break could not be started. Try again."
  description: "Break screen, after the API refused or could not be reached; the session stays."
  fi: "Taukoa ei voitu aloittaa. Yritä uudelleen."
  sv: "Pausen kunde inte startas. Försök igen."
  machine: { fi: true, sv: true }

account.break.back:
  en: "Back"
  description: "Screen-reader label of the back arrow of the break screen."
  fi: "Takaisin"
  sv: "Tillbaka"
  machine: { fi: true, sv: true }

account.foundThem.button:
  en: "I found someone"
  description: "Your account: the button to \"Löysin hänet\" (#83), telling Kuutti the person found somebody. An indication only: nothing in the app changes."
  fi: "Löysin hänet"
  sv: "Jag hittade någon"
  machine: { fi: true, sv: true }

account.foundThem.title:
  en: "I found someone"
  description: "Heading of the \"Löysin hänet\" screen (#83). The Finnish is the feature's own name."
  fi: "Löysin hänet"
  sv: "Jag hittade någon"
  machine: { fi: true, sv: true }

account.foundThem.intro:
  en: "Your answer tells the association whether Kuutti works. It is shown to nobody, and it is counted without your name."
  description: "\"Löysin hänet\" (#83), above the three choices: why the association asks, and that the answer is counted anonymously (a count by day and reason, ADR-040); no person is shown it, the moderators see totals only. For those in the study the research consent already covers the event. Fits every reason, \"another reason\" too."
  fi: "Vastauksesi kertoo yhdistykselle, toimiiko Kuutti. Sitä ei näytetä kenellekään, ja se lasketaan ilman nimeäsi."
  sv: "Ditt svar berättar för föreningen om Kuutti fungerar. Det visas inte för någon, och det räknas utan ditt namn."
  machine: { fi: true, sv: true }

account.foundThem.unchanged:
  en: "Nothing changes in the app: your profile, your rounds and your conversations stay as they are. To step away, take a break or delete your account under Your account."
  description: "\"Löysin hänet\" (#83): the answer changes nothing (the maintainer, 21/10/2026); stepping away is the break or the deletion, both under Your account (account.title)."
  fi: "Sovelluksessa mikään ei muutu: profiilisi, kierroksesi ja keskustelusi pysyvät ennallaan. Jos haluat pitää taukoa tai poistaa tilisi, löydät ne kohdasta Tilisi."
  sv: "Inget ändras i appen: din profil, dina rundor och dina samtal är kvar som de är. Vill du ta en paus eller radera ditt konto finns det under Ditt konto."
  machine: { fi: true, sv: true }

account.foundThem.question:
  en: "Which is it?"
  description: "\"Löysin hänet\" (#83): the label of the three choices, a radio group, and its name for a screen reader."
  fi: "Mikä on kyseessä?"
  sv: "Vilket gäller?"
  machine: { fi: true, sv: true }

account.foundThem.reason.here:
  en: "I found someone on Kuutti"
  description: "\"Löysin hänet\" (#83), the first reason: the association's measure of success is its share."
  fi: "Löysin jonkun Kuutista"
  sv: "Jag hittade någon på Kuutti"
  machine: { fi: true, sv: true }

account.foundThem.reason.elsewhere:
  en: "I found someone elsewhere"
  description: "\"Löysin hänet\" (#83), the second reason."
  fi: "Löysin jonkun muualta"
  sv: "Jag hittade någon på annat håll"
  machine: { fi: true, sv: true }

account.foundThem.reason.other:
  en: "Another reason"
  description: "\"Löysin hänet\" (#83), the third reason. Never asks for words: the list is closed."
  fi: "Jokin muu syy"
  sv: "Ett annat skäl"
  machine: { fi: true, sv: true }

account.foundThem.send:
  en: "Tell Kuutti"
  description: "\"Löysin hänet\" (#83): sends the chosen reason; enabled once one is chosen."
  fi: "Kerro Kuutille"
  sv: "Berätta för Kuutti"
  machine: { fi: true, sv: true }

account.foundThem.sending:
  en: "Sending…"
  description: "\"Löysin hänet\" (#83): the button while the answer is on its way."
  fi: "Lähetetään…"
  sv: "Skickar…"
  machine: { fi: true, sv: true }

account.foundThem.failed:
  en: "That did not go through. Your choice is kept; try again."
  description: "\"Löysin hänet\" (#83): a failure that keeps the choice."
  fi: "Lähetys ei onnistunut. Valintasi on tallessa; yritä uudelleen."
  sv: "Det gick inte fram. Ditt val finns kvar; försök igen."
  machine: { fi: true, sv: true }

account.foundThem.thanks:
  en: "Thank you for telling us."
  description: "\"Löysin hänet\" (#83): after the answer was counted, or when this account told Kuutti before. Not congratulations: the reason may be another one."
  fi: "Kiitos, että kerroit meille."
  sv: "Tack för att du berättade för oss."
  machine: { fi: true, sv: true }

# --- Research opt-in on the account card, and the home screen's onboarding gate (#46) ---

account.research.label:
  en: "Take part in research"
  description: "Label of the research opt-in switch on its screen in Settings (#46, #287): on when the active research consent names the current wording."
  fi: "Osallistu tutkimukseen"
  sv: "Delta i forskningen"
  machine: { fi: true, sv: true }

account.research.explain:
  en: "Anonymised events about how you use Kuutti, under a separate research identifier. You can change this at any time."
  description: "Line under the research switch."
  fi: "Anonymisoituja tapahtumia Kuutin käytöstäsi erillisellä tutkimustunnisteella. Voit muuttaa tätä milloin tahansa."
  sv: "Anonymiserade händelser om hur du använder Kuutti, under ett separat forskningsid. Du kan ändra det här när som helst."
  machine: { fi: true, sv: true }

account.research.failed:
  en: "The research choice could not be saved. Try again."
  description: "Notice when giving or withdrawing the research consent failed."
  fi: "Tutkimusvalintaa ei voitu tallentaa. Yritä uudelleen."
  sv: "Forskningsvalet kunde inte sparas. Försök igen."
  machine: { fi: true, sv: true }

account.specialCategory.failed:
  en: "The sensitive-answers choice could not be saved. Try again."
  description: "Notice on the sensitive answers' screen in Settings when giving or withdrawing the special-category consent failed (#146, #287); it said the research choice before."
  fi: "Arkaluonteisia vastauksia koskevaa valintaa ei voitu tallentaa. Yritä uudelleen."
  sv: "Valet om känsliga svar kunde inte sparas. Försök igen."
  machine: { fi: true, sv: true }

account.specialCategory.label:
  en: "Store my sensitive answers"
  description: "Label of the switch for the special-category consent on its screen in Settings (#146, ADR-019 §4, #287)."
  fi: "Tallenna arkaluonteiset vastaukseni"
  sv: "Spara mina känsliga svar"
  machine: { fi: true, sv: true }

account.specialCategory.explain:
  en: "Whom you seek, the parties you could vote for and your religion. Switching this off removes those answers and pauses matching; your profile stays, and you are asked whom you seek again before matching resumes."
  description: "Explanation under the special-category switch on its screen in Settings (#146, #204, #287): the one place the consent is withdrawn, with its consequence."
  fi: "Kenen seuraa etsit, puolueet, joita voisit äänestää, ja uskontosi. Kytkimen sammuttaminen poistaa nämä vastaukset ja keskeyttää yhdistämisen; profiilisi säilyy, ja sinulta kysytään uudelleen, kenen seuraa etsit, ennen kuin yhdistäminen jatkuu."
  sv: "Vem du söker, partierna du kunde rösta på och din religion. Stänger du av det här tas de svaren bort och matchningen pausas; din profil finns kvar, och du får frågan om vem du söker igen innan matchningen fortsätter."
  machine: { fi: true, sv: true }

account.email.title:
  en: "A way to stay in touch"
  description: "Heading of the optional e-mail card (#148, TD-18), on the e-mail screen in Settings and the last of the later screens. Not a way back in (#385): getting back in after losing a phone is a new bank login."
  fi: "Tapa pitää yhteyttä"
  sv: "Ett sätt att hålla kontakten"
  machine: { fi: true, sv: true }

account.email.explain:
  en: "Optional. A way for Kuutti to reach you. Never shown to anyone and never a login. A code confirms the address; nothing else is sent to it without asking you first."
  description: "Explanation of the optional e-mail (#148, #385): the honest reason, as the sheet asks, and that the only message is the code until the person agrees to more (TD-18, #196); on the card under its heading."
  fi: "Vapaaehtoinen. Tapa, jolla Kuutti voi tavoittaa sinut. Ei näytetä kenellekään, eikä koskaan kirjautumista varten. Koodi vahvistaa osoitteen; muuta tänne ei lähetetä kysymättä ensin sinulta."
  sv: "Frivilligt. Ett sätt för Kuutti att nå dig. Visas aldrig för någon och är aldrig en inloggning. En kod bekräftar adressen; inget annat skickas hit utan att du först tillfrågas."
  machine: { fi: true, sv: true }

account.email.label:
  en: "E-mail address"
  description: "Label of the e-mail input (#148)."
  fi: "Sähköpostiosoite"
  sv: "E-postadress"
  machine: { fi: true, sv: true }

account.email.save:
  en: "Send a confirmation code"
  description: "Button that keeps the e-mail typed and mails a code to confirm it (#148, #385); named for what it does, since it mails one (the maintainer, 29/10/2026, #511). The only button of the e-mail: Settings has no Save buttons."
  fi: "Lähetä vahvistuskoodi"
  sv: "Skicka en bekräftelsekod"
  machine: { fi: true, sv: true }

account.email.clear:
  en: "Remove the address"
  description: "Button that clears the e-mail (#148)."
  fi: "Poista osoite"
  sv: "Ta bort adressen"
  machine: { fi: true, sv: true }

account.email.saved:
  en: "Saved."
  description: "Said after the e-mail is saved or removed (#148)."
  fi: "Tallennettu."
  sv: "Sparad."
  machine: { fi: true, sv: true }

account.email.invalid:
  en: "That does not look like an e-mail address."
  description: "Said when the API refuses the e-mail as malformed (#148)."
  fi: "Tuo ei näytä sähköpostiosoitteelta."
  sv: "Det ser inte ut som en e-postadress."
  machine: { fi: true, sv: true }

account.email.failed:
  en: "The address could not be saved. Try again."
  description: "Said when saving or removing the e-mail failed for another reason (#148)."
  fi: "Osoitetta ei voitu tallentaa. Yritä uudelleen."
  sv: "Adressen kunde inte sparas. Försök igen."
  machine: { fi: true, sv: true }

account.email.unconfirmed:
  en: "An address is set, not confirmed yet."
  description: "Said on the card while an e-mail is set and its code has not been typed (#148, #385); the address itself is in the input."
  fi: "Osoite on tallennettu, mutta sitä ei ole vielä vahvistettu."
  sv: "En adress är sparad men inte bekräftad ännu."
  machine: { fi: true, sv: true }

account.email.confirmed:
  en: "An address is set and confirmed."
  description: "Said on the card once the e-mail's code was typed right (#385)."
  fi: "Osoite on tallennettu ja vahvistettu."
  sv: "En adress är sparad och bekräftad."
  machine: { fi: true, sv: true }

account.email.codeSent:
  en: "A code is on its way to the address. It works until {time}."
  description: "Said on the card while a code waits (#385, ADR-043); {time} is when it stops working, as hours and minutes in the person's language."
  fi: "Koodi on matkalla osoitteeseen. Se toimii kello {time} asti."
  sv: "En kod är på väg till adressen. Den gäller till klockan {time}."
  machine: { fi: true, sv: true }

account.email.codeLabel:
  en: "The code from the message"
  description: "Label of the input for the six digits of the confirmation message (#385)."
  fi: "Viestin koodi"
  sv: "Koden i meddelandet"
  machine: { fi: true, sv: true }

account.email.confirm:
  en: "Confirm the address"
  description: "Button that sends the typed code (#385)."
  fi: "Vahvista osoite"
  sv: "Bekräfta adressen"
  machine: { fi: true, sv: true }

account.email.send:
  en: "Send a code"
  description: "Button that sends a code to an unconfirmed address when none waits (#385)."
  fi: "Lähetä koodi"
  sv: "Skicka en kod"
  machine: { fi: true, sv: true }

account.email.sendAgain:
  en: "Send a new code"
  description: "Button that sends a fresh code while one waits; the earlier one stops working (#385)."
  fi: "Lähetä uusi koodi"
  sv: "Skicka en ny kod"
  machine: { fi: true, sv: true }

account.email.confirmedNow:
  en: "The address is confirmed."
  description: "Said once, when the code was right (#385)."
  fi: "Osoite on vahvistettu."
  sv: "Adressen är bekräftad."
  machine: { fi: true, sv: true }

account.email.codeWrong:
  en: "That is not the code. Check the message and try again."
  description: "Said when the typed code is wrong and tries remain (#385, three in all); the last wrong one says account.email.codeSpent instead."
  fi: "Tuo ei ole koodi. Tarkista viesti ja yritä uudelleen."
  sv: "Det är inte koden. Kontrollera meddelandet och försök igen."
  machine: { fi: true, sv: true }

account.email.codeSpent:
  en: "Too many wrong codes. Send a new one."
  description: "Said when the last try was wrong and the code no longer works (#385)."
  fi: "Liian monta väärää koodia. Lähetä uusi."
  sv: "För många fel koder. Skicka en ny."
  machine: { fi: true, sv: true }

account.email.codeExpired:
  en: "That code has expired. Send a new one."
  description: "Said when the code was typed after its thirty minutes (#385)."
  fi: "Koodi on vanhentunut. Lähetä uusi."
  sv: "Koden har gått ut. Skicka en ny."
  machine: { fi: true, sv: true }

account.email.codeNone:
  en: "No code is waiting. Send a new one."
  description: "Said when a code is typed but none waits, for instance after the address changed on another phone (#385)."
  fi: "Mikään koodi ei odota. Lähetä uusi."
  sv: "Ingen kod väntar. Skicka en ny."
  machine: { fi: true, sv: true }

account.email.sendLimit:
  en: "That is enough codes for today. You can send a new one after midnight."
  description: "Said when the day's five codes are sent (#385); the day rolls at midnight in Finland. Said plainly, nobody is limited in silence."
  fi: "Koodeja on lähetetty tälle päivälle tarpeeksi. Voit lähettää uuden keskiyön jälkeen."
  sv: "Det räcker med koder för i dag. Du kan skicka en ny efter midnatt."
  machine: { fi: true, sv: true }

account.email.mailUnavailable:
  en: "The code could not be sent just now. Try again later."
  description: "Said when no mail could be sent (#385): the service failed, or this environment sends none."
  fi: "Koodia ei voitu lähettää juuri nyt. Yritä myöhemmin uudelleen."
  sv: "Koden kunde inte skickas just nu. Försök igen senare."
  machine: { fi: true, sv: true }

account.email.codeFailed:
  en: "Something went wrong with the code. Try again."
  description: "Said when sending or confirming a code failed for a reason the card has no words of its own for (#385)."
  fi: "Koodin kanssa meni jotain vikaan. Yritä uudelleen."
  sv: "Något gick fel med koden. Försök igen."
  machine: { fi: true, sv: true }

mail.emailCode.subject:
  en: "Your code for Kuutti"
  description: "Subject of the message that confirms the optional e-mail (#385, ADR-043). Plain text, names nobody."
  fi: "Koodisi Kuuttiin"
  sv: "Din kod till Kuutti"
  machine: { fi: true, sv: true }

mail.emailCode.code:
  en: "Your code is {code}. It works for {minutes, plural, one {# minute} other {# minutes}}."
  description: "First paragraph of the confirmation message (#385, ADR-043), plain text in the language of the request that asked for it. {code} is the six digits; {minutes} how long they work. No link (ADR-043 §3)."
  fi: "Koodisi on {code}. Se on voimassa {minutes, plural, one {# minuutin} other {# minuutin}} ajan."
  sv: "Din kod är {code}. Den gäller i {minutes, plural, one {# minut} other {# minuter}}."
  machine: { fi: true, sv: true }

mail.emailCode.ignore:
  en: "Someone added this address in the Kuutti app as a way to stay in touch. If that was not you, you can ignore this message."
  description: "Second paragraph of the confirmation message (#385): it names nobody, since the address may be somebody else's, and asks nothing but to ignore it."
  fi: "Joku lisäsi tämän osoitteen Kuutti-sovellukseen yhteydenpitoa varten. Jos se et ollut sinä, voit jättää tämän viestin huomiotta."
  sv: "Någon lade till den här adressen i Kuutti-appen för att hålla kontakten. Om det inte var du kan du bortse från det här meddelandet."
  machine: { fi: true, sv: true }

mail.signature:
  en: "Kuutti ry"
  description: "The last line of every message Kuutti sends (#385): the association's name, never an address (the maintainer, 06/10/2026)."
  fi: "Kuutti ry"
  sv: "Kuutti ry"
  machine: { fi: true, sv: true }

account.email.done:
  en: "Done"
  description: "Button of the e-mail screen that returns to the home screen (#148)."
  fi: "Valmis"
  sv: "Klart"
  machine: { fi: true, sv: true }

pond.waitlist.label:
  en: "People in your area"
  description: "Home screen, accessible name of the card with the waitlist counter of the person's own pond (#54, ADR-013)."
  fi: "Ihmiset alueellasi"
  sv: "Människor i ditt område"
  machine: { fi: true, sv: true }

pond.waitlist.title:
  en: "Your area"
  description: "Waitlist card: the line above the pond's name. The name follows on a line of its own, in the nominative, never inside a sentence."
  fi: "Alueesi"
  sv: "Ditt område"
  machine: { fi: true, sv: true }

pond.waitlist.verified:
  en: "{people, plural, one {# person has identified with their bank} other {# people have identified with their bank}}"
  description: "Waitlist card: how many bank-verified people wait in the pond. {people} is at least the threshold k (ten), so never small."
  fi: "{people, plural, one {# ihminen on tunnistautunut pankkitunnuksilla} other {# ihmistä on tunnistautunut pankkitunnuksilla}}"
  sv: "{people, plural, one {# person har identifierat sig med bank-id} other {# personer har identifierat sig med bank-id}}"
  machine: { fi: true, sv: true }

pond.waitlist.seeks.title:
  en: "Whom people with a finished profile are looking for"
  description: "Waitlist card, the line above the bar of whom the people of the area seek (#507). The bar is drawn from finished profiles only."
  fi: "Ketä valmiin profiilin tehneet etsivät"
  sv: "Vem personer med färdig profil söker"
  machine: { fi: true, sv: true }

pond.waitlist.seeks.men:
  en: "{share, number} % men"
  description: "Waitlist card, the bar's label for the people who seek men and not women. {share} is a share of the three bands together, in steps of five."
  fi: "{share, number} % miehiä"
  sv: "{share, number} % män"
  machine: { fi: true, sv: true }

pond.waitlist.seeks.everyone:
  en: "{share, number} % everyone"
  description: "Waitlist card, the bar's label for the people who seek both women and men. It stands in the middle of the bar, as the overlap of the two others. {share} is a share of the three bands together, in steps of five."
  fi: "{share, number} % kaikkia"
  sv: "{share, number} % alla"
  machine: { fi: true, sv: true }

pond.waitlist.seeks.women:
  en: "{share, number} % women"
  description: "Waitlist card, the bar's label for the people who seek women and not men. {share} is a share of the three bands together, in steps of five."
  fi: "{share, number} % naisia"
  sv: "{share, number} % kvinnor"
  machine: { fi: true, sv: true }

pond.waitlist.seeks.label:
  en: "Of the people with a finished profile who are looking for men or women, {men, number} percent are looking for men. {everyone, number} percent are looking for everyone. {women, number} percent are looking for women."
  description: "Waitlist card, what a screen reader says for the whole bar: one element, three sentences. Each number is a share of the three bands together, in steps of five, at least five."
  fi: "Valmiin profiilin tehneistä miehiä tai naisia etsivistä {men, number} prosenttia etsii miehiä. {everyone, number} prosenttia etsii kaikkia. {women, number} prosenttia etsii naisia."
  sv: "Av personerna med färdig profil som söker män eller kvinnor söker {men, number} procent män. {everyone, number} procent söker alla. {women, number} procent söker kvinnor."
  machine: { fi: true, sv: true }

pond.waitlist.finishing:
  en: "{people, plural, =0 {Everyone has finished their profile.} one {# person is still finishing their profile.} other {# people are still finishing their profile.}}"
  description: "Waitlist card: how many of the verified people have not completed their profile yet. Shown only when the number is zero or at least k (ten); the one form exists for the grammar, not for use."
  fi: "{people, plural, =0 {Kaikki ovat saaneet profiilinsa valmiiksi.} one {# ihminen viimeistelee vielä profiiliaan.} other {# ihmistä viimeistelee vielä profiiliaan.}}"
  sv: "{people, plural, =0 {Alla har gjort klart sin profil.} one {# person håller fortfarande på med sin profil.} other {# personer håller fortfarande på med sin profil.}}"
  machine: { fi: true, sv: true }

pond.waitlist.small:
  en: "Your area is just getting started. Numbers are shown only when at least {k, number} people are here."
  description: "Waitlist card, below the threshold: no number is said about a small pond. {k} is the threshold. It names a condition, not a promise: numbers are never shown below {k}, and they may come a little later than at exactly {k}."
  fi: "Alueesi on vasta alussa. Luvut näytetään vain, kun täällä on vähintään {k, number} ihmistä."
  sv: "Ditt område har precis kommit igång. Siffror visas bara när minst {k, number} personer finns här."
  machine: { fi: true, sv: true }

pond.waitlist.steps:
  en: "The numbers change only in steps of at least {k, number} people, so that one person does not show."
  description: "Waitlist card, under the figures and the bar: why they stand still for a while. {k} is the threshold (ten): the figures of an area move in steps of at least that many people, the total as people come and go, the bar as they finish a profile or change whom they seek, so one person changes nothing in them. It says what the numbers do, not that nothing can ever be inferred."
  fi: "Luvut muuttuvat vain vähintään {k, number} ihmisen askelin, jotta yksittäinen ihminen ei näy niistä."
  sv: "Siffrorna ändras bara i steg om minst {k, number} personer, så att en enskild person inte syns i dem."
  machine: { fi: true, sv: true }

pond.waitlist.loading:
  en: "Counting…"
  description: "Waitlist card while the figures load."
  fi: "Lasketaan…"
  sv: "Räknar…"
  machine: { fi: true, sv: true }

pond.waitlist.failed:
  en: "The numbers could not be read."
  description: "Waitlist card when the figures could not be fetched."
  fi: "Lukuja ei voitu lukea."
  sv: "Siffrorna kunde inte läsas."
  machine: { fi: true, sv: true }

pond.waitlist.retry:
  en: "Try again"
  description: "Waitlist card, the button that fetches the figures again."
  fi: "Yritä uudelleen"
  sv: "Försök igen"
  machine: { fi: true, sv: true }

# --- The pond gate (#94, ADR-015): where a person stands between a finished profile and the first round ---
pond.gate.label:
  en: "When matching opens for you"
  description: "Home screen, accessible name of the card that says where the person stands at the pond gate (#94): waiting to be let into the area, waiting for enough people who match, or open."
  fi: "Milloin seuranhaku avautuu sinulle"
  sv: "När matchningen öppnar för dig"
  machine: { fi: true, sv: true }

pond.gate.title:
  en: "Matching"
  description: "Gate card: the line above the state. One word, a heading."
  fi: "Seuranhaku"
  sv: "Matchning"
  machine: { fi: true, sv: true }

pond.gate.incomplete:
  en: "Matching opens for finished profiles. Yours still lacks something."
  description: "Gate card when the person's profile or onboarding is not complete: nothing is counted for them yet. The profile screen says what is missing; this only says that something is."
  fi: "Seuranhaku avautuu valmiille profiileille. Sinun profiilistasi puuttuu vielä jotakin."
  sv: "Matchningen öppnar för färdiga profiler. I din saknas ännu något."
  machine: { fi: true, sv: true }

pond.gate.pending:
  en: "Your profile is finished. Where you stand is counted tonight."
  description: "Gate card when the person is complete and the next nightly count is to say where they stand: after they chose another area, after a change of gender or of whom they seek that needs deciding anew, or on a first look that could not be decided for them alone."
  fi: "Profiilisi on valmis. Tilanteesi lasketaan ensi yönä."
  sv: "Din profil är färdig. Var du står räknas i natt."
  machine: { fi: true, sv: true }

pond.gate.waiting:
  en: "You are among the next {within, number} in line for your area."
  description: "Gate card when the person waits to be let into their pond. {within} is the place as it is said, in steps: 10, 20, 30; never an exact place, see pond.gate.steps. The pond is not named in the sentence (TD-17: no inflected pond name)."
  fi: "Olet alueesi jonossa seuraavien {within, number} joukossa."
  sv: "Du är bland de {within, number} närmaste i kön till ditt område."
  machine: { fi: true, sv: true }

pond.gate.waiting.why:
  en: "People are let in so that no group becomes much larger than the other. Those who wait are let in in the order they registered: nobody who waits passes you, and nothing can be bought."
  description: "Gate card, under the place in line: why there is a line at all (TD-10, TD-13). It names no gender and no percentage. The order holds among those who wait; people of the smaller group are let in without waiting, so the text must not promise that nobody at all is let in earlier. 'Nothing can be bought' is a promise of the product, not decoration."
  fi: "Ihmisiä päästetään sisään niin, ettei mikään ryhmä kasva paljon toista suuremmaksi. Odottajat päästetään sisään rekisteröitymisjärjestyksessä: kukaan odottaja ei ohita sinua, eikä mitään voi ostaa."
  sv: "Människor släpps in så att ingen grupp blir mycket större än den andra. De som väntar släpps in i den ordning de registrerade sig: ingen som väntar går före dig, och ingenting går att köpa."
  machine: { fi: true, sv: true }

pond.gate.closed:
  en: "{needed, plural, one {About # more person is needed before matching opens for you.} other {About # more people are needed before matching opens for you.}}"
  description: "Gate card when the person is let into their pond and their pool is below the threshold. {needed} is about how many more people are needed, at least 1, said in steps, see pond.gate.steps. 'About' is part of the promise: the number is never exact."
  fi: "{needed, plural, one {Tarvitaan vielä noin # ihminen, ennen kuin seuranhaku avautuu sinulle.} other {Tarvitaan vielä noin # ihmistä, ennen kuin seuranhaku avautuu sinulle.}}"
  sv: "{needed, plural, one {Det behövs ungefär # person till innan matchningen öppnar för dig.} other {Det behövs ungefär # personer till innan matchningen öppnar för dig.}}"
  machine: { fi: true, sv: true }

pond.gate.closed.who:
  en: "They are people in your area who are what you seek, and who seek somebody like you."
  description: "Gate card, under the number needed: who counts. Both directions: the people the person seeks, who also seek a person like them. No gender is named."
  fi: "He ovat alueesi ihmisiä, jotka vastaavat sitä, mitä etsit, ja jotka etsivät sinun kaltaistasi."
  sv: "De är människor i ditt område som är det du söker, och som söker någon som du."
  machine: { fi: true, sv: true }

pond.gate.steps:
  en: "Numbers here are said in steps of {step, number}, so that they do not follow each person who comes or goes."
  description: "Gate card, under the place in line and under the number needed: why the number is round and stands still for a while. {step} is the step (ten). It must not promise that one person never shows: a person who is the tenth does."
  fi: "Luvut sanotaan tässä {step, number} ihmisen tarkkuudella, jotta ne eivät seuraa jokaista tulijaa ja lähtijää."
  sv: "Siffrorna anges här i steg om {step, number}, så att de inte följer varje person som kommer eller lämnar."
  machine: { fi: true, sv: true }

pond.gate.open:
  en: "Matching is open for you."
  description: "Gate card when matching has opened for the person. It promises no round and no date: the rounds come with a later version."
  fi: "Seuranhaku on sinulle auki."
  sv: "Matchningen är öppen för dig."
  machine: { fi: true, sv: true }

pond.gate.loading:
  en: "Looking…"
  description: "Gate card while the person's gate loads."
  fi: "Katsotaan…"
  sv: "Tittar…"
  machine: { fi: true, sv: true }

pond.gate.failed:
  en: "Where you stand could not be read."
  description: "Gate card when the person's gate could not be fetched."
  fi: "Tilannettasi ei voitu lukea."
  sv: "Det gick inte att läsa var du står."
  machine: { fi: true, sv: true }

pond.gate.retry:
  en: "Try again"
  description: "Gate card, the button that fetches the person's gate again."
  fi: "Yritä uudelleen"
  sv: "Försök igen"
  machine: { fi: true, sv: true }

# --- Today's round (#379, ADR-034): one card at a time, like and pass, come back tomorrow ---

round.home.open:
  en: "Today's round"
  description: "Button on the gate card of the home screen, once matching is open for the person: opens the day's round (#379). Short; no count, no time."
  fi: "Päivän kierros"
  sv: "Dagens runda"
  machine: { fi: true, sv: true }

round.title:
  en: "Today's round"
  description: "Title of the round screen, in its header beside the back arrow (#379)."
  fi: "Päivän kierros"
  sv: "Dagens runda"
  slangi: "Päivän rundi"
  machine: { fi: true, sv: true, slangi: true }

round.back:
  en: "Back to home"
  description: "Back arrow of the round screen, heard by a screen reader: where it goes (#379)."
  fi: "Takaisin alkuun"
  sv: "Tillbaka till start"
  machine: { fi: true, sv: true }

round.loading:
  en: "Loading today's round…"
  description: "Round screen while the day's round is read (#379)."
  fi: "Ladataan päivän kierrosta…"
  sv: "Läser in dagens runda…"
  machine: { fi: true, sv: true }

round.failed:
  en: "Today's round did not load."
  description: "Round screen when the day's round could not be read; why, and a button to try again, follow (#379)."
  fi: "Päivän kierrosta ei voitu ladata."
  sv: "Dagens runda kunde inte läsas in."
  machine: { fi: true, sv: true }

round.reason.matches_filters:
  en: "Matches your filters"
  description: "Why a card is in the round (TD-12), above the card: the person is in the reader's filters and the reader in theirs. Never a score, never 'best match'. A short label."
  fi: "Vastaa suodattimiasi"
  sv: "Matchar dina filter"
  machine: { fi: true, sv: true }

round.reason.liked_you:
  en: "Liked you"
  description: "Why a card is in the round (TD-12, #97), above the card: this person liked the reader, and liking back makes a match. Never says when or how often. A short label."
  fi: "Tykkäsi sinusta"
  sv: "Gillade dig"
  machine: { fi: true, sv: true }

round.reason.seen_before:
  en: "Seen before"
  description: "Why a card is in the round (TD-12), above the card: the reader was shown this person in an earlier round. A short label."
  fi: "Nähty aiemmin"
  sv: "Sedd tidigare"
  machine: { fi: true, sv: true }

round.reason.relaxed:
  en: "Shown because you widened your filters"
  description: "Why a card is in the round (TD-12, #99), above the card: the person is there because the reader relaxed a filter for a short pool, when the API names no field (an older API). A short label."
  fi: "Näytetään, koska laajensit suodattimiasi"
  sv: "Visas för att du vidgade dina filter"
  machine: { fi: true, sv: true }

round.reason.fish:
  en: "Sent you a fish"
  description: "Why a card is in the round (TD-12, #378, ADR-039): this person sent the reader a fish, a like that goes first; liking back makes a match. The word fish is the app's own for it (ADR-039 Open 1), for the native review. A short label."
  fi: "Lähetti sinulle kalan"
  sv: "Skickade en fisk till dig"
  machine: { fi: true, sv: true }

round.reason.relaxedField:
  en: "Relaxed for today: {field}"
  description: "Why a card is in the round (TD-12, #99, ADR-042 §9), above the card: the reader relaxed this deal-breaker for today and this person came in by it. {field} is the field's label, after a colon so nothing is inflected. A short label."
  fi: "Joustettu tänään: {field}"
  sv: "Släppt på i dag: {field}"
  machine: { fi: true, sv: true }

round.notAnswered:
  en: "Did not answer: {field}"
  description: "Above a card of today's round (TD-12, #99, ADR-042 §8): this person left unanswered the field of one of the reader's own deal-breakers, which lets such people through. {field} is the field's label, after a colon so nothing is inflected."
  fi: "Ei vastannut: {field}"
  sv: "Svarade inte: {field}"
  machine: { fi: true, sv: true }

round.relaxed.undo:
  en: "Undo for today: {field}"
  description: "Button on a card a relaxation brought, and in the short-pool panel (#99, ADR-042 §6): one tap undoes today's relaxation of this deal-breaker and takes back the cards it brought that the reader has not decided on. {field} is the field's label, after a colon."
  fi: "Peru tämän päivän jousto: {field}"
  sv: "Ångra dagens undantag: {field}"
  machine: { fi: true, sv: true }

round.short.title:
  en: "Few people today"
  description: "Heading of the short-pool panel at the end of a short round (TD-12, #99, ADR-042 §2): the reader's deal-breakers leave few people. Never blames the reader."
  fi: "Tänään vähän ihmisiä"
  sv: "Få personer i dag"
  machine: { fi: true, sv: true }

round.short.explain:
  en: "Your deal-breakers leave few people today. You can relax one for today only: tomorrow's round follows them as you set them, and one tap undoes it."
  description: "Short-pool panel (#99, ADR-042 §3): a relaxation is for the day only, by the reader's tap, undone by one; nothing else is ever relaxed."
  fi: "Ehdottomat rajasi jättävät tänään vähän ihmisiä. Voit joustaa yhdestä vain tämän päivän ajan: huomisen kierros noudattaa niitä niin kuin asetit ne, ja yksi napautus peruu jouston."
  sv: "Dina absoluta gränser lämnar få personer i dag. Du kan släppa på en bara för i dag: morgondagens runda följer dem som du har ställt in dem, och ett tryck ångrar det."
  machine: { fi: true, sv: true }

round.short.unanswered:
  en: "Include those who did not answer: {field}"
  description: "Button of the short-pool panel (#99, ADR-042 §3): for today, let through people who left this deal-breaker's field unanswered. {field} is the field's label, after a colon."
  fi: "Ota mukaan ne, jotka eivät vastanneet: {field}"
  sv: "Ta med dem som inte svarade: {field}"
  machine: { fi: true, sv: true }

round.short.aside:
  en: "Set aside for today: {field}"
  description: "Button of the short-pool panel (#99, ADR-042 §3): set this deal-breaker aside for today only. {field} is the field's label, after a colon."
  fi: "Ohita tänään: {field}"
  sv: "Bortse från i dag: {field}"
  machine: { fi: true, sv: true }

round.short.more:
  en: "{more, plural, =0 {A few more people} one {About # more person} other {About # more people}}"
  description: "Under a short-pool button (#99, ADR-042 §4): how much the relaxation widens the reader's pool, rounded down to the gate's step (matching_config waitlist_k, ten or more, ADR-015 §6); zero means fewer than a step. Never a count of cards."
  fi: "{more, plural, =0 {Muutama ihminen lisää} one {Noin # ihminen lisää} other {Noin # ihmistä lisää}}"
  sv: "{more, plural, =0 {Några fler personer} one {Ungefär # person till} other {Ungefär # fler personer}}"
  machine: { fi: true, sv: true }

round.short.nobody:
  en: "Nobody new to show today after all."
  description: "Short-pool panel (#99, ADR-042 §5): the relaxation was made, but by the time it was tapped it found nobody to add today. It can still be undone."
  fi: "Ketään uutta ei sittenkään ole näytettävänä tänään."
  sv: "Det finns ingen ny att visa i dag ändå."
  machine: { fi: true, sv: true }

round.short.failed:
  en: "That did not go through. Try again."
  description: "Short-pool panel (#99): a relaxation or its undo failed for a reason the reader cannot act on; nothing changed."
  fi: "Se ei onnistunut. Yritä uudelleen."
  sv: "Det gick inte. Försök igen."
  machine: { fi: true, sv: true }

round.fish:
  en: "Send a fish"
  description: "Decision button on a round card, above like and pass, a filled rounded square with a fish (#378, ADR-039): a like with a mark, first in the other person's round; matching_config fish_budget of them in a calendar week, Monday to Sunday (fish_window_days from a Monday). Not offered on a card that liked the reader or sent a fish, nor once no fish can go (the week's is sent and no earned one waits), except on the card that holds it (#475). Never a number or a period on the button: both are tunables. The word fish is the app's own (ADR-039 Open 1), for the native review."
  fi: "Lähetä kala"
  sv: "Skicka en fisk"
  max_length: 24
  machine: { fi: true, sv: true }

round.like:
  en: "Like"
  description: "Decision button on a round card, a filled pill with a heart (#379): the reader would like to talk to this person. By default at the right of the bottom bar; the person can mirror it for the left hand or stack it last in a one-handed column (#82). One word; see the glossary's like."
  fi: "Tykkää"
  sv: "Gilla"
  slangi: "Digaan"
  max_length: 14
  machine: { fi: true, sv: true, slangi: true }

round.pass:
  en: "Pass"
  description: "Decision button on a round card, an outlined rectangle with a cross (#379): not this time. By default at the left of the bottom bar; the person can mirror it for the left hand or stack it in a one-handed column (#82). Neutral and kind, never a rejection; see the glossary's pass. One word."
  fi: "Ohita"
  sv: "Hoppa över"
  slangi: "Skippaan"
  max_length: 14
  machine: { fi: true, sv: true, slangi: true }

round.likesLeft:
  en: "{likes, plural, =0 {No likes left today. New ones tomorrow.} one {# like left today} other {# likes left today}}"
  description: "Line beside the decision buttons on a round card (#524, ADR-036 §6): how many of the day's likes the reader has left, counting down from matching_config like_budget_balanced to zero; a fish counts in them. A plain fact in the same words at ten as at one: never urgent, never 'only one left'. =0: none are left and new ones come tomorrow, and passing stays possible. It wraps at large text sizes. The number is a tunable, so never write it out."
  fi: "{likes, plural, =0 {Tykkäyksiä ei ole tänään enää jäljellä. Uusia tulee huomenna.} one {# tykkäys jäljellä tänään} other {# tykkäystä jäljellä tänään}}"
  sv: "{likes, plural, =0 {Inga gillanden kvar i dag. Nya kommer i morgon.} one {# gillande kvar i dag} other {# gillanden kvar i dag}}"
  machine: { fi: true, sv: true }

round.undo:
  en: "Undo"
  description: "Button after a decision, in the round screen's header, or first in the bottom column in one-handed mode (#82): brings the last card back to decide again (ADR-034 §5, until midnight). One word."
  fi: "Kumoa"
  sv: "Ångra"
  max_length: 12
  machine: { fi: true, sv: true }

round.undo.label:
  en: "Undo your last decision"
  description: "What a screen reader says for the Undo button of the round screen: the last card comes back to decide again (#379)."
  fi: "Kumoa viimeisin valintasi"
  sv: "Ångra ditt senaste val"
  machine: { fi: true, sv: true }

round.revisit.like:
  en: "You liked this person. You can change that until midnight."
  description: "Above a card the reader brought back with Undo, when its decision is a like (ADR-034 §5): the like stands until another button is pressed."
  fi: "Tykkäsit tästä henkilöstä. Voit muuttaa sitä keskiyöhön asti."
  sv: "Du gillade den här personen. Du kan ändra det fram till midnatt."
  machine: { fi: true, sv: true }

round.revisit.pass:
  en: "You passed on this person. You can change that until midnight."
  description: "Above a card the reader brought back with Undo, when its decision is a pass (ADR-034 §5): the pass stands until another button is pressed. Neutral, never a rejection."
  fi: "Ohitit tämän henkilön. Voit muuttaa sitä keskiyöhön asti."
  sv: "Du hoppade över den här personen. Du kan ändra det fram till midnatt."
  machine: { fi: true, sv: true }

round.revisit.fish:
  en: "You sent this person a fish. You can change that until midnight."
  description: "Above a card the reader brought back with Undo, when its decision is a fish (ADR-034 §5, ADR-039): changed the same day, the fish is given back."
  fi: "Lähetit tälle henkilölle kalan. Voit muuttaa sitä keskiyöhön asti."
  sv: "Du skickade en fisk till den här personen. Du kan ändra det fram till midnatt."
  machine: { fi: true, sv: true }

round.done:
  en: "That was today's round. The next one comes tomorrow."
  description: "Round screen after the day's last card is decided (#379). Calm and final: no countdown, no count, nothing that loads more."
  fi: "Siinä oli päivän kierros. Seuraava tulee huomenna."
  sv: "Det var dagens runda. Nästa kommer i morgon."
  machine: { fi: true, sv: true }

round.empty:
  en: "There is nobody to show you today. Come back tomorrow."
  description: "Round screen when the day's round has no cards (#95): nobody in the pool both ways today. No filler, no count, nothing that blames the reader."
  fi: "Tänään ei ole ketään näytettävää. Tule takaisin huomenna."
  sv: "I dag finns det ingen att visa dig. Kom tillbaka i morgon."
  machine: { fi: true, sv: true }

round.none:
  en: "Your round is not ready yet. Come back tomorrow."
  description: "Round screen when the reader has no round for the day (ADR-035 §5: the read builds none, for instance while matching is not open). No date, no count."
  fi: "Kierroksesi ei ole vielä valmis. Tule takaisin huomenna."
  sv: "Din runda är inte klar än. Kom tillbaka i morgon."
  machine: { fi: true, sv: true }

round.newDay:
  en: "Yesterday's round ended at midnight. This is today's."
  description: "Round screen when the day ended while it was open and the new day's round was read in its place (ADR-034 §3). Said once, above the round."
  fi: "Eilinen kierros päättyi keskiyöllä. Tämä on tämän päivän kierros."
  sv: "Gårdagens runda tog slut vid midnatt. Det här är dagens."
  machine: { fi: true, sv: true }

round.gone:
  en: "That card is no longer available."
  description: "Round screen when the card on it could not be decided because it is gone meanwhile (404: the person was blocked, left, or is no longer shown). The card leaves the screen. Never says why."
  fi: "Kortti ei ole enää saatavilla."
  sv: "Kortet är inte längre tillgängligt."
  machine: { fi: true, sv: true }

round.decision.failed:
  en: "That was not saved. Try again."
  description: "Round screen when a like or a pass did not reach the API or failed there; the card stays for another try (#379)."
  fi: "Valintaa ei tallennettu. Yritä uudelleen."
  sv: "Det sparades inte. Försök igen."
  machine: { fi: true, sv: true }

round.match.title:
  en: "It's a match"
  description: "Round screen after a like made a match (#100, ADR-038): both liked each other. A short headline, no exclamation mark; see the tone guide."
  fi: "Se on mätsi"
  sv: "Det är en match"
  slangi: "Nyt natsaa"
  machine: { fi: true, sv: true, slangi: true }

round.match.body:
  en: "You both liked each other, so a conversation is open for you two under Conversations."
  description: "Round screen under the match headline (#100): what the match is and where it is. Conversations is the list's name (chat.list.title)."
  fi: "Tykkäsitte toisistanne, joten teillä on nyt keskustelu Keskusteluissa."
  sv: "Ni gillade varandra, så nu har ni ett samtal under Samtal."
  machine: { fi: true, sv: true }

round.match.open:
  en: "Go to the conversation"
  description: "Button under a match on the round screen (#100): opens the conversation the match opened."
  fi: "Siirry keskusteluun"
  sv: "Gå till samtalet"
  machine: { fi: true, sv: true }

round.match.continue:
  en: "Back to the round"
  description: "Button under a match on the round screen (#100): the round goes on with its next card, or says that it is done."
  fi: "Takaisin kierrokselle"
  sv: "Tillbaka till rundan"
  machine: { fi: true, sv: true }

# --- The chat (#348, ADR-031): the list of conversations, a conversation and its composer ---

chat.list.title:
  en: "Conversations"
  description: "Title of the list of conversations (#348)."
  fi: "Keskustelut"
  sv: "Samtal"
  machine: { fi: true, sv: true }

chat.back:
  en: "Back"
  description: "What a screen reader says for the arrow at the top of the conversation screens (#348): back to where the person came from."
  fi: "Takaisin"
  sv: "Tillbaka"
  machine: { fi: true, sv: true }

chat.list.open:
  en: "Open"
  description: "Heading of the list's first group (#348): the conversations going on now."
  fi: "Avoimet"
  sv: "Öppna"
  machine: { fi: true, sv: true }

chat.list.archived:
  en: "Archived"
  description: "Heading of the list's second group (#348): conversations quiet for a week, and ended ones."
  fi: "Arkistoidut"
  sv: "Arkiverade"
  machine: { fi: true, sv: true }

chat.list.archivedHint:
  en: "A conversation quiet for a week moves here, and so does one that has ended. Writing in a quiet one brings it back."
  description: "One line under the Archived heading (#348, TD-13, #351): the group holds the quiet conversations and the ended ones, and only a quiet one comes back when the person writes in it; an ended one never opens again. The week is silent_match_archive_days; say it plainly, no countdown. Never says how a conversation ended."
  fi: "Viikon hiljaa ollut keskustelu siirtyy tänne, samoin päättynyt keskustelu. Kun kirjoitat hiljaiseen keskusteluun, se palaa."
  sv: "Ett samtal som varit tyst en vecka flyttas hit, liksom ett samtal som har avslutats. När du skriver i ett tyst samtal kommer det tillbaka."
  machine: { fi: true, sv: true }

chat.list.empty:
  en: "No conversations yet. A conversation opens here when you match with someone."
  description: "The list when the person has no conversation (#348). Calm, no hurry."
  fi: "Ei vielä keskusteluja. Keskustelu avautuu tänne, kun saat mätsin."
  sv: "Inga samtal än. Ett samtal öppnas här när du får en match."
  machine: { fi: true, sv: true }

chat.list.loading:
  en: "Loading conversations…"
  description: "The list while it loads (#348)."
  fi: "Ladataan keskusteluja…"
  sv: "Laddar samtal…"
  machine: { fi: true, sv: true }

chat.list.failed:
  en: "Your conversations could not be loaded."
  description: "The list when it did not load (#348); the reason and a retry follow."
  fi: "Keskustelujasi ei voitu ladata."
  sv: "Dina samtal kunde inte laddas."
  machine: { fi: true, sv: true }

chat.deletedUser:
  en: "Deleted user"
  description: "Stands for the counterpart of a conversation once they deleted their account (#348, TD-7): the messages stay with the person, under this name."
  fi: "Poistettu käyttäjä"
  sv: "Raderad användare"
  machine: { fi: true, sv: true }

chat.row.noMessages:
  en: "No messages yet"
  description: "A row of the list before the first message (#348)."
  fi: "Ei vielä viestejä"
  sv: "Inga meddelanden än"
  machine: { fi: true, sv: true }

chat.row.mine:
  en: "You: {preview}"
  description: "A row of the list when the last message is the person's own (#348): the first words after it."
  fi: "Sinä: {preview}"
  sv: "Du: {preview}"
  machine: { fi: true, sv: true }

chat.row.unread:
  en: "{unread, plural, one {# unread message} other {# unread messages}}"
  description: "What a screen reader says of a row's unread mark (#348)."
  fi: "{unread, plural, one {# lukematon viesti} other {# lukematonta viestiä}}"
  sv: "{unread, plural, one {# oläst meddelande} other {# olästa meddelanden}}"
  machine: { fi: true, sv: true }

chat.unread.badge:
  en: "{unread, plural, one {# new} other {# new}}"
  description: "The unread mark on the home screen's button and on a row (#348): a shape with this text, never colour alone. Very short."
  fi: "{unread, plural, one {# uusi} other {# uutta}}"
  sv: "{unread, plural, one {# ny} other {# nya}}"
  machine: { fi: true, sv: true }

chat.state.ended:
  en: "This conversation has ended."
  description: "A closed conversation, instead of the composer and in the row of one ended before the conversation named nobody (#348, #351): an ended one, however it ended. Never says blocked or removed (ADR-030 §6)."
  fi: "Tämä keskustelu on päättynyt."
  sv: "Det här samtalet har avslutats."
  machine: { fi: true, sv: true }

chat.state.deleted:
  en: "This person deleted their account."
  description: "A closed conversation whose counterpart deleted their account (#348, TD-7), in its row and instead of the composer."
  fi: "Tämä henkilö poisti tilinsä."
  sv: "Den här personen har raderat sitt konto."
  machine: { fi: true, sv: true }

chat.closed.title:
  en: "Conversation ended"
  description: "An ended conversation (#351, ADR-031 Open 10): its heading on the conversation screen and its name in the list, in place of the other person's name, which an ended conversation never shows, so nobody learns from a name turning into Deleted user that the other left. However it ended: never says blocked, removed or by whom. Short, a heading."
  fi: "Keskustelu päättynyt"
  sv: "Samtalet har avslutats"
  machine: { fi: true, sv: true }

chat.closed.them:
  en: "The other person"
  description: "An ended conversation (#351): who wrote the other side's messages, heard by a screen reader before each of them and used where the name would stand, since an ended conversation shows no name."
  fi: "Keskustelukumppani"
  sv: "Den andra personen"
  machine: { fi: true, sv: true }

chat.actions.open:
  en: "More"
  description: "The conversation's header (#351): the label of the icon button that opens report, block and end (heard, never seen: the icon is decorative). Short."
  fi: "Lisää"
  sv: "Mer"
  machine: { fi: true, sv: true }

chat.actions.title:
  en: "Report, block or end"
  description: "The conversation's dialog of actions (#351): its title, over the buttons Report and block, Block and End conversation. In an ended conversation only the report is offered, under the same title."
  fi: "Ilmoita, estä tai lopeta"
  sv: "Anmäl, blockera eller avsluta"
  machine: { fi: true, sv: true }

chat.actions.unmatch:
  en: "End conversation"
  description: "The conversation's dialog of actions (#351): the button that chooses to end the conversation for both without blocking (the unmatch), and the button that confirms it on the next step. A verb phrase, a button."
  fi: "Lopeta keskustelu"
  sv: "Avsluta samtalet"
  machine: { fi: true, sv: true }

chat.actions.unmatchHint:
  en: "Neither of you can write in it any more. Nobody is blocked."
  description: "The conversation's dialog of actions (#351), the line under End conversation: what an unmatch does, and that it is not a block."
  fi: "Kumpikaan teistä ei voi enää kirjoittaa siihen. Ketään ei estetä."
  sv: "Ingen av er kan skriva i det längre. Ingen blockeras."
  machine: { fi: true, sv: true }

chat.unmatch.title:
  en: "End this conversation?"
  description: "The conversation's dialog of actions (#351), the title of the step that confirms ending the conversation."
  fi: "Lopetetaanko tämä keskustelu?"
  sv: "Avsluta det här samtalet?"
  machine: { fi: true, sv: true }

chat.unmatch.body:
  en: "Neither of you can write in it any more. It stays in the archive for both of you, and nobody is told who ended it. Nobody is blocked, and either of you can still report it for a while."
  description: "The conversation's dialog of actions (#351, ADR-030 §12), under the confirmation's title: an unmatch closes the conversation for both, keeps it read-only in both archives, says nothing of who ended it, blocks nobody, and leaves both able to report it for matching_config report_after_close_days. Never a number: the window is a tunable. Plain, calm."
  fi: "Kumpikaan teistä ei voi enää kirjoittaa siihen. Se jää teidän molempien arkistoon, eikä kenellekään kerrota, kuka sen lopetti. Ketään ei estetä, ja kumpi tahansa teistä voi vielä jonkin aikaa ilmoittaa siitä."
  sv: "Ingen av er kan skriva i det längre. Det stannar i arkivet för er båda, och ingen får veta vem som avslutade det. Ingen blockeras, och ni kan båda fortfarande anmäla det en tid."
  machine: { fi: true, sv: true }

chat.unmatch.done:
  en: "The conversation has ended."
  description: "Said after the conversation was ended from its dialog of actions (#351), on the list of conversations the person is taken back to."
  fi: "Keskustelu on päättynyt."
  sv: "Samtalet har avslutats."
  machine: { fi: true, sv: true }

chat.unmatch.failed:
  en: "The conversation could not be ended. Try again."
  description: "The conversation's dialog of actions (#351), an unmatch the API did not take (no connection, a server error); the dialog stays open."
  fi: "Keskustelun lopettaminen ei onnistunut. Yritä uudelleen."
  sv: "Det gick inte att avsluta samtalet. Försök igen."
  machine: { fi: true, sv: true }

chat.block.body:
  en: "The conversation ends for both of you, and you will not see each other here again, even if either of you deletes their account and comes back. A block cannot be undone. They are not told."
  description: "The conversation's dialog of actions (#351, ADR-030 §1 and §2), under Block this person?: a block from a conversation ends it for both, holds both ways and through either person's deletion, for good, and the other person is not told. Plain, calm, no blame."
  fi: "Keskustelu päättyy teiltä molemmilta, ettekä näe toisianne täällä enää, vaikka jompikumpi teistä poistaisi tilinsä ja palaisi. Estoa ei voi perua. Hänelle ei kerrota."
  sv: "Samtalet avslutas för er båda, och ni ser inte varandra här igen, även om någon av er raderar sitt konto och kommer tillbaka. En blockering kan inte ångras. Personen får inte veta det."
  machine: { fi: true, sv: true }

chat.report.copy:
  en: "The moderators get a copy of this whole conversation, your own messages and photos included, and keep it for twelve months."
  description: "The report step of the conversation's dialog of actions (#351, ADR-030 §8 and §12), first under its title: a report from a conversation freezes a copy of every message, both people's, photos included, for the moderators, kept twelve months from filing. Plain; the reporter should know their own words and pictures go too. What the report's block does follows it (chat.report.alsoEnds, or safety.report.alsoBlocks in an ended conversation)."
  fi: "Moderaattorit saavat kopion tästä koko keskustelusta, myös omista viesteistäsi ja kuvistasi, ja säilyttävät sen kaksitoista kuukautta."
  sv: "Moderatorerna får en kopia av hela det här samtalet, även dina egna meddelanden och bilder, och sparar den i tolv månader."
  machine: { fi: true, sv: true }

chat.report.alsoEnds:
  en: "A report also blocks them, for good, and ends this conversation for both of you: you will not see each other here again, even if either of you deletes their account. A block cannot be undone. They are not told."
  description: "The report step of the conversation's dialog of actions (#351, ADR-030 §1, §4 and §12), under chat.report.copy in a conversation that has not ended: sending the report sets the same final block as Block and ends the conversation for both; there is no confirmation step after it. In an ended conversation safety.report.alsoBlocks stands in its place. Says what chat.block.body says, in the report's words."
  fi: "Ilmoitus myös estää hänet pysyvästi ja päättää tämän keskustelun teiltä molemmilta: ette näe toisianne täällä enää, vaikka jompikumpi teistä poistaisi tilinsä. Estoa ei voi perua. Hänelle ei kerrota."
  sv: "En anmälan blockerar också personen, för gott, och avslutar det här samtalet för er båda: ni ser inte varandra här igen, även om någon av er raderar sitt konto. En blockering kan inte ångras. Personen får inte veta det."
  machine: { fi: true, sv: true }

chat.report.limited:
  en: "That is enough reports for today. You can send more after midnight."
  description: "The report step in an ended conversation (#351), the day's reports filed (429 report_budget_exceeded, matching_config reports_per_day): nothing was written. No block is offered there, so unlike errors.report_budget_exceeded it says when the cap lifts (the day rolls at midnight in Finland). Must not promise that this conversation can still be reported then: its window may close first. Never a number, the cap is a tunable."
  fi: "Tältä päivältä ilmoituksia on jo tarpeeksi. Voit lähettää lisää keskiyön jälkeen."
  sv: "Det räcker med anmälningar för i dag. Du kan skicka fler efter midnatt."
  machine: { fi: true, sv: true }

chat.report.photo:
  en: "The report points the moderators to this photo."
  description: "The report step opened from Report this photo (chat.photo.report) on a conversation's photo full size (#476, ADR-030 §13), first under its title, before chat.report.copy: the report names this photo, whose line the moderators' copy marks in words and lists first. Says only that; the copy and the block follow in their own lines. Plain, calm."
  fi: "Ilmoitus ohjaa moderaattorit tähän kuvaan."
  sv: "Anmälan pekar ut det här fotot för moderatorerna."
  machine: { fi: true, sv: true }

chat.notice.gone:
  en: "That conversation is no longer available."
  description: "Said on the list of conversations when an action from a conversation found it gone meanwhile (#351): nothing was reported, blocked or ended."
  fi: "Keskustelu ei ole enää saatavilla."
  sv: "Samtalet är inte längre tillgängligt."
  machine: { fi: true, sv: true }

chat.conversation.loading:
  en: "Loading the conversation…"
  description: "The conversation screen while it loads (#348)."
  fi: "Ladataan keskustelua…"
  sv: "Laddar samtalet…"
  machine: { fi: true, sv: true }

chat.conversation.failed:
  en: "The conversation could not be loaded."
