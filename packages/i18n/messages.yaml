notices.invitationCounted.body:
  en: "Somebody you invited has finished their profile. {reward, select, fish {You earned {fish, plural, one {a fish} other {# fish}}.} likes {You earned {likes, plural, one {an extra like} other {# extra likes}}.} both {You earned {fish, plural, one {a fish} other {# fish}} and {likes, plural, one {an extra like} other {# extra likes}}.} other {Thank you for inviting them.}}"
  description: "The home screen's notices (#107, ADR-044 §9), under the title: what the counted invitation earned. reward is fish, likes, both, or anything else when it earned nothing (matching_config invitation_reward switched off); fish and likes are the units it earned. Never who was invited, never when they joined. Fish is the app's super-like (ADR-039), an extra like one used by itself on a day the likes run out."
  fi: "Joku kutsumasi on saanut profiilinsa valmiiksi. {reward, select, fish {Ansaitsit {fish, plural, one {kalan} other {# kalaa}}.} likes {Ansaitsit {likes, plural, one {ylimääräisen tykkäyksen} other {# ylimääräistä tykkäystä}}.} both {Ansaitsit {fish, plural, one {kalan} other {# kalaa}} ja {likes, plural, one {ylimääräisen tykkäyksen} other {# ylimääräistä tykkäystä}}.} other {Kiitos, että kutsuit hänet.}}"
  sv: "Någon du bjöd in har gjort klart sin profil. {reward, select, fish {Du fick {fish, plural, one {en fisk} other {# fiskar}}.} likes {Du fick {likes, plural, one {ett extra gillande} other {# extra gillanden}}.} both {Du fick {fish, plural, one {en fisk} other {# fiskar}} och {likes, plural, one {ett extra gillande} other {# extra gillanden}}.} other {Tack för att du bjöd in.}}"
  machine: { fi: true, sv: true }

# --- Invitations (#107, ADR-044): a code for one friend, made and withdrawn in Settings, typed by the friend after the bank login ---

settings.invite.label:
  en: "Invitations"
  description: "Title of the row under Account in Settings and of the screen it opens (#107): invitation codes for friends, and a code from a friend. Not the profile's invitation to answer the later questions. Short."
  fi: "Kutsut"
  sv: "Inbjudningar"
  max_length: 24
  machine: { fi: true, sv: true }

settings.invite.waiting:
  en: "{waiting, plural, =0 {None waiting to be used} one {One waiting to be used} other {# waiting to be used}}"
  description: "Value of the Invitations row in Settings once the person may invite (#511, #376): how many invitations they made wait to be used."
  fi: "{waiting, plural, =0 {Ei yhtään odottamassa} one {Yksi odottaa käyttöä} other {# odottaa käyttöä}}"
  sv: "{waiting, plural, =0 {Ingen väntar på att användas} one {En väntar på att användas} other {# väntar på att användas}}"
  machine: { fi: true, sv: true }

settings.invite.loading:
  en: "Loading your invitations…"
  description: "The Invitations screen while the person's invitations are read (#107)."
  fi: "Ladataan kutsujasi…"
  sv: "Laddar dina inbjudningar…"
  machine: { fi: true, sv: true }

settings.invite.loadFailed:
  en: "Your invitations could not be loaded."
  description: "The Invitations screen when the read failed (#107); the reason and Try again follow (load.failed.*)."
  fi: "Kutsujasi ei voitu ladata."
  sv: "Dina inbjudningar kunde inte laddas."
  machine: { fi: true, sv: true }

settings.invite.intro:
  en: "Invite a friend with a code. They get the app at kuutti.app, sign in with their bank and type the code before their profile is complete. Each code works once."
  description: "The Invitations screen, the opening line for a person who may invite (#107, ADR-044 §1, §2): the friend types the code after the bank login, before their profile passes the gate's test; single use."
  fi: "Kutsu ystävä koodilla. Hän lataa sovelluksen osoitteesta kuutti.app, kirjautuu pankkitunnuksillaan ja kirjoittaa koodin ennen kuin hänen profiilinsa on valmis. Jokainen koodi toimii kerran."
  sv: "Bjud in en vän med en kod. Vännen hämtar appen på kuutti.app, loggar in med sina bankkoder och skriver in koden innan profilen är klar. Varje kod fungerar en gång."
  machine: { fi: true, sv: true }

settings.invite.earns:
  en: "{reward, select, fish {When a friend you invite finishes their profile, you get {fish, plural, one {a fish} other {# fish}}. An earned fish is used by itself once your own fish are used up.} likes {When a friend you invite finishes their profile, you get {likes, plural, one {an extra like} other {# extra likes}}. An extra like is used by itself on a day your likes run out.} both {When a friend you invite finishes their profile, you get {fish, plural, one {a fish} other {# fish}} and {likes, plural, one {an extra like} other {# extra likes}}. They are used by themselves once your own fish or likes run out.} other {Invitations earn nothing just now, but every friend you bring is welcome.}}"
  description: "The Invitations screen, what an invitation earns today (#107, ADR-044 §4, §8), from matching_config invitation_reward: reward is fish, likes, both, or anything else when both are 0; fish and likes are the units. Earned units wait and are used by themselves once the person's own are used up; never a number of days or a period (tunables)."
  fi: "{reward, select, fish {Kun kutsumasi ystävä saa profiilinsa valmiiksi, saat {fish, plural, one {kalan} other {# kalaa}}. Ansaittu kala käytetään automaattisesti, kun omat kalasi on käytetty.} likes {Kun kutsumasi ystävä saa profiilinsa valmiiksi, saat {likes, plural, one {ylimääräisen tykkäyksen} other {# ylimääräistä tykkäystä}}. Ylimääräinen tykkäys käytetään automaattisesti päivänä, jona tykkäyksesi loppuvat.} both {Kun kutsumasi ystävä saa profiilinsa valmiiksi, saat {fish, plural, one {kalan} other {# kalaa}} ja {likes, plural, one {ylimääräisen tykkäyksen} other {# ylimääräistä tykkäystä}}. Ne käytetään automaattisesti, kun omat kalasi tai tykkäyksesi loppuvat.} other {Kutsut eivät juuri nyt tuo mitään, mutta jokainen tuomasi ystävä on tervetullut.}}"
  sv: "{reward, select, fish {När en vän du bjuder in gör klart sin profil får du {fish, plural, one {en fisk} other {# fiskar}}. En intjänad fisk används automatiskt när dina egna fiskar är slut.} likes {När en vän du bjuder in gör klart sin profil får du {likes, plural, one {ett extra gillande} other {# extra gillanden}}. Ett extra gillande används automatiskt en dag då dina gillanden tar slut.} both {När en vän du bjuder in gör klart sin profil får du {fish, plural, one {en fisk} other {# fiskar}} och {likes, plural, one {ett extra gillande} other {# extra gillanden}}. De används automatiskt när dina egna fiskar eller gillanden tar slut.} other {Inbjudningar ger ingenting just nu, men varje vän du tar med är välkommen.}}"
  machine: { fi: true, sv: true }

settings.invite.notYet:
  en: "You can invite friends once your profile is complete."
  description: "The Invitations screen for a person whose profile has not passed the pond gate's test yet (#107, ADR-044 §1): no Make an invitation until then."
  fi: "Voit kutsua ystäviä, kun profiilisi on valmis."
  sv: "Du kan bjuda in vänner när din profil är klar."
  machine: { fi: true, sv: true }

settings.invite.make:
  en: "Make an invitation"
