  description: "Banner above the composer of an archived conversation (#348, TD-13)."
  fi: "Tämä keskustelu oli hiljaa viikon. Kirjoita, niin se palaa."
  sv: "Det här samtalet var tyst en vecka. Skriv, så kommer det tillbaka."
  machine: { fi: true, sv: true }

chat.history.earlier:
