  fi: "Kutsusi on valmis. Sen koodi on alla."
  sv: "Din inbjudan är klar. Koden finns nedan."
  machine: { fi: true, sv: true }

settings.invite.makeFailed:
  en: "The invitation could not be made. Try again."
  description: "The Invitations screen when Make an invitation failed for a reason the app has no words of its own for (#107)."
  fi: "Kutsua ei voitu tehdä. Yritä uudelleen."
  sv: "Inbjudan kunde inte skapas. Försök igen."
  machine: { fi: true, sv: true }

settings.invite.code.label:
