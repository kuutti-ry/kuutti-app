  fi: "Pidä täällä yhteystiedot, joilla sinut tavoittaa sovelluksen ulkopuolella. Kukaan ei näe niitä, ennen kuin jaat jonkin niistä keskustelussa sen yläosan painikkeella. Muutos tai poisto näkyy heti kaikkialla, missä olet sen jakanut."
  sv: "Spara här hur man når dig utanför appen. Ingen ser dem förrän du delar en av dem i ett samtal, med knappen högst upp. En ändring eller borttagning syns direkt överallt där du har delat den."
  machine: { fi: true, sv: true }

