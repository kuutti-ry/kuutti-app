# --- The Photo descriptions setting and the one-time screen-reader hint (#296 part 3) ---

settings.decisionButtons.label:
  en: "Decision buttons"
  description: "Settings, title of the row in Appearance and language and of its screen (#82): where Like and Pass sit on today's round, for the right hand or the left, one-handed mode, and the marks they carry (#520)."
  fi: "Valintapainikkeet"
  sv: "Valknappar"
  machine: { fi: true, sv: true }

settings.decisionButtons.explain:
  en: "Where Like and Pass sit on today's round. Each keeps its own word and shape wherever it is."
  description: "Decision buttons screen, its first line (#82): what the setting moves, and that the two buttons stay told apart by word and shape, never by colour or place alone."
  fi: "Missä Tykkää ja Ohita ovat päivän kierroksella. Kummallakin on aina oma sanansa ja muotonsa, missä se onkin."
  sv: "Var Gilla och Hoppa över finns i dagens runda. Båda behåller sitt eget ord och sin form var de än är."
  machine: { fi: true, sv: true }

settings.decisionButtons.hand:
  en: "Which hand"
  description: "Decision buttons screen, the name of the radio group of the two hands (#82), heard by a screen reader."
  fi: "Kumpi käsi"
  sv: "Vilken hand"
  machine: { fi: true, sv: true }

settings.decisionButtons.right:
  en: "Right hand"
  description: "Decision buttons screen, a choice (#82): Pass at the left and Like at the right, the default. Also the summary of the Settings row."
  fi: "Oikea käsi"
  sv: "Höger hand"
  machine: { fi: true, sv: true }

settings.decisionButtons.left:
  en: "Left hand"
  description: "Decision buttons screen, a choice (#82): Like at the left and Pass at the right. Also the summary of the Settings row."
  fi: "Vasen käsi"
  sv: "Vänster hand"
  machine: { fi: true, sv: true }

settings.decisionButtons.oneHanded:
  en: "One-handed"
  description: "Decision buttons screen, the switch's label (#82): the round's buttons in one column on the chosen hand's side."
  fi: "Yhdellä kädellä"
  sv: "Med en hand"
  machine: { fi: true, sv: true }

settings.decisionButtons.oneHandedHint:
  en: "Undo, the fish, Pass and Like in one column at the bottom on your hand's side, within your thumb's reach."
  description: "Decision buttons screen, under the one-handed switch (#82): what it does. The fish is the app's word for the super-like (ADR-039)."
  fi: "Kumoa, kala, Ohita ja Tykkää yhdessä sarakkeessa alhaalla kätesi puolella, peukalon ulottuvilla."
  sv: "Ångra, fisken, Hoppa över och Gilla i en kolumn längst ner på din hands sida, inom räckhåll för tummen."
  machine: { fi: true, sv: true }

settings.decisionButtons.style:
  en: "Button style"
  description: "Decision buttons screen, the name of the radio group of the marks Like and Pass carry (#520), heard by a screen reader."
  fi: "Painikkeiden tyyli"
  sv: "Knappstil"
  machine: { fi: true, sv: true }

settings.decisionButtons.style.kuutti:
  en: "Kuutti"
  description: "Decision buttons screen, a choice (#520), the default: Like and Pass carry the app's own heart and cross. The app's name."
  fi: "Kuutti"
  sv: "Kuutti"
  machine: { fi: true, sv: true }

settings.decisionButtons.style.shapes:
  en: "✕ and ○"
  description: "Decision buttons screen, a choice (#520): Like carries the ✕ and Pass the ○ of a game controller, in that order. Keep the two marks as they are. It names no console and no maker, on purpose (.claude/rules/mobile.md)."
  fi: "✕ ja ○"
  sv: "✕ och ○"
  machine: { fi: true, sv: true }

settings.decisionButtons.style.shapes.spoken:
  en: "Cross and circle"
  description: "Decision buttons screen, what a screen reader says for the choice shown as ✕ and ○ (#520): the two marks in words."
  fi: "Risti ja ympyrä"
  sv: "Kryss och cirkel"
  machine: { fi: true, sv: true }

settings.decisionButtons.style.letters:
  en: "A and B"
  description: "Decision buttons screen, a choice (#520): Like carries the A and Pass the B of a game controller, in that order. Keep the two letters as they are, in every language. It names no console and no maker, on purpose (.claude/rules/mobile.md)."
  fi: "A ja B"
  sv: "A och B"
  machine: { fi: true, sv: true }

settings.decisionButtons.styleHint:
  en: "Like and Pass can carry a game controller's marks in place of their icons: the first mark is Like, the second Pass. Their words stay."
  description: "Decision buttons screen, under the style choices (#520): what they do, and which mark is which. The words stay because the mark alone means nothing to anyone who does not play."
  fi: "Tykkää ja Ohita voivat saada kuvakkeidensa tilalle peliohjaimen merkit: ensimmäinen merkki on Tykkää, toinen Ohita. Sanat pysyvät."
  sv: "Gilla och Hoppa över kan få en spelkontrolls tecken i stället för sina ikoner: det första tecknet är Gilla, det andra Hoppa över. Orden står kvar."
  machine: { fi: true, sv: true }

settings.decisionButtons.withOneHanded:
  en: "{hand}, one-handed"
  description: "Summary of the Decision buttons row while one-handed mode is on (#82); {hand} is the chosen hand's name (settings.decisionButtons.right or .left), in the nominative."
  fi: "{hand}, yhdellä kädellä"
  sv: "{hand}, med en hand"
  machine: { fi: true, sv: true }

settings.photoDescriptions.label:
  en: Photo descriptions
  description: "Settings, title of the row in Appearance and language and of its screen (#296): the automatic descriptions, shown under the photos or not, and which parts are told. Also the title of the one-time hint for screen-reader users."
  fi: Kuvien kuvaukset
  sv: Bildbeskrivningar
  machine: { fi: true, sv: true }

settings.photoDescriptions.shown:
  en: "Shown under the photos"
  description: "Settings, the Photo descriptions row's state when the descriptions are shown as text under the photos (#296); heard as the row's value."
  fi: "Näytetään kuvien alla"
  sv: "Visas under fotona"
  machine: { fi: true, sv: true }

settings.photoDescriptions.notShown:
  en: "Not shown under the photos"
  description: "Settings, the Photo descriptions row's state when the descriptions are only read by a screen reader, the default (#296); heard as the row's value."
  fi: "Ei näytetä kuvien alla"
  sv: "Visas inte under fotona"
  machine: { fi: true, sv: true }

settings.photoDescriptions.explain:
  en: "The photo check describes what a sighted viewer sees in a photo: how many people, indoors or outdoors, the setting, a smile or glasses, an activity or an object. A screen reader reads it with each photo, after the owner's own caption. It is automatic and can be wrong."
  description: "Settings, the Photo descriptions screen, first text (#296): what the descriptions are and that they can be wrong."
  fi: "Kuvatarkistus kuvailee, mitä näkevä katsoja näkee kuvassa: kuinka monta ihmistä, sisällä vai ulkona, ympäristön, hymyn tai lasit, tekemisen tai esineen. Ruudunlukija lukee kuvauksen jokaisen kuvan kanssa kuvan omistajan oman kuvatekstin jälkeen. Kuvaus on automaattinen ja voi olla väärässä."
  sv: "Fotokontrollen beskriver vad en seende betraktare ser i ett foto: hur många personer, inomhus eller utomhus, omgivningen, ett leende eller glasögon, en aktivitet eller ett föremål. En skärmläsare läser upp den med varje foto, efter ägarens egen bildtext. Den är automatisk och kan ha fel."
  machine: { fi: true, sv: true }

settings.photoDescriptions.show:
  en: Show under photos
  description: "Settings, the Photo descriptions screen: label of the switch that shows the description as text under each photo on the card, in one's own photos and full size (#296). Off by default."
  fi: Näytä kuvien alla
  sv: Visa under fotona
  machine: { fi: true, sv: true }

settings.photoDescriptions.showHint:
  en: "As text under each photo on the card, in your photos and full size."
  description: "Settings, the Photo descriptions screen, under the Show under photos switch: where the text appears (#296)."
  fi: "Tekstinä jokaisen kuvan alla kortilla, omissa kuvissasi ja täysikokoisena."
  sv: "Som text under varje foto på kortet, bland dina foton och i full storlek."
  machine: { fi: true, sv: true }

settings.photoDescriptions.tell.title:
  en: Tell me about
  description: "Settings, the Photo descriptions screen: heading of the three switches that choose which parts of a description are read and shown (#296)."
  fi: Kerro minulle
  sv: Berätta om
  machine: { fi: true, sv: true }

settings.photoDescriptions.tell.people:
  en: People and setting
  description: "Settings, the Photo descriptions screen: label of the switch for the first part of a description, how many people, indoors or outdoors, and where (#296). On by default."
  fi: Ihmiset ja ympäristö
  sv: Personer och omgivning
  machine: { fi: true, sv: true }

settings.photoDescriptions.tell.face:
  en: Face
  description: "Settings, the Photo descriptions screen: label of the switch for the face part of a description, a smile, glasses, sunglasses, facial hair (#296). On by default; a person who finds it unwelcome turns it off."
  fi: Kasvot
  sv: Ansikte
  machine: { fi: true, sv: true }

settings.photoDescriptions.tell.objects:
  en: Activity and objects
  description: "Settings, the Photo descriptions screen: label of the switch for the last part of a description, what the person is doing and what is with them (#296). On by default."
  fi: Tekeminen ja esineet
  sv: Aktivitet och föremål
  machine: { fi: true, sv: true }

settings.photoDescriptions.hint.body:
  en: "It seems you use a screen reader. Each photo is read with a description of what the photo check sees in it, after the owner's own caption. In Settings the descriptions can also be shown under the photos, and parts of them left out."
  description: "The one-time hint on the first launch with a screen reader active (#296): a dialog titled Photo descriptions, with this text and two buttons. Never sent anywhere: the screen-reader state stays on the device."
  fi: "Näytät käyttävän ruudunlukijaa. Jokaisen kuvan kanssa luetaan kuvaus siitä, mitä kuvatarkistus näkee kuvassa, kuvan omistajan oman kuvatekstin jälkeen. Asetuksissa kuvaukset voi myös näyttää kuvien alla ja jättää osia niistä pois."
  sv: "Det verkar som att du använder en skärmläsare. Varje foto läses upp med en beskrivning av vad fotokontrollen ser i det, efter ägarens egen bildtext. I inställningarna kan beskrivningarna också visas under fotona, och delar av dem lämnas bort."
  machine: { fi: true, sv: true }

settings.photoDescriptions.hint.open:
  en: Open the setting
  description: "The screen-reader hint's first button (#296): opens the Photo descriptions screen in Settings and closes the hint for good."
  fi: Avaa asetus
  sv: Öppna inställningen
  machine: { fi: true, sv: true }

settings.photoDescriptions.hint.dismiss:
  en: Got it
  description: "The screen-reader hint's second button (#296): closes the hint for good."
  fi: Selvä
  sv: Uppfattat
  machine: { fi: true, sv: true }

settings.photoDescriptions.hint.close:
  en: Close
  description: "Screen-reader label of the screen-reader hint's close control (#296); closes the hint for good, like Got it."
  fi: Sulje
  sv: Stäng
  machine: { fi: true, sv: true }

admin.signIn.title:
  en: Sign in
  description: Admin panel, heading of the sign-in screen. English only (TD-17).

admin.signIn.explain:
  en: Moderators sign in with their bank, like everyone. The panel opens only for a bank login that has a moderator role.
  description: Admin panel, sign-in screen paragraph.

admin.signIn.button:
  en: Sign in with your bank
  description: Admin panel, the button that starts the staff bank login.

admin.signIn.error.admin_not_allowed:
  en: That bank login has no moderator role. Ask the maintainer to add it.
  description: Admin panel, the bank login came back refused with admin_not_allowed.

admin.signIn.error.no_api:
  en: This build of the panel names no API to sign in to; it was built without VITE_API_URL.
  description: Admin panel, a production build without an API address; nothing is sent anywhere.

admin.signIn.error.auth_rate_limited:
  en: Too many sign-ins were started just now. Wait a minute and sign in again.
  description: "Admin panel, the API refused the staff sign-in for its rate (ADR-026): too many from this network within a minute, or too many under way at once. Said for the fragment's error=auth_rate_limited and for the exchange's 429 (rate_limited)."

admin.signIn.error.generic:
  en: Sign-in did not complete. Try again.
  description: Admin panel, any other sign-in failure (a used code, the API unreachable).

admin.signIn.error.session_ended:
  en: Your session has ended. Sign in again.
  description: Admin panel, back at the sign-in because the API no longer honours the session (revoked, expired) while the panel was in use (#250).

