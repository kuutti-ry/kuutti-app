errors.not_found:
  en: Not found.
  description: API error message (404).
  fi: Ei löytynyt.
  sv: Hittades inte.
  machine: { fi: true, sv: true }

errors.unauthenticated:
  en: Sign in to continue.
  description: API error message (401) when the request carries no valid session.
  fi: Kirjaudu sisään jatkaaksesi.
  sv: Logga in för att fortsätta.
  machine: { fi: true, sv: true }

errors.payload_too_large:
  en: The request is too large.
  description: API error message (413) when the request body exceeds the limit.
  fi: Pyyntö on liian suuri.
  sv: Begäran är för stor.
  machine: { fi: true, sv: true }

errors.rate_limited:
  en: "Too many requests. Try again in {seconds, plural, one {# second} other {# seconds}}."
  description: API error message (429). {seconds} is the whole number of seconds until the limit resets.
  fi: "Liian monta pyyntöä. Yritä uudelleen {seconds, plural, one {# sekunnin} other {# sekunnin}} kuluttua."
  sv: "För många förfrågningar. Försök igen om {seconds, plural, one {# sekund} other {# sekunder}}."
  machine: { fi: true, sv: true }

errors.http_error:
  en: The request failed.
  description: API error message for an HTTP failure that has no message of its own.
  fi: Pyyntö epäonnistui.
  sv: Begäran misslyckades.
  machine: { fi: true, sv: true }

errors.internal_error:
  en: Something went wrong on our side.
  description: API error message (500). Never carries detail.
  fi: Jokin meni vikaan meidän päässämme.
  sv: Något gick fel hos oss.
  machine: { fi: true, sv: true }

errors.auth_state_mismatch:
  en: This login attempt is unknown or has expired. Start again.
  description: Bank login, callback with an unknown or expired state.
  fi: Tätä kirjautumisyritystä ei tunnisteta tai se on vanhentunut. Aloita alusta.
  sv: Det här inloggningsförsöket är okänt eller har gått ut. Börja om.
  machine: { fi: true, sv: true }

errors.auth_code_used:
  en: This code is unknown, already used or expired. Sign in again.
  description: Bank login, the one-time code the app exchanges is not valid.
  fi: Tämä koodi on tuntematon, jo käytetty tai vanhentunut. Kirjaudu uudelleen.
  sv: Den här koden är okänd, redan använd eller har gått ut. Logga in igen.
  machine: { fi: true, sv: true }

errors.auth_under_18:
  en: Kuutti is for adults only.
  description: Bank login, the identification says the person is under 18. Nothing is stored.
  fi: Kuutti on vain täysi-ikäisille.
  sv: Kuutti är bara för vuxna.
  machine: { fi: true, sv: true }

errors.auth_provider_error:
  en: The identification service did not complete the login. Try again in a moment.
  description: Bank login, the broker returned an error or an unusable answer.
  fi: Tunnistuspalvelu ei saanut kirjautumista valmiiksi. Yritä hetken kuluttua uudelleen.
  sv: Identifieringstjänsten slutförde inte inloggningen. Försök igen om en stund.
  machine: { fi: true, sv: true }

errors.auth_banned:
  en: This account has been closed and cannot be reopened.
  description: Bank login refused because the identity is banned (TD-7). Says nothing about why.
  fi: Tämä tili on suljettu, eikä sitä voi avata uudelleen.
  sv: Det här kontot har stängts och kan inte öppnas igen.
  machine: { fi: true, sv: true }

errors.auth_suspended:
  en: This account is suspended for now.
  description: Bank login refused because the identity is suspended.
  fi: Tämä tili on toistaiseksi jäädytetty.
  sv: Det här kontot är tills vidare avstängt.
  machine: { fi: true, sv: true }

errors.auth_cooldown:
  en: You deleted your account recently. A new one is possible after the waiting time.
  description: Bank login refused because the identity is inside the deletion cooldown; the date is in the API log, not in the envelope.
  fi: Poistit tilisi äskettäin. Uuden tilin voi luoda odotusajan jälkeen.
  sv: Du raderade ditt konto nyligen. Ett nytt konto är möjligt efter väntetiden.
  machine: { fi: true, sv: true }

errors.auth_cancelled:
  en: The sign-in was cancelled at the bank.
  description: API error message (400) when the person backed out at the bank (the broker answered access_denied); the app shows its own text.
  fi: Kirjautuminen peruttiin pankissa.
  sv: Inloggningen avbröts hos banken.
  machine: { fi: true, sv: true }

errors.session_expired:
  en: Your session has expired. Please continue; it renews by itself.
  description: API error message (401) when the access token has run out; the app refreshes and retries without showing this unless the refresh fails too.
  fi: Istuntosi on vanhentunut. Jatka; se uusiutuu itsestään.
  sv: Din session har gått ut. Fortsätt; den förnyas av sig själv.
  machine: { fi: true, sv: true }

errors.session_revoked:
  en: You have been signed out of this device. Sign in with your bank to continue.
  description: API error message (401) when the session was ended (log out everywhere, a reused refresh token, or a sanction); the app returns to the sign-in screen.
  fi: Sinut on kirjattu ulos tältä laitteelta. Kirjaudu pankkitunnuksillasi jatkaaksesi.
  sv: Du har loggats ut från den här enheten. Logga in med din bank för att fortsätta.
  machine: { fi: true, sv: true }

errors.unsupported_media_type:
  en: The request body is not in a form the API accepts.
  description: API error message (415) when a route was called with a content type it does not take (a JSON body on the photo upload, for example).
  fi: Pyynnön sisältö ei ole muodossa, jonka rajapinta hyväksyy.
  sv: Begärans innehåll är inte i ett format som API:et tar emot.
  machine: { fi: true, sv: true }

errors.photo_unsupported:
  en: This file is not a photo Kuutti can use. Choose a JPEG, PNG or WebP picture.
  description: Photo upload (415), the bytes are not a JPEG, PNG or WebP (an animated GIF, a HEIC, a video).
  fi: Tämä tiedosto ei ole kuva, jota Kuutti voi käyttää. Valitse JPEG-, PNG- tai WebP-kuva.
  sv: Den här filen är inte ett foto som Kuutti kan använda. Välj en JPEG-, PNG- eller WebP-bild.
  machine: { fi: true, sv: true }

errors.photo_invalid:
  en: The photo could not be read. Try another picture.
  description: Photo upload (422), the decoder could not read the file (a damaged or lying file).
  fi: Kuvaa ei voitu lukea. Kokeile toista kuvaa.
  sv: Fotot kunde inte läsas. Prova en annan bild.
  machine: { fi: true, sv: true }

errors.photo_too_many_pixels:
  en: The photo is too large. Choose a smaller picture.
  description: Photo upload (422), the image has more pixels than the cap; the app pre-resizes, so this is a picture that bypassed the app.
  fi: Kuva on liian suuri. Valitse pienempi kuva.
  sv: Fotot är för stort. Välj en mindre bild.
  machine: { fi: true, sv: true }

errors.photo_limit:
  en: You already have the maximum number of photos. Remove one to add another.
  description: Photo upload (409), the account has max_photos photos.
  fi: Sinulla on jo enimmäismäärä kuvia. Poista yksi lisätäksesi toisen.
  sv: Du har redan det största antalet foton. Ta bort ett för att lägga till ett annat.
  machine: { fi: true, sv: true }

errors.photo_order_invalid:
  en: The photo order did not include every photo. Reload and try again.
  description: Photo reorder (400), the list did not name each of the account's photos exactly once (the app's view was stale).
  fi: Kuvien järjestys ei sisältänyt kaikkia kuvia. Lataa uudelleen ja yritä taas.
  sv: Fotoordningen innehöll inte alla foton. Ladda om och försök igen.
  machine: { fi: true, sv: true }

errors.photo_not_appealable:
  en: A person cannot be asked to look at this photo.
  description: Photo appeal (409), the photo was not rejected by the automatic check, was appealed already, or showed nudity the check was very sure of (#253).
  fi: Tätä kuvaa ei voi pyytää ihmisen katsottavaksi.
  sv: Det går inte att be en person titta på det här fotot.
  machine: { fi: true, sv: true }

errors.media_busy:
  en: Many photos are being processed right now. Try again in a moment.
  description: "Photo upload or a photo in a conversation (503 with Retry-After): image processing is at its concurrency limit, or the photo check cannot run just now (#350)."
  fi: Kuvia käsitellään juuri nyt paljon. Yritä hetken kuluttua uudelleen.
  sv: Många foton bearbetas just nu. Försök igen om en stund.
  machine: { fi: true, sv: true }

errors.photo_budget_exceeded:
  en: You have looked at many photos today. Photos are available again after midnight.
  description: Photo URL route (429 with Retry-After), the account's fetches of that variant have reached the day's budget from matching_config (TD-6, #52); the day rolls at midnight in Finland. Said plainly, nobody is limited in silence.
  fi: Olet katsonut tänään paljon kuvia. Kuvat ovat taas saatavilla keskiyön jälkeen.
  sv: Du har tittat på många foton i dag. Fotona är tillgängliga igen efter midnatt.
  machine: { fi: true, sv: true }

errors.card_budget_exceeded:
  en: You have seen many profiles today. New ones come after midnight.
  description: Card route (429 with Retry-After), the account has been shown the day's budget of cards from matching_config exposure_cards_per_day (TD-6, #47); the day rolls at midnight in Finland.
  fi: Olet nähnyt tänään paljon profiileja. Uusia tulee keskiyön jälkeen.
  sv: Du har sett många profiler i dag. Nya kommer efter midnatt.
  machine: { fi: true, sv: true }

errors.export_budget_exceeded:
  en: That is enough copies of your data for today. You can download it again after midnight.
  description: Export route (429 with Retry-After), the account has taken the day's copies from matching_config exports_per_day (#237); the day rolls at midnight in Finland. Said plainly, nobody is limited in silence.
  fi: Tältä päivältä kopioita tiedoistasi on jo tarpeeksi. Voit ladata ne uudelleen keskiyön jälkeen.
  sv: Det räcker med kopior av dina uppgifter för i dag. Du kan ladda ner dem igen efter midnatt.
  machine: { fi: true, sv: true }

errors.feedback_budget_exceeded:
  en: That is enough feedback for today. You can send more after midnight.
  description: "Feedback route (429 with Retry-After), the account has sent the day's feedback, matching_config feedback_per_day (#171); the day rolls at midnight in Finland. Said plainly, nobody is limited in silence."
  fi: Tältä päivältä palautetta on jo tarpeeksi. Voit lähettää lisää keskiyön jälkeen.
  sv: Det räcker med respons för i dag. Du kan skicka mer efter midnatt.
  machine: { fi: true, sv: true }

errors.report_budget_exceeded:
  en: That is enough reports for today. You can still block this person, but then you cannot report them later.
  description: "Report route (429 with Retry-After), the account has filed the day's reports, matching_config reports_per_day (#84, ADR-030 §4); nothing was written, the block neither, so the person is pointed to blocking, which has no cap. The app's report step shows it with a Block button under it. A blocked person's card is gone for good and there is no list of blocks, so a report after a block is impossible in the app: the text must not promise one. Never a number, the cap is a tunable."
  fi: Tältä päivältä ilmoituksia on jo tarpeeksi. Voit silti estää tämän henkilön, mutta silloin et voi ilmoittaa hänestä myöhemmin.
  sv: Det räcker med anmälningar för i dag. Du kan ändå blockera den här personen, men då kan du inte anmäla hen senare.
  machine: { fi: true, sv: true }

errors.report_window_closed:
  en: "This conversation can no longer be reported."
  description: "Report from a conversation (409, #351, ADR-030 §12): the conversation closed longer ago than matching_config report_after_close_days, or the other person deleted their account. Must not say which, nor how it closed. Never a number, the window is a tunable."
  fi: "Tästä keskustelusta ei voi enää ilmoittaa."
  sv: "Det går inte längre att anmäla det här samtalet."
  machine: { fi: true, sv: true }

errors.round_expired:
  en: "That round ended at midnight, so this was not saved."
  description: "Today's round (409, #96, ADR-034): a card of a day that has ended was liked, passed or reported seen; the app reads today's round again."
  fi: "Kierros päättyi keskiyöllä, joten tätä ei tallennettu."
  sv: "Rundan tog slut vid midnatt, så det här sparades inte."
  machine: { fi: true, sv: true }

errors.found_them_answered:
  en: "You told us already. Thank you."
  description: "\"Löysin hänet\" (409, #83, ADR-040): this account told Kuutti before; each counts once. Nothing was counted."
  fi: "Kerroit jo meille. Kiitos."
  sv: "Du har redan berättat för oss. Tack."
  machine: { fi: true, sv: true }

errors.match_made:
  en: "This like made a match, so it stays. You can still end the conversation under Conversations."
  description: "Today's round (409, #100, ADR-038): a like that made a match was changed; a like that is part of a match is final (the maintainer, 20/10/2026). Conversations is the list's name (chat.list.title). Nothing was saved."
  fi: "Tästä tykkäyksestä tuli mätsi, joten se pysyy. Voit silti lopettaa keskustelun Keskusteluissa."
  sv: "Det här gillandet blev en match, så det står kvar. Du kan fortfarande avsluta samtalet under Samtal."
  machine: { fi: true, sv: true }

errors.already_relaxed:
  en: "You relaxed that one for today already."
  description: "Today's round (409, #99, ADR-042 §5): the same deal-breaker relaxed twice the same day, from two devices or a tap that crossed another. Nothing was saved."
  fi: "Joustit siitä jo tälle päivälle."
  sv: "Du har redan släppt på den för i dag."
  machine: { fi: true, sv: true }

errors.relaxations_changed:
  en: "Your relaxations for today changed meanwhile. Look again and choose."
  description: "Today's round (409, #99, ADR-042 §5): another device relaxed or undid a deal-breaker between this screen's read and its tap. Nothing was saved; the panel reads the offers again."
  fi: "Tämän päivän joustosi muuttuivat sillä välin. Katso uudelleen ja valitse."
  sv: "Dina undantag för i dag ändrades under tiden. Titta igen och välj."
  machine: { fi: true, sv: true }

errors.fish_budget_exceeded:
  en: "You cannot send a fish just now. You can still like."
  description: "Today's round (429 with Retry-After, #378, ADR-039): the person has sent matching_config fish_budget fish within the period of fish_window_days counted from a Monday, the calendar week (#475), and no earned fish waits; Retry-After says when the next can go. The round screen says it when another phone sent the week's fish meanwhile, and takes the fish button away; it never names the day of the next, which is Monday. Nothing was saved. Never a number or a period: both are tunables."
  fi: "Et voi lähettää kalaa juuri nyt. Voit silti tykätä."
  sv: "Du kan inte skicka en fisk just nu. Du kan fortfarande gilla."
  machine: { fi: true, sv: true }

errors.like_budget_exceeded:
  en: "You have used today's likes. New ones come after midnight; you can still pass."
  description: "Today's round (429 with Retry-After, #98, ADR-036): the day's likes from matching_config like_budget_balanced are used; a like back on a card of somebody who liked the person is free and a pass is never counted. The day rolls at midnight in Finland. Nothing was saved."
  fi: "Olet käyttänyt tämän päivän tykkäykset. Uusia tulee keskiyön jälkeen, mutta voit yhä ohittaa."
  sv: "Du har använt dagens gillanden. Nya kommer efter midnatt, men du kan fortfarande hoppa över."
  machine: { fi: true, sv: true }

errors.invitation_not_yet:
  en: "You can invite friends once your profile is complete."
  description: "Invitations (409, #107, ADR-044 §1): only a person whose profile has passed the pond gate's completeness test may make an invitation. Nothing was saved."
  fi: "Voit kutsua ystäviä, kun profiilisi on valmis."
  sv: "Du kan bjuda in vänner när din profil är klar."
  machine: { fi: true, sv: true }

errors.invitations_full:
  en: "You have as many invitations waiting as you can have. Withdraw one, or wait until a friend uses one."
  description: "Invitations (409, #107, ADR-044 §5): the person holds matching_config invitations_open invitations nobody has used yet. Never a number: the limit is a tunable. Withdraw is the open invitation's own button. Nothing was saved."
  fi: "Sinulla on jo niin monta odottavaa kutsua kuin voi olla. Peru jokin niistä tai odota, että ystävä käyttää sen."
  sv: "Du har redan så många väntande inbjudningar som du kan ha. Dra tillbaka en, eller vänta tills en vän använder den."
  machine: { fi: true, sv: true }

errors.invitation_not_for_you:
  en: "This account cannot use an invitation code. A code is for someone new, before their profile is complete, and works once."
  description: "Typing an invitation code (409, #107, ADR-044 §6): the person cannot use one: their profile has passed the gate's test already, they used a code before, the current terms are not accepted, or their identity had an account deleted before. Must not say which, and says nothing of the code, which was not looked up."
  fi: "Tällä tilillä ei voi käyttää kutsukoodia. Koodi on uudelle käyttäjälle ennen kuin profiili on valmis, ja se toimii vain kerran."
  sv: "Det här kontot kan inte använda en inbjudningskod. En kod är för någon ny, innan profilen är klar, och fungerar bara en gång."
  machine: { fi: true, sv: true }

errors.invitation_unknown:
  en: "That code does not work. Check it and try again."
  description: "Typing an invitation code (404, #107, ADR-044 §6): no open invitation has that code. A code used already and the person's own get the same words (ADR-027 §3's one answer), so they must not say which."
  fi: "Koodi ei toimi. Tarkista se ja yritä uudelleen."
  sv: "Koden fungerar inte. Kontrollera den och försök igen."
  machine: { fi: true, sv: true }

errors.invitation_tries_exceeded:
  en: "You have tried enough codes for today. You can try again after midnight."
  description: "Typing an invitation code (429 with Retry-After, #107, ADR-044 §6): matching_config invitation_tries_per_day tries a Finnish day, whatever their answer. Never a number: the limit is a tunable. The day rolls at midnight in Finland."
  fi: "Olet kokeillut tänään jo tarpeeksi koodeja. Voit yrittää uudelleen keskiyön jälkeen."
  sv: "Du har provat tillräckligt många koder i dag. Du kan försöka igen efter midnatt."
  machine: { fi: true, sv: true }

errors.conversation_closed:
  en: "This conversation has ended, so the message was not sent."
  description: "Send (409, #348, ADR-031 §3): the conversation is closed, a block stands between the two, or the other person deleted their account. Must not say which: a block reads as an ended conversation (ADR-030 §6)."
  fi: "Tämä keskustelu on päättynyt, joten viestiä ei lähetetty."
  sv: "Det här samtalet har avslutats, så meddelandet skickades inte."
  machine: { fi: true, sv: true }

errors.message_too_long:
  en: "The message is too long. Make it shorter and send it again."
  description: "Send (400, #348): over matching_config message_max_length characters after trimming. Never a number: the limit is a tunable, and the composer counts down."
  fi: "Viesti on liian pitkä. Lyhennä sitä ja lähetä uudelleen."
  sv: "Meddelandet är för långt. Korta det och skicka igen."
  machine: { fi: true, sv: true }

errors.contact_details:
  en: "A message cannot carry an e-mail address, a link, a phone number or a social media handle. To give your number or a username, keep it in Settings, under Ways to reach you, and share it from the top of the conversation."
  description: "Send (400, #348, the plain-text rule of #47 for messages), a photo's caption too (#350): the text carried a way to reach the person outside Kuutti. The API logs the kind found, never the text. Its second sentence is the way through (#103), in the words of chat.composer.error.contact_details."
  fi: "Viestissä ei voi olla sähköpostiosoitetta, linkkiä, puhelinnumeroa tai somekäyttäjänimeä. Jos haluat antaa numerosi tai käyttäjänimesi, tallenna se kohtaan Asetukset, Mistä sinut tavoittaa, ja jaa se keskustelun yläosasta."
  sv: "Ett meddelande kan inte innehålla en e-postadress, en länk, ett telefonnummer eller ett användarnamn på sociala medier. Vill du ge ditt nummer eller ett användarnamn, spara det under Inställningar, Hur man når dig, och dela det högst upp i samtalet."
  machine: { fi: true, sv: true }

errors.contact_invalid:
  en: "Check what you typed: it does not look like a phone number or a username of this kind."
  description: "Settings, Ways to reach you (400, #103): the value is not one of its kind (normaliseContact in packages/schema). The detail names the kind, never the value."
  fi: "Tarkista, mitä kirjoitit: se ei näytä tämänlaiselta puhelinnumerolta tai käyttäjänimeltä."
  sv: "Kontrollera vad du skrev: det ser inte ut som ett telefonnummer eller ett användarnamn av det här slaget."
  machine: { fi: true, sv: true }

errors.contact_not_stored:
  en: "Save this contact under Settings, Ways to reach you, first."
  description: "Conversation, Share contact (409, #103): the person keeps no contact of that kind, removed meanwhile on another phone. Settings and Ways to reach you are the screens' own names."
  fi: "Tallenna tämä yhteystieto ensin kohtaan Asetukset, Mistä sinut tavoittaa."
  sv: "Spara först den här kontaktuppgiften under Inställningar, Hur man når dig."
  machine: { fi: true, sv: true }

errors.message_budget_exceeded:
  en: "You are sending messages very fast. Wait a moment and send again."
  description: "Send (429 with Retry-After, #348, ADR-026): over matching_config messages_per_minute for the account. Calm, never a number."
  fi: "Lähetät viestejä hyvin nopeasti. Odota hetki ja lähetä uudelleen."
  sv: "Du skickar meddelanden väldigt snabbt. Vänta en stund och skicka igen."
  machine: { fi: true, sv: true }

errors.photo_rejected_nudity:
  en: Not sent. Photos with nudity cannot be sent on Kuutti.
  description: "Photo in a conversation (400, #350): the automatic check was sure the photo shows nudity; nothing was stored. The sender's words keep the field."
  fi: Ei lähetetty. Alastomuutta sisältäviä kuvia ei voi lähettää Kuutissa.
  sv: Inte skickat. Foton med nakenhet kan inte skickas på Kuutti.
  machine: { fi: true, sv: true }

errors.photo_rejected_violence:
  en: Not sent. Photos with violence or weapons cannot be sent on Kuutti.
  description: "Photo in a conversation (400, #350): the automatic check was sure the photo shows violence or weapons; nothing was stored."
  fi: Ei lähetetty. Kuvia, joissa on väkivaltaa tai aseita, ei voi lähettää Kuutissa.
  sv: Inte skickat. Foton med våld eller vapen kan inte skickas på Kuutti.
  machine: { fi: true, sv: true }

errors.photo_rejected_other:
  en: Not sent. This photo cannot be sent on Kuutti; try another one.
  description: "Photo in a conversation (400, #350): the automatic check was sure the photo shows something disturbing or hateful; nothing was stored. Names no label."
  fi: Ei lähetetty. Tätä kuvaa ei voi lähettää Kuutissa; kokeile toista.
  sv: Inte skickat. Det här fotot kan inte skickas på Kuutti; prova ett annat.
  machine: { fi: true, sv: true }

errors.message_photo_budget_exceeded:
  en: You have tried to send many photos today. You can send photos again after midnight.
  description: "Photo in a conversation (429 with Retry-After, #350): over matching_config message_photos_per_day (the photos sent) or message_photo_attempts_per_day (the sends tried, refused ones included) for the account; both days roll at midnight in Finland. Never a number."
  fi: Olet yrittänyt lähettää tänään paljon kuvia. Voit lähettää kuvia taas keskiyön jälkeen.
  sv: Du har försökt skicka många foton i dag. Du kan skicka foton igen efter midnatt.
  machine: { fi: true, sv: true }

errors.text_contact_details:
  en: Your profile text cannot contain an e-mail address, a link, a phone number or a social media handle.
  description: Profile save (400), a text field carried a way to reach the person outside Kuutti (#47, the plain-text rule). The API says which field in the envelope's detail, never in the message.
  fi: Profiilitekstissä ei voi olla sähköpostiosoitetta, linkkiä, puhelinnumeroa tai somekäyttäjänimeä.
  sv: Profiltexten kan inte innehålla en e-postadress, en länk, ett telefonnummer eller ett användarnamn på sociala medier.
  machine: { fi: true, sv: true }

errors.special_category_locked:
  en: This field needs your explicit consent first.
  description: Profile save (403), a special-category field was set without the consent version (#47, ADR-009).
  fi: Tämä kenttä vaatii ensin nimenomaisen suostumuksesi.
  sv: Det här fältet kräver först ditt uttryckliga samtycke.
  machine: { fi: true, sv: true }

errors.agreement_outdated:
  en: "This text has changed since you read it. Please read and accept the new version."
  description: "Consent route (409), the version the app sent is not the current consent_version of that wording (#46)."
  fi: "Tämä teksti on muuttunut sen jälkeen, kun luit sen. Lue ja hyväksy uusi versio."
  sv: "Den här texten har ändrats sedan du läste den. Läs och godkänn den nya versionen."
  machine: { fi: true, sv: true }

errors.too_many_changes:
  en: "You have changed this many times today. Try again tomorrow."
  description: "Consent route (429), the research opt-in was given and withdrawn more than the day allows (#46); the rows are proof of consent and are kept, so churn is capped."
  fi: "Olet muuttanut tätä tänään monta kertaa. Yritä uudelleen huomenna."
  sv: "Du har ändrat det här många gånger i dag. Försök igen i morgon."
  machine: { fi: true, sv: true }

errors.change_too_soon:
  en: "You changed this recently. A change is possible again once the waiting time has passed."
  description: "PUT /account/gender or PUT /preferences (429): the gender or whom one seeks was changed less than change_cadence_days ago (#147, ADR-015 §9). No hostile wording: somebody transitioning must not hit a wall. The app adds the date (onboarding.changeFrom)."
  fi: "Muutit tätä äskettäin. Muutos on taas mahdollinen, kun odotusaika on kulunut."
  sv: "Du ändrade det här nyligen. En ändring är möjlig igen när väntetiden har gått."
  machine: { fi: true, sv: true }

errors.filter_unanswered:
  en: "To filter on this, share your own answer first."
  description: "PUT /preferences/deal-breakers (409): a deal-breaker on a field the person has not answered themselves (#149, the disclose-to-filter rule)."
  fi: "Suodattaaksesi tällä kerro ensin oma vastauksesi."
  sv: "För att filtrera på det här, dela ditt eget svar först."
  machine: { fi: true, sv: true }

errors.pond_unknown:
  en: "That area is not on the list."
  description: "Pond choice (400), the pond id names no pond (#46)."
  fi: "Tuota aluetta ei ole listalla."
  sv: "Det området finns inte på listan."
  machine: { fi: true, sv: true }

errors.admin_not_allowed:
  en: This bank login has no moderator role.
  description: Staff sign-in (403), the identified person has no row in moderator_roles or their identity is not in good standing; nothing was created.
  fi: Tällä pankkitunnistautumisella ei ole moderaattorin roolia.
  sv: Den här bankinloggningen har ingen moderatorroll.
  machine: { fi: true, sv: true }

errors.admin_forbidden:
  en: Your role does not allow this.
  description: Admin routes (403), the session's role is not one the route admits (a researcher on the photo queue, for example).
  fi: Roolisi ei salli tätä.
  sv: Din roll tillåter inte det här.
  machine: { fi: true, sv: true }

errors.media_unavailable:
  en: Photos are not available right now.
  description: Photo routes (503) when the API has no object storage configured (a developer's machine without the S3 stand-in, an environment before the media module is applied).
  fi: Kuvat eivät ole juuri nyt käytettävissä.
  sv: Foton är inte tillgängliga just nu.
  machine: { fi: true, sv: true }

signIn.title:
  en: Sign in
  description: Sign-in screen heading.
  fi: Kirjaudu sisään
  sv: Logga in
  machine: { fi: true, sv: true }

signIn.explain:
  en: Kuutti verifies every account through a Finnish bank. Your bank confirms who you are; Kuutti keeps only your year and month of birth and a code that cannot be turned back into you.
  description: Sign-in screen, the paragraph above the button; what the bank login is for and what is kept (rules 1 and 3).
  fi: Kuutti varmentaa jokaisen tilin suomalaisen pankin kautta. Pankkisi vahvistaa, kuka olet; Kuutti säilyttää vain syntymävuotesi ja -kuukautesi sekä koodin, josta sinua ei voi tunnistaa.
  sv: Kuutti verifierar varje konto via en finländsk bank. Din bank bekräftar vem du är; Kuutti sparar bara ditt födelseår och din födelsemånad samt en kod som inte kan spåras tillbaka till dig.
  machine: { fi: true, sv: true }

signIn.button:
  en: Sign in with your bank
  description: Sign-in screen, the button that opens the bank chooser in the system browser. Also the button after a refusal that lasts (deletion cooldown, ban, suspension, under 18), where trying again would only repeat it, but the phone may be somebody else's (#466).
  fi: Kirjaudu pankkitunnuksilla
  sv: Logga in med din bank
  machine: { fi: true, sv: true }

signIn.opening:
  en: Your bank opens in the browser. Come back here when it is done.
  description: Sign-in screen, shown after the button was pressed and the browser opened.
  fi: Pankkisi avautuu selaimessa. Palaa tänne, kun olet valmis.
  sv: Din bank öppnas i webbläsaren. Kom tillbaka hit när det är klart.
  machine: { fi: true, sv: true }

signIn.exchanging:
  en: Signing you in…
  description: Sign-in screen, while the one-time code from the deep link is exchanged for a session.
  fi: Kirjaudutaan sisään…
  sv: Loggar in dig…
  machine: { fi: true, sv: true }

signIn.done:
  en: You are signed in.
  description: Sign-in screen, after the exchange succeeded.
  fi: Olet kirjautunut sisään.
  sv: Du är inloggad.
  machine: { fi: true, sv: true }

signIn.error.title:
  en: Sign-in did not complete
  description: Sign-in screen, heading of the error state (the text below says why).
  fi: Kirjautuminen ei onnistunut
  sv: Inloggningen slutfördes inte
  machine: { fi: true, sv: true }

signIn.error.auth_code_used:
  en: That sign-in link was already used or has expired. Start again.
  description: Sign-in screen, the deep link's code was used, unknown or older than a minute.
  fi: Tämä kirjautumislinkki on jo käytetty tai vanhentunut. Aloita alusta.
  sv: Den här inloggningslänken har redan använts eller gått ut. Börja om.
  machine: { fi: true, sv: true }

signIn.error.auth_state_mismatch:
  en: That sign-in attempt is unknown or has expired. Start again.
  description: Sign-in screen, the bank came back for an attempt the API does not know (older than ten minutes, or forged).
  fi: Tätä kirjautumisyritystä ei tunnisteta tai se on vanhentunut. Aloita alusta.
  sv: Det här inloggningsförsöket är okänt eller har gått ut. Börja om.
  machine: { fi: true, sv: true }

signIn.error.auth_under_18:
  en: Kuutti is for adults. You are welcome once you are 18.
  description: Sign-in screen, the bank says the person is under 18 (nothing was stored).
  fi: Kuutti on aikuisille. Olet tervetullut täytettyäsi 18 vuotta.
  sv: Kuutti är för vuxna. Du är välkommen när du fyllt 18.
  machine: { fi: true, sv: true }

signIn.error.auth_banned:
  en: This person may not use Kuutti.
  description: Sign-in screen, the identity is banned (TD-7).
  fi: Tämä henkilö ei voi käyttää Kuuttia.
  sv: Den här personen får inte använda Kuutti.
  machine: { fi: true, sv: true }

signIn.error.auth_suspended:
  en: This account is suspended for now.
  description: Sign-in screen, the identity is suspended.
  fi: Tämä tili on toistaiseksi jäädytetty.
  sv: Det här kontot är tills vidare avstängt.
  machine: { fi: true, sv: true }

signIn.error.auth_suspended_until:
  en: "This account is suspended. You can sign in again from: {date}"
  description: "Sign-in screen, the identity is suspended until a day (#307, ADR-024 §5); {date} is the first day the person may sign in again, formatted in Finland's time zone (after a colon, so no language inflects it). Without a valid day the screen says signIn.error.auth_suspended instead."
  fi: "Tämä tili on jäädytetty. Voit kirjautua taas sisään alkaen: {date}"
  sv: "Det här kontot är avstängt. Du kan logga in igen från och med: {date}"
  machine: { fi: true, sv: true }

signIn.paused.title:
  en: "Your account is on a break"
  description: "Sign-in screen, card shown right after the person paused the account on this device (#170)."
  fi: "Tilisi on tauolla"
  sv: "Ditt konto är på paus"
  machine: { fi: true, sv: true }

signIn.paused.body:
  en: "Sign in with your bank whenever you want to come back. Everything is as you left it."
  description: "Sign-in screen, under the break card's title."
  fi: "Kirjaudu pankkitunnuksilla, kun haluat palata. Kaikki on niin kuin sen jätit."
  sv: "Logga in med din bank när du vill komma tillbaka. Allt är som du lämnade det."
  machine: { fi: true, sv: true }

signIn.agreements.title:
  en: "Before you sign in"
  description: "Heading of the screens before the bank login (#418, ADR-010 §15): first the norms with the terms and the privacy summary, which must be accepted before the bank button can be reached; then the research question, which never blocks."
  fi: "Ennen kuin kirjaudut"
  sv: "Innan du loggar in"
  machine: { fi: true, sv: true }

signIn.agreements.research:
  en: "Either answer takes you on to the sign-in with your bank."
  description: "Before the bank login, under the research question (#418): a yes and a no both lead on to the sign-in, and a no costs nothing (GDPR art. 7(4))."
  fi: "Kumpi tahansa vastaus vie sinut eteenpäin kirjautumaan pankkitunnuksilla."
  sv: "Vilket svar du än ger går du vidare till inloggningen med din bank."
  machine: { fi: true, sv: true }

signIn.lock.title:
  en: "Signed out by the lock"
  description: "Sign-in screen, card shown right after the person left the app's lock through the bank, or typed a wrong passcode too many times (#418, ADR-045): this phone's session was dropped."
  fi: "Lukitus kirjasi sinut ulos"
  sv: "Låset loggade ut dig"
  machine: { fi: true, sv: true }

signIn.lock.body:
  en: "Sign in with your bank to come back. Nothing on your account changed. The lock is off until you turn it on again in Settings."
  description: "Sign-in screen, under the lock card's title (#418)."
  fi: "Kirjaudu pankkitunnuksilla palataksesi. Tilillesi ei muuttunut mitään. Lukitus on pois päältä, kunnes otat sen taas käyttöön asetuksista."
  sv: "Logga in med din bank för att komma tillbaka. Ingenting ändrades på ditt konto. Låset är av tills du slår på det igen i inställningarna."
  machine: { fi: true, sv: true }

lock.title:
  en: "Kuutti is locked"
  description: "Heading of the lock screen, shown over the app at a cold start and after the chosen time in the background, when the person has turned the lock on (#418, ADR-045)."
  fi: "Kuutti on lukittu"
  sv: "Kuutti är låst"
  machine: { fi: true, sv: true }

lock.cover:
  en: "Kuutti"
  description: "The app's name on the plain cover drawn over the app while it is in the app switcher or in the background, when the lock is on (#418): the snapshot shows this, not the last screen."
  fi: "Kuutti"
  sv: "Kuutti"
  machine: { fi: true, sv: true }

lock.unlock.face:
  en: "Unlock with your face"
  description: "Lock screen, the button that asks the phone's face recognition (#418); the phone has face recognition only."
  fi: "Avaa kasvoillasi"
  sv: "Lås upp med ansiktet"
  machine: { fi: true, sv: true }

lock.unlock.fingerprint:
  en: "Unlock with your fingerprint"
  description: "Lock screen, the button that asks the phone's fingerprint reader (#418); the phone has a fingerprint reader only."
  fi: "Avaa sormenjäljelläsi"
  sv: "Lås upp med fingeravtrycket"
  machine: { fi: true, sv: true }

lock.unlock.biometrics:
  en: "Unlock with your face or fingerprint"
  description: "Lock screen, the button that asks the phone's biometrics (#418) when it has both kinds, or does not say which."
  fi: "Avaa kasvoillasi tai sormenjäljelläsi"
  sv: "Lås upp med ansiktet eller fingeravtrycket"
  machine: { fi: true, sv: true }

lock.biometrics.prompt:
  en: "Unlock Kuutti"
  description: "The title of the phone's own face or fingerprint prompt (#418)."
  fi: "Avaa Kuutti"
  sv: "Lås upp Kuutti"
  machine: { fi: true, sv: true }

lock.biometrics.cancel:
  en: "Cancel"
  description: "The cancel button of the phone's own face or fingerprint prompt (#418); the lock screen stays."
  fi: "Peruuta"
  sv: "Avbryt"
  machine: { fi: true, sv: true }

lock.failed.face:
  en: "Your face did not unlock Kuutti. Try again, or use another way below."
  description: "Lock screen, after the phone's face prompt refused or could not run (#418, #464), on a phone whose button says 'Unlock with your face'; a cancel says nothing."
  fi: "Kasvosi eivät avanneet Kuuttia. Yritä uudelleen tai käytä toista alla olevaa tapaa."
  sv: "Ditt ansikte låste inte upp Kuutti. Försök igen eller använd ett annat sätt nedan."
  machine: { fi: true, sv: true }

lock.failed.fingerprint:
  en: "Your fingerprint did not unlock Kuutti. Try again, or use another way below."
  description: "Lock screen, after the phone's fingerprint prompt refused or could not run (#418, #464), on a phone whose button says 'Unlock with your fingerprint'; a cancel says nothing."
  fi: "Sormenjälkesi ei avannut Kuuttia. Yritä uudelleen tai käytä toista alla olevaa tapaa."
  sv: "Ditt fingeravtryck låste inte upp Kuutti. Försök igen eller använd ett annat sätt nedan."
  machine: { fi: true, sv: true }

lock.failed.biometrics:
  en: "Your face or fingerprint did not unlock Kuutti. Try again, or use another way below."
  description: "Lock screen, after the phone's biometric prompt refused or could not run (#418, #464), on a phone whose button says 'Unlock with your face or fingerprint'; a cancel says nothing. On Android such a phone may take only the finger, so the words promise neither."
  fi: "Kasvosi tai sormenjälkesi eivät avanneet Kuuttia. Yritä uudelleen tai käytä toista alla olevaa tapaa."
  sv: "Ditt ansikte eller fingeravtryck låste inte upp Kuutti. Försök igen eller använd ett annat sätt nedan."
  machine: { fi: true, sv: true }

lock.lockout.face:
  en: "The phone has paused face unlock after too many tries. Lock the phone and open it with its own code, then try again, or use another way below."
  description: "Lock screen, when the phone has paused its face unlock after too many failed tries (#464): the try that brings the pause ends the prompt, and each ask during it answers with no prompt, on a phone whose button says 'Unlock with your face'. Opening the phone with its own code (PIN, pattern, password or iPhone passcode, never Kuutti's passcode) ends every pause on both platforms; Android's first pauses also end after 30 seconds, iOS's never by waiting, so the line names the code alone."
  fi: "Puhelin on keskeyttänyt kasvojentunnistuksen liian monen yrityksen jälkeen. Lukitse puhelin ja avaa se puhelimen omalla koodilla. Yritä sitten uudelleen tai käytä toista alla olevaa tapaa."
  sv: "Telefonen har pausat upplåsning med ansikte efter för många försök. Lås telefonen och öppna den med telefonens egen kod. Försök sedan igen eller använd ett annat sätt nedan."
  machine: { fi: true, sv: true }

lock.lockout.fingerprint:
  en: "The phone has paused fingerprint unlock after too many tries. Lock the phone and open it with its own code, then try again, or use another way below."
  description: "Lock screen, when the phone has paused its fingerprint unlock after too many failed tries (#464): the try that brings the pause ends the prompt, and each ask during it answers with no prompt, on a phone whose button says 'Unlock with your fingerprint'. Opening the phone with its own code (PIN, pattern, password or iPhone passcode, never Kuutti's passcode) ends every pause on both platforms; Android's first pauses also end after 30 seconds, iOS's never by waiting, so the line names the code alone."
  fi: "Puhelin on keskeyttänyt sormenjäljentunnistuksen liian monen yrityksen jälkeen. Lukitse puhelin ja avaa se puhelimen omalla koodilla. Yritä sitten uudelleen tai käytä toista alla olevaa tapaa."
  sv: "Telefonen har pausat upplåsning med fingeravtryck efter för många försök. Lås telefonen och öppna den med telefonens egen kod. Försök sedan igen eller använd ett annat sätt nedan."
  machine: { fi: true, sv: true }

lock.lockout.biometrics:
  en: "The phone has paused face or fingerprint unlock after too many tries. Lock the phone and open it with its own code, then try again, or use another way below."
  description: "Lock screen, when the phone has paused its biometrics after too many failed tries (#464): the try that brings the pause ends the prompt, and each ask during it answers with no prompt, on a phone whose button says 'Unlock with your face or fingerprint'. On Android such a phone may take only the finger, so the words say 'or', never that both were paused. Opening the phone with its own code (PIN, pattern, password or iPhone passcode, never Kuutti's passcode) ends every pause on both platforms; Android's first pauses also end after 30 seconds, iOS's never by waiting, so the line names the code alone."
  fi: "Puhelin on keskeyttänyt kasvojen- tai sormenjäljentunnistuksen liian monen yrityksen jälkeen. Lukitse puhelin ja avaa se puhelimen omalla koodilla. Yritä sitten uudelleen tai käytä toista alla olevaa tapaa."
  sv: "Telefonen har pausat upplåsning med ansikte eller fingeravtryck efter för många försök. Lås telefonen och öppna den med telefonens egen kod. Försök sedan igen eller använd ett annat sätt nedan."
  machine: { fi: true, sv: true }

lock.passcode.label:
  en: "Your Kuutti passcode"
  description: "Lock screen, the label of the six-digit field (#418); Kuutti's own passcode, not the phone's."
  fi: "Kuutin pääsykoodisi"
  sv: "Din lösenkod för Kuutti"
  machine: { fi: true, sv: true }

lock.passcode.wrong:
  en: "Wrong passcode. {left, plural, one {# try left} other {# tries left}}."
  description: "Lock screen, after a wrong passcode (#418); {left} is how many tries remain before this phone is signed out."
  fi: "Väärä pääsykoodi. {left, plural, one {# yritys jäljellä} other {# yritystä jäljellä}}."
  sv: "Fel lösenkod. {left, plural, one {# försök kvar} other {# försök kvar}}."
  machine: { fi: true, sv: true }

lock.passcode.choose:
  en: "Choose a passcode of six digits"
  description: "Setting the lock's passcode, the label of the first field (#418)."
  fi: "Valitse kuusinumeroinen pääsykoodi"
  sv: "Välj en lösenkod med sex siffror"
  machine: { fi: true, sv: true }

lock.passcode.repeat:
  en: "Type the same six digits again"
  description: "Setting the lock's passcode, the label of the second field (#418)."
  fi: "Kirjoita samat kuusi numeroa uudelleen"
  sv: "Skriv samma sex siffror igen"
  machine: { fi: true, sv: true }

lock.passcode.mismatch:
  en: "The two did not match. Choose the passcode again."
  description: "Setting the lock's passcode, when the second entry differs from the first (#418); the first field is shown again."
  fi: "Koodit eivät täsmänneet. Valitse pääsykoodi uudelleen."
  sv: "Koderna stämde inte överens. Välj lösenkoden igen."
  machine: { fi: true, sv: true }

lock.passcode.cancel:
  en: "Cancel"
  description: "Setting the lock's passcode: stop without changing anything (#418)."
  fi: "Peruuta"
  sv: "Avbryt"
  machine: { fi: true, sv: true }

lock.bank:
  en: "Sign in with the bank instead"
  description: "Lock screen, the way out that is always there (#418, ADR-045): it signs this phone out, as Log out does, and turns the lock off; the person then signs in with the bank."
  fi: "Kirjaudu mieluummin pankkitunnuksilla"
  sv: "Logga in med banken i stället"
  machine: { fi: true, sv: true }

lock.bank.explain:
  en: "This signs Kuutti out of this phone and turns the lock off. Nothing on your account changes."
  description: "Lock screen, above the button that leaves through the bank (#418)."
  fi: "Tämä kirjaa Kuutin ulos tältä puhelimelta ja poistaa lukituksen. Tililläsi ei muutu mitään."
  sv: "Det här loggar ut Kuutti från den här telefonen och stänger av låset. Ingenting ändras på ditt konto."
  machine: { fi: true, sv: true }

lock.settings.explain:
  en: "Lock Kuutti on this phone, so that somebody else holding it cannot open your matches and conversations. The lock stays on this phone, and logging out turns it off."
  description: "The lock's settings screen and its offer among the later screens, the paragraph at the top (#418, ADR-045)."
  fi: "Lukitse Kuutti tällä puhelimella, jotta kukaan muu puhelinta pitelevä ei pääse matcheihisi ja keskusteluihisi. Lukitus koskee vain tätä puhelinta, ja uloskirjautuminen poistaa sen."
  sv: "Lås Kuutti på den här telefonen, så att ingen annan som håller i den kan öppna dina matcher och samtal. Låset gäller bara den här telefonen, och när du loggar ut stängs det av."
  machine: { fi: true, sv: true }

lock.settings.biometrics:
  en: "Face or fingerprint"
  description: "The lock's settings, the switch that lets the phone's face or fingerprint unlock Kuutti (#418); turning it on asks for the face or finger once."
  fi: "Kasvot tai sormenjälki"
  sv: "Ansikte eller fingeravtryck"
  machine: { fi: true, sv: true }

lock.settings.biometricsMissing:
  en: "This phone has no face or fingerprint unlock that Kuutti can use. A passcode works without one."
  description: "The lock's settings, instead of the biometrics switch when the phone has none Kuutti can use (#418, #464): none enrolled, a face that unlocks only the phone itself (an Android class 1 face), or Face ID that Kuutti was refused in the iPhone's settings."
  fi: "Tässä puhelimessa ei ole kasvojen- tai sormenjäljentunnistusta, jota Kuutti voi käyttää. Pääsykoodi toimii ilman sitä."
  sv: "Den här telefonen har ingen upplåsning med ansikte eller fingeravtryck som Kuutti kan använda. En lösenkod fungerar utan."
  machine: { fi: true, sv: true }

lock.settings.biometricsFailed:
  en: "Your face or fingerprint was not confirmed, so it was not turned on."
  description: "The lock's settings, when the confirming prompt for turning biometrics on did not succeed (#418)."
  fi: "Kasvojasi tai sormenjälkeäsi ei vahvistettu, joten sitä ei otettu käyttöön."
  sv: "Ditt ansikte eller fingeravtryck bekräftades inte, så det slogs inte på."
  machine: { fi: true, sv: true }

lock.settings.biometricsLockout:
  en: "The phone has paused face or fingerprint unlock after too many tries, so it was not turned on. Lock the phone and open it with its own code, then try again."
  description: "The lock's settings, when turning biometrics on met the phone's pause after too many failed tries (#464). Opening the phone with its own code (PIN, pattern, password or iPhone passcode, never Kuutti's passcode) ends every pause on both platforms; Android's first pauses also end after 30 seconds, iOS's never by waiting, so the line names the code alone."
  fi: "Puhelin on keskeyttänyt kasvojen- tai sormenjäljentunnistuksen liian monen yrityksen jälkeen, joten sitä ei otettu käyttöön. Lukitse puhelin ja avaa se puhelimen omalla koodilla, ja yritä sitten uudelleen."
  sv: "Telefonen har pausat upplåsning med ansikte eller fingeravtryck efter för många försök, så det slogs inte på. Lås telefonen och öppna den med telefonens egen kod, och försök sedan igen."
  machine: { fi: true, sv: true }

lock.settings.setPasscode:
  en: "Set a passcode"
  description: "The lock's settings, the button that starts choosing Kuutti's own six-digit passcode (#418)."
  fi: "Aseta pääsykoodi"
