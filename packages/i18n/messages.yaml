settings.contacts.remove:
  en: "Remove"
  description: "The button of one card on the Ways to reach you screen, there only while one is kept (#103): removes it, and takes it out of every conversation where it is shared. Short; its screen-reader name is settings.contacts.removeLabel, which starts with these words."
  fi: "Poista"
  sv: "Ta bort"
  machine: { fi: true, sv: true }

settings.contacts.removeLabel:
  en: "{kind, select, phone {Remove your phone number} whatsapp {Remove your WhatsApp number} telegram {Remove your Telegram username} instagram {Remove your Instagram username} snapchat {Remove your Snapchat username} other {Remove}}"
  description: "What a screen reader says for the Remove button of one card on the Ways to reach you screen (#103). Must start with the words of settings.contacts.remove."
  fi: "{kind, select, phone {Poista puhelinnumerosi} whatsapp {Poista WhatsApp-numerosi} telegram {Poista Telegram-käyttäjänimesi} instagram {Poista Instagram-käyttäjänimesi} snapchat {Poista Snapchat-käyttäjänimesi} other {Poista}}"
  sv: "{kind, select, phone {Ta bort ditt telefonnummer} whatsapp {Ta bort ditt WhatsApp-nummer} telegram {Ta bort ditt användarnamn på Telegram} instagram {Ta bort ditt användarnamn på Instagram} snapchat {Ta bort ditt användarnamn på Snapchat} other {Ta bort}}"
  machine: { fi: true, sv: true }

settings.contacts.saved:
  en: "Saved."
  description: "Said on a card of the Ways to reach you screen once it was kept (#103); the field shows it as stored (a number as +358…). Where it is shared, the new one shows at once."
  fi: "Tallennettu."
  sv: "Sparat."
  machine: { fi: true, sv: true }

settings.contacts.removed:
  en: "Removed. Wherever you shared it, it is gone now."
  description: "Said on a card of the Ways to reach you screen once it was removed (#103): every share of it ended with it."
  fi: "Poistettu. Se on poistunut myös sieltä, missä jaoit sen."
  sv: "Borttaget. Det är borta även där du delade det."
  machine: { fi: true, sv: true }

settings.contacts.stillSaved:
  en: "Still saved. Remove takes it away."
  description: "Said under a contact's field of Settings when it was emptied and left (#511): an emptied field takes nothing away, the kept one comes back, and Remove is the way to take it away, since a removal ends every share of it (the maintainer, 29/10/2026)."
  fi: "Yhä tallennettu. Poista vie sen pois."
  sv: "Fortfarande sparat. Ta bort tar bort det."
  machine: { fi: true, sv: true }

settings.contacts.invalid:
  en: "{kind, select, phone {That does not look like a phone number. Write it with its country code (+358…) or as a Finnish number starting with 0.} whatsapp {That does not look like a phone number. Write it with its country code (+358…) or as a Finnish number starting with 0.} telegram {That does not look like a Telegram username: 5 to 32 letters, digits and underscores, starting with a letter.} instagram {That does not look like an Instagram username: up to 30 letters, digits, dots and underscores, never a dot first, last or two in a row.} snapchat {That does not look like a Snapchat username: 3 to 15 letters, digits, dots, underscores and hyphens, starting with a letter and ending with a letter or a digit.} other {Check what you typed.}}"
  description: "Said on a card of the Ways to reach you screen when what was typed is not one of its kind (#103): the phone checks first, the API's contact_invalid says the same. Nothing was saved; the words stay in the field."
  fi: "{kind, select, phone {Tämä ei näytä puhelinnumerolta. Kirjoita se maatunnuksen kanssa (+358…) tai suomalaisena numerona, joka alkaa nollalla.} whatsapp {Tämä ei näytä puhelinnumerolta. Kirjoita se maatunnuksen kanssa (+358…) tai suomalaisena numerona, joka alkaa nollalla.} telegram {Tämä ei näytä Telegram-käyttäjänimeltä: 5–32 kirjainta, numeroa tai alaviivaa, ensimmäisenä kirjain.} instagram {Tämä ei näytä Instagram-käyttäjänimeltä: enintään 30 kirjainta, numeroa, pistettä tai alaviivaa. Piste ei voi olla ensimmäisenä, viimeisenä eikä kahdesti peräkkäin.} snapchat {Tämä ei näytä Snapchat-käyttäjänimeltä: 3–15 kirjainta, numeroa, pistettä, alaviivaa tai yhdysmerkkiä, ensimmäisenä kirjain ja viimeisenä kirjain tai numero.} other {Tarkista, mitä kirjoitit.}}"
  sv: "{kind, select, phone {Det ser inte ut som ett telefonnummer. Skriv det med landsnummer (+358…) eller som ett finskt nummer som börjar med 0.} whatsapp {Det ser inte ut som ett telefonnummer. Skriv det med landsnummer (+358…) eller som ett finskt nummer som börjar med 0.} telegram {Det ser inte ut som ett användarnamn på Telegram: 5–32 bokstäver, siffror och understreck, först en bokstav.} instagram {Det ser inte ut som ett användarnamn på Instagram: högst 30 bokstäver, siffror, punkter och understreck, aldrig en punkt först, sist eller två i rad.} snapchat {Det ser inte ut som ett användarnamn på Snapchat: 3–15 bokstäver, siffror, punkter, understreck och bindestreck, först en bokstav och sist en bokstav eller en siffra.} other {Kontrollera vad du skrev.}}"
  machine: { fi: true, sv: true }

settings.contacts.failed:
  en: "Nothing changed. Check your connection and try again."
  description: "Said on a card of the Ways to reach you screen when a save or a removal failed for any other reason (#103); the words stay in the field."
  fi: "Mikään ei muuttunut. Tarkista yhteys ja yritä uudelleen."
  sv: "Inget ändrades. Kontrollera anslutningen och försök igen."
  machine: { fi: true, sv: true }

settings.contacts.retry:
  en: "Try again"
  description: "Under a contact's field of Settings after a save that failed or went past the minute's messages (#511): sends the words again."
  fi: "Yritä uudelleen"
  sv: "Försök igen"
  machine: { fi: true, sv: true }

settings.contacts.country:
  en: "Country code"
  description: "Screen-reader label of the country code beside a number's field (#511), and the title of the list of countries it opens."
  fi: "Maatunnus"
  sv: "Landsnummer"
  machine: { fi: true, sv: true }

settings.contacts.countryValue:
  en: "{country}, {code}"
  description: "The country code as heard (#511): {country} is the country's name in the app's language, nominative, {code} its calling code (+358)."
  fi: "{country}, {code}"
  sv: "{country}, {code}"
  machine: { fi: true, sv: true }

settings.contacts.countryHint:
  en: "Opens the list of countries"
  description: "Screen-reader hint of the country code beside a number's field (#511)."
  fi: "Avaa maiden luettelon"
  sv: "Öppnar listan över länder"
  machine: { fi: true, sv: true }

settings.contacts.phoneShort:
  en: "A digit or more seems to be missing."
  description: "Said under a number's field when it is too short for its country code (#511); nothing was saved, the words stay."
  fi: "Numerosta näyttää puuttuvan numero tai useampi."
  sv: "Det verkar saknas en siffra eller fler."
  machine: { fi: true, sv: true }

settings.contacts.phoneLong:
  en: "The number has too many digits."
  description: "Said under a number's field when it is too long for its country code (#511)."
  fi: "Numerossa on liian monta numeroa."
  sv: "Numret har för många siffror."
  machine: { fi: true, sv: true }

settings.contacts.phoneInvalid:
  en: "That is not a phone number with the code {code}. Check it, or choose another code."
  description: "Said under a number's field when it is no number under the code chosen (#511); {code} is the calling code (+358), never a country's name, which Finnish would inflect."
  fi: "Tämä ei ole puhelinnumero maatunnuksella {code}. Tarkista se tai valitse toinen maatunnus."
  sv: "Det är inget telefonnummer med landsnumret {code}. Kontrollera det, eller välj ett annat landsnummer."
  machine: { fi: true, sv: true }

settings.country.search:
  en: "Search"
  description: "Visible label over the search field of the list of countries (#511)."
  fi: "Hae"
  sv: "Sök"
  machine: { fi: true, sv: true }

settings.country.searchLabel:
  en: "Search by country or code"
  description: "Screen-reader label of the search field of the list of countries (#511): a name in the app's language or in English, or the code's digits."
  fi: "Hae maan tai maatunnuksen mukaan"
  sv: "Sök på land eller landsnummer"
  machine: { fi: true, sv: true }

settings.country.none:
  en: "No country matches. Search by name or by code, such as 46."
  description: "Said in the list of countries when a search finds none (#511)."
  fi: "Yksikään maa ei vastaa hakua. Hae nimellä tai maatunnuksella, esimerkiksi 46."
  sv: "Inget land matchar. Sök på namn eller landsnummer, till exempel 46."
  machine: { fi: true, sv: true }

settings.country.near:
  en: "Near Finland"
  description: "Heading of the first part of the list of countries (#511): Finland, Sweden, Estonia and Norway."
  fi: "Suomen lähellä"
  sv: "Nära Finland"
  machine: { fi: true, sv: true }

settings.country.all:
  en: "All countries"
  description: "Heading of the list of every country a number can have (#511), alphabetical in the app's language."
  fi: "Kaikki maat"
  sv: "Alla länder"
  machine: { fi: true, sv: true }

settings.country.close:
  en: "Close"
  description: "Label of the list of countries' close control (#511): the code stays as it was."
  fi: "Sulje"
  sv: "Stäng"
  machine: { fi: true, sv: true }

feedback.title:
  en: "Give feedback"
  description: "Title of the feedback row in Settings and of the screen it opens (#171)."
  fi: "Anna palautetta"
  sv: "Ge respons"
  machine: { fi: true, sv: true }

feedback.explain:
  en: "A few lines to the moderators: what went wrong, what you would like, what bothers you, or what works. The moderators see that it came from your account; nobody else does. The app's version, the platform and your language go with it. Nobody is mailed."
  description: "Feedback, the line above the form (#171, #511): who sees the sender (the moderators see the account, ADR-023 §6), what is sent along with the words, and that no mail follows."
  fi: "Muutama rivi moderaattoreille: mikä meni pieleen, mitä toivoisit, mikä häiritsee tai mikä toimii. Moderaattorit näkevät, että viesti tuli tililtäsi; kukaan muu ei näe. Mukana lähtevät sovelluksen versio, alusta ja kielesi. Kenellekään ei lähetetä sähköpostia."
  sv: "Några rader till moderatorerna: vad som gick fel, vad du önskar, vad som stör dig eller vad som fungerar. Moderatorerna ser att det kom från ditt konto; ingen annan gör det. Appens version, plattformen och ditt språk följer med. Ingen får e-post."
  machine: { fi: true, sv: true }

feedback.kind.label:
  en: "What is it about?"
  description: "Feedback screen, the label of the group of four kind buttons (#171); heard as the radio group's name."
  fi: "Mistä on kyse?"
  sv: "Vad gäller det?"
  machine: { fi: true, sv: true }

feedback.kind.bug:
  en: "A bug"
  description: "Feedback screen, one of the four kinds (#171): something does not work."
  fi: "Vika"
  sv: "En bugg"
  machine: { fi: true, sv: true }

feedback.kind.idea:
  en: "An idea"
  description: "Feedback screen, one of the four kinds (#171): something the person would like."
  fi: "Idea"
  sv: "En idé"
  machine: { fi: true, sv: true }

feedback.kind.complaint:
  en: "A complaint"
  description: "Feedback screen, one of the four kinds (#171): something that bothers the person."
  fi: "Valitus"
  sv: "Ett klagomål"
  machine: { fi: true, sv: true }

feedback.kind.praise:
  en: "Praise"
  description: "Feedback screen, one of the four kinds (#171): something that works. Not the word for thank you, which the thanks line uses."
  fi: "Kehu"
  sv: "Beröm"
  machine: { fi: true, sv: true }

feedback.text.label:
  en: "Your feedback"
  description: "Feedback screen, the label of the text field (#171); the field is multiline, up to 2000 characters."
  fi: "Palautteesi"
  sv: "Din respons"
  machine: { fi: true, sv: true }

feedback.send:
  en: "Send"
  description: "Feedback screen, the button that sends (#171); disabled until a kind is chosen and something is written."
  fi: "Lähetä"
  sv: "Skicka"
  machine: { fi: true, sv: true }

feedback.sending:
  en: "Sending…"
  description: "Feedback screen, the send button while the request is on its way (#171)."
  fi: "Lähetetään…"
  sv: "Skickar…"
  machine: { fi: true, sv: true }

feedback.thanks.title:
  en: "Thank you"
  description: "Feedback screen, the heading after a send (#171)."
  fi: "Kiitos"
  sv: "Tack"
  machine: { fi: true, sv: true }

feedback.thanks.body:
  en: "The moderators will read it. Nobody is mailed."
  description: "Feedback screen, the line under the thanks (#171): what happens next, and that no mail follows."
  fi: "Moderaattorit lukevat sen. Kenellekään ei lähetetä sähköpostia."
  sv: "Moderatorerna läser den. Ingen får e-post."
  machine: { fi: true, sv: true }

feedback.another:
  en: "Send more"
  description: "Feedback screen, the button under the thanks that brings the empty form back (#171)."
  fi: "Lähetä lisää"
  sv: "Skicka mer"
  machine: { fi: true, sv: true }

feedback.failed:
  en: "Sending did not work. Try again."
  description: "Feedback screen, the request failed for a reason other than the day's cap (#171)."
  fi: "Lähetys ei onnistunut. Yritä uudelleen."
  sv: "Det gick inte att skicka. Försök igen."
  machine: { fi: true, sv: true }

feedback.limited:
  en: "That is enough feedback for today. You can send more after midnight."
  description: "Feedback screen, the request refused because the day's feedback is sent (matching_config feedback_per_day, #171); the day rolls at midnight in Finland. Never a number, the cap is a tunable."
  fi: "Tältä päivältä palautetta on jo tarpeeksi. Voit lähettää lisää keskiyön jälkeen."
  sv: "Det räcker med respons för i dag. Du kan skicka mer efter midnatt."
  machine: { fi: true, sv: true }

safety.actions.title:
  en: "Block or report"
  description: "Somebody else's card (#84, ADR-030 §11): the label of the icon button in the card's header (heard, never seen: the icon is decorative), the same as an accessibility action on the card's name, and the title of the dialog it opens. No name in it, so nothing needs inflecting. Short."
  fi: "Estä tai ilmoita"
  sv: "Blockera eller anmäl"
  machine: { fi: true, sv: true }

safety.actions.block:
  en: "Block"
  description: "The block-or-report dialog (#84, ADR-030 §11): the button that chooses a block, and the button that confirms it on the next step. A verb, a button; the word carries the meaning, not the colour."
  fi: "Estä"
  sv: "Blockera"
  machine: { fi: true, sv: true }

safety.actions.blockHint:
  en: "You will not see each other again. They are not told."
  description: "The block-or-report dialog (#84), the line under the Block button: what a block does. Calm; the other person is not told."
  fi: "Ette näe toisianne enää. Hänelle ei kerrota."
  sv: "Ni ser inte varandra igen. Personen får inte veta det."
  machine: { fi: true, sv: true }

safety.actions.report:
  en: "Report and block"
  description: "The block-or-report dialog (#84, ADR-030 §4): the button that chooses a report, which blocks as well, and the title of the report step."
  fi: "Ilmoita ja estä"
  sv: "Anmäl och blockera"
  machine: { fi: true, sv: true }

safety.actions.reportHint:
  en: "Tell the moderators what is wrong. This blocks them too. They are not told who reported them."
  description: "The block-or-report dialog (#84, ADR-030 §4), the line under the Report and block button: who reads a report, that it blocks as well, and that the reported person never learns who sent it."
  fi: "Kerro moderaattoreille, mikä on vialla. Tämä myös estää hänet. Hänelle ei kerrota, kuka ilmoitti."
  sv: "Berätta för moderatorerna vad som är fel. Det blockerar också personen. Personen får inte veta vem som anmälde."
  machine: { fi: true, sv: true }

safety.actions.cancel:
  en: "Cancel"
  description: "The block-or-report dialog (#84), the button that closes it on any step with nothing sent."
  fi: "Peruuta"
  sv: "Avbryt"
  machine: { fi: true, sv: true }

safety.actions.close:
  en: "Close"
  description: "The block-or-report dialog (#84): the label of its corner close control (heard, never seen: the control is an icon)."
  fi: "Sulje"
  sv: "Stäng"
  machine: { fi: true, sv: true }

safety.done:
  en: "Done"
  description: "The block-or-report dialog (#84, ADR-030 §11), the button after a block or a report went through, or after the card turned out to be gone: closes the dialog and takes the card away. A different word from the corner's Close, so a screen reader's list of buttons tells them apart."
  fi: "Valmis"
  sv: "Klar"
  machine: { fi: true, sv: true }

safety.gone:
  en: "This profile is no longer available."
  description: "The block-or-report dialog (#84, ADR-030 §5 and §11), said when the API answered that there is no such card: the card's person, or the photos the card showed, are gone meanwhile, so trying again cannot help; nothing was blocked or reported, and closing the dialog takes the card away. Calm; never says why."
  fi: "Tämä profiili ei ole enää saatavilla."
  sv: "Den här profilen är inte längre tillgänglig."
  machine: { fi: true, sv: true }

safety.sending:
  en: "Sending…"
  description: "The block-or-report dialog (#84), said while a block or a report is on its way; the buttons wait meanwhile."
  fi: "Lähetetään…"
  sv: "Skickar…"
  machine: { fi: true, sv: true }

safety.block.title:
  en: "Block this person?"
  description: "The block-or-report dialog (#84, ADR-030 §1), the title of the step that confirms a block."
  fi: "Estetäänkö tämä henkilö?"
  sv: "Blockera den här personen?"
  machine: { fi: true, sv: true }

safety.block.body:
  en: "You will not see each other here again, even if either of you deletes their account and comes back. A block cannot be undone. They are not told."
  description: "The block-or-report dialog (#84, ADR-030 §1 and §8), under the confirmation's title: a block holds both ways, through either person's deletion, for good, and the other person is not told. Plain, calm, no blame. Never the app's name in an inflected position."
  fi: "Ette näe toisianne täällä enää, vaikka jompikumpi teistä poistaisi tilinsä ja palaisi. Estoa ei voi perua. Hänelle ei kerrota."
  sv: "Ni ser inte varandra här igen, även om någon av er raderar sitt konto och kommer tillbaka. En blockering kan inte ångras. Personen får inte veta det."
  machine: { fi: true, sv: true }

safety.block.done:
  en: "Blocked. You will not see each other again."
  description: "The block-or-report dialog (#84), after the block went through; closing the dialog takes the card away."
  fi: "Estetty. Ette näe toisianne enää."
  sv: "Blockerad. Ni ser inte varandra igen."
  machine: { fi: true, sv: true }

safety.block.failed:
  en: "The block did not go through. Try again."
  description: "The block-or-report dialog (#84), a block the API did not take (no connection, a server error); the dialog stays open."
  fi: "Esto ei onnistunut. Yritä uudelleen."
  sv: "Blockeringen gick inte igenom. Försök igen."
  machine: { fi: true, sv: true }

safety.report.alsoBlocks:
  en: "A report also blocks them, for good: you will not see each other here again, even if either of you deletes their account. A block cannot be undone. They are not told."
  description: "The block-or-report dialog (#84, ADR-030 §1 and §4), under the report step's title: sending a report sets the same final block as the Block path, so it says what safety.block.body says; there is no confirmation step after it."
  fi: "Ilmoitus myös estää hänet pysyvästi: ette näe toisianne täällä enää, vaikka jompikumpi teistä poistaisi tilinsä. Estoa ei voi perua. Hänelle ei kerrota."
  sv: "En anmälan blockerar också personen, för gott: ni ser inte varandra här igen, även om någon av er raderar sitt konto. En blockering kan inte ångras. Personen får inte veta det."
  machine: { fi: true, sv: true }

safety.report.reasonLabel:
  en: "What is wrong?"
  description: "The report step (#84), the heading over the six reasons and the radio group's heard name. One reason is required."
  fi: "Mikä on vialla?"
  sv: "Vad är fel?"
  machine: { fi: true, sv: true }

safety.report.reason.harassment:
  en: "Harassing, threatening or hateful"
  description: "The report step (#84, #106's list), one of six reasons, a radio button: the person harasses, threatens or spreads hate. Describes the behaviour, not the person's worth. Also the reason of a filed report in the person's data download (ADR-030 §8)."
  fi: "Häiritsevä, uhkaava tai vihamielinen"
  sv: "Trakasserande, hotfull eller hatisk"
  machine: { fi: true, sv: true }

safety.report.reason.misrepresentation:
  en: "A fake profile, or someone else's photos"
  description: "The report step (#84, #106's list), one of six reasons, a radio button: the profile pretends to be someone else or uses another person's photos. Also the reason of a filed report in the person's data download (ADR-030 §8)."
  fi: "Valeprofiili tai jonkun muun kuvat"
  sv: "Falsk profil eller någon annans bilder"
  machine: { fi: true, sv: true }

safety.report.reason.under_age:
  en: "May be under 18"
  description: "The report step (#84, #106's list), one of six reasons, a radio button: the person may be a minor. Also the reason of a filed report in the person's data download (ADR-030 §8)."
  fi: "Saattaa olla alle 18-vuotias"
  sv: "Kan vara under 18 år"
  machine: { fi: true, sv: true }

safety.report.reason.commercial_use:
  en: "Selling, advertising or asking for money"
  description: "The report step (#84, #106's list), one of six reasons, a radio button: the person uses the app to sell, advertise or ask for money. Also the reason of a filed report in the person's data download (ADR-030 §8)."
  fi: "Myy, mainostaa tai pyytää rahaa"
  sv: "Säljer, gör reklam eller ber om pengar"
  machine: { fi: true, sv: true }

safety.report.reason.scraping:
  en: "Seems automated, or collects people's details"
  description: "The report step (#84, #106's list: scraping), one of six reasons, a radio button: the account seems run by a program, or gathers other people's profiles or details. Plain words, no technical term. Also the reason of a filed report in the person's data download (ADR-030 §8)."
  fi: "Vaikuttaa automaattiselta tai kerää ihmisten tietoja"
  sv: "Verkar automatiserad eller samlar in andras uppgifter"
  machine: { fi: true, sv: true }

safety.report.reason.other:
  en: "Something else"
  description: "The report step (#84, #106's list), the last of six reasons, a radio button: anything the other five do not cover; the note can say what. Also the reason of a filed report in the person's data download (ADR-030 §8)."
  fi: "Jokin muu"
  sv: "Något annat"
  machine: { fi: true, sv: true }

safety.report.photo.question:
  en: "Is it about one photo?"
  description: "The report step of somebody else's card (#476, ADR-030 §13), after the reasons: the heading over an optional choice of the card's own photos, each named as the card names it, and the radio group's heard name. Nothing has to be chosen: safety.report.photo.none is chosen first. A short question about the report."
  fi: "Koskeeko ilmoitus tiettyä kuvaa?"
  sv: "Gäller anmälan ett visst foto?"
  machine: { fi: true, sv: true }

safety.report.photo.none:
  en: "Not one photo"
  description: "The report step of somebody else's card (#476), the first option under safety.report.photo.question and the one chosen until the person picks one of the card's photos: the report is about the person, not about one photo. A radio button, short."
  fi: "Ei tiettyä kuvaa"
  sv: "Inget visst foto"
  machine: { fi: true, sv: true }

safety.report.noteLabel:
  en: "Anything the moderators should know (optional, up to {max, number} characters)"
  description: "The report step (#84, ADR-030 §4), the label of the optional text field, read and heard; max is the field's limit (500), which cuts typing and pasting off, so it is said. Only the moderators read the note, and the person's own data download."
  fi: "Mitä moderaattoreiden pitäisi tietää (vapaaehtoinen, enintään {max, number} merkkiä)"
  sv: "Något moderatorerna bör veta (valfritt, högst {max, number} tecken)"
  machine: { fi: true, sv: true }

safety.report.send:
  en: "Send report"
  description: "The report step (#84), the button that sends the report and the block; disabled until a reason is chosen."
  fi: "Lähetä ilmoitus"
  sv: "Skicka anmälan"
  machine: { fi: true, sv: true }

