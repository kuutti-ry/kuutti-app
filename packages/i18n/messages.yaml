  sv: "Lås"
  machine: { fi: true, sv: true }

native.ios.NSFaceIDUsageDescription:
  en: "Kuutti uses Face ID to unlock the app when you have turned the lock on."
  description: "iOS asks this before Kuutti first uses Face ID (#418): the purpose string in Info.plist, written per language by app.config.ts from native.json. No double quotes or backslashes."
  fi: "Kuutti käyttää Face ID:tä sovelluksen avaamiseen, kun olet ottanut lukituksen käyttöön."
  sv: "Kuutti använder Face ID för att låsa upp appen när du har slagit på låset."
  machine: { fi: true, sv: true }

signIn.error.auth_cooldown:
  en: "You deleted your account recently. The earliest day for a new one: {date}"
  description: Sign-in screen, inside the deletion cooldown; {date} is the day the cooldown ends, formatted for the locale (after a colon, so no language inflects it).
  fi: "Poistit tilisi äskettäin. Uuden tilin voi luoda aikaisintaan: {date}"
  sv: "Du raderade ditt konto nyligen. Tidigaste dagen för ett nytt konto: {date}"
  machine: { fi: true, sv: true }

signIn.error.auth_cancelled:
  en: You cancelled the sign-in at your bank. Nothing was saved.
  description: Sign-in screen, the person backed out at the bank.
  fi: Peruutit kirjautumisen pankissasi. Mitään ei tallennettu.
  sv: Du avbröt inloggningen hos din bank. Inget sparades.
  machine: { fi: true, sv: true }

signIn.error.auth_provider_error:
  en: The identification service did not complete the sign-in. Try again in a moment.
  description: Sign-in screen, the broker (Telia) failed or is not configured.
  fi: Tunnistuspalvelu ei saanut kirjautumista valmiiksi. Yritä hetken kuluttua uudelleen.
  sv: Identifieringstjänsten slutförde inte inloggningen. Försök igen om en stund.
  machine: { fi: true, sv: true }

signIn.error.auth_rate_limited:
  en: Too many sign-ins were started just now. Wait a minute and try again.
  description: "Sign-in screen, the API refused the sign-in for its rate (ADR-026): too many were started from this network within a minute, or too many are under way at once. Said for the start's deep link (error=auth_rate_limited) and for the exchange's 429 (rate_limited). The window is a minute, so 'a minute' is the wait."
  fi: Kirjautumisia on juuri nyt aloitettu liian monta. Odota minuutti ja yritä uudelleen.
  sv: Just nu har för många inloggningar påbörjats. Vänta en minut och försök igen.
  machine: { fi: true, sv: true }

signIn.error.unexpected_link:
  en: This sign-in link was not requested from this phone. Start the sign-in here, with the button.
  description: Sign-in screen, a deep link with a code arrived although this device did not open the bank login (or is already signed in); the link is refused.
  fi: Tätä kirjautumislinkkiä ei pyydetty tältä puhelimelta. Aloita kirjautuminen tästä painikkeella.
  sv: Den här inloggningslänken begärdes inte från den här telefonen. Starta inloggningen här med knappen.
  machine: { fi: true, sv: true }

signIn.unavailable:
  en: "There is no bank sign-in here: the web version and pull-request previews have none. Try the change locally, with the mock bank."
  description: Sign-in screen where no bank login exists at all, so only testers see it. The web target shows it instead of the button; a pull-request preview, whose API has no broker (ADR-014 §1), sends the deep link's auth_unavailable. "The mock bank" is the local stand-in for the bank login (services/mock-idp).
  fi: "Pankkitunnistusta ei ole täällä: verkkoversiossa ja pull requestien esikatseluissa sitä ei ole. Kokeile muutosta paikallisesti testipankilla."
  sv: "Här finns ingen bankinloggning: webbversionen och förhandsversionerna av pull requests har ingen. Prova ändringen lokalt med testbanken."
  machine: { fi: true, sv: true }

signIn.error.generic:
