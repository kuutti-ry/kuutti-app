  fi: "Kuutti näyttää tämän koodin vain nyt eikä säilytä siitä kopiota. Jaa se yhdelle ystävälle tai kirjoita se muistiin."
  sv: "Kuutti visar den här koden bara nu och sparar ingen kopia av den. Dela den med en vän, eller skriv upp den."
  machine: { fi: true, sv: true }

settings.invite.share:
  en: "Share the code"
  description: "The Invitations screen, the button under a code just made that opens the phone's share sheet with the invitation's message (#107). Short."
  fi: "Jaa koodi"
  sv: "Dela koden"
  max_length: 24
  machine: { fi: true, sv: true }

settings.invite.shareFailed:
  en: "The share did not open. You can copy the code above instead."
  description: "The Invitations screen when the phone's share sheet did not open (#107); the code stays on the screen as selectable text."
