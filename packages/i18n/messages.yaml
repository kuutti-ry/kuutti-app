  sv: "{kind, select, phone {Med eller utan 0 först. För ett nummer från ett annat land, välj först dess landsnummer.} whatsapp {Numret som WhatsApp använder. Med eller utan 0 först.} telegram {Ditt användarnamn, med eller utan @ före.} instagram {Ditt användarnamn, med eller utan @ före.} snapchat {Ditt användarnamn, med eller utan @ före.} other {Ett sätt att nå dig.}}"
  machine: { fi: true, sv: true }

