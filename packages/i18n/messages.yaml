settings.contacts.hint:
  en: "{kind, select, phone {With or without the 0 at the start. For another country's number, choose its code first.} whatsapp {The number your WhatsApp uses. With or without the 0 at the start.} telegram {Your username, with or without the @ before it.} instagram {Your username, with or without the @ before it.} snapchat {Your username, with or without the @ before it.} other {A way to reach you.}}"
  description: "Under the title of one kind under the Ways to reach you row (#103, #511): what to type. A number is typed after its country code, which stands beside the field (+358 unless another is chosen), with or without the 0 a country dials at home; the app stores it as +358…, a username without its @ (an Instagram or Snapchat one in lower case). No example number: one that looks real belongs to someone."
