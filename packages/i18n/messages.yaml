# --- Research opt-in on the account card, and the home screen's onboarding gate (#46) ---

account.research.label:
  en: "Take part in research"
  description: "Label of the research opt-in switch on the account card (#46): on when the active research consent names the current wording."
  fi: "Osallistu tutkimukseen"
  sv: "Delta i forskningen"
  machine: { fi: true, sv: true }

account.research.explain:
  en: "Anonymised events about how you use Kuutti, under a separate research identifier. You can change this at any time."
  description: "Line under the research switch."
  fi: "Anonymisoituja tapahtumia Kuutin käytöstäsi erillisellä tutkimustunnisteella. Voit muuttaa tätä milloin tahansa."
  sv: "Anonymiserade händelser om hur du använder Kuutti, under ett separat forskningsid. Du kan ändra det här när som helst."
  machine: { fi: true, sv: true }

account.research.failed:
  en: "The research choice could not be saved. Try again."
  description: "Notice when giving or withdrawing the research consent failed."
  fi: "Tutkimusvalintaa ei voitu tallentaa. Yritä uudelleen."
  sv: "Forskningsvalet kunde inte sparas. Försök igen."
  machine: { fi: true, sv: true }

account.specialCategory.label:
  en: "Store my sensitive answers"
  description: "Label of the switch on the account card for the special-category consent (#146, ADR-019 §4)."
  fi: "Tallenna arkaluonteiset vastaukseni"
  sv: "Spara mina känsliga svar"
  machine: { fi: true, sv: true }

account.specialCategory.explain:
  en: "Whom you seek, the parties you could vote for and your religion. Switching this off removes those answers, and you will be asked whom you seek again."
  description: "Explanation under the special-category switch of the account card (#146)."
  fi: "Kenen seuraa etsit, puolueet, joita voisit äänestää, ja uskontosi. Kytkimen sammuttaminen poistaa nämä vastaukset, ja sinulta kysytään uudelleen, kenen seuraa etsit."
  sv: "Vem du söker, partierna du kunde rösta på och din religion. Stänger du av det här tas de svaren bort, och du får frågan om vem du söker igen."
  machine: { fi: true, sv: true }

pond.waitlist.label:
  en: "People in your area"
  description: "Home screen, accessible name of the card with the waitlist counter of the person's own pond (#54, ADR-013)."
  fi: "Ihmiset alueellasi"
  sv: "Människor i ditt område"
  machine: { fi: true, sv: true }

pond.waitlist.title:
  en: "Your area"
  description: "Waitlist card: the line above the pond's name. The name follows on a line of its own, in the nominative, never inside a sentence."
  fi: "Alueesi"
  sv: "Ditt område"
  machine: { fi: true, sv: true }

pond.waitlist.verified:
  en: "{people, plural, one {# person has identified with their bank} other {# people have identified with their bank}}"
  description: "Waitlist card: how many bank-verified people wait in the pond. {people} is at least the threshold k (ten), so never small."
  fi: "{people, plural, one {# ihminen on tunnistautunut pankkitunnuksilla} other {# ihmistä on tunnistautunut pankkitunnuksilla}}"
  sv: "{people, plural, one {# person har identifierat sig med bank-id} other {# personer har identifierat sig med bank-id}}"
  machine: { fi: true, sv: true }

pond.waitlist.split:
  en: "{women, number} women, {men, number} men, {nonBinary, number} non-binary"
  description: "Waitlist card: the split by self-declared gender, shown only when every group is at least k, so each number is 10 or more."
  fi: "{women, number} naista, {men, number} miestä, {nonBinary, number} muunsukupuolista"
  sv: "{women, number} kvinnor, {men, number} män, {nonBinary, number} icke-binära"
  machine: { fi: true, sv: true }

pond.waitlist.finishing:
  en: "{people, plural, =0 {Everyone has finished their profile.} one {# person is still finishing their profile.} other {# people are still finishing their profile.}}"
  description: "Waitlist card: how many of the verified people have not completed their profile yet. Shown only when the number is zero or at least k (ten); the one form exists for the grammar, not for use."
  fi: "{people, plural, =0 {Kaikki ovat saaneet profiilinsa valmiiksi.} one {# ihminen viimeistelee vielä profiiliaan.} other {# ihmistä viimeistelee vielä profiiliaan.}}"
  sv: "{people, plural, =0 {Alla har gjort klart sin profil.} one {# person håller fortfarande på med sin profil.} other {# personer håller fortfarande på med sin profil.}}"
  machine: { fi: true, sv: true }

pond.waitlist.small:
  en: "Your area is just getting started. Numbers are shown only when at least {k, number} people are here."
  description: "Waitlist card, below the threshold: no number is said about a small pond. {k} is the threshold. It names a condition, not a promise: numbers are never shown below {k}, and they may come a little later than at exactly {k}."
  fi: "Alueesi on vasta alussa. Luvut näytetään vain, kun täällä on vähintään {k, number} ihmistä."
  sv: "Ditt område har precis kommit igång. Siffror visas bara när minst {k, number} personer finns här."
  machine: { fi: true, sv: true }

pond.waitlist.steps:
  en: "The numbers change only when at least {k, number} people have joined or left, so that one person joining or leaving does not show."
  description: "Waitlist card, under the figures: why the numbers stand still for a while. {k} is the threshold (ten): the figures of an area move in steps of at least that many people, so one person's arrival or departure changes nothing in them. It says what the numbers do, not that nothing can ever be inferred."
  fi: "Luvut muuttuvat vasta, kun vähintään {k, number} ihmistä on tullut tai lähtenyt, jotta yhden ihmisen tulo tai lähtö ei näy niistä."
  sv: "Siffrorna ändras först när minst {k, number} personer har kommit eller lämnat, så att det inte syns när en enskild person kommer eller lämnar."
  machine: { fi: true, sv: true }

pond.waitlist.loading:
  en: "Counting…"
  description: "Waitlist card while the figures load."
  fi: "Lasketaan…"
  sv: "Räknar…"
  machine: { fi: true, sv: true }

pond.waitlist.failed:
  en: "The numbers could not be read."
  description: "Waitlist card when the figures could not be fetched."
  fi: "Lukuja ei voitu lukea."
  sv: "Siffrorna kunde inte läsas."
  machine: { fi: true, sv: true }

pond.waitlist.retry:
  en: "Try again"
  description: "Waitlist card, the button that fetches the figures again."
  fi: "Yritä uudelleen"
  sv: "Försök igen"
  machine: { fi: true, sv: true }

# --- The pond gate (#94, ADR-015): where a person stands between a finished profile and the first round ---
pond.gate.label:
  en: "When matching opens for you"
  description: "Home screen, accessible name of the card that says where the person stands at the pond gate (#94): waiting to be let into the area, waiting for enough people who match, or open."
  fi: "Milloin seuranhaku avautuu sinulle"
  sv: "När matchningen öppnar för dig"
  machine: { fi: true, sv: true }

pond.gate.title:
  en: "Matching"
  description: "Gate card: the line above the state. One word, a heading."
  fi: "Seuranhaku"
  sv: "Matchning"
  machine: { fi: true, sv: true }

pond.gate.incomplete:
  en: "Matching opens for finished profiles. Yours still lacks something."
  description: "Gate card when the person's profile or onboarding is not complete: nothing is counted for them yet. The profile screen says what is missing; this only says that something is."
  fi: "Seuranhaku avautuu valmiille profiileille. Sinun profiilistasi puuttuu vielä jotakin."
  sv: "Matchningen öppnar för färdiga profiler. I din saknas ännu något."
  machine: { fi: true, sv: true }

pond.gate.pending:
  en: "Your profile is finished. Where you stand is counted tonight."
  description: "Gate card when the person is complete and the next nightly count is to say where they stand: after they chose another area, after a change of gender or of whom they seek that needs deciding anew, or on a first look that could not be decided for them alone."
  fi: "Profiilisi on valmis. Tilanteesi lasketaan ensi yönä."
  sv: "Din profil är färdig. Var du står räknas i natt."
  machine: { fi: true, sv: true }

pond.gate.waiting:
  en: "You are among the next {within, number} in line for your area."
  description: "Gate card when the person waits to be let into their pond. {within} is the place as it is said, in steps: 10, 20, 30; never an exact place, see pond.gate.steps. The pond is not named in the sentence (TD-17: no inflected pond name)."
  fi: "Olet alueesi jonossa seuraavien {within, number} joukossa."
  sv: "Du är bland de {within, number} närmaste i kön till ditt område."
  machine: { fi: true, sv: true }

pond.gate.waiting.why:
  en: "People are let in so that no group becomes much larger than the other. Those who wait are let in in the order they registered: nobody who waits passes you, and nothing can be bought."
  description: "Gate card, under the place in line: why there is a line at all (TD-10, TD-13). It names no gender and no percentage. The order holds among those who wait; people of the smaller group are let in without waiting, so the text must not promise that nobody at all is let in earlier. 'Nothing can be bought' is a promise of the product, not decoration."
  fi: "Ihmisiä päästetään sisään niin, ettei mikään ryhmä kasva paljon toista suuremmaksi. Odottajat päästetään sisään rekisteröitymisjärjestyksessä: kukaan odottaja ei ohita sinua, eikä mitään voi ostaa."
  sv: "Människor släpps in så att ingen grupp blir mycket större än den andra. De som väntar släpps in i den ordning de registrerade sig: ingen som väntar går före dig, och ingenting går att köpa."
  machine: { fi: true, sv: true }

pond.gate.closed:
  en: "{needed, plural, one {About # more person is needed before matching opens for you.} other {About # more people are needed before matching opens for you.}}"
  description: "Gate card when the person is let into their pond and their pool is below the threshold. {needed} is about how many more people are needed, at least 1, said in steps, see pond.gate.steps. 'About' is part of the promise: the number is never exact."
  fi: "{needed, plural, one {Tarvitaan vielä noin # ihminen, ennen kuin seuranhaku avautuu sinulle.} other {Tarvitaan vielä noin # ihmistä, ennen kuin seuranhaku avautuu sinulle.}}"
  sv: "{needed, plural, one {Det behövs ungefär # person till innan matchningen öppnar för dig.} other {Det behövs ungefär # personer till innan matchningen öppnar för dig.}}"
  machine: { fi: true, sv: true }

pond.gate.closed.who:
  en: "They are people in your area who are what you seek, and who seek somebody like you."
  description: "Gate card, under the number needed: who counts. Both directions: the people the person seeks, who also seek a person like them. No gender is named."
  fi: "He ovat alueesi ihmisiä, jotka vastaavat sitä, mitä etsit, ja jotka etsivät sinun kaltaistasi."
  sv: "De är människor i ditt område som är det du söker, och som söker någon som du."
  machine: { fi: true, sv: true }

pond.gate.steps:
  en: "Numbers here are said in steps of {step, number}, so that they do not follow each person who comes or goes."
  description: "Gate card, under the place in line and under the number needed: why the number is round and stands still for a while. {step} is the step (ten). It must not promise that one person never shows: a person who is the tenth does."
  fi: "Luvut sanotaan tässä {step, number} ihmisen tarkkuudella, jotta ne eivät seuraa jokaista tulijaa ja lähtijää."
  sv: "Siffrorna anges här i steg om {step, number}, så att de inte följer varje person som kommer eller lämnar."
  machine: { fi: true, sv: true }

pond.gate.open:
  en: "Matching is open for you."
  description: "Gate card when matching has opened for the person. It promises no round and no date: the rounds come with a later version."
  fi: "Seuranhaku on sinulle auki."
  sv: "Matchningen är öppen för dig."
  machine: { fi: true, sv: true }

pond.gate.loading:
  en: "Looking…"
  description: "Gate card while the person's gate loads."
  fi: "Katsotaan…"
  sv: "Tittar…"
  machine: { fi: true, sv: true }

pond.gate.failed:
  en: "Where you stand could not be read."
  description: "Gate card when the person's gate could not be fetched."
  fi: "Tilannettasi ei voitu lukea."
  sv: "Det gick inte att läsa var du står."
  machine: { fi: true, sv: true }

pond.gate.retry:
  en: "Try again"
  description: "Gate card, the button that fetches the person's gate again."
  fi: "Yritä uudelleen"
  sv: "Försök igen"
  machine: { fi: true, sv: true }

