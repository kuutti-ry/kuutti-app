  machine: { fi: true, sv: true }

photos.explain:
  en: "Up to {max, plural, one {# photo} other {# photos}}. The first one is your main photo. A new photo is checked before anyone else sees it."
  description: Photos screen, the paragraph under the heading. {max} is max_photos from the API.
  fi: "Enintään {max, plural, one {# kuva} other {# kuvaa}}. Ensimmäinen on pääkuvasi. Uusi kuva tarkistetaan, ennen kuin kukaan muu näkee sen."
  sv: "Högst {max, plural, one {# foto} other {# foton}}. Det första är ditt huvudfoto. Ett nytt foto granskas innan någon annan ser det."
  machine: { fi: true, sv: true }

photos.count:
  en: "{photos, plural, one {# photo} other {# photos}}, at most {max, number}"
  description: Photos screen, how many photos there are and the allowed number. Both are plain numbers after a comma, so no language inflects them.
  fi: "{photos, plural, one {# kuva} other {# kuvaa}}, enintään {max, number}"
  sv: "{photos, plural, one {# foto} other {# foton}}, högst {max, number}"
  machine: { fi: true, sv: true }

photos.empty:
  en: No photos yet.
  description: Photos screen, when the account has no photos.
  fi: Ei vielä kuvia.
  sv: Inga foton ännu.
  machine: { fi: true, sv: true }

photos.add:
  en: Add a photo
  description: Photos screen, the button that opens the phone's photo picker.
  fi: Lisää kuva
  sv: Lägg till ett foto
  machine: { fi: true, sv: true }

photos.picking:
  en: Choosing a photo…
  description: Photos screen, while the phone's picker is open.
  fi: Valitaan kuvaa…
  sv: Väljer foto…
  machine: { fi: true, sv: true }

photos.preparing:
  en: Preparing the photo…
  description: Photos screen, while the picked photo is checked and resized on the phone, before anything is sent.
  fi: Valmistellaan kuvaa…
  sv: Förbereder fotot…
  machine: { fi: true, sv: true }

photos.uploading:
  en: "Uploading… {percent, number} %"
  description: Photos screen, upload progress. {percent} is a whole number 0 to 100.
  fi: "Lähetetään… {percent, number} %"
  sv: "Laddar upp… {percent, number} %"
  machine: { fi: true, sv: true }

photos.state.pending:
  en: Waiting for review
  description: Photos screen, badge on a photo that moderation has not looked at yet; only the owner sees the photo.
  fi: Odottaa tarkistusta
  sv: Väntar på granskning
  machine: { fi: true, sv: true }

photos.state.queued:
  en: Being reviewed
  description: Photos screen, badge on a photo a person is reviewing.
  fi: Tarkistuksessa
  sv: Granskas
  machine: { fi: true, sv: true }

photos.state.approved:
  en: Visible to others
  description: Photos screen, badge on a photo that passed moderation.
  fi: Näkyy muille
  sv: Syns för andra
  machine: { fi: true, sv: true }

photos.state.rejected:
  en: Not accepted
  description: Photos screen, badge on a photo moderation refused; the reason arrives with the moderation feature.
  fi: Ei hyväksytty
  sv: Inte godkänt
  machine: { fi: true, sv: true }

photos.main:
  en: Main photo
  description: Photos screen, label on the first photo.
  fi: Pääkuva
  sv: Huvudfoto
  machine: { fi: true, sv: true }

photos.open:
  en: "Open photo {position, number}"
  description: Photos screen, screen-reader label of a photo tile; tapping opens it large. {position} counts from 1.
  fi: "Avaa kuva {position, number}"
  sv: "Öppna foto {position, number}"
  machine: { fi: true, sv: true }

photos.makeMain:
  en: Make main photo
  description: Photos screen, button that moves a photo to the first position.
  fi: Aseta pääkuvaksi
  sv: Gör till huvudfoto
  machine: { fi: true, sv: true }

photos.moveEarlier:
  en: Move earlier
  description: Photos screen, button that moves a photo one step towards the front.
  fi: Siirrä aiemmaksi
  sv: Flytta framåt
  machine: { fi: true, sv: true }

photos.moveLater:
  en: Move later
  description: Photos screen, button that moves a photo one step towards the back.
  fi: Siirrä myöhemmäksi
  sv: Flytta bakåt
  machine: { fi: true, sv: true }

photos.remove:
  en: Remove
  description: Photos screen, button that asks to remove a photo.
  fi: Poista
  sv: Ta bort
  machine: { fi: true, sv: true }

photos.remove.title:
  en: Remove this photo?
  description: Photos screen, heading of the confirmation before a photo is removed.
  fi: Poistetaanko tämä kuva?
  sv: Ta bort det här fotot?
  machine: { fi: true, sv: true }

photos.remove.body:
  en: It disappears from your profile at once and cannot be brought back.
  description: Photos screen, text of the confirmation before a photo is removed.
  fi: Se poistuu profiilistasi heti, eikä sitä voi palauttaa.
  sv: Det försvinner från din profil direkt och kan inte tas tillbaka.
  machine: { fi: true, sv: true }

photos.remove.confirm:
  en: Remove photo
  description: Photos screen, the confirming button of the removal dialog.
  fi: Poista kuva
  sv: Ta bort fotot
  machine: { fi: true, sv: true }

photos.remove.cancel:
  en: Keep it
  description: Photos screen, the cancelling button of the removal dialog.
  fi: Säilytä
  sv: Behåll
  machine: { fi: true, sv: true }

photos.dialog.close:
  en: Close
  description: Photos screen, screen-reader label of the close control of the removal dialog.
  fi: Sulje
  sv: Stäng
  machine: { fi: true, sv: true }

photos.notice.dismiss:
  en: OK
  description: Photos screen, the button that dismisses a notice.
  fi: OK
  sv: OK
  machine: { fi: true, sv: true }

photos.refused.local:
  en: This photo cannot be used.
  description: Photos screen, the on-device check refused the picked photo; nothing was sent. Deliberately says no more.
  fi: Tätä kuvaa ei voi käyttää.
  sv: Det här fotot kan inte användas.
  machine: { fi: true, sv: true }

photos.error.permission:
  en: Kuutti could not open your photos. Allow access in the phone's settings and try again.
  description: Photos screen, the photo library could not be opened (permission denied).
  fi: Kuutti ei päässyt kuviisi. Salli pääsy puhelimen asetuksista ja yritä uudelleen.
  sv: Kuutti kunde inte öppna dina foton. Tillåt åtkomst i telefonens inställningar och försök igen.
  machine: { fi: true, sv: true }

photos.error.generic:
  en: The photo could not be uploaded. Try again.
  description: Photos screen, any upload failure without a more specific text (network, an unexpected answer).
  fi: Kuvan lähetys ei onnistunut. Yritä uudelleen.
  sv: Fotot kunde inte laddas upp. Försök igen.
  machine: { fi: true, sv: true }

photos.error.photo_limit:
  en: You already have the maximum number of photos. Remove one to add another.
  description: Photos screen, the API refused the upload because the account is at max_photos.
  fi: Sinulla on jo enimmäismäärä kuvia. Poista yksi lisätäksesi toisen.
  sv: Du har redan det största antalet foton. Ta bort ett för att lägga till ett annat.
  machine: { fi: true, sv: true }

photos.error.photo_unsupported:
  en: This file is not a photo Kuutti can use. Choose a JPEG, PNG or WebP picture.
  description: Photos screen, the API refused the file type.
  fi: Tämä tiedosto ei ole kuva, jota Kuutti voi käyttää. Valitse JPEG-, PNG- tai WebP-kuva.
  sv: Den här filen är inte ett foto som Kuutti kan använda. Välj en JPEG-, PNG- eller WebP-bild.
  machine: { fi: true, sv: true }

photos.error.photo_invalid:
  en: The photo could not be read. Try another picture.
  description: Photos screen, the API could not decode the picture.
  fi: Kuvaa ei voitu lukea. Kokeile toista kuvaa.
  sv: Fotot kunde inte läsas. Prova en annan bild.
  machine: { fi: true, sv: true }

photos.error.tooLarge:
  en: The photo is too large. Choose a smaller picture.
  description: Photos screen, the API refused the size (payload_too_large or photo_too_many_pixels).
  fi: Kuva on liian suuri. Valitse pienempi kuva.
  sv: Fotot är för stort. Välj en mindre bild.
  machine: { fi: true, sv: true }

photos.error.media_busy:
  en: Many photos are being processed right now. Try again in a moment.
  description: Photos screen, the API answered 503 media_busy.
  fi: Kuvia käsitellään juuri nyt paljon. Yritä hetken kuluttua uudelleen.
  sv: Många foton bearbetas just nu. Försök igen om en stund.
  machine: { fi: true, sv: true }

photos.error.photo_order_invalid:
  en: The photo order was out of date, so it was reloaded. Try the move again.
  description: Photos screen, the API refused a reorder because the app's list was stale (a photo added or removed elsewhere); the screen has already reloaded the list.
  fi: Kuvien järjestys oli vanhentunut, joten se ladattiin uudelleen. Kokeile siirtoa uudelleen.
  sv: Fotoordningen var inaktuell, så den laddades om. Försök flytta igen.
  machine: { fi: true, sv: true }

photos.error.media_unavailable:
  en: Photos are not available right now.
  description: Photos screen, the API has no photo storage configured (503 media_unavailable).
  fi: Kuvat eivät ole juuri nyt käytettävissä.
  sv: Foton är inte tillgängliga just nu.
  machine: { fi: true, sv: true }

photos.error.photo_budget_exceeded:
  en: That is enough photos for today. They load again after midnight.
  description: Notice on the photos screen and the zoom screen when the API refused a photo URL with photo_budget_exceeded (429, #52).
  fi: Kuvia on katsottu tänään riittävästi. Ne latautuvat taas keskiyön jälkeen.
  sv: Det räcker med foton för i dag. De laddas igen efter midnatt.
  machine: { fi: true, sv: true }

photos.zoom.label:
  en: "Photo {position, number} / {total, number}, full size"
  description: Zoom screen, screen-reader label of the large photo. {position} counts from 1; {total} is how many photos there are.
  fi: "Kuva {position, number} / {total, number}, täysikokoinen"
  sv: "Foto {position, number} / {total, number}, full storlek"
  machine: { fi: true, sv: true }

photos.zoom.back:
  en: Back to your photos
  description: Zoom screen, the button that returns to the photos screen.
  fi: Takaisin kuviisi
  sv: Tillbaka till dina foton
  machine: { fi: true, sv: true }

photos.imageLabel:
  en: "Photo {position, number} / {total, number}"
  description: Screen-reader label of one photo in the grid. {position} counts from 1; {total} is how many photos there are.
  fi: "Kuva {position, number} / {total, number}"
  sv: "Foto {position, number} / {total, number}"
  machine: { fi: true, sv: true }

photos.rejected.nudity:
  en: Not accepted. Photos with nudity cannot be used on Kuutti.
  description: Photos screen, under the badge of a rejected photo; the moderator chose the reason nudity.
  fi: Ei hyväksytty. Alastomuutta sisältäviä kuvia ei voi käyttää Kuutissa.
  sv: Inte godkänt. Foton med nakenhet kan inte användas på Kuutti.
  machine: { fi: true, sv: true }

photos.rejected.no_person:
  en: Not accepted. A profile photo has to show you.
  description: Photos screen, rejected because no person is visible (a landscape, a pet, an object).
  fi: Ei hyväksytty. Profiilikuvassa pitää näkyä sinä.
  sv: Inte godkänt. En profilbild måste visa dig.
  machine: { fi: true, sv: true }

photos.rejected.several_people:
  en: Not accepted. A profile photo shows you alone, so nobody else appears on Kuutti without asking.
  description: Photos screen, rejected because several people are in the picture.
  fi: Ei hyväksytty. Profiilikuvassa olet yksin, jotta kukaan muu ei päädy Kuuttiin kysymättä.
  sv: Inte godkänt. På en profilbild är du ensam, så att ingen annan hamnar på Kuutti utan att bli tillfrågad.
  machine: { fi: true, sv: true }

photos.rejected.minor:
  en: Not accepted. Photos with children cannot be used on Kuutti.
  description: Photos screen, rejected because a minor appears in the picture.
  fi: Ei hyväksytty. Kuvia, joissa on lapsia, ei voi käyttää Kuutissa.
  sv: Inte godkänt. Foton med barn kan inte användas på Kuutti.
  machine: { fi: true, sv: true }

photos.rejected.violence:
  en: Not accepted. Photos with violence or weapons cannot be used on Kuutti.
  description: Photos screen, rejected because of violence or weapons.
  fi: Ei hyväksytty. Kuvia, joissa on väkivaltaa tai aseita, ei voi käyttää Kuutissa.
  sv: Inte godkänt. Foton med våld eller vapen kan inte användas på Kuutti.
  machine: { fi: true, sv: true }

photos.rejected.contact_details:
  en: Not accepted. Photos must not show contact details, usernames or links.
  description: Photos screen, rejected because the picture carries contact details, a handle or a link (pre-match links are banned by the product constraints).
  fi: Ei hyväksytty. Kuvissa ei saa näkyä yhteystietoja, käyttäjätunnuksia tai linkkejä.
  sv: Inte godkänt. Foton får inte visa kontaktuppgifter, användarnamn eller länkar.
  machine: { fi: true, sv: true }

photos.rejected.other:
  en: Not accepted. This photo does not fit Kuutti; try another one.
  description: Photos screen, rejected for a reason outside the list.
  fi: Ei hyväksytty. Tämä kuva ei sovi Kuuttiin; kokeile toista.
  sv: Inte godkänt. Det här fotot passar inte på Kuutti; prova ett annat.
  machine: { fi: true, sv: true }

admin.signIn.title:
  en: Sign in
  description: Admin panel, heading of the sign-in screen. English only (TD-17).

admin.signIn.explain:
  en: Moderators sign in with their bank, like everyone. The panel opens only for a bank login that has a moderator role.
  description: Admin panel, sign-in screen paragraph.

admin.signIn.button:
  en: Sign in with your bank
  description: Admin panel, the button that starts the staff bank login.

admin.signIn.error.admin_not_allowed:
  en: That bank login has no moderator role. Ask the maintainer to add it.
  description: Admin panel, the bank login came back refused with admin_not_allowed.

admin.signIn.error.no_api:
  en: This build of the panel names no API to sign in to; it was built without VITE_API_URL.
  description: Admin panel, a production build without an API address; nothing is sent anywhere.

admin.signIn.error.generic:
  en: Sign-in did not complete. Try again.
  description: Admin panel, any other sign-in failure (a used code, the API unreachable).

admin.session.role:
  en: "Signed in as {role}"
  description: Admin panel header. {role} is the role word from the API (moderator, admin, researcher), not translated.

admin.session.expires:
  en: "Session ends: {time}"
  description: Admin panel header. {time} is a clock time formatted for the locale, after a colon so nothing inflects it.

admin.signOut:
  en: Sign out
  description: Admin panel header button.

admin.queue.title:
  en: Photo review queue
  description: Admin panel, heading of the photo queue screen.

admin.queue.total:
  en: "{total, plural, =0 {Nothing waiting} one {# photo waiting} other {# photos waiting}}"
  description: Admin panel, how many photos wait for a decision.

admin.queue.loading:
  en: Loading the queue…
  description: Admin panel, while the queue is fetched.

admin.queue.error:
  en: The queue could not be loaded.
  description: Admin panel, the queue request failed.

admin.queue.refresh:
  en: Refresh
  description: Admin panel, reloads the queue.

admin.queue.uploaded:
  en: "Uploaded {time}"
  description: Admin panel, one queue item. {time} is a date and time formatted for the locale.

admin.queue.account:
  en: "Account {account}"
  description: Admin panel, one queue item. {account} is the first characters of the pseudonymous account id.

admin.queue.image:
  en: "Photo under review"
  description: Admin panel, alt text of the card image in the queue.

admin.queue.imageLoading:
  en: Loading the photo…
  description: Admin panel, while the signed URL of a card is fetched.

admin.queue.labels:
  en: What the automatic check saw
  description: Admin panel, heading above the label list of one item.

admin.queue.noLabels:
  en: No labels above 30 % confidence.
  description: Admin panel, when the automatic check returned no labels.

admin.queue.notChecked:
  en: Not checked automatically.
  description: Admin panel, the item was queued without an automatic check (no Rekognition where the API runs).

admin.queue.faces:
  en: "{faces, plural, =0 {No face found} one {# face found} other {# faces found}}"
  description: Admin panel, the face count the automatic check found.

admin.queue.label:
  en: "{name} ({confidence, number} %)"
  description: Admin panel, one label with its confidence. {name} is the label as Rekognition names it, in English.

admin.queue.approve:
  en: Approve
  description: Admin panel, button that approves the photo.

admin.queue.reject:
  en: Reject…
  description: Admin panel, button that opens the reason choice.

admin.queue.reason.label:
  en: Reason the person is told
  description: Admin panel, label of the reason select in the rejection form.

admin.queue.reason.nudity:
  en: Nudity
  description: Admin panel, a rejection reason.

admin.queue.reason.no_person:
  en: No person visible
  description: Admin panel, a rejection reason.

admin.queue.reason.several_people:
  en: Several people
  description: Admin panel, a rejection reason.

admin.queue.reason.minor:
  en: A child appears
  description: Admin panel, a rejection reason.

admin.queue.reason.violence:
  en: Violence or weapons
  description: Admin panel, a rejection reason.

admin.queue.reason.contact_details:
  en: Contact details, handle or link
  description: Admin panel, a rejection reason.

admin.queue.reason.other:
  en: Other
  description: Admin panel, a rejection reason.

admin.queue.confirmReject:
  en: Reject photo
  description: Admin panel, the confirming button of the rejection form.

admin.queue.cancel:
  en: Cancel
  description: Admin panel, closes the rejection form without deciding.

admin.queue.decided:
  en: "{decision, select, approved {Approved} rejected {Rejected} other {Decided}}"
  description: Admin panel, the line shown where a decided item was, until the next refresh.

admin.queue.decisionFailed:
  en: The decision was not saved. Refresh and try again.
  description: Admin panel, a decision request failed.

admin.forbidden:
  en: Your role does not allow the photo queue.
  description: Admin panel, a researcher signed in; the queue is for moderators and admins.

