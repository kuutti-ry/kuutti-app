# --- Legal texts (#46, ADR-010): binding Finnish wording, versioned, never machine-translated. ---
# DRAFTS: the maintainer and the association's counsel replace these before
# launch; a new wording is a new consent_version and everyone is asked again.

legal.terms.title:
  en: "Terms of use"
  description: "Heading of the terms consent (#46). Binding legal text; the Finnish is the wording that counts."
  fi: "Käyttöehdot"
  consent_version: "2026-09-draft-1"

legal.terms.summary:
  en: "DRAFT: Kuutti is a free dating service run by a registered association for adults living in Finland. Every account is verified with a Finnish bank login. You agree to treat other members with respect, to upload only photos of yourself, and not to copy or collect other members' photos or profiles. Kuutti may remove content and close accounts that break these terms."
  description: "The terms the person accepts by version (#46). DRAFT wording; the full text is a page of #53."
  fi: "LUONNOS: Kuutti on rekisteröidyn yhdistyksen ylläpitämä maksuton deittipalvelu Suomessa asuville täysi-ikäisille. Jokainen tili varmistetaan suomalaisella pankkitunnistautumisella. Sitoudut kohtelemaan muita jäseniä kunnioittavasti, lataamaan vain kuvia itsestäsi sekä olemaan kopioimatta tai keräämättä muiden jäsenten kuvia tai profiileja. Kuutti voi poistaa sisältöä ja sulkea tilejä, jotka rikkovat näitä ehtoja."
  consent_version: "2026-09-draft-1"

legal.privacy.title:
  en: "Privacy"
  description: "Heading of the privacy consent (#46). Binding legal text."
  fi: "Tietosuoja"
  consent_version: "2026-09-draft-1"

legal.privacy.summary:
  en: "DRAFT: Kuutti stores your year and month of birth, a keyed hash of your personal identity code, your self-declared gender, whom you seek, your age window, your area, your profile and photos, and a log of the photos you fetch. It never stores your personal identity code, your legal sex, your name from the bank or your date of birth. You can download everything and delete your account at any time; deletion removes your profile, photos and preferences and keeps only what the law requires."
  description: "The privacy summary the person accepts by version (#46). DRAFT wording; the full policy is a page of #53."
  fi: "LUONNOS: Kuutti tallentaa syntymävuotesi ja -kuukautesi, henkilötunnuksesi avaimellisen tiivisteen, itse ilmoittamasi sukupuolen, kenen seuraa etsit, ikähaarukkasi, alueesi, profiilisi ja kuvasi sekä lokin hakemistasi kuvista. Se ei koskaan tallenna henkilötunnustasi, juridista sukupuoltasi, pankin ilmoittamaa nimeäsi tai syntymäaikaasi. Voit ladata kaikki tietosi ja poistaa tilisi milloin tahansa; poisto hävittää profiilin, kuvat ja asetukset ja säilyttää vain sen, mitä laki vaatii."
  consent_version: "2026-09-draft-1"

legal.research.title:
  en: "Research"
  description: "Heading of the research opt-in (#46, #50). Binding legal text."
  fi: "Tutkimus"
  consent_version: "2026-09-draft-1"

legal.research.summary:
  en: "DRAFT: If you say yes, anonymised events about how you use Kuutti (for example that a round was shown or a like was sent; never message text, never who you are) are kept under a separate research identifier for up to 90 days and used by the association's research partner to study how the matching works. You can withdraw at any time; withdrawing removes the link between you and the events."
  description: "The research opt-in the person accepts by version and can withdraw (#46, #50). DRAFT wording."
  fi: "LUONNOS: Jos sanot kyllä, anonymisoituja tapahtumia Kuutin käytöstäsi (esimerkiksi että kierros näytettiin tai tykkäys lähetettiin; ei koskaan viestien tekstiä eikä sitä, kuka olet) säilytetään erillisellä tutkimustunnisteella enintään 90 päivää, ja yhdistyksen tutkimuskumppani käyttää niitä yhdistämisen toiminnan tutkimiseen. Voit perua milloin tahansa; peruminen poistaa yhteyden sinun ja tapahtumien välillä."
  consent_version: "2026-09-draft-1"

legal.special_category.title:
  en: "Sensitive answers"
  description: "Heading of the special-category consent (#145, ADR-019 §4): whom you seek, the parties you could vote for, your religion. Binding legal text; the Finnish is the wording that counts."
  fi: "Arkaluonteiset tiedot"
  consent_version: "2026-10-draft-2"

legal.special_category.summary:
  en: "DRAFT: Whom you seek, the parties you could vote for and your religion are special categories of personal data. If you say yes, Kuutti stores the answers you give to these questions: whom you seek only to match you, never shown to anyone; the parties and the religion on your card, when you choose to fill them in. None of them ever goes into a log or a research event, and you can withdraw this consent at any time, which removes the answers. Without your yes these questions stay unanswered."
  description: "The special-category consent the person accepts by version (#145, ADR-019 §4; GDPR art. 9(2)(a)). DRAFT wording for the association's counsel."
  fi: "LUONNOS: Se, kenen seuraa etsit, puolueet, joita voisit äänestää, ja uskontosi ovat erityisiä henkilötietoryhmiä. Jos sanot kyllä, Kuutti tallentaa näihin kysymyksiin antamasi vastaukset: kenen seuraa etsit vain yhdistämistä varten, eikä sitä näytetä kenellekään; puolueet ja uskonnon kortillasi, jos päätät täyttää ne. Mikään niistä ei koskaan päädy lokiin eikä tutkimustapahtumaan, ja voit perua tämän suostumuksen milloin tahansa, jolloin vastaukset poistetaan. Ilman kyllä-vastaustasi nämä kysymykset jäävät vastaamatta."
  consent_version: "2026-10-draft-2"

