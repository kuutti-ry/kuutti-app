notifications.ask.body:
  en: "Kuutti can tell this phone when today's round is ready, when someone likes you back and when a message arrives. A notification says only that there is something, never what or from whom. You choose which kinds in Settings."
  description: "The home screen's offer of notifications (#102, ADR-055 §9), the reason in words, under its heading: the three pushes, what a push never carries, and where the kinds are chosen. Calm; no promise of more."
  fi: "Kuutti voi kertoa tälle puhelimelle, kun päivän kierros on valmis, kun joku tykkää sinusta takaisin ja kun saat viestin. Ilmoitus kertoo vain, että jotain on, ei koskaan mitä tai keneltä. Lajit valitset asetuksista."
  sv: "Kuutti kan berätta för den här telefonen när dagens omgång är klar, när någon gillar dig tillbaka och när ett meddelande kommer. En avisering säger bara att det finns något, aldrig vad eller från vem. Du väljer slagen i inställningarna."
