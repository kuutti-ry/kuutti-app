# --- The automatic photo description (#296, ADR-006 §3): what the photo check sees, ---
# --- one key per part of the closed list of PhotoDescription (packages/schema).   ---
# --- describePhoto (src/describe.ts) joins the parts into sentences: people and   ---
# --- the setting, then the face, then the activity and objects. A phrase stands   ---
# --- in a comma list after "one person" or alone at the start of a sentence, so   ---
# --- it is a fragment ("by a lake", "with a dog"), never a sentence of its own.    ---

photos.description.text:
  en: "Automatic description: {description}"
  description: "Read with a photo by a screen reader after the owner's caption, and shown under it when the viewer asks (#296). {description} is one to three short sentences made of the keys below, e.g. \"One person, outdoors, by a lake. Smiling, sunglasses. Hiking, with a dog.\" The prefix says it is the machine's words, not the owner's."
  fi: "Automaattinen kuvaus: {description}"
  sv: "Automatisk beskrivning: {description}"
  machine: { fi: true, sv: true }

photos.description.people:
  en: "{people, plural, one {one person} other {# people}}"
  description: "First phrase of the automatic description (#296): how many people the photo check counted. Starts the sentence; the setting and the scene follow it in a comma list."
  fi: "{people, plural, one {yksi henkilö} other {# henkilöä}}"
  sv: "{people, plural, one {en person} other {# personer}}"
  machine: { fi: true, sv: true }

photos.description.setting.indoors:
  en: "indoors"
  description: "Automatic description (#296), after the people: the photo was taken inside. A fragment in a comma list."
  fi: "sisällä"
  sv: "inomhus"
  machine: { fi: true, sv: true }

