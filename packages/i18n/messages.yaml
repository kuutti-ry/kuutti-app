  fi: "Sinulle näytetyt kierrokset, yksi kultakin päivältä: milloin kierros oli valmis ja avattiin, kunkin kortin paikka ja miksi se oli mukana, milloin näit sen ja tykkäsitkö vai ohititko sen. Sitä, kuka kortilla oli, ei kirjoiteta tähän."
