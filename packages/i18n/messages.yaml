  machine: { fi: true, sv: true }

onboarding.welcome.title:
  en: "How we do things here"
  description: "Heading of the welcome screen, the first after the bank login (#146): the norms and the two consents on one screen."
  fi: "Näin täällä toimitaan"
  sv: "Så här gör vi här"
  machine: { fi: true, sv: true }

onboarding.welcome.norm1:
  en: "Everybody here has shown a bank ID. Be the person you are."
  description: "First norm of the welcome screen (#146)."
  fi: "Jokainen täällä on tunnistautunut pankkitunnuksilla. Ole se, joka olet."
  sv: "Alla här har visat bank-ID. Var den du är."
  machine: { fi: true, sv: true }

onboarding.welcome.norm2:
  en: "You decide with buttons, one person at a time. Nobody here is swiped through."
  description: "Second norm of the welcome screen (#146)."
  fi: "Päätät painikkeilla, yksi ihminen kerrallaan. Ketään ei pyyhkäistä ohi."
  sv: "Du bestämmer med knappar, en person i taget. Ingen här sveps förbi."
  machine: { fi: true, sv: true }

onboarding.welcome.norm3:
  en: "No contact details before a match. Your photos stay inside Kuutti."
  description: "Third norm of the welcome screen (#146)."
  fi: "Ei yhteystietoja ennen matchia. Kuvasi pysyvät Kuutin sisällä."
  sv: "Inga kontaktuppgifter före en match. Dina bilder stannar inne i Kuutti."
