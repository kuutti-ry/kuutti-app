chat.composer.error.message_too_long:
  en: "The message is too long. Make it shorter and send it again."
  description: "Under the composer when the API refused the length (#348). The words stay in the field."
  fi: "Viesti on liian pitkä. Lyhennä sitä ja lähetä uudelleen."
