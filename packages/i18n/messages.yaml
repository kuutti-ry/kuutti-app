invite.share.message:
  en: "You're invited to Kuutti, a free dating app for Finland where everyone signs in with their bank ID. Get the app at https://kuutti.app/ and type this code after signing in: {code}"
  description: "The message the phone's share sheet sends with an invitation (#107, ADR-044 Context 5), to somebody who may not know Kuutti: free, bank-verified, Finland's; the website's address as it is, and the code (XXXXX-XXXXX) after a colon at the end. Nothing about the sender, no link into the app."
  fi: "Sinut on kutsuttu: Kuutti on ilmainen suomalainen deittisovellus, jossa jokainen kirjautuu pankkitunnuksillaan. Lataa sovellus osoitteesta https://kuutti.app/ ja kirjoita tämä koodi kirjautumisen jälkeen: {code}"
  sv: "Du är inbjuden till Kuutti, en gratis dejtingapp för Finland där alla loggar in med sina bankkoder. Hämta appen på https://kuutti.app/ och skriv in den här koden efter inloggningen: {code}"
  machine: { fi: true, sv: true }

settings.contacts.intro:
  en: "Keep the ways to reach you outside the app here. Nobody sees them until you share one in a conversation, with the button at its top. A change or a removal shows at once wherever you shared it."
