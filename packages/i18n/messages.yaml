  sv: "Hade skickat en fisk till dig"
  machine: { fi: true, sv: true }

account.export.round.decision.like:
  en: "Liked"
  description: "Inside the downloaded data file (#96), the person's decision on a card of their round."
  fi: "Tykkäsit"
  sv: "Gillade"
  machine: { fi: true, sv: true }

account.export.round.decision.fish:
  en: "Sent a fish"
  description: "Inside the downloaded data file (#378), the person's decision on a card of their round: a fish, a like that says a little more, of which a person may send matching_config fish_budget in each calendar week, Monday to Sunday (fish_window_days counted from a Monday, #475)."
  fi: "Lähetit kalan"
  sv: "Skickade en fisk"
  machine: { fi: true, sv: true }

account.export.round.decision.pass:
  en: "Passed"
  description: "Inside the downloaded data file (#96), the person's decision on a card of their round."
  fi: "Ohitit"
  sv: "Hoppade över"
  machine: { fi: true, sv: true }

account.export.block.about:
  en: "When you blocked someone. Who it was is not written here. A block holds even if either of you deletes their account and comes back."
  description: "Inside the downloaded data file (#84, ADR-030 §8), the text that opens the part listing the person's blocks by date only. Plain; says why no name is there and that a block outlives a deletion."
  fi: "Milloin estit jonkun. Sitä, kuka hän oli, ei kirjoiteta tähän. Esto pysyy voimassa, vaikka jompikumpi teistä poistaisi tilinsä ja palaisi."
  sv: "När du blockerade någon. Vem det var står inte här. En blockering gäller även om någon av er raderar sitt konto och kommer tillbaka."
  machine: { fi: true, sv: true }

account.export.photoCheck.reason.nudity:
