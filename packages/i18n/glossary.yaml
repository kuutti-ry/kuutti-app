# Product vocabulary for `pnpm i18n:translate` and for human translators (#13, TD-17).
# A term with a fi or sv value is fixed: translations must use exactly that word.
# A term without one is explained by its definition only, and the translation
# is left to the translator until a native reviewer fixes the word here.
# The Finnish and Swedish product terms are a naming decision, not a lookup:
# they are empty until the maintainers and a native speaker choose them.

Kuutti:
  definition: The name of the app and of the association. A proper noun; never translated and never inflected in a message (keep it in nominative positions).
  fi: Kuutti
  sv: Kuutti

pond:
  definition: The group of people a member meets within, usually a city or region. One of the app's own words, used as a common noun ("your pond"). Pond names themselves come from the database with their case forms and are never built in a message.

round:
  definition: The small, fixed set of profiles a member receives once a day. There is no feed and nothing loads after it; the word should sound finite and calm.

like:
  definition: Telling the app you would like to talk to someone. A noun and a verb in English; never a score, never a count shown to others.

pass:
  definition: Deciding not to talk to someone in this round. Neutral and kind; it must not read as rejection or as a judgement of the other person.

standing:
  definition: Whether a verified person is in good standing, suspended or banned. Used in moderation and account notices; formal, factual register.

block:
  definition: One person's choice that they and another person are never shown to each other again, in either direction, even if either deletes their account and comes back (#84, ADR-030). Final; the other person is not told. A noun and a verb; a private choice, never an accusation or a punishment, so not a word for banning or rejecting.

report:
  definition: Telling the moderators that something about another person is wrong, with a reason from a closed list (#84, ADR-030). Sending one also blocks that person. The reported person is never told who sent it. A noun and a verb; the same word wherever a person reports, from a card now and from a conversation later (#101), and the word staff use for it in the panel.

moderator:
  definition: A person of the association who reads reports and checks photos, and may warn, suspend or ban (ADR-024). A person, never "the system" or an algorithm; plain register, not a legal or police word.

contact:
  definition: A way to reach a person outside the app that they keep in Settings, under Your contacts (#103) - a phone number, WhatsApp, Telegram or Instagram. Nobody sees one until its owner shares it in one conversation, and it disappears there when they stop sharing it, change or remove it, or the conversation ends. Not an address-book entry and not a social "connection"; sharing asks nothing back. The brand names stay as they are in every language.

end a conversation:
  definition: Either person's choice to close a conversation for both of them (#351, the unmatch of #101). Nobody can write in it again, nobody is blocked, and either can still report it for a while. Neither person is told who ended it or how. Plain and calm; not a word for rejecting, breaking up or blocking, and not "unmatch".
