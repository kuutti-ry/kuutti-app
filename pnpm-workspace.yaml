packages:
  - apps/*
  - packages/*
  - services/*

# Hoisted layout for Metro compatibility (TD-2).
nodeLinker: hoisted

# Peers with "*" ranges (expo-router lists reanimated, gesture-handler, testing
# libraries) must be installed deliberately with `npx expo install`, never
# auto-resolved to whatever is newest.
autoInstallPeers: false

# One version of each shared tool across the workspace. Expo SDK 57 pins react,
# react-native and typescript; everything else follows those.
catalog:
  typescript: ~6.0.3
  vitest: ^5.0.3
  react: 19.3.0
  react-dom: 19.3.0
  "@types/react": ~19.3.0
  "@types/react-dom": ~19.3.0


allowBuilds:
  esbuild: true
  # @sentry/cli's postinstall downloads the sentry-cli binary (checksum-verified
  # by the package); the Expo plugin and the source-map upload in deploy.yml
  # need it (#11). Allowed deliberately, like esbuild.
  "@sentry/cli": true
  # eas-cli's optional native helpers; not built, eas works without them, and
  # pnpm 12 treats an undeclared ignored build as an install error.
  dtrace-provider: false
  protobufjs: false

# Supply chain: a version must be at least one day old before pnpm installs it
# (pnpm's default, stated explicitly). Exclusions are a decision, not a convenience.
minimumReleaseAge: 1440

# Patched transitive versions the audit gate requires. The first three and joi
# sit under eas-cli (a CLI run only in CI), which still ships older ranges;
# brace-expansion sits under the globbing of eas-cli, the Expo tooling and jest
# (GHSA-6j4f-fj2g-mc7p and GHSA-qhr7-859c-m2p7, 2026-09-29). The majors are
# unchanged, so nothing else in the tree moves. Remove an entry once the
# range of whoever asks for the package is at or above it.
overrides:
  "minimatch@5": ">=5.1.8 <6"
  "nanoid@3": ">=3.3.18 <4"
  "tar@7": ">=7.5.21 <8"
  "brace-expansion@1": ">=1.1.20 <2"
  "brace-expansion@2": ">=2.1.6 <3"
  "brace-expansion@5": ">=5.0.11 <6"
  "joi@17": ">=17.13.7 <18"
  # shell-quote under react-devtools-core (react-native's developer tooling)
  # and source-map-js under postcss (vite: the admin panel's build and the
  # tests): GHSA-pqg4-j6r4-53mv and GHSA-68fv-2mgg-jv7q, failing the audit
  # gate since 2026-10-07. Both are patched within their major.
  "shell-quote@1": ">=1.11.0 <2"
  "source-map-js@1": ">=1.2.2 <2"
  # Not installed at all. @sentry/node 11 lists its bundler plugins as a
  # dependency for the entry points ./vite, ./rollup, ./webpack and ./esbuild,
  # which the API does not import, and they bring Sentry's command-line tool
  # (`sentry`, FSL-1.1-Apache-2.0, outside the licence policy) and a native
  # parser for every platform. The image's build, which installs for the API
  # alone, fails if the API ever comes to need them; a whole-workspace install
  # would find the copy of an older major that @sentry/react-native brings.
  # Remove this when the plugins are an optional peer.
  "@sentry/node>@sentry/bundler-plugins": "-"

# pnpm audit: two advisories set aside, each with its reason. Neither has a
# patched version, and neither package is in the API's image or the app's
# bundle. Remove an entry when a patched version exists or the package is gone
# from the tree. Every other advisory still fails the job.
#
# GHSA-86w9-cpqp-85rv (node-forge <= 1.4.0): a forged RSA PKCS#1 v1.5 signature
# is accepted for keys with a low exponent. node-forge is asked for by
# @expo/code-signing-certificates, @expo/pkcs12 and eas-cli only: tooling on a
# developer's machine and in CI, which checks certificates and signatures it
# made itself. The app verifies an update's signature with the platform's own
# cryptography, not with this package.
#
# GHSA-vfj7-8cjw-p6xm (braces <= 3.0.3): a deeply nested brace pattern
# exhausts the stack. braces is asked for by micromatch only, under fast-glob,
# jest, Metro's file map and tailwindcss: build and test tools that expand the
# patterns of our own configuration, never a pattern somebody sends us.
auditConfig:
  ignoreGhsas:
    - GHSA-86w9-cpqp-85rv
    - GHSA-vfj7-8cjw-p6xm
