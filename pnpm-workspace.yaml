packages:
  - apps/*
  - packages/*
  - services/*

# Hoisted layout for Metro compatibility (TD-2).
nodeLinker: hoisted

# Peers with "*" ranges (expo-router lists reanimated, gesture-handler, testing
# libraries) must be installed deliberately with `npx expo install`, never
# auto-resolved to whatever is newest.
autoInstallPeers: false

# One version of each shared tool across the workspace. Expo SDK 57 pins react,
# react-native and typescript; everything else follows those.
catalog:
  typescript: ~6.0.3
  vitest: ^5.0.3
  # Its peer is the exact vitest version: the two move together.
  "@vitest/coverage-v8": ^5.0.3
  react: 19.3.0
  react-dom: 19.3.0
  "@types/react": ~19.3.0
  "@types/react-dom": ~19.3.0


allowBuilds:
  esbuild: true
  # @sentry/cli's postinstall downloads the sentry-cli binary (checksum-verified
  # by the package); the Expo plugin and the source-map upload in deploy.yml
  # need it (#11). Allowed deliberately, like esbuild.
  "@sentry/cli": true
  # eas-cli's optional native helpers; not built, eas works without them, and
  # pnpm 12 treats an undeclared ignored build as an install error.
  dtrace-provider: false
  protobufjs: false

# Supply chain: a version must be at least one day old before pnpm installs it
# (pnpm's default, stated explicitly). Exclusions are a decision, not a convenience.
minimumReleaseAge: 1440

# Patched transitive versions the audit gate requires. The first three and joi
# sit under eas-cli (a CLI run only in CI), which still ships older ranges;
# brace-expansion sits under the globbing of eas-cli, the Expo tooling and jest
# (GHSA-6j4f-fj2g-mc7p and GHSA-qhr7-859c-m2p7, 2026-09-29). The majors are
# unchanged, so nothing else in the tree moves. Remove an entry once the
# range of whoever asks for the package is at or above it.
overrides:
  "minimatch@5": ">=5.1.8 <6"
  "nanoid@3": ">=3.3.18 <4"
  "tar@7": ">=7.5.21 <8"
  "brace-expansion@1": ">=1.1.20 <2"
  "brace-expansion@2": ">=2.1.6 <3"
  "brace-expansion@5": ">=5.0.11 <6"
  "joi@17": ">=17.13.9 <18"
  # node-forge under the Expo tooling's code signing and eas-cli, and joi
  # above: GHSA-7wch-p9px-956x, GHSA-jc66-7q78-782g, GHSA-8hrf-8g6f-7xwp,
  # GHSA-hqq3-7jhf-c5jx and GHSA-5x38-2vff-x55p, and for joi GHSA-4528-x5fx-h6hg,
  # failing the audit gate since 2026-10-31 (#541). Both are patched within
  # their major. 1.4.1 also fixes GHSA-86w9-cpqp-85rv (CVE-2026-85393), which
  # auditConfig below set aside until a patched version existed.
  "node-forge@1": ">=1.4.1 <2"
  # shell-quote under react-devtools-core (react-native's developer tooling)
  # and source-map-js under postcss (vite: the admin panel's build and the
  # tests): GHSA-pqg4-j6r4-53mv and GHSA-68fv-2mgg-jv7q, failing the audit
  # gate since 2026-10-07. Both are patched within their major.
  "shell-quote@1": ">=1.11.0 <2"
  "source-map-js@1": ">=1.2.2 <2"
  # undici under @sentry/cli (Sentry's upload tool, run at build time) and
  # under jsdom (the tests' DOM): GHSA-xjj6-f33q-929c, failing the audit gate
  # since 2026-10-24. Both majors are patched within themselves.
  "undici@6": ">=6.29.1 <7"
  "undici@8": ">=8.12.2 <9"
  # zod 4 under the Telia kit (which runs in the API), knip and eas-cli's
  # packages, whose ranges already take 4.6.7: no copy of zod 4 stays below
  # GHSA-mrhx-c7xc-m3w5's fix (our own ask for ^4.6.7). zod 3 has no fixed
  # release; auditConfig below says why its one copy stays.
  "zod@4": ">=4.6.7 <5"
  # Not installed at all. @sentry/node 11 lists its bundler plugins as a
  # dependency for the entry points ./vite, ./rollup, ./webpack and ./esbuild,
  # which the API does not import, and they bring Sentry's command-line tool
  # (`sentry`, FSL-1.1-Apache-2.0, outside the licence policy) and a native
  # parser for every platform. The image's build, which installs for the API
  # alone, fails if the API ever comes to need them; a whole-workspace install
  # would find the copy of an older major that @sentry/react-native brings.
  # Remove this when the plugins are an optional peer.
  "@sentry/node>@sentry/bundler-plugins": "-"

# pnpm audit: three advisories set aside, each with its reason. The first two
# have no patched version for the copy that is left, and neither copy is in the
# API's image or the app's bundle; the third ships in the app and is patched in
# place, which the audit cannot see. Remove one of the first two when its copy
# can take a patched version or the package is gone from the tree; the third
# says when. Every other advisory still fails the job.
#
# GHSA-vfj7-8cjw-p6xm (braces <= 3.0.3): a deeply nested brace pattern
# exhausts the stack. braces is asked for by micromatch only, under fast-glob,
# jest, Metro's file map and tailwindcss: build and test tools that expand the
# patterns of our own configuration, never a pattern somebody sends us.
#
# GHSA-mrhx-c7xc-m3w5 (zod < 4.6.6): validating an oversized array, set or
# record against a size limit can exhaust memory. Our own zod is 4.6.7, past
# the fix (the API, the panel, packages/schema and packages/i18n). What is left
# is zod 3.25.76 under @expo/cli, the dev server and `expo export` on a
# developer's machine and in CI, which validates its own configuration and
# manifests; zod 3 has no patched release. Remove this when @expo/cli moves to
# zod 4.6.6 or later.
#
# GHSA-qr28-fpjm-wq7f (decode-uri-component <= 0.5.0): a string of many distinct
# percent-encoded runs takes quadratic time to decode. 0.2.2 ships in the app's
# bundle under query-string 7, which asks for ^0.2.2: expo-router builds paths
# with it, and the React Navigation getStateFromPath it bundles would parse a
# link's query with it, but expo-router passes its own, which reads the query
# with URL. No link reaches the decoder today; the patch (below) keeps it safe
# if one comes to. The one fixed release, 0.5.1, is an ES module: query-string
# 7's require() would get its namespace, not the function it calls. The audit
# reads the version alone and still counts it;
# apps/mobile/src/decode-uri-component.test.ts holds the installed copy to the
# fix. Remove this, and the patch, when query-string under expo-router asks for
# 0.5.1 or later.
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
    - GHSA-mrhx-c7xc-m3w5
    - GHSA-qr28-fpjm-wq7f

# Fixes taken from a newer release onto the version Expo's SDK pins, each with
# its reason. Remove an entry once the pinned version carries the fix, or as its
# own note says (pnpm refuses to install while a patch goes unused).
#
# react-native-screens: on Android a cold start or a reload registers the
# screen-removal listener from two threads at once, and 4.26.2 makes it lazily
# without a lock; React Native can keep a freed one and crashes natively in
# MountingCoordinator::pullTransaction at the first render (#360). The patch is
# 4.28.0's code (software-mansion/react-native-screens#4413) on 4.26.2; Expo
# SDK 57 pins ~4.26. Patching the package moves the dev client's fingerprint.
#
# decode-uri-component: 0.5.1's decoder, one linear pass over the input, on
# 0.2.2's own entry point (which, unlike 0.5.1, still reads `+` as a space), for
# GHSA-qr28-fpjm-wq7f above; query-string 7 under expo-router pins ^0.2.2. It
# answers every case of 0.2.2's own tests as 0.2.2 does, and every case of
# 0.5.1's as 0.5.1 does, `+` aside. On four of those 0.2.2 itself was wrong:
# three decode its own output again (%25C2%zz gives %C2%zz, where 0.2.2 gave
# �%zz), and in %41%FE%FF its BOM rule replaced inside the run first, leaving
# %41 undecoded. JavaScript only: the fingerprint does not move.
patchedDependencies:
  decode-uri-component@0.2.2: patches/decode-uri-component@0.2.2.patch
  react-native-screens@4.26.2: patches/react-native-screens@4.26.2.patch

# The kit's first release, approved at the prompt on 2026-10-23, the day it
# was published: the one exception the maintainer took to the day above. It
# expires by itself: the next bump of the kit meets the quarantine again.
minimumReleaseAgeExclude:
  - "@kuutti-ry/tunnistus-oidc@0.1.0"
