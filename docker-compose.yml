# Local development stack (#5). `pnpm env:up` runs this for you; on its own:
#   docker compose up -d --wait
# Every published port binds to 127.0.0.1. Values mirror env.example and are
# not secrets. Deployed environments use RDS, S3 and the Telia broker instead.
name: kuutti

services:
  postgres:
    image: postgres:17.10
    environment:
      POSTGRES_USER: kuutti
      POSTGRES_PASSWORD: kuutti
      POSTGRES_DB: kuutti
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates kuutti_test once, when the volume is new.
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/10-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kuutti -d kuutti"]
      interval: 5s
      timeout: 5s
      retries: 12

  # S3 stand-in (TD-2): versitygw, an S3 gateway over a directory (Apache-2.0,
  # Docker Hub, arm64 and amd64). MinIO's community images were withdrawn from
  # Docker Hub and quay.io in September 2026, so the stand-in changed; the API
  # sees the same S3 API on :9000 with the keys of env.example. No console. A
  # bucket is a directory under /data, so the media bucket is a mkdir at start
  # and needs no init container (one image fewer to pull in CI).
  s3:
    image: versity/versitygw:v1.8.0
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mkdir -p /data/kuutti-media &&
        exec versitygw --port :9000 --region eu-central-1 --quiet posix /data
    environment:
      ROOT_ACCESS_KEY: kuutti
      ROOT_SECRET_KEY: kuutti-dev-only
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - s3-data:/data
    healthcheck:
      # The image is Alpine with busybox: a TCP check is what it can do, and the
      # gateway answers on the port the moment the backend is up.
      test: ["CMD", "nc", "-z", "127.0.0.1", "9000"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Stand-in for the Telia ID Broker: issuer http://127.0.0.1:8080/ftn.
  # Its login page is ours: a button per persona and a form for arbitrary
  # FTN-shaped claims (services/mock-idp/README.md, ADR-014).
  mock-idp:
    image: ghcr.io/navikt/mock-oauth2-server:6.0.5
    environment:
      SERVER_PORT: "8080"
      JSON_CONFIG_PATH: /config/config.json
      LOG_LEVEL: INFO
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      # The directory, not its two files: a file mounted by itself is mounted
      # by its identity, and git replaces a file when a branch is switched, so
      # the container would go on reading a login page that is gone.
      - ./services/mock-idp:/config:ro

volumes:
  postgres-data:
  s3-data:
